\"Both appear once, so the tie is broken lexicographically: \\\"x.io\\\" < \\\"y.io\\\".\"}],\"constraints\":[\"1 <= sources.length <= 10^5\",\"1 <= k <= number of distinct domains\",\"each domain string has length <= 40\"],\"hints\":[\"Two separate jobs: count occurrences, then select the largest k counts. Solve them with two different structures rather than trying to do both at once.\",\"Counting is a hash map from domain to frequency. For the selection, you do not need the whole thing sorted — you only need the top k, which is exactly what a size-k min-heap gives you.\",\"Push each (count, domain) pair into a min-heap; whenever the heap exceeds size k, pop the smallest. The k survivors are your answer — but remember to apply the tie-break rule consistently in *both* the heap comparator and the final sort.\"],\"bruteForce\":{\"idea\":\"Count into a hash map, dump all distinct pairs into a list, fully sort the list by (count desc, domain asc), take the first k. Perfectly acceptable in an interview and often fast enough.\",\"time\":\"O(d log d) where d = number of distinct domains\",\"space\":\"O(d)\"},\"optimal\":{\"idea\":\"Count into a hash map, then keep a min-heap of size k ordered so that the 'worst' element by the final ranking rule sits on top. Each of the d distinct entries costs O(log k) to push/pop, so selection is O(d log k) instead of O(d log d).\",\"time\":\"O(n + d log k)\",\"space\":\"O(d)\"},\"walkthrough\":\"Take `sources = [\\\"a.com\\\",\\\"b.com\\\",\\\"a.com\\\",\\\"c.com\\\",\\\"b.com\\\",\\\"a.com\\\"]`, `k = 2`.\\n\\n**Step 1 — count.** One pass builds the map:\\n\\n| domain | count |\\n|---|---|\\n| a.com | 3 |\\n| b.com | 2 |\\n| c.com | 1 |\\n\\n**Step 2 — size-2 min-heap.** The heap is ordered by the *inverse* of the final ranking, so the element most likely to be evicted is on top.\\n\\n| push | heap contents (top first) | action |\\n|---|---|---|\\n| (a.com, 3) | [(a.com,3)] | size 1 ≤ k |\\n| (b.com, 2) | [(b.com,2), (a.com,3)] | size 2 ≤ k |\\n| (c.com, 1) | [(c.com,1), (b.com,2), (a.com,3)] | size 3 > k → pop top |\\n| — | [(b.com,2), (a.com,3)] | c.com evicted |\\n\\n**Step 3 — order the survivors.** Sort by count descending, then domain ascending → `[\\\"a.com\\\", \\\"b.com\\\"]`.\\n\\nThe heap never holds more than k+1 elements, which is the whole point: with d = 10⁵ distinct domains and k = 10, you do 10⁵ operations of cost log 10 instead of cost log 10⁵.\",\"solutions\":{\"python\":\"import heapq\\nfrom collections import Counter\\nfrom typing import List\\n\\ndef top_k_sources(sources: List[str], k: int) -> List[str]:\\n    counts = Counter(sources)\\n\\n    # Min-heap of size k. Key is (count, reversed-name) so that the element\\n    # that should lose the tie-break sits on top and gets evicted first.\\n    # Python has no 'reverse string' ordering, so we negate the comparison by\\n    # storing the name and handling ties explicitly at the end instead.\\n    heap = []  # entries are (count, name)\\n    for name, c in counts.items():\\n        heapq.heappush(heap, (c, _InvName(name)))\\n        if len(heap) > k:\\n            heapq.heappop(heap)\\n\\n    result = [(c, inv.name) for c, inv in heap]\\n    # Final ordering: count descending, then name ascending.\\n    result.sort(key=lambda p: (-p[0], p[1]))\\n    return [name for _, name in result]\\n\\n\\nclass _InvName:\\n    \\\"\\\"\\\"Wrapper that reverses string ordering, so the lexicographically LARGEST\\n    name compares as smallest and is evicted first on a count tie.\\\"\\\"\\\"\\n    __slots__ = ('name',)\\n\\n    def __init__(self, name: str):\\n        self.name = name\\n\\n    def __lt__(self, other: '_InvName') -> bool:\\n        return self.name > other.name\",\"java\":\"import java.util.*;\\n\\nclass Solution {\\n    public List<String> topKSources(String[] sources, int k) {\\n        Map<String, Integer> counts = new HashMap<>();\\n        for (String s : sources) {\\n            counts.put(s, counts.getOrDefault(s, 0) + 1);\\n        }\\n\\n        // Min-heap of size k: the entry that would lose the final ranking\\n        // sits on top, so it is the one evicted when we overflow.\\n        PriorityQueue<Map.Entry<String, Integer>> heap = new PriorityQueue<>(\\n            (a, b) -> {\\n                if (!a.getValue().equals(b.getValue())) {\\n                    return a.getValue() - b.getValue();      // smaller count first\\n                }\\n                return b.getKey().compareTo(a.getKey());     // larger name first\\n            }\\n        );\\n\\n        for (Map.Entry<String, Integer> e : counts.entrySet()) {\\n            heap.offer(e);\\n            if (heap.size() > k) heap.poll();\\n        }\\n\\n        List<Map.Entry<String, Integer>> survivors = new ArrayList<>(heap);\\n        survivors.sort((a, b) -> {\\n            if (!a.getValue().equals(b.getValue())) {\\n                return b.getValue() - a.getValue();          // count descending\\n            }\\n            return a.getKey().compareTo(b.getKey());          // name ascending\\n        });\\n\\n        List<String> out = new ArrayList<>();\\n        for (Map.Entry<String, Integer> e : survivors) out.add(e.getKey());\\n        return out;\\n    }\\n}\",\"cpp\":\"#include <string>\\n#include <vector>\\n#include <unordered_map>\\n#include <queue>\\n#include <algorithm>\\n\\nclass Solution {\\npublic:\\n    std::vector<std::string> topKSources(const std::vector<std::string>& sources, int k) {\\n        std::unordered_map<std::string, int> counts;\\n        for (const auto& s : sources) ++counts[s];\\n\\n        using Entry = std::pair<int, std::string>;   // (count, name)\\n\\n        // Comparator returns true when a should sit BELOW b in the heap.\\n        // We want the losing entry on top: smallest count, then largest name.\\n        auto worseOnTop = [](const Entry& a, const Entry& b) {\\n            if (a.first != b.first) return a.first > b.first;   // smaller count on top\\n            return a.second < b.second;                          // larger name on top\\n        };\\n\\n        std::priority_queue<Entry, std::vector<Entry>, decltype(worseOnTop)> heap(worseOnTop);\\n        for (const auto& kv : counts) {\\n            heap.push({kv.second, kv.first});\\n            if (static_cast<int>(heap.size()) > k) heap.pop();\\n        }\\n\\n        std::vector<Entry> survivors;\\n        while (!heap.empty()) { survivors.push_back(heap.top()); heap.pop(); }\\n\\n        std::sort(survivors.begin(), survivors.end(), [](const Entry& a, const Entry& b) {\\n            if (a.first != b.first) return a.first > b.first;   // count descending\\n            return a.second < b.second;                          // name ascending\\n        });\\n\\n        std::vector<std::string> out;\\n        out.reserve(survivors.size());\\n        for (const auto& e : survivors) out.push_back(e.second);\\n        return out;\\n    }\\n};\"},\"edgeCases\":[\"k equals the number of distinct domains → returns everything, still ordered\",\"All domains identical → single element repeated n times, k must be 1\",\"Every domain distinct → tie-break rule decides the entire answer\",\"Ties that straddle the k boundary — this is where a sloppy comparator produces a wrong but plausible-looking answer\"],\"followUps\":[\"The log is a stream too large to fit in memory — how would you get an approximate top-k? (Count-Min Sketch, or the Misra-Gries / Space-Saving algorithm.)\",\"Counts are all small integers bounded by n — can you get O(n) with bucket sort instead of a heap?\",\"How would you keep the top-k updated live as new citations stream in?\"],\"patternTakeaway\":\"For top-k out of d items, a size-k heap turns O(d log d) into O(d log k) — and the tie-break rule must be encoded identically in the heap comparator and the final sort.\",\"practice\":{\"note\":\"347 for the heap selection; 692 adds the lexicographic tie-break ours uses.\",\"links\":[{\"name\":\"LeetCode 347 · Top K Frequent Elements\",\"url\":\"https://leetcode.com/problems/top-k-frequent-elements/\"},{\"name\":\"LeetCode 692 · Top K Frequent Words\",\"url\":\"https://leetcode.com/problems/top-k-frequent-words/\"}]}},{\"id\":\"cb-03\",\"title\":\"Merge Overlapping Campaign Windows\",\"difficulty\":\"medium\",\"topics\":[\"Intervals\",\"Sorting\",\"Greedy\"],\"statement\":\"You are given an array `intervals` where `intervals[i] = [start_i, end_i]` represents a campaign that runs from `start_i` to `end_i` inclusive.\\n\\nMerge all overlapping or touching intervals and return the resulting non-overlapping intervals, sorted by start time. Two intervals touch when one ends exactly where the next begins (`[1,3]` and `[3,5]` merge into `[1,5]`).\\n\\n**Input:** array of integer pairs `intervals`.\\n**Output:** array of merged integer pairs.\",\"examples\":[{\"input\":\"intervals = [[1,3],[2,6],[8,10],[15,18]]\",\"output\":\"[[1,6],[8,10],[15,18]]\",\"explanation\":\"[1,3] and [2,6] overlap (2 <= 3), so they merge into [1,6]. The others are disjoint.\"},{\"input\":\"intervals = [[1,4],[4,5]]\",\"output\":\"[[1,5]]\",\"explanation\":\"They touch at 4, which counts as overlapping here.\"}],\"constraints\":[\"1 <= intervals.length <= 10^4\",\"intervals[i].length == 2\",\"0 <= start_i <= end_i <= 10^9\"],\"hints\":[\"The input is unsorted, and that is the only thing making this hard. What becomes true once the intervals are sorted by start time?\",\"After sorting by start, any interval can only overlap with the block you are *currently* building — never with one you already closed off. That reduces the whole problem to a single left-to-right sweep.\",\"Hold one 'current' interval. For each next interval: if `next.start <= current.end`, extend `current.end = max(current.end, next.end)`; otherwise push `current` to the output and make `next` the new current. Do not forget to push the final current at the end.\"],\"bruteForce\":{\"idea\":\"Repeatedly scan all pairs looking for any two that overlap, merge them, and start over. Terminates when a full pass finds nothing to merge.\",\"time\":\"O(n^3) worst case\",\"space\":\"O(n)\"},\"optimal\":{\"idea\":\"Sort by start time, then sweep once holding a single open interval. Sorting dominates the cost; the sweep itself is linear.\",\"time\":\"O(n log n)\",\"space\":\"O(n) for the output, O(1) auxiliary beyond the sort\"},\"walkthrough\":\"Take `[[1,3],[2,6],[8,10],[15,18]]`. It is already sorted by start.\\n\\n| next interval | current before | test | current after | output |\\n|---|---|---|---|---|\\n| [1,3] | — | first one | [1,3] | [] |\\n| [2,6] | [1,3] | 2 <= 3 → overlap | [1, max(3,6)] = [1,6] | [] |\\n| [8,10] | [1,6] | 8 > 6 → disjoint | [8,10] | [[1,6]] |\\n| [15,18] | [8,10] | 15 > 10 → disjoint | [15,18] | [[1,6],[8,10]] |\\n\\nAfter the loop, push the still-open `[15,18]` → `[[1,6],[8,10],[15,18]]`.\\n\\nThe `max(current.end, next.end)` is the line people get wrong. Consider `[[1,10],[2,3]]`: `next.end = 3` is *smaller* than `current.end = 10`. Blindly assigning `current.end = next.end` would shrink the interval to `[1,3]` and silently lose coverage.\",\"solutions\":{\"python\":\"from typing import List\\n\\ndef merge_intervals(intervals: List[List[int]]) -> List[List[int]]:\\n    if not intervals:\\n        return []\\n\\n    intervals.sort(key=lambda iv: iv[0])   # sort by start time\\n\\n    merged = [list(intervals[0])]\\n    for start, end in intervals[1:]:\\n        last = merged[-1]\\n        if start <= last[1]:\\n            # overlaps or touches the open interval - extend it.\\n            # max() matters: the new interval may be fully contained.\\n            last[1] = max(last[1], end)\\n        else:\\n            merged.append([start, end])\\n    return merged\",\"java\":\"import java.util.*;\\n\\nclass Solution {\\n    public int[][] merge(int[][] intervals) {\\n        if (intervals.length == 0) return new int[0][];\\n\\n        // Comparator.comparingInt avoids the a[0] - b[0] overflow trap\\n        // when start values can be near Integer.MAX_VALUE.\\n        Arrays.sort(intervals, Comparator.comparingInt(a -> a[0]));\\n\\n        List<int[]> merged = new ArrayList<>();\\n        int[] current = new int[]{intervals[0][0], intervals[0][1]};\\n\\n        for (int i = 1; i < intervals.length; i++) {\\n            int start = intervals[i][0], end = intervals[i][1];\\n            if (start <= current[1]) {\\n                current[1] = Math.max(current[1], end);   // extend, never shrink\\n            } else {\\n                merged.add(current);\\n                current = new int[]{start, end};\\n            }\\n        }\\n        merged.add(current);   // the final open interval\\n\\n        return merged.toArray(new int[merged.size()][]);\\n    }\\n}\",\"cpp\":\"#include <vector>\\n#include <algorithm>\\n\\nclass Solution {\\npublic:\\n    std::vector<std::vector<int>> merge(std::vector<std::vector<int>>& intervals) {\\n        if (intervals.empty()) return {};\\n\\n        std::sort(intervals.begin(), intervals.end(),\\n                  [](const std::vector<int>& a, const std::vector<int>& b) {\\n                      return a[0] < b[0];   // sort by start time\\n                  });\\n\\n        std::vector<std::vector<int>> merged;\\n        std::vector<int> current = intervals[0];\\n\\n        for (size_t i = 1; i < intervals.size(); ++i) {\\n            int start = intervals[i][0], end = intervals[i][1];\\n            if (start <= current[1]) {\\n                current[1] = std::max(current[1], end);   // extend, never shrink\\n            } else {\\n                merged.push_back(current);\\n                current = intervals[i];\\n            }\\n        }\\n        merged.push_back(current);   // the final open interval\\n\\n        return merged;\\n    }\\n};\"},\"edgeCases\":[\"Single interval → returned unchanged\",\"One interval fully inside another, [[1,10],[2,3]] → [[1,10]], the max() case\",\"Touching endpoints [[1,4],[4,5]] → [[1,5]] under this problem's rule; if the problem said 'strictly overlapping' the test would be < not <=\",\"All identical intervals → collapse to one\",\"Unsorted input, which is the default — forgetting the sort passes the sample and fails the suite\"],\"followUps\":[\"Insert a single new interval into an already-merged list in O(n) without re-sorting.\",\"Return the total covered length rather than the intervals themselves.\",\"Find the maximum number of campaigns running simultaneously (sweep-line with +1/-1 events).\"],\"patternTakeaway\":\"Almost every interval problem starts with 'sort by start time'; after that a single sweep holding one open interval solves it, and the merge step is always max(), never assignment.\",\"practice\":{\"note\":\"The canonical version. Same as ca-05 — worth doing once and recognising forever.\",\"links\":[{\"name\":\"LeetCode 56 · Merge Intervals\",\"url\":\"https://leetcode.com/problems/merge-intervals/\"}]}},{\"id\":\"cb-04\",\"title\":\"Days Until a Better Ranking\",\"difficulty\":\"medium\",\"topics\":[\"Monotonic Stack\",\"Arrays\"],\"statement\":\"You track your brand's visibility score once per day in an array `scores`.\\n\\nFor each day `i`, find how many days you must wait until a day with a **strictly higher** score. If no such future day exists, the answer for that day is `0`.\\n\\n**Input:** integer array `scores`.\\n**Output:** integer array `answer` of the same length, where `answer[i]` is the waiting time in days.\",\"examples\":[{\"input\":\"scores = [73,74,75,71,69,72,76,73]\",\"output\":\"[1,1,4,2,1,1,0,0]\",\"explanation\":\"Day 0 (73) is beaten the very next day by 74 → wait 1. Day 2 (75) is not beaten until day 6 (76) → wait 4. Days 6 and 7 are never beaten → 0.\"},{\"input\":\"scores = [30,40,50,60]\",\"output\":\"[1,1,1,0]\",\"explanation\":\"Strictly increasing, so every day is beaten by the next one.\"}],\"constraints\":[\"1 <= scores.length <= 10^5\",\"30 <= scores[i] <= 100\"],\"hints\":[\"The naive answer scans forward from every index. Notice how much of that scanning is repeated work — if day 3 is not beaten by day 4, then anything that fails to beat day 3 also fails to beat day 4 when day 4 is larger.\",\"Keep a stack of indices whose answer you have not yet resolved. The scores at those indices are, by construction, in decreasing order.\",\"When you read a new score, it resolves every pending index on the stack whose score is strictly less than it. Pop them one at a time, and the answer for each popped index is `currentIndex - poppedIndex`. Then push the current index.\"],\"bruteForce\":{\"idea\":\"For each index i, scan j from i+1 forward until scores[j] > scores[i]. Simple and obviously correct, but degenerates on a decreasing array where every scan runs to the end.\",\"time\":\"O(n^2)\",\"space\":\"O(1)\"},\"optimal\":{\"idea\":\"One pass with a monotonic decreasing stack of unresolved indices. Each index is pushed exactly once and popped at most once, so the total work is linear despite the inner while loop.\",\"time\":\"O(n)\",\"space\":\"O(n)\"},\"walkthrough\":\"Trace `[73, 74, 75, 71, 69, 72, 76, 73]`. Stack holds indices; the scores at those indices stay in decreasing order.\\n\\n| i | score | pops (resolved) | stack after | answer set |\\n|---|---|---|---|---|\\n| 0 | 73 | — | [0] | — |\\n| 1 | 74 | pop 0 (73 < 74) | [1] | ans[0] = 1-0 = 1 |\\n| 2 | 75 | pop 1 (74 < 75) | [2] | ans[1] = 2-1 = 1 |\\n| 3 | 71 | none (71 < 75) | [2,3] | — |\\n| 4 | 69 | none (69 < 71) | [2,3,4] | — |\\n| 5 | 72 | pop 4 (69<72), pop 3 (71<72) | [2,5] | ans[4] = 1, ans[3] = 2 |\\n| 6 | 76 | pop 5 (72<76), pop 2 (75<76) | [6] | ans[5] = 1, ans[2] = 4 |\\n| 7 | 73 | none (73 < 76) | [6,7] | — |\\n\\nIndices 6 and 7 are still on the stack when the loop ends — they were never beaten, so their answers stay at the initialised `0`.\\n\\n**Why this is O(n) and not O(n²):** the inner `while` can pop many elements in one iteration, but every index enters the stack once and leaves once. Total pops across the whole run is at most n. Amortised, each index costs O(1).\",\"solutions\":{\"python\":\"from typing import List\\n\\ndef days_until_better(scores: List[int]) -> List[int]:\\n    n = len(scores)\\n    answer = [0] * n      # default 0 means 'never beaten'\\n    stack = []            # indices of days still waiting for a better score\\n\\n    for i, score in enumerate(scores):\\n        # every pending day with a strictly smaller score is resolved by today\\n        while stack and scores[stack[-1]] < score:\\n            j = stack.pop()\\n            answer[j] = i - j\\n        stack.append(i)\\n\\n    return answer\",\"java\":\"import java.util.*;\\n\\nclass Solution {\\n    public int[] daysUntilBetter(int[] scores) {\\n        int n = scores.length;\\n        int[] answer = new int[n];        // defaults to 0 = 'never beaten'\\n        Deque<Integer> stack = new ArrayDeque<>();   // indices still waiting\\n\\n        for (int i = 0; i < n; i++) {\\n            // every pending day with a strictly smaller score is resolved by today\\n            while (!stack.isEmpty() && scores[stack.peek()] < scores[i]) {\\n                int j = stack.pop();\\n                answer[j] = i - j;\\n            }\\n            stack.push(i);\\n        }\\n\\n        return answer;\\n    }\\n}\",\"cpp\":\"#include <vector>\\n#include <stack>\\n\\nclass Solution {\\npublic:\\n    std::vector<int> daysUntilBetter(const std::vector<int>& scores) {\\n        int n = static_cast<int>(scores.size());\\n        std::vector<int> answer(n, 0);   // 0 = 'never beaten'\\n        std::stack<int> st;              // indices still waiting\\n\\n        for (int i = 0; i < n; ++i) {\\n            // every pending day with a strictly smaller score is resolved by today\\n            while (!st.empty() && scores[st.top()] < scores[i]) {\\n                int j = st.top();\\n                st.pop();\\n                answer[j] = i - j;\\n            }\\n            st.push(i);\\n        }\\n\\n        return answer;\\n    }\\n};\"},\"edgeCases\":[\"Strictly decreasing input → all zeros, and the stack grows to length n\",\"All equal values → all zeros, because the comparison is strict (< not <=)\",\"Single element → [0]\",\"Using <= instead of < silently changes the semantics from 'strictly higher' to 'at least as high'\"],\"followUps\":[\"Return the previous greater element instead of the next — iterate right to left with the same stack.\",\"Find the largest rectangle in a histogram, which is the same stack with an extra width calculation.\",\"Make it work on a circular array where day n-1 wraps to day 0.\"],\"patternTakeaway\":\"'Next greater / next smaller element' is always a monotonic stack of unresolved indices — each index pushed once and popped once, so the nested while loop is still O(n) overall.\",\"practice\":{\"note\":\"Identical monotonic stack of unresolved indices.\",\"links\":[{\"name\":\"LeetCode 739 · Daily Temperatures\",\"url\":\"https://leetcode.com/problems/daily-temperatures/\"}]}},{\"id\":\"cc-01\",\"title\":\"Count Connected Regions in a Grid\",\"difficulty\":\"medium\",\"topics\":[\"Graphs\",\"BFS\",\"DFS\",\"Grid\"],\"statement\":\"You are given an `m x n` grid of characters where `'1'` marks an occupied cell and `'0'` marks an empty cell.\\n\\nA **region** is a maximal group of `'1'` cells connected horizontally or vertically (not diagonally). Return the number of distinct regions.\\n\\n**Input:** 2-D character array `grid`.\\n**Output:** a single integer.\",\"examples\":[{\"input\":\"grid = [[\\\"1\\\",\\\"1\\\",\\\"0\\\"],[\\\"1\\\",\\\"0\\\",\\\"0\\\"],[\\\"0\\\",\\\"0\\\",\\\"1\\\"]]\",\"output\":\"2\",\"explanation\":\"The three connected '1's in the top-left form one region; the lone '1' at (2,2) forms another. Diagonal adjacency does not connect them.\"},{\"input\":\"grid = [[\\\"0\\\",\\\"0\\\"],[\\\"0\\\",\\\"0\\\"]]\",\"output\":\"0\",\"explanation\":\"No occupied cells at all.\"}],\"constraints\":[\"1 <= m, n <= 300\",\"grid[i][j] is '0' or '1'\"],\"hints\":[\"This is a graph problem wearing a grid costume. Each '1' cell is a vertex; edges join orthogonally adjacent '1' cells. What standard quantity are you being asked for?\",\"Counting connected components: scan every cell, and whenever you meet an unvisited '1', increment the counter and then flood-fill everything reachable from it so it is never counted again.\",\"The flood fill can be DFS or BFS. Sinking visited cells by overwriting them with '0' avoids a separate visited array — just be sure you are allowed to mutate the input, otherwise keep a boolean grid.\"],\"bruteForce\":{\"idea\":\"There is no meaningfully worse approach that is still correct — a union-find over all cells is the main alternative at O(m·n·α(m·n)), which is essentially the same cost with more code.\",\"time\":\"O(m * n * a(m * n)) with union-find\",\"space\":\"O(m * n)\"},\"optimal\":{\"idea\":\"Linear scan plus flood fill. Every cell is visited a constant number of times: once by the outer scan, and at most once by a flood fill.\",\"time\":\"O(m * n)\",\"space\":\"O(min(m, n)) for a BFS queue, or O(m * n) worst case for a DFS recursion stack\"},\"walkthrough\":\"Take the 3x3 grid:\\n\\n```\\n1 1 0\\n1 0 0\\n0 0 1\\n```\\n\\nThe outer scan visits cells in row-major order.\\n\\n| cell | value | action |\\n|---|---|---|\\n| (0,0) | '1' | unvisited → **count = 1**, start BFS |\\n| — | — | BFS from (0,0) reaches (0,1) and (1,0); both sunk to '0'. (1,1) is '0', so the region stops. |\\n| (0,1) | now '0' | skip — already sunk |\\n| (0,2) | '0' | skip |\\n| (1,0) | now '0' | skip |\\n| (1,1),(1,2) | '0' | skip |\\n| (2,0),(2,1) | '0' | skip |\\n| (2,2) | '1' | unvisited → **count = 2**, BFS finds no neighbours |\\n\\nFinal count: **2**.\\n\\n**Why BFS over DFS here:** with m = n = 300, a grid that is entirely '1's gives a single region of 90,000 cells. Recursive DFS would nest 90,000 frames deep and blow the stack in Java and C++, and hit Python's default recursion limit of 1000 almost immediately. The iterative BFS below has no such problem — this is a real, common failure on this exact problem.\",\"solutions\":{\"python\":\"from collections import deque\\nfrom typing import List\\n\\ndef count_regions(grid: List[List[str]]) -> int:\\n    if not grid or not grid[0]:\\n        return 0\\n\\n    rows, cols = len(grid), len(grid[0])\\n    count = 0\\n    DIRECTIONS = ((1, 0), (-1, 0), (0, 1), (0, -1))\\n\\n    for r in range(rows):\\n        for c in range(cols):\\n            if grid[r][c] != '1':\\n                continue\\n\\n            count += 1\\n            # Iterative BFS, not recursion: a 300x300 grid of all '1's is a\\n            # single 90,000-cell region and would overflow the call stack.\\n            queue = deque([(r, c)])\\n            grid[r][c] = '0'          # sink on enqueue, never on dequeue\\n\\n            while queue:\\n                cr, cc = queue.popleft()\\n                for dr, dc in DIRECTIONS:\\n                    nr, nc = cr + dr, cc + dc\\n                    if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == '1':\\n                        grid[nr][nc] = '0'\\n                        queue.append((nr, nc))\\n\\n    return count\",\"java\":\"import java.util.*;\\n\\nclass Solution {\\n    public int countRegions(char[][] grid) {\\n        if (grid == null || grid.length == 0 || grid[0].length == 0) return 0;\\n\\n        int rows = grid.length, cols = grid[0].length;\\n        int count = 0;\\n        int[][] directions = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};\\n\\n        for (int r = 0; r < rows; r++) {\\n            for (int c = 0; c < cols; c++) {\\n                if (grid[r][c] != '1') continue;\\n\\n                count++;\\n                // Iterative BFS - recursion would overflow on a large solid region.\\n                Deque<int[]> queue = new ArrayDeque<>();\\n                queue.offer(new int[]{r, c});\\n                grid[r][c] = '0';        // sink on enqueue, never on dequeue\\n\\n                while (!queue.isEmpty()) {\\n                    int[] cell = queue.poll();\\n                    for (int[] d : directions) {\\n                        int nr = cell[0] + d[0], nc = cell[1] + d[1];\\n                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] == '1') {\\n                            grid[nr][nc] = '0';\\n                            queue.offer(new int[]{nr, nc});\\n                        }\\n                    }\\n                }\\n            }\\n        }\\n\\n        return count;\\n    }\\n}\",\"cpp\":\"#include <vector>\\n#include <queue>\\n#include <utility>\\n\\nclass Solution {\\npublic:\\n    int countRegions(std::vector<std::vector<char>>& grid) {\\n        if (grid.empty() || grid[0].empty()) return 0;\\n\\n        int rows = static_cast<int>(grid.size());\\n        int cols = static_cast<int>(grid[0].size());\\n        int count = 0;\\n        const int dr[4] = {1, -1, 0, 0};\\n        const int dc[4] = {0, 0, 1, -1};\\n\\n        for (int r = 0; r < rows; ++r) {\\n            for (int c = 0; c < cols; ++c) {\\n                if (grid[r][c] != '1') continue;\\n\\n                ++count;\\n                // Iterative BFS - recursion would overflow on a large solid region.\\n                std::queue<std::pair<int,int>> q;\\n                q.push({r, c});\\n                grid[r][c] = '0';        // sink on enqueue, never on dequeue\\n\\n                while (!q.empty()) {\\n                    auto [cr, cc] = q.front();\\n                    q.pop();\\n                    for (int k = 0; k < 4; ++k) {\\n                        int nr = cr + dr[k], nc = cc + dc[k];\\n                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] == '1') {\\n                            grid[nr][nc] = '0';\\n                            q.push({nr, nc});\\n                        }\\n                    }\\n                }\\n            }\\n        }\\n\\n        return count;\\n    }\\n};\"},\"edgeCases\":[\"Grid of all '1's → exactly 1 region, and the case that breaks recursive DFS\",\"Grid of all '0's → 0\",\"Single row or single column\",\"Diagonally touching cells must NOT merge — a common wrong answer adds 8 directions\",\"Sinking on dequeue instead of on enqueue lets the same cell enter the queue several times and degrades to O((mn)^2) memory pressure\"],\"followUps\":[\"Return the size of the largest region instead of the count.\",\"The grid is too large for memory and arrives row by row — how would you count regions in a streaming fashion? (Union-find over two rows at a time.)\",\"Allow diagonal connectivity — what exactly changes?\"],\"patternTakeaway\":\"Count connected components = scan for an unvisited seed, increment, flood-fill; use iterative BFS on grids because a solid region can be as deep as the whole grid.\",\"practice\":{\"note\":\"Identical grid flood fill. Use the iterative BFS — recursion stack-overflows on the big grids.\",\"links\":[{\"name\":\"LeetCode 200 · Number of Islands\",\"url\":\"https://leetcode.com/problems/number-of-islands/\"}]}},{\"id\":\"cc-02\",\"title\":\"Feature Rollout Order\",\"difficulty\":\"medium\",\"topics\":[\"Graphs\",\"Topological Sort\",\"BFS\"],\"statement\":\"Your team has `n` features labelled `0` to `n-1`. Some features depend on others: `dependencies[i] = [a, b]` means feature `b` must ship before feature `a`.\\n\\nReturn any valid order in which all `n` features can ship. If no such order exists — because the dependencies contain a cycle — return an empty array.\\n\\n**Input:** integer `n`, array of integer pairs `dependencies`.\\n**Output:** an array of `n` integers, or an empty array.\",\"examples\":[{\"input\":\"n = 4, dependencies = [[1,0],[2,0],[3,1],[3,2]]\",\"output\":\"[0,1,2,3]\",\"explanation\":\"Feature 0 has no dependencies so it ships first. 1 and 2 both need 0. 3 needs both 1 and 2. [0,2,1,3] is equally valid.\"},{\"input\":\"n = 2, dependencies = [[1,0],[0,1]]\",\"output\":\"[]\",\"explanation\":\"0 must precede 1 and 1 must precede 0 — a cycle, so no order exists.\"}],\"constraints\":[\"1 <= n <= 2000\",\"0 <= dependencies.length <= 5000\",\"all pairs are distinct\"],\"hints\":[\"Model it as a directed graph. The pair [a, b] means 'b before a', so the edge points from b to a. Getting this direction backwards is the single most common mistake on this problem.\",\"A feature can ship the moment every feature it depends on has already shipped. Track, for each feature, how many unshipped dependencies it still has — its in-degree.\",\"Start a queue with every feature of in-degree 0. Pop one, append it to the order, and decrement the in-degree of everything that depended on it; anything that hits 0 joins the queue. If the final order has fewer than n entries, the leftovers are in a cycle.\"],\"bruteForce\":{\"idea\":\"Repeatedly scan all n features for one whose dependencies are all satisfied, emit it, mark it done, and rescan from scratch. Correct, but each of the n emissions costs a full O(n + E) scan.\",\"time\":\"O(n * (n + E))\",\"space\":\"O(n + E)\"},\"optimal\":{\"idea\":\"Kahn's algorithm. Build the adjacency list and in-degree array in one pass over the edges, then process the zero-in-degree frontier with a queue. Cycle detection falls out for free: if fewer than n nodes were emitted, a cycle exists.\",\"time\":\"O(n + E)\",\"space\":\"O(n + E)\"},\"walkthrough\":\"Take `n = 4`, `dependencies = [[1,0],[2,0],[3,1],[3,2]]`.\\n\\n**Build the graph.** `[a,b]` means b → a.\\n\\n| edge | meaning | adjacency | in-degree effect |\\n|---|---|---|---|\\n| [1,0] | 0 → 1 | adj[0] += 1 | indeg[1] = 1 |\\n| [2,0] | 0 → 2 | adj[0] += 2 | indeg[2] = 1 |\\n| [3,1] | 1 → 3 | adj[1] += 3 | indeg[3] = 1 |\\n| [3,2] | 2 → 3 | adj[2] += 3 | indeg[3] = 2 |\\n\\nFinal in-degrees: `[0, 1, 1, 2]`. Only node 0 starts at zero.\\n\\n**Process the queue.**\\n\\n| step | queue | pop | order so far | in-degrees after decrement |\\n|---|---|---|---|---|\\n| 1 | [0] | 0 | [0] | 1→0, 2→0, so both enqueue |\\n| 2 | [1,2] | 1 | [0,1] | 3→1, not yet ready |\\n| 3 | [2] | 2 | [0,1,2] | 3→0, enqueues |\\n| 4 | [3] | 3 | [0,1,2,3] | — |\\n\\nOrder length is 4 = n, so the order is valid: `[0,1,2,3]`.\\n\\n**How the cycle case fails.** For `n = 2`, `[[1,0],[0,1]]`, in-degrees are `[1,1]` — nothing ever enters the queue, the loop never runs, and the order stays empty with length 0 < 2. Return `[]`.\",\"solutions\":{\"python\":\"from collections import deque\\nfrom typing import List\\n\\ndef rollout_order(n: int, dependencies: List[List[int]]) -> List[int]:\\n    adjacency = [[] for _ in range(n)]\\n    in_degree = [0] * n\\n\\n    # dependencies[i] = [a, b] means 'b must ship before a', so the edge is b -> a\\n    for a, b in dependencies:\\n        adjacency[b].append(a)\\n        in_degree[a] += 1\\n\\n    # everything with no unmet dependency can ship immediately\\n    queue = deque(i for i in range(n) if in_degree[i] == 0)\\n    order = []\\n\\n    while queue:\\n        node = queue.popleft()\\n        order.append(node)\\n        for nxt in adjacency[node]:\\n            in_degree[nxt] -= 1\\n            if in_degree[nxt] == 0:\\n                queue.append(nxt)\\n\\n    # fewer than n emitted means the remainder sit in a cycle\\n    return order if len(order) == n else []\",\"java\":\"import java.util.*;\\n\\nclass Solution {\\n    public int[] rolloutOrder(int n, int[][] dependencies) {\\n        List<List<Integer>> adjacency = new ArrayList<>();\\n        for (int i = 0; i < n; i++) adjacency.add(new ArrayList<>());\\n        int[] inDegree = new int[n];\\n\\n        // [a, b] means 'b must ship before a', so the edge is b -> a\\n        for (int[] dep : dependencies) {\\n            int a = dep[0], b = dep[1];\\n            adjacency.get(b).add(a);\\n            inDegree[a]++;\\n        }\\n\\n        Deque<Integer> queue = new ArrayDeque<>();\\n        for (int i = 0; i < n; i++) {\\n            if (inDegree[i] == 0) queue.offer(i);\\n        }\\n\\n        int[] order = new int[n];\\n        int emitted = 0;\\n\\n        while (!queue.isEmpty()) {\\n            int node = queue.poll();\\n            order[emitted++] = node;\\n            for (int next : adjacency.get(node)) {\\n                if (--inDegree[next] == 0) queue.offer(next);\\n            }\\n        }\\n\\n        // fewer than n emitted means the remainder sit in a cycle\\n        return emitted == n ? order : new int[0];\\n    }\\n}\",\"cpp\":\"#include <vector>\\n#include <queue>\\n\\nclass Solution {\\npublic:\\n    std::vector<int> rolloutOrder(int n, const std::vector<std::vector<int>>& dependencies) {\\n        std::vector<std::vector<int>> adjacency(n);\\n        std::vector<int> inDegree(n, 0);\\n\\n        // [a, b] means 'b must ship before a', so the edge is b -> a\\n        for (const auto& dep : dependencies) {\\n            int a = dep[0], b = dep[1];\\n            adjacency[b].push_back(a);\\n            ++inDegree[a];\\n        }\\n\\n        std::queue<int> q;\\n        for (int i = 0; i < n; ++i) {\\n            if (inDegree[i] == 0) q.push(i);\\n        }\\n\\n        std::vector<int> order;\\n        order.reserve(n);\\n\\n        while (!q.empty()) {\\n            int node = q.front();\\n            q.pop();\\n            order.push_back(node);\\n            for (int next : adjacency[node]) {\\n                if (--inDegree[next] == 0) q.push(next);\\n            }\\n        }\\n\\n        // fewer than n emitted means the remainder sit in a cycle\\n        if (static_cast<int>(order.size()) != n) return {};\\n        return order;\\n    }\\n};\"},\"edgeCases\":[\"No dependencies at all → any permutation is valid; this implementation returns [0,1,...,n-1]\",\"A self-dependency [a, a] → in-degree never reaches 0, correctly reported as a cycle\",\"Disconnected components → handled naturally, since every zero-in-degree node seeds the queue\",\"Reversing the edge direction produces a plausible-looking order that is exactly backwards — check against the sample\",\"n = 1 with no edges → [0]\"],\"followUps\":[\"Detect and return the actual cycle rather than just reporting failure (DFS with a recursion-stack colour marking).\",\"Return the lexicographically smallest valid order — swap the queue for a min-heap.\",\"Compute the minimum number of parallel rollout waves, which is the longest path in the DAG.\"],\"patternTakeaway\":\"Ordering under 'X before Y' constraints is a topological sort; Kahn's in-degree queue gives you both the order and cycle detection, and the emitted-count check is the cycle test.\",\"practice\":{\"note\":\"Identical Kahn topological sort, including the empty-array-on-cycle rule.\",\"links\":[{\"name\":\"LeetCode 210 · Course Schedule II\",\"url\":\"https://leetcode.com/problems/course-schedule-ii/\"}]}},{\"id\":\"cc-03\",\"title\":\"Rightmost Node of Each Level\",\"difficulty\":\"medium\",\"topics\":[\"Trees\",\"BFS\",\"Level Order\"],\"statement\":\"Given the root of a binary tree, imagine standing to the right of it. Return the values of the nodes you can see, ordered from top to bottom — that is, the **last node at each depth**.\\n\\n**Input:** the root of a binary tree (`null` for an empty tree).\\n**Output:** an array of integers, one per level.\",\"examples\":[{\"input\":\"root = [1,2,3,null,5,null,4]\",\"output\":\"[1,3,4]\",\"explanation\":\"Level 0 has only 1. Level 1 has [2,3] so you see 3. Level 2 has [5,4] so you see 4.\"},{\"input\":\"root = [1,2,null,3]\",\"output\":\"[1,2,3]\",\"explanation\":\"A left-leaning chain — with nothing to their right, every node is visible.\"}],\"constraints\":[\"0 <= number of nodes <= 100\",\"-100 <= Node.val <= 100\"],\"hints\":[\"The naive idea 'always go right' fails on the second example, where the visible nodes are all left children. Visibility is about depth, not about direction.\",\"If you process the tree level by level, the answer for each level is simply the last node in that level.\",\"Standard level-order BFS: before draining the queue, record its current size — that is exactly the number of nodes at this depth. Loop that many times, and the node at the final iteration is the one you can see.\"],\"bruteForce\":{\"idea\":\"DFS the whole tree recording (depth, value) for every node, then group by depth and take the last-visited entry at each depth. Same asymptotic cost, but needs a second pass and careful ordering.\",\"time\":\"O(n)\",\"space\":\"O(n)\"},\"optimal\":{\"idea\":\"Level-order BFS with an explicit level-size snapshot. One pass, and the answer is written as you go. Alternatively a root-right-left DFS that records the first node seen at each new depth.\",\"time\":\"O(n)\",\"space\":\"O(w) where w is the maximum width of the tree\"},\"walkthrough\":\"Take the tree `[1,2,3,null,5,null,4]`:\\n\\n```\\n      1\\n     / \\\\\\n    2   3\\n     \\\\    \\\\\\n      5    4\\n```\\n\\nBFS with a level-size snapshot each round:\\n\\n| round | queue at start | levelSize | nodes processed | last one → recorded | children enqueued |\\n|---|---|---|---|---|---|\\n| 1 | [1] | 1 | 1 | **1** | 2, 3 |\\n| 2 | [2, 3] | 2 | 2, then 3 | **3** | 5 (from 2), 4 (from 3) |\\n| 3 | [5, 4] | 2 | 5, then 4 | **4** | none |\\n\\nResult: `[1, 3, 4]`.\\n\\nThe crucial line is capturing `levelSize = queue.size()` **before** the inner loop starts. Inside the loop you are enqueuing children, so the queue grows — reading `.size()` inside the condition would make the loop consume the next level too and collapse the whole traversal into one round.\\n\\nCheck it against example 2, the left-leaning chain: each level contains exactly one node, so the 'last node at this level' is that node, and every node is visible. A naive always-go-right walk would have returned just `[1]`.\",\"solutions\":{\"python\":\"from collections import deque\\nfrom typing import List, Optional\\n\\nclass TreeNode:\\n    def __init__(self, val: int = 0, left: 'Optional[TreeNode]' = None, right: 'Optional[TreeNode]' = None):\\n        self.val = val\\n        self.left = left\\n        self.right = right\\n\\n\\ndef right_side_view(root: Optional[TreeNode]) -> List[int]:\\n    if root is None:\\n        return []\\n\\n    view = []\\n    queue = deque([root])\\n\\n    while queue:\\n        level_size = len(queue)      # snapshot BEFORE enqueuing children\\n        for i in range(level_size):\\n            node = queue.popleft()\\n            if i == level_size - 1:  # last node at this depth is the visible one\\n                view.append(node.val)\\n            if node.left:\\n                queue.append(node.left)\\n            if node.right:\\n                queue.append(node.right)\\n\\n    return view\",\"java\":\"import java.util.*;\\n\\nclass TreeNode {\\n    int val;\\n    TreeNode left;\\n    TreeNode right;\\n    TreeNode() {}\\n    TreeNode(int val) { this.val = val; }\\n    TreeNode(int val, TreeNode left, TreeNode right) {\\n        this.val = val; this.left = left; this.right = right;\\n    }\\n}\\n\\nclass Solution {\\n    public List<Integer> rightSideView(TreeNode root) {\\n        List<Integer> view = new ArrayList<>();\\n        if (root == null) return view;\\n\\n        Deque<TreeNode> queue = new ArrayDeque<>();\\n        queue.offer(root);\\n\\n        while (!queue.isEmpty()) {\\n            int levelSize = queue.size();    // snapshot BEFORE enqueuing children\\n            for (int i = 0; i < levelSize; i++) {\\n                TreeNode node = queue.poll();\\n                if (i == levelSize - 1) {    // last node at this depth is visible\\n                    view.add(node.val);\\n                }\\n                if (node.left != null) queue.offer(node.left);\\n                if (node.right != null) queue.offer(node.right);\\n            }\\n        }\\n\\n        return view;\\n    }\\n}\",\"cpp\":\"#include <vector>\\n#include <queue>\\n\\nstruct TreeNode {\\n    int val;\\n    TreeNode* left;\\n    TreeNode* right;\\n    TreeNode() : val(0), left(nullptr), right(nullptr) {}\\n    TreeNode(int x) : val(x), left(nullptr), right(nullptr) {}\\n    TreeNode(int x, TreeNode* l, TreeNode* r) : val(x), left(l), right(r) {}\\n};\\n\\nclass Solution {\\npublic:\\n    std::vector<int> rightSideView(TreeNode* root) {\\n        std::vector<int> view;\\n        if (root == nullptr) return view;\\n\\n        std::queue<TreeNode*> q;\\n        q.push(root);\\n\\n        while (!q.empty()) {\\n            int levelSize = static_cast<int>(q.size());   // snapshot BEFORE enqueuing\\n            for (int i = 0; i < levelSize; ++i) {\\n                TreeNode* node = q.front();\\n                q.pop();\\n                if (i == levelSize - 1) {                  // last node at this depth\\n                    view.push_back(node->val);\\n                }\\n                if (node->left) q.push(node->left);\\n                if (node->right) q.push(node->right);\\n            }\\n        }\\n\\n        return view;\\n    }\\n};\"},\"edgeCases\":[\"Empty tree → []\",\"Left-only chain → every node visible, the case that kills the 'always go right' shortcut\",\"Single node → [root.val]\",\"Reading queue.size() inside the loop condition instead of snapshotting it — collapses all levels into one\"],\"followUps\":[\"Return the left side view — same algorithm, take i == 0 instead.\",\"Return the average value per level, or the maximum per level.\",\"Do it with DFS in O(h) extra space by visiting root, right, then left, and recording the first node seen at each new depth.\"],\"patternTakeaway\":\"Anything phrased 'per level' of a tree is level-order BFS with the queue size snapshotted before the inner loop — that snapshot is what separates one level from the next.\",\"practice\":{\"note\":\"The exact problem, with the tree pre-built for you.\",\"links\":[{\"name\":\"LeetCode 199 · Binary Tree Right Side View\",\"url\":\"https://leetcode.com/problems/binary-tree-right-side-view/\"}]}},{\"id\":\"cd-01\",\"title\":\"Non-Adjacent Campaign Budget\",\"difficulty\":\"medium\",\"topics\":[\"Dynamic Programming\",\"1D DP\"],\"statement\":\"You are given an integer array `value` where `value[i]` is the return from running a campaign in week `i`.\\n\\nYou cannot run campaigns in two consecutive weeks — the audience needs a gap. Return the **maximum total return** you can achieve.\\n\\n**Input:** integer array `value`.\\n**Output:** a single integer.\",\"examples\":[{\"input\":\"value = [2,7,9,3,1]\",\"output\":\"12\",\"explanation\":\"Pick weeks 0, 2 and 4: 2 + 9 + 1 = 12. Picking 7 + 3 = 10 is worse, and 7 + 9 is illegal because those weeks are adjacent.\"},{\"input\":\"value = [5,1,1,5]\",\"output\":\"10\",\"explanation\":\"Weeks 0 and 3: 5 + 5 = 10. The greedy 'take the biggest first' happens to work here but fails on [2,7,9,3,1].\"}],\"constraints\":[\"1 <= value.length <= 10^5\",\"0 <= value[i] <= 10^4\"],\"hints\":[\"Greedy fails. On [2,7,9,3,1] the largest element is 9, and committing to it blocks 7 and 3 — you would get 9 + 2 + 1 = 12 by luck here, but try [3,10,3,1,10,3] and the greedy ordering falls apart. You need to consider both choices at each step.\",\"At week i you have exactly two options: skip it (and inherit the best answer through week i-1), or take it (and add value[i] to the best answer through week i-2). The recurrence is best[i] = max(best[i-1], best[i-2] + value[i]).\",\"That recurrence only ever looks two steps back, so you do not need an array at all — two rolling integers are enough, giving O(1) space.\"],\"bruteForce\":{\"idea\":\"Recursively try take-and-skip at every index. This explores every valid subset and re-solves identical subproblems over and over — the classic exponential recursion that memoisation exists to fix.\",\"time\":\"O(2^n)\",\"space\":\"O(n) recursion depth\"},\"optimal\":{\"idea\":\"Bottom-up DP collapsed to two rolling variables. `take` is the best total that includes the current week, `skip` is the best that excludes it; each step recomputes both from the previous pair.\",\"time\":\"O(n)\",\"space\":\"O(1)\"},\"walkthrough\":\"Trace `value = [2, 7, 9, 3, 1]`. Let `prev2` = best through i-2, `prev1` = best through i-1.\\n\\nStart: `prev2 = 0`, `prev1 = 0`.\\n\\n| i | value[i] | skip = prev1 | take = prev2 + value[i] | best = max | new prev2 | new prev1 |\\n|---|---|---|---|---|---|---|\\n| 0 | 2 | 0 | 0 + 2 = 2 | **2** | 0 | 2 |\\n| 1 | 7 | 2 | 0 + 7 = 7 | **7** | 2 | 7 |\\n| 2 | 9 | 7 | 2 + 9 = 11 | **11** | 7 | 11 |\\n| 3 | 3 | 11 | 7 + 3 = 10 | **11** | 11 | 11 |\\n| 4 | 1 | 11 | 11 + 1 = 12 | **12** | 11 | 12 |\\n\\nAnswer: **12**.\\n\\nLook at row 3. Taking week 3 gives 10, skipping gives 11, so we skip — and critically, `prev1` becomes 11 while `prev2` also becomes 11. That is what lets week 4 add its 1 on top of the week-2 solution. The DP silently keeps the option open; a greedy that had committed to week 3 could not.\\n\\n**Why two variables and not an array:** the recurrence reads only `i-1` and `i-2`. Anything older is unreachable, so storing it is pure waste. This 'roll the window' collapse works on any DP whose recurrence has bounded look-back.\",\"solutions\":{\"python\":\"from typing import List\\n\\ndef max_return(value: List[int]) -> int:\\n    prev2 = 0   # best total through week i-2\\n    prev1 = 0   # best total through week i-1\\n\\n    for v in value:\\n        # either skip this week (keep prev1) or take it (prev2 + v)\\n        current = max(prev1, prev2 + v)\\n        prev2, prev1 = prev1, current\\n\\n    return prev1\",\"java\":\"class Solution {\\n    public int maxReturn(int[] value) {\\n        int prev2 = 0;   // best total through week i-2\\n        int prev1 = 0;   // best total through week i-1\\n\\n        for (int v : value) {\\n            // either skip this week (keep prev1) or take it (prev2 + v)\\n            int current = Math.max(prev1, prev2 + v);\\n            prev2 = prev1;\\n            prev1 = current;\\n        }\\n\\n        return prev1;\\n    }\\n}\",\"cpp\":\"#include <vector>\\n#include <algorithm>\\n\\nclass Solution {\\npublic:\\n    int maxReturn(const std::vector<int>& value) {\\n        int prev2 = 0;   // best total through week i-2\\n        int prev1 = 0;   // best total through week i-1\\n\\n        for (int v : value) {\\n            // either skip this week (keep prev1) or take it (prev2 + v)\\n            int current = std::max(prev1, prev2 + v);\\n            prev2 = prev1;\\n            prev1 = current;\\n        }\\n\\n        return prev1;\\n    }\\n};\"},\"edgeCases\":[\"Single element → that element\",\"Two elements → the larger of the two\",\"All zeros → 0\",\"Initialising prev1 to value[0] before the loop and then also iterating from index 0 double-counts week 0 — start both at 0 and let the loop handle it\"],\"followUps\":[\"The weeks are arranged in a circle so week 0 and week n-1 are adjacent — solve by running the linear version twice, on [0..n-2] and [1..n-1].\",\"Reconstruct which weeks were chosen, not just the total.\",\"Generalise to 'no two campaigns within k weeks' — what does the recurrence become?\"],\"patternTakeaway\":\"When a choice at index i is constrained by index i-1, the answer is max(skip, take + best-from-i-2) — and a recurrence with bounded look-back collapses to O(1) rolling variables.\",\"practice\":{\"note\":\"Same non-adjacent DP collapsed to two rolling variables.\",\"links\":[{\"name\":\"LeetCode 198 · House Robber\",\"url\":\"https://leetcode.com/problems/house-robber/\"}]}},{\"id\":\"cd-02\",\"title\":\"Fewest Credits to Reach a Spend Target\",\"difficulty\":\"medium\",\"topics\":[\"Dynamic Programming\",\"Unbounded Knapsack\"],\"statement\":\"You are given an integer array `credits` of distinct credit-pack sizes and an integer `target`.\\n\\nYou have an unlimited supply of each pack size. Return the **fewest number of packs** that sum exactly to `target`. If the target cannot be reached, return `-1`.\\n\\n**Input:** integer array `credits`, integer `target`.\\n**Output:** a single integer.\",\"examples\":[{\"input\":\"credits = [1,3,4], target = 6\",\"output\":\"2\",\"explanation\":\"3 + 3 = 6 uses two packs. The greedy 'take the largest first' gives 4 + 1 + 1 = 3 packs, which is worse — this is exactly why greedy is wrong here.\"},{\"input\":\"credits = [2], target = 3\",\"output\":\"-1\",\"explanation\":\"Only even totals are reachable with a pack of size 2.\"},{\"input\":\"credits = [5,2], target = 0\",\"output\":\"0\",\"explanation\":\"Zero packs are needed to reach zero.\"}],\"constraints\":[\"1 <= credits.length <= 12\",\"1 <= credits[i] <= 2^31 - 1\",\"0 <= target <= 10^4\"],\"hints\":[\"Check the greedy on example 1 before you trust it: largest-first gives 4+1+1 = 3 packs, but the optimum is 3+3 = 2. Greedy is only correct for special 'canonical' coin systems, and you are not promised one.\",\"Define best[t] = the fewest packs summing to exactly t. What is best[0]? And how does best[t] relate to best[t - c] for each pack size c?\",\"best[t] = 1 + min over all c <= t of best[t - c], with best[0] = 0 and unreachable amounts marked as infinity. Build the table upward from 1 to target so every subproblem you read is already final.\"],\"bruteForce\":{\"idea\":\"Recursively subtract each pack size from the remaining target and take the shallowest branch that reaches zero. Explodes because the same remaining amount is re-solved through many different paths.\",\"time\":\"O(len(credits)^target)\",\"space\":\"O(target) recursion depth\"},\"optimal\":{\"idea\":\"Bottom-up 1-D DP over amounts 0..target. Each amount consults every pack size once. Because packs are unlimited, the table is filled in increasing amount order and each entry reads only smaller, already-finalised entries.\",\"time\":\"O(target * len(credits))\",\"space\":\"O(target)\"},\"walkthrough\":\"Trace `credits = [1, 3, 4]`, `target = 6`. Write `INF` for unreachable. Initialise `best[0] = 0`.\\n\\n| t | candidates: 1 + best[t - c] for each c <= t | best[t] |\\n|---|---|---|\\n| 1 | c=1 → 1 + best[0] = 1 | **1** |\\n| 2 | c=1 → 1 + best[1] = 2 | **2** |\\n| 3 | c=1 → 1 + best[2] = 3; c=3 → 1 + best[0] = 1 | **1** |\\n| 4 | c=1 → 1 + best[3] = 2; c=3 → 1 + best[1] = 2; c=4 → 1 + best[0] = 1 | **1** |\\n| 5 | c=1 → 1 + best[4] = 2; c=3 → 1 + best[2] = 3; c=4 → 1 + best[1] = 2 | **2** |\\n| 6 | c=1 → 1 + best[5] = 3; c=3 → 1 + best[3] = **2**; c=4 → 1 + best[2] = 3 | **2** |\\n\\nAnswer: `best[6] = 2`, achieved by 3 + 3.\\n\\nNotice row 6: the greedy instinct picks `c = 4` because it is the biggest pack that fits, giving 3. The DP evaluates all three options and finds that going through `best[3] = 1` is better. The table has already computed that 3 is reachable in a single pack, so it can exploit that.\\n\\n**The overflow trap.** Constraints allow `credits[i]` up to 2³¹−1. If you initialise the table with `Integer.MAX_VALUE` and then compute `1 + best[t - c]` without first checking that `best[t - c]` is reachable, you overflow to a negative number and the `min` happily accepts it. Guard with an explicit reachability check, as the code below does.\",\"solutions\":{\"python\":\"from typing import List\\n\\ndef fewest_packs(credits: List[int], target: int) -> int:\\n    INF = float('inf')\\n    best = [INF] * (target + 1)\\n    best[0] = 0                      # zero packs make zero\\n\\n    for t in range(1, target + 1):\\n        for c in credits:\\n            if c <= t and best[t - c] != INF:\\n                best[t] = min(best[t], best[t - c] + 1)\\n\\n    return -1 if best[target] == INF else best[target]\",\"java\":\"import java.util.*;\\n\\nclass Solution {\\n    public int fewestPacks(int[] credits, int target) {\\n        final int UNREACHABLE = Integer.MAX_VALUE;\\n        int[] best = new int[target + 1];\\n        Arrays.fill(best, UNREACHABLE);\\n        best[0] = 0;                     // zero packs make zero\\n\\n        for (int t = 1; t <= target; t++) {\\n            for (int c : credits) {\\n                // c <= t guards the index; the reachability check prevents\\n                // MAX_VALUE + 1 from overflowing to a negative number.\\n                if (c <= t && best[t - c] != UNREACHABLE) {\\n                    best[t] = Math.min(best[t], best[t - c] + 1);\\n                }\\n            }\\n        }\\n\\n        return best[target] == UNREACHABLE ? -1 : best[target];\\n    }\\n}\",\"cpp\":\"#include <vector>\\n#include <algorithm>\\n#include <climits>\\n\\nclass Solution {\\npublic:\\n    int fewestPacks(const std::vector<int>& credits, int target) {\\n        const int UNREACHABLE = INT_MAX;\\n        std::vector<int> best(target + 1, UNREACHABLE);\\n        best[0] = 0;                     // zero packs make zero\\n\\n        for (int t = 1; t <= target; ++t) {\\n            for (int c : credits) {\\n                // c <= t guards the index; the reachability check prevents\\n                // INT_MAX + 1 from overflowing to a negative number.\\n                if (c <= t && best[t - c] != UNREACHABLE) {\\n                    best[t] = std::min(best[t], best[t - c] + 1);\\n                }\\n            }\\n        }\\n\\n        return best[target] == UNREACHABLE ? -1 : best[target];\\n    }\\n};\"},\"edgeCases\":[\"target = 0 → 0, and the table must be sized target+1 so index 0 exists\",\"No combination reaches the target → -1, not 0 and not a huge number\",\"A single pack size larger than the target → -1\",\"Pack sizes near 2^31-1 with an unguarded INF + 1 → silent integer overflow, the classic wrong answer here\",\"credits containing a value equal to target → 1\"],\"followUps\":[\"Count the number of distinct combinations reaching the target instead of the minimum count — note the loop order flips to avoid counting permutations.\",\"Return the actual multiset of packs used, by storing a parent pointer per amount.\",\"target grows to 10^9 but len(credits) stays tiny — the DP is dead; what number-theoretic approach works?\"],\"patternTakeaway\":\"Unbounded knapsack: best[t] = 1 + min(best[t - c]) built upward from 0 — and always check reachability before adding 1, or your sentinel overflows.\",\"practice\":{\"note\":\"Identical unbounded knapsack, including the -1 unreachable case.\",\"links\":[{\"name\":\"LeetCode 322 · Coin Change\",\"url\":\"https://leetcode.com/problems/coin-change/\"}]}},{\"id\":\"cd-03\",\"title\":\"Longest Shared Message Sequence\",\"difficulty\":\"medium\",\"topics\":[\"Dynamic Programming\",\"2D DP\",\"Strings\"],\"statement\":\"Two assistants produced answers `a` and `b` about your brand. To measure how much they overlap, find the length of the **longest common subsequence** of the two strings.\\n\\nA subsequence keeps the original relative order but may skip characters; it does not need to be contiguous.\\n\\n**Input:** two strings `a` and `b`.\\n**Output:** a single integer — the length of the longest common subsequence.\",\"examples\":[{\"input\":\"a = \\\"abcde\\\", b = \\\"ace\\\"\",\"output\":\"3\",\"explanation\":\"\\\"ace\\\" appears in \\\"abcde\\\" in order (skipping b and d), so the LCS has length 3.\"},{\"input\":\"a = \\\"abc\\\", b = \\\"def\\\"\",\"output\":\"0\",\"explanation\":\"No characters in common.\"},{\"input\":\"a = \\\"abc\\\", b = \\\"abc\\\"\",\"output\":\"3\",\"explanation\":\"Identical strings — the whole string is common.\"}],\"constraints\":[\"1 <= a.length, b.length <= 1000\",\"a and b consist of lowercase English letters\"],\"hints\":[\"Compare the last characters of the two strings. If they match, that character can safely be part of the answer — why is it never wrong to include it? If they differ, at least one of them cannot be in the LCS.\",\"Let dp[i][j] be the LCS length of the first i characters of a and the first j of b. When a[i-1] == b[j-1], dp[i][j] = dp[i-1][j-1] + 1. Otherwise dp[i][j] = max(dp[i-1][j], dp[i][j-1]).\",\"Row i only ever reads row i-1, so if memory is tight you can keep two rows instead of the full table — but with lengths capped at 1000 the full 1001x1001 table is fine and much easier to debug.\"],\"bruteForce\":{\"idea\":\"Enumerate every subsequence of a (2^n of them) and test each for being a subsequence of b. Correct and completely infeasible beyond about n = 20.\",\"time\":\"O(2^n * m)\",\"space\":\"O(n)\"},\"optimal\":{\"idea\":\"Fill a 2-D table where dp[i][j] answers the prefix-versus-prefix subproblem. Every cell is computed once in O(1) from three neighbours, so the table fill is the total cost.\",\"time\":\"O(n * m)\",\"space\":\"O(n * m), reducible to O(min(n, m))\"},\"walkthrough\":\"Trace `a = \\\"abcde\\\"` (rows) against `b = \\\"ace\\\"` (columns). Row 0 and column 0 are all zeros — an empty prefix shares nothing.\\n\\n|  | ∅ | a | c | e |\\n|---|---|---|---|---|\\n| **∅** | 0 | 0 | 0 | 0 |\\n| **a** | 0 | **1** | 1 | 1 |\\n| **b** | 0 | 1 | 1 | 1 |\\n| **c** | 0 | 1 | **2** | 2 |\\n| **d** | 0 | 1 | 2 | 2 |\\n| **e** | 0 | 1 | 2 | **3** |\\n\\nRead a few cells:\\n\\n- **(a, a)** — characters match, so take the diagonal `dp[0][0] = 0` and add 1 → **1**.\\n- **(b, a)** — `'b' != 'a'`, so take `max(dp[above] = 1, dp[left] = 0) = 1`. The `b` contributed nothing but we keep the best result found so far.\\n- **(c, c)** — match, so diagonal `dp[\\\"ab\\\",\\\"a\\\"] = 1` plus 1 → **2**.\\n- **(e, e)** — match, diagonal `dp[\\\"abcd\\\",\\\"ac\\\"] = 2` plus 1 → **3**.\\n\\nBottom-right cell = **3**.\\n\\n**Why taking a match is always safe:** if `a[i-1] == b[j-1] == x`, there is always an optimal LCS that ends with that `x`. Any LCS not using this pair can be rewritten to use it without getting shorter. That is what licenses the unconditional `dp[i-1][j-1] + 1` — no `max` needed on the match branch.\\n\\n**Do not confuse this with longest common substring**, which requires contiguity and has a different recurrence: the mismatch case resets to 0 rather than inheriting the max.\",\"solutions\":{\"python\":\"def longest_common_subsequence(a: str, b: str) -> int:\\n    n, m = len(a), len(b)\\n    # dp[i][j] = LCS length of a[:i] and b[:j]; row/col 0 mean empty prefix\\n    dp = [[0] * (m + 1) for _ in range(n + 1)]\\n\\n    for i in range(1, n + 1):\\n        for j in range(1, m + 1):\\n            if a[i - 1] == b[j - 1]:\\n                # a match is always safe to take - no max needed here\\n                dp[i][j] = dp[i - 1][j - 1] + 1\\n            else:\\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])\\n\\n    return dp[n][m]\",\"java\":\"class Solution {\\n    public int longestCommonSubsequence(String a, String b) {\\n        int n = a.length(), m = b.length();\\n        // dp[i][j] = LCS length of a[0..i) and b[0..j); row/col 0 = empty prefix\\n        int[][] dp = new int[n + 1][m + 1];\\n\\n        for (int i = 1; i <= n; i++) {\\n            for (int j = 1; j <= m; j++) {\\n                if (a.charAt(i - 1) == b.charAt(j - 1)) {\\n                    // a match is always safe to take - no max needed here\\n                    dp[i][j] = dp[i - 1][j - 1] + 1;\\n                } else {\\n                    dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);\\n                }\\n            }\\n        }\\n\\n        return dp[n][m];\\n    }\\n}\",\"cpp\":\"#include <string>\\n#include <vector>\\n#include <algorithm>\\n\\nclass Solution {\\npublic:\\n    int longestCommonSubsequence(const std::string& a, const std::string& b) {\\n        int n = static_cast<int>(a.size());\\n        int m = static_cast<int>(b.size());\\n        // dp[i][j] = LCS length of a[0..i) and b[0..j); row/col 0 = empty prefix\\n        std::vector<std::vector<int>> dp(n + 1, std::vector<int>(m + 1, 0));\\n\\n        for (int i = 1; i <= n; ++i) {\\n            for (int j = 1; j <= m; ++j) {\\n                if (a[i - 1] == b[j - 1]) {\\n                    // a match is always safe to take - no max needed here\\n                    dp[i][j] = dp[i - 1][j - 1] + 1;\\n                } else {\\n                    dp[i][j] = std::max(dp[i - 1][j], dp[i][j - 1]);\\n                }\\n            }\\n        }\\n\\n        return dp[n][m];\\n    }\\n};\"},\"edgeCases\":[\"No common characters → 0\",\"Identical strings → full length\",\"One string a subsequence of the other → the shorter length\",\"Off-by-one on the string index: dp indices are 1-based but string indices are 0-based, hence a[i-1]\",\"Confusing this with longest common SUBSTRING, where a mismatch resets the cell to 0\"],\"followUps\":[\"Reconstruct the actual subsequence by walking the table backwards from dp[n][m].\",\"Reduce space to two rows — or to one row with a saved diagonal.\",\"Compute the edit distance between the two strings; the recurrence is a close cousin with three operations instead of two.\"],\"patternTakeaway\":\"Two-sequence DP is a grid over prefix pairs: match → diagonal + 1, mismatch → max of the two neighbours; row i reads only row i-1, which is what lets you shrink the space.\",\"practice\":{\"note\":\"The exact problem.\",\"links\":[{\"name\":\"LeetCode 1143 · Longest Common Subsequence\",\"url\":\"https://leetcode.com/problems/longest-common-subsequence/\"}]}},{\"id\":\"ce-01\",\"title\":\"Rotate an Asset Grid In Place\",\"difficulty\":\"medium\",\"topics\":[\"Matrix\",\"Implementation\",\"In-Place\"],\"statement\":\"You are given an `n x n` matrix representing an image asset. Rotate it **90 degrees clockwise, in place** — you must modify the input matrix directly and may not allocate another n x n matrix.\\n\\n**Input:** an `n x n` integer matrix.\\n**Output:** none; mutate the input.\",\"examples\":[{\"input\":\"matrix = [[1,2,3],[4,5,6],[7,8,9]]\",\"output\":\"[[7,4,1],[8,5,2],[9,6,3]]\",\"explanation\":\"The first column bottom-to-top (7,4,1) becomes the first row.\"},{\"input\":\"matrix = [[1,2],[3,4]]\",\"output\":\"[[3,1],[4,2]]\",\"explanation\":\"A 2x2 rotation.\"}],\"constraints\":[\"n == matrix.length == matrix[i].length\",\"1 <= n <= 20\",\"-1000 <= matrix[i][j] <= 1000\"],\"hints\":[\"Write down where a single element ends up. Element at (r, c) lands at (c, n-1-r). Try to build that mapping out of two simpler operations you already know how to do in place.\",\"Transpose (reflect across the main diagonal) sends (r, c) to (c, r). What single reflection do you still need afterwards to turn (c, r) into (c, n-1-r)?\",\"Transpose, then reverse each row. The transpose loop must start its inner index at `c = r`, not `c = 0` — otherwise you swap every pair twice and end up back where you started.\"],\"bruteForce\":{\"idea\":\"Allocate a fresh n x n matrix, write result[c][n-1-r] = matrix[r][c], then copy it back. Trivially correct but violates the in-place constraint and uses O(n^2) extra memory.\",\"time\":\"O(n^2)\",\"space\":\"O(n^2)\"},\"optimal\":{\"idea\":\"Two in-place passes: transpose across the main diagonal, then reverse each row. Both are simple swap loops with no extra allocation.\",\"time\":\"O(n^2)\",\"space\":\"O(1)\"},\"walkthrough\":\"Take the 3x3:\\n\\n```\\n1 2 3\\n4 5 6\\n7 8 9\\n```\\n\\n**Pass 1 — transpose.** Swap `matrix[r][c]` with `matrix[c][r]` for every `c > r`, i.e. only the upper triangle.\\n\\n| swap | result so far |\\n|---|---|\\n| (0,1) ↔ (1,0) | 1 4 3 / 2 5 6 / 7 8 9 |\\n| (0,2) ↔ (2,0) | 1 4 7 / 2 5 6 / 3 8 9 |\\n| (1,2) ↔ (2,1) | 1 4 7 / 2 5 8 / 3 6 9 |\\n\\n```\\n1 4 7\\n2 5 8\\n3 6 9\\n```\\n\\n**Pass 2 — reverse each row.**\\n\\n```\\n7 4 1\\n8 5 2\\n9 6 3\\n```\\n\\nWhich is the required output.\\n\\n**Why the inner loop starts at `c = r`.** If it started at `c = 0`, the pair (0,1)↔(1,0) would be swapped once when `r=0, c=1` and swapped *back* when `r=1, c=0`. Every swap would be undone and the matrix would come out unchanged — a bug that produces a perfectly plausible-looking 'no rotation happened' result rather than a crash.\\n\\n**For 90° anticlockwise** it is the same trick with the second step changed: transpose, then reverse each *column* (equivalently, reverse the order of the rows).\",\"solutions\":{\"python\":\"from typing import List\\n\\ndef rotate(matrix: List[List[int]]) -> None:\\n    n = len(matrix)\\n\\n    # Pass 1: transpose across the main diagonal.\\n    # Inner loop starts at c = r so each pair is swapped exactly once.\\n    for r in range(n):\\n        for c in range(r + 1, n):\\n            matrix[r][c], matrix[c][r] = matrix[c][r], matrix[r][c]\\n\\n    # Pass 2: reverse each row\\n    for row in matrix:\\n        row.reverse()\",\"java\":\"class Solution {\\n    public void rotate(int[][] matrix) {\\n        int n = matrix.length;\\n\\n        // Pass 1: transpose across the main diagonal.\\n        // Inner loop starts at c = r + 1 so each pair is swapped exactly once.\\n        for (int r = 0; r < n; r++) {\\n            for (int c = r + 1; c < n; c++) {\\n                int tmp = matrix[r][c];\\n                matrix[r][c] = matrix[c][r];\\n                matrix[c][r] = tmp;\\n            }\\n        }\\n\\n        // Pass 2: reverse each row\\n        for (int r = 0; r < n; r++) {\\n            int left = 0, right = n - 1;\\n            while (left < right) {\\n                int tmp = matrix[r][left];\\n                matrix[r][left] = matrix[r][right];\\n                matrix[r][right] = tmp;\\n                left++;\\n                right--;\\n            }\\n        }\\n    }\\n}\",\"cpp\":\"#include <vector>\\n#include <algorithm>\\n\\nclass Solution {\\npublic:\\n    void rotate(std::vector<std::vector<int>>& matrix) {\\n        int n = static_cast<int>(matrix.size());\\n\\n        // Pass 1: transpose across the main diagonal.\\n        // Inner loop starts at c = r + 1 so each pair is swapped exactly once.\\n        for (int r = 0; r < n; ++r) {\\n            for (int c = r + 1; c < n; ++c) {\\n                std::swap(matrix[r][c], matrix[c][r]);\\n            }\\n        }\\n\\n        // Pass 2: reverse each row\\n        for (int r = 0; r < n; ++r) {\\n            std::reverse(matrix[r].begin(), matrix[r].end());\\n        }\\n    }\\n};\"},\"edgeCases\":[\"n = 1 → unchanged\",\"n = 2 → the smallest case where a double-swap bug is visible\",\"Inner transpose loop starting at c = 0 → every swap undone, matrix unchanged\",\"Returning a new matrix instead of mutating — fails the in-place requirement even though the values are right\"],\"followUps\":[\"Rotate 90 degrees anticlockwise instead — transpose then reverse rows top-to-bottom.\",\"Rotate a rectangular m x n matrix; why can that not be done in place?\",\"Do it with the four-way cyclic swap of layers, touching each element exactly once.\"],\"patternTakeaway\":\"In-place matrix rotation = transpose then reverse rows; the transpose inner loop must start at c = r + 1 or every swap is undone.\",\"practice\":{\"note\":\"Identical in-place transpose-then-reverse.\",\"links\":[{\"name\":\"LeetCode 48 · Rotate Image\",\"url\":\"https://leetcode.com/problems/rotate-image/\"}]}},{\"id\":\"ce-02\",\"title\":\"The Unpaired Session ID\",\"difficulty\":\"easy\",\"topics\":[\"Bit Manipulation\",\"Arrays\",\"XOR\"],\"statement\":\"Every session in a log was recorded exactly twice, except for one session that was recorded only once.\\n\\nGiven the array `ids`, return the id that appears only once. Solve it in linear time using constant extra space.\\n\\n**Input:** integer array `ids`.\\n**Output:** a single integer.\",\"examples\":[{\"input\":\"ids = [4,1,2,1,2]\",\"output\":\"4\",\"explanation\":\"1 and 2 each appear twice; 4 appears once.\"},{\"input\":\"ids = [7]\",\"output\":\"7\",\"explanation\":\"A single element is by definition the unpaired one.\"}],\"constraints\":[\"1 <= ids.length <= 3 * 10^4\",\"ids.length is odd\",\"-3 * 10^4 <= ids[i] <= 3 * 10^4\",\"every element appears exactly twice except one\"],\"hints\":[\"A hash set solves this immediately but costs O(n) space, and the problem explicitly asks for O(1). So you need an operation that makes duplicates cancel each other out.\",\"XOR has three properties that matter here: x ^ x == 0, x ^ 0 == x, and it is commutative and associative — so the order you apply it in does not matter at all.\",\"XOR every element together. Each duplicated pair collapses to 0 regardless of where the two copies sit in the array, and 0 ^ unique == unique.\"],\"bruteForce\":{\"idea\":\"Count occurrences in a hash map, then scan for the entry with count 1. Linear time but O(n) space, which the constraints rule out.\",\"time\":\"O(n)\",\"space\":\"O(n)\"},\"optimal\":{\"idea\":\"Fold the whole array with XOR into a single accumulator. Pairs annihilate; the survivor is the answer.\",\"time\":\"O(n)\",\"space\":\"O(1)\"},\"walkthrough\":\"Trace `ids = [4, 1, 2, 1, 2]` with `result = 0`. Values shown in binary for clarity.\\n\\n| step | element | operation | result (binary) | result |\\n|---|---|---|---|---|\\n| start | — | — | 000 | 0 |\\n| 1 | 4 (100) | 0 ^ 4 | 100 | 4 |\\n| 2 | 1 (001) | 4 ^ 1 | 101 | 5 |\\n| 3 | 2 (010) | 5 ^ 2 | 111 | 7 |\\n| 4 | 1 (001) | 7 ^ 1 | 110 | 6 |\\n| 5 | 2 (010) | 6 ^ 2 | 100 | 4 |\\n\\nResult: **4**.\\n\\nWatch what happened to the 1s: the low bit was set at step 2 and cleared again at step 4. Same for the 2s at steps 3 and 5. Because XOR is commutative and associative, the expression is equivalent to `4 ^ (1 ^ 1) ^ (2 ^ 2)` = `4 ^ 0 ^ 0` = `4` — and that regrouping is legal *no matter how the duplicates are scattered* through the array. The array does not need to be sorted, and the pairs do not need to be adjacent.\\n\\nNegative numbers are fine too: XOR operates on the two's-complement bit pattern, and a value XORed with itself is still zero whatever those bits are.\",\"solutions\":{\"python\":\"from typing import List\\n\\ndef find_unpaired(ids: List[int]) -> int:\\n    result = 0\\n    for value in ids:\\n        # x ^ x == 0, so every duplicated pair cancels out\\n        result ^= value\\n    return result\",\"java\":\"class Solution {\\n    public int findUnpaired(int[] ids) {\\n        int result = 0;\\n        for (int value : ids) {\\n            // x ^ x == 0, so every duplicated pair cancels out\\n            result ^= value;\\n        }\\n        return result;\\n    }\\n}\",\"cpp\":\"#include <vector>\\n\\nclass Solution {\\npublic:\\n    int findUnpaired(const std::vector<int>& ids) {\\n        int result = 0;\\n        for (int value : ids) {\\n            // x ^ x == 0, so every duplicated pair cancels out\\n            result ^= value;\\n        }\\n        return result;\\n    }\\n};\"},\"edgeCases\":[\"Single element → returns it\",\"Negative values → fine, XOR works on the bit pattern\",\"The unpaired element is 0 → returns 0 correctly, but a 'return the first non-cancelled value' hack would not\",\"Duplicates far apart in the array → order is irrelevant to XOR\"],\"followUps\":[\"Two elements appear once instead of one — split the array by any set bit of the total XOR and solve each half.\",\"Every element appears three times except one; XOR no longer cancels, so count bits modulo 3 instead.\",\"Find the missing number in 0..n — XOR the array against 0..n.\"],\"patternTakeaway\":\"XOR is the constant-space cancellation tool: x ^ x = 0 and x ^ 0 = x, and because it commutes the duplicates can be anywhere in the array.\",\"practice\":{\"note\":\"The exact XOR problem.\",\"links\":[{\"name\":\"LeetCode 136 · Single Number\",\"url\":\"https://leetcode.com/problems/single-number/\"}]}},{\"id\":\"ce-03\",\"title\":\"Share of Voice Across AI Answers\",\"difficulty\":\"medium\",\"topics\":[\"Hash Map\",\"Sorting\",\"Simulation\",\"String Parsing\"],\"statement\":\"You are measuring how visible brands are inside AI assistant answers.\\n\\nYou are given `answers`, a list of strings. Each string is one assistant answer, formatted as space-separated brand mentions. A mention has the form `brand:position`, where `position` is a 1-based integer giving where the brand was cited in that answer (position 1 is the first citation).\\n\\nA mention scores `1.0 / position` points — being cited first is worth much more than being cited fifth.\\n\\nReturn the brands ranked by **share of voice**: a brand's share is its total score divided by the total score of all brands. Rank by share descending; break ties by brand name ascending. Round each share to 4 decimal places.\\n\\n**Input:** list of strings `answers`.\\n**Output:** list of `[brand, share]` pairs.\",\"examples\":[{\"input\":\"answers = [\\\"acme:1 globex:2\\\", \\\"globex:1 acme:2\\\"]\",\"output\":\"[[\\\"acme\\\",0.5],[\\\"globex\\\",0.5]]\",\"explanation\":\"acme scores 1/1 + 1/2 = 1.5; globex scores 1/2 + 1/1 = 1.5. Total 3.0, so each holds 0.5. The tie is broken alphabetically.\"},{\"input\":\"answers = [\\\"acme:1\\\", \\\"acme:1\\\", \\\"globex:2\\\"]\",\"output\":\"[[\\\"acme\\\",0.8],[\\\"globex\\\",0.2]]\",\"explanation\":\"acme scores 1 + 1 = 2.0; globex scores 0.5. Total 2.5 → acme 2.0/2.5 = 0.8, globex 0.5/2.5 = 0.2.\"}],\"constraints\":[\"1 <= answers.length <= 10^4\",\"each answer contains between 1 and 20 mentions\",\"brand names are lowercase letters, length <= 20\",\"1 <= position <= 20\"],\"hints\":[\"There are three separate steps hiding in here: parse, aggregate, rank. Do them one at a time rather than trying to fuse them — fused parsing-and-ranking code is where the bugs live.\",\"Parsing: split each answer on spaces, then split each token on ':' to get the brand and the position. Accumulate into a hash map from brand to running score.\",\"Compute the grand total in the same pass you build the map, then divide. Do the rounding only at the very end — rounding each mention as you go accumulates error and can flip a tie.\"],\"bruteForce\":{\"idea\":\"Collect every mention into a flat list, then for each distinct brand rescan the whole list summing its score. Correct but quadratic in the number of mentions.\",\"time\":\"O(M * B) for M mentions and B brands\",\"space\":\"O(M)\"},\"optimal\":{\"idea\":\"One pass to parse and accumulate scores into a hash map while tracking the grand total, then one sort of the distinct brands. Sorting dominates.\",\"time\":\"O(M + B log B)\",\"space\":\"O(B)\"},\"walkthrough\":\"Take `answers = [\\\"acme:1\\\", \\\"acme:1\\\", \\\"globex:2\\\"]`.\\n\\n**Step 1 — parse and accumulate.**\\n\\n| answer | token | brand | position | score added | map after | total |\\n|---|---|---|---|---|---|---|\\n| \\\"acme:1\\\" | acme:1 | acme | 1 | 1/1 = 1.0 | {acme: 1.0} | 1.0 |\\n| \\\"acme:1\\\" | acme:1 | acme | 1 | 1/1 = 1.0 | {acme: 2.0} | 2.0 |\\n| \\\"globex:2\\\" | globex:2 | globex | 2 | 1/2 = 0.5 | {acme: 2.0, globex: 0.5} | 2.5 |\\n\\n**Step 2 — divide by the grand total (2.5).**\\n\\n| brand | score | share |\\n|---|---|---|\\n| acme | 2.0 | 2.0 / 2.5 = 0.8 |\\n| globex | 0.5 | 0.5 / 2.5 = 0.2 |\\n\\n**Step 3 — sort by share descending, then name ascending** → `[[\\\"acme\\\", 0.8], [\\\"globex\\\", 0.2]]`.\\n\\n**The floating-point trap.** Shares are doubles, and comparing them with `==` for the tie-break is unreliable — `1.5/3.0` and `1.5/3.0` computed by different routes may differ in the last bit. In the tie-break, compare with a small epsilon (as the code below does) rather than exact equality, or compare the integer-scaled rounded values. Example 1 is exactly this case: two brands that must tie and then be ordered alphabetically.\\n\\n**Why 1/position and not a flat count?** Because it encodes the actual finding this whole theme rests on — in a generative answer, the first cited source captures far more attention than the fourth. A flat mention count would rate 'mentioned last in every answer' equal to 'always cited first', which is exactly the wrong signal for a brand visibility dashboard.\",\"solutions\":{\"python\":\"from typing import List\\n\\ndef share_of_voice(answers: List[str]) -> List[list]:\\n    scores = {}\\n    total = 0.0\\n\\n    # Step 1: parse and accumulate in a single pass\\n    for answer in answers:\\n        for token in answer.split():\\n            brand, _, position_text = token.partition(':')\\n            position = int(position_text)\\n            points = 1.0 / position          # first citation is worth the most\\n            scores[brand] = scores.get(brand, 0.0) + points\\n            total += points\\n\\n    # Step 2: convert to shares (guard against an empty input)\\n    if total == 0.0:\\n        return []\\n    ranked = [[brand, score / total] for brand, score in scores.items()]\\n\\n    # Step 3: share descending, then name ascending.\\n    # Round first so the sort and the output agree on the tie-break.\\n    ranked = [[brand, round(share, 4)] for brand, share in ranked]\\n    ranked.sort(key=lambda pair: (-pair[1], pair[0]))\\n    return ranked\",\"java\":\"import java.util.*;\\n\\nclass Solution {\\n    public List<Object[]> shareOfVoice(String[] answers) {\\n        Map<String, Double> scores = new HashMap<>();\\n        double total = 0.0;\\n\\n        // Step 1: parse and accumulate in a single pass\\n        for (String answer : answers) {\\n            for (String token : answer.split(\\\" \\\")) {\\n                if (token.isEmpty()) continue;\\n                int colon = token.lastIndexOf(':');\\n                String brand = token.substring(0, colon);\\n                int position = Integer.parseInt(token.substring(colon + 1));\\n                double points = 1.0 / position;    // first citation is worth the most\\n                scores.put(brand, scores.getOrDefault(brand, 0.0) + points);\\n                total += points;\\n            }\\n        }\\n\\n        List<Object[]> ranked = new ArrayList<>();\\n        if (total == 0.0) return ranked;\\n\\n        // Step 2: convert to shares, rounded to 4 decimal places\\n        for (Map.Entry<String, Double> e : scores.entrySet()) {\\n            double share = Math.round(e.getValue() / total * 10000.0) / 10000.0;\\n            ranked.add(new Object[]{e.getKey(), share});\\n        }\\n\\n
