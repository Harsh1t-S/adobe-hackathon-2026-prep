/* ---- Storage ------------------------------------------------------------ */

const STORE_KEY = 'adobe-prep-2026';

function defaultState() {
  return {
    profile: '',
    theme: '',
    mcq: {},          // id -> {seen, correct, wrong, starred, lastPick, lastAt}
    code: {},         // id -> {solved, revealed:[], notes}
    cases: {},        // caseId -> {answers:{qIdx:text}, scored:{qIdx:[bool]}, done}
    flash: {},        // cardKey -> {box, due}
    mocks: [],        // finished mock runs
    read: {},         // cardId -> true
  };
}

let STATE = defaultState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      STATE = Object.assign(defaultState(), parsed);
      ['mcq', 'code', 'cases', 'flash', 'read'].forEach(function (k) {
        if (!STATE[k] || typeof STATE[k] !== 'object') STATE[k] = {};
      });
      if (!Array.isArray(STATE.mocks)) STATE.mocks = [];
    }
  } catch (e) { STATE = defaultState(); }
}

let saveTimer = null;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); } catch (e) { /* quota */ }
  }, 180);
}

function mcqRec(id) {
  if (!STATE.mcq[id]) STATE.mcq[id] = { seen: 0, correct: 0, wrong: 0, starred: false, lastPick: null };
  return STATE.mcq[id];
}
function codeRec(id) {
  if (!STATE.code[id]) STATE.code[id] = { solved: false, revealed: [], notes: '' };
  return STATE.code[id];
}
function caseRec(id) {
  if (!STATE.cases[id]) STATE.cases[id] = { answers: {}, scored: {}, done: false };
  return STATE.cases[id];
}

/* ---- Markdown ----------------------------------------------------------- */

// Content authored upstream sometimes already carries HTML entities inside code
// fences (`i &lt; n`). Decode first, then escape once, so it renders as `i < n`
// instead of the literal text `&lt;`.
function decodeEntities(s) {
  return String(s)
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
    .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&');
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escapeForHtml(s) { return esc(decodeEntities(s)); }

function inlineMd(src) {
  let s = escapeForHtml(src);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, function (_, c) {
    codes.push(c);
    return '\u001A' + (codes.length - 1) + '\u001A';
  });
  s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<s>$1</s>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/\u001A(\d+)\u001A/g, function (_, i) { return '<code>' + codes[+i] + '</code>'; });
  return s;
}

function highlight(code, lang) {
  const src = decodeEntities(code);
  const out = [];
  const KW = {
    python: /\b(def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|with|try|except|finally|raise|lambda|yield|pass|break|continue|None|True|False|global|nonlocal|assert|del|is)\b/,
    java: /\b(public|private|protected|static|final|class|interface|extends|implements|return|if|else|for|while|do|switch|case|break|continue|new|this|super|void|try|catch|finally|throw|throws|import|package|null|true|false|abstract|synchronized|instanceof|enum|default)\b/,
    cpp: /\b(int|long|short|char|bool|double|float|void|auto|const|static|struct|class|public|private|protected|return|if|else|for|while|do|switch|case|break|continue|new|delete|using|namespace|template|typename|try|catch|throw|include|define|nullptr|true|false|sizeof|virtual|override|unsigned|constexpr)\b/,
  };
  const TYPES = /\b(vector|string|map|unordered_map|set|unordered_set|pair|queue|stack|priority_queue|deque|List|ArrayList|Map|HashMap|Set|HashSet|Deque|ArrayDeque|Queue|PriorityQueue|String|StringBuilder|Integer|Long|Character|Boolean|Arrays|Collections|Math|System|Optional|int|str|list|dict|tuple|float|bool)\b/;
  const kw = KW[lang] || KW.python;

  // Tokenise line by line so a stray quote can't swallow the file.
  src.split('\n').forEach(function (line, li) {
    if (li) out.push('\n');
    let rest = line, guard = 0;
    while (rest.length && guard++ < 4000) {
      let m;
      if ((m = rest.match(/^(\s+)/))) { out.push(esc(m[1])); rest = rest.slice(m[1].length); continue; }
      if ((m = rest.match(/^(#[^\n]*|\/\/[^\n]*)/))) { out.push('<span class="tk-com">' + esc(m[1]) + '</span>'); rest = rest.slice(m[1].length); continue; }
      if ((m = rest.match(/^(\/\*[\s\S]*?\*\/|\/\*[^\n]*)/))) { out.push('<span class="tk-com">' + esc(m[1]) + '</span>'); rest = rest.slice(m[1].length); continue; }
      if ((m = rest.match(/^("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')/))) { out.push('<span class="tk-str">' + esc(m[1]) + '</span>'); rest = rest.slice(m[1].length); continue; }
      if ((m = rest.match(/^(\d[\w.]*)/))) { out.push('<span class="tk-num">' + esc(m[1]) + '</span>'); rest = rest.slice(m[1].length); continue; }
      if ((m = rest.match(/^([A-Za-z_$][\w$]*)/))) {
        const w = m[1];
        const after = rest.slice(w.length);
        let cls = '';
        if (kw.test(w)) cls = 'tk-kw';
        else if (TYPES.test(w)) cls = 'tk-typ';
        else if (/^\s*\(/.test(after)) cls = 'tk-fn';
        out.push(cls ? '<span class="' + cls + '">' + esc(w) + '</span>' : esc(w));
        rest = after; continue;
      }
      if ((m = rest.match(/^([+\-*/%=<>!&|^~?:]+)/))) { out.push('<span class="tk-op">' + esc(m[1]) + '</span>'); rest = rest.slice(m[1].length); continue; }
      out.push(esc(rest[0])); rest = rest.slice(1);
    }
  });
  return out.join('');
}

function codeBlock(code, lang, opts) {
  const o = opts || {};
  const wrap = el('div', { class: 'code-wrap' });
  const bar = el('div', { class: 'code-bar' });
  bar.appendChild(el('span', { class: 'lang', text: lang || 'text' }));
  bar.appendChild(el('span', { class: 'spacer' }));
  if (o.tabs) bar.appendChild(o.tabs);
  const copyBtn = el('button', {
    class: 'btn btn-sm btn-ghost', type: 'button', title: 'Copy code',
    onclick: function () {
      const text = decodeEntities(code);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast('Copied'); },
          function () { fallbackCopy(text); });
      } else fallbackCopy(text);
    },
  });
  copyBtn.appendChild(icon('copy'));
  copyBtn.appendChild(document.createTextNode('Copy'));
  bar.appendChild(copyBtn);
  wrap.appendChild(bar);
  const pre = el('pre', { class: 'code' });
  pre.appendChild(el('code', { html: highlight(code, lang) }));
  wrap.appendChild(pre);
  return wrap;
}

function fallbackCopy(text) {
  const ta = el('textarea', { style: 'position:fixed;opacity:0' });
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Copy failed'); }
  document.body.removeChild(ta);
}

// Block-level markdown -> DocumentFragment
function md(src) {
  const frag = document.createDocumentFragment();
  if (!src) return frag;
  const lines = String(src).replace(/\r\n/g, '\n').split('\n');
  let i = 0;

  function flushPara(buf) {
    if (!buf.length) return;
    frag.appendChild(el('p', { html: inlineMd(buf.join('\n')).replace(/\n/g, '<br>') }));
    buf.length = 0;
  }

  const para = [];
  while (i < lines.length) {
    const line = lines[i];

    // fenced code
    const fence = line.match(/^\s*```+\s*([\w+-]*)\s*$/);
    if (fence) {
      flushPara(para);
      const lang = (fence[1] || 'text').toLowerCase();
      const body = [];
      i++;
      while (i < lines.length && !/^\s*```+\s*$/.test(lines[i])) { body.push(lines[i]); i++; }
      i++;
      const norm = lang === 'py' ? 'python' : (lang === 'c++' || lang === 'cc' ? 'cpp' : lang);
      frag.appendChild(codeBlock(body.join('\n'), norm));
      continue;
    }

    if (/^\s*$/.test(line)) { flushPara(para); i++; continue; }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara(para);
      const lvl = Math.min(h[1].length + 1, 6);
      frag.appendChild(el('h' + lvl, { html: inlineMd(h[2]) }));
      i++; continue;
    }

    if (/^\s*([-*_])\s*\1\s*\1[-*_\s]*$/.test(line)) { flushPara(para); frag.appendChild(el('hr')); i++; continue; }

    // table
    if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      flushPara(para);
      const cells = function (row) {
        return row.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) { return c.trim(); });
      };
      const head = cells(line);
      i += 2;
      const body = [];
      while (i < lines.length && /\|/.test(lines[i]) && !/^\s*$/.test(lines[i])) { body.push(cells(lines[i])); i++; }
      const scroll = el('div', { class: 'table-scroll' });
      const table = el('table');
      const thead = el('thead');
      const hr = el('tr');
      head.forEach(function (c) { hr.appendChild(el('th', { html: inlineMd(c) })); });
      thead.appendChild(hr); table.appendChild(thead);
      const tbody = el('tbody');
      body.forEach(function (r) {
        const tr = el('tr');
        for (let c = 0; c < head.length; c++) tr.appendChild(el('td', { html: inlineMd(r[c] || '') }));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      scroll.appendChild(table);
      frag.appendChild(scroll);
      continue;
    }

    // blockquote
    if (/^\s*>\s?/.test(line)) {
      flushPara(para);
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      const bq = el('blockquote');
      bq.appendChild(md(buf.join('\n')));
      frag.appendChild(bq);
      continue;
    }

    // lists (one nesting level)
    const li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (li) {
      flushPara(para);
      const ordered = /\d/.test(li[2]);
      const list = el(ordered ? 'ol' : 'ul');
      let cur = null;
      while (i < lines.length) {
        const m2 = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (m2) {
          const indent = m2[1].length;
          if (indent >= 2 && cur) {
            const subLines = [];
            while (i < lines.length) {
              const m3 = lines[i].match(/^(\s{2,})([-*+]|\d+[.)])\s+(.*)$/);
              if (!m3) break;
              subLines.push(m3[2] + ' ' + m3[3]);
              i++;
            }
            cur.appendChild(md(subLines.join('\n')));
            continue;
          }
          cur = el('li', { html: inlineMd(m2[3]) });
          list.appendChild(cur);
          i++;
          continue;
        }
        if (/^\s{2,}\S/.test(lines[i]) && cur) {
          cur.innerHTML += ' ' + inlineMd(lines[i].trim());
          i++; continue;
        }
        break;
      }
      frag.appendChild(list);
      continue;
    }

    para.push(line);
    i++;
  }
  flushPara(para);
  return frag;
}

function mdBlock(src, cls) {
  const d = el('div', { class: 'md ' + (cls || '') });
  d.appendChild(md(src));
  return d;
}

/* ---- Misc --------------------------------------------------------------- */

function toast(msg) {
  let stack = $('.toast-stack');
  if (!stack) { stack = el('div', { class: 'toast-stack' }); document.body.appendChild(stack); }
  const t = el('div', { class: 'toast', text: msg });
  stack.appendChild(t);
  setTimeout(function () { t.remove(); }, 2100);
}

function fmtClock(ms) {
  if (ms < 0) ms = 0;
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  return (h > 0 ? h + ':' + pad(m) : m) + ':' + pad(s);
}

function fmtCountdown(ms) {
  if (ms <= 0) return '00:00:00';
  const total = Math.floor(ms / 1000);
  const d = Math.floor(total / 86400);
  const h = Math.floor((total % 86400) / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  return (d > 0 ? d + 'd ' : '') + pad(h) + ':' + pad(m) + ':' + pad(s);
}

function shuffle(arr, seed) {
  const a = arr.slice();
  let s = seed || 1;
  const rnd = function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ---- Stats -------------------------------------------------------------- */

function mcqStats() {
  const all = APP.mcq;
  let seen = 0, correct = 0, attempts = 0, starred = 0;
  const perTopic = {};
  all.forEach(function (q) {
    const r = STATE.mcq[q.id];
    if (!perTopic[q.topic]) perTopic[q.topic] = { total: 0, seen: 0, correct: 0, attempts: 0 };
    perTopic[q.topic].total++;
    if (!r) return;
    if (r.seen) { seen++; perTopic[q.topic].seen++; }
    correct += r.correct; attempts += r.correct + r.wrong;
    perTopic[q.topic].correct += r.correct;
    perTopic[q.topic].attempts += r.correct + r.wrong;
    if (r.starred) starred++;
  });
  return { total: all.length, seen: seen, correct: correct, attempts: attempts, starred: starred, perTopic: perTopic };
}

function codeStats() {
  let solved = 0;
  APP.coding.forEach(function (p) { if ((STATE.code[p.id] || {}).solved) solved++; });
  return { total: APP.coding.length, solved: solved };
}

/* ---- Countdown ---------------------------------------------------------- */

function roundState(r) {
  const now = Date.now();
  const s = Date.parse(r.startISO), e = Date.parse(r.endISO);
  if (now < s) return { phase: 'upcoming', ms: s - now };
  if (now <= e) return { phase: 'live', ms: e - now };
  return { phase: 'past', ms: 0 };
}

function nextRound() {
  const now = Date.now();
  for (let i = 0; i < APP.meta.rounds.length; i++) {
    const r = APP.meta.rounds[i];
    if (Date.parse(r.endISO) >= now) return r;
  }
  return APP.meta.rounds[APP.meta.rounds.length - 1];
}

const practiceState = { topic: 'all', diff: 'all', pool: 'all', idx: 0, list: [], answered: null };

function buildPool() {
  let list = APP.mcq.slice();
  if (practiceState.topic !== 'all') list = list.filter(function (q) { return q.topic === practiceState.topic; });
  if (practiceState.diff !== 'all') list = list.filter(function (q) { return q.difficulty === practiceState.diff; });
  if (practiceState.pool === 'unseen') list = list.filter(function (q) { return !(STATE.mcq[q.id] || {}).seen; });
  if (practiceState.pool === 'wrong') list = list.filter(function (q) { const r = STATE.mcq[q.id]; return r && r.wrong > 0; });
  if (practiceState.pool === 'starred') list = list.filter(function (q) { return (STATE.mcq[q.id] || {}).starred; });
  return list;
}

ROUTES.practice = function (params) {
  const wrap = el('div', { class: 'view narrow' });
  if (params.topic) { practiceState.topic = params.topic; practiceState.idx = 0; }

  wrap.appendChild(pageHead('Round 1 · Section A', 'MCQ practice',
    'Every question carries the full reasoning, why each wrong option is tempting, and a one-line rule to bank. In the real thing you get 60 seconds each.'));

  const bar = el('div', { class: 'filters' });

  const topicSel = el('select', { class: 'field', onchange: function (e) { practiceState.topic = e.target.value; practiceState.idx = 0; practiceState.answered = null; go('practice'); } });
  topicSel.appendChild(el('option', { value: 'all', text: 'All topics' }));
  Object.keys(TOPIC_META).forEach(function (k) {
    const n = APP.mcq.filter(function (q) { return q.topic === k; }).length;
    if (!n) return;
    topicSel.appendChild(el('option', { value: k, text: topicLabel(k) + ' (' + n + ')', selected: practiceState.topic === k }));
  });
  bar.appendChild(topicSel);

  const diffSel = el('select', { class: 'field', onchange: function (e) { practiceState.diff = e.target.value; practiceState.idx = 0; practiceState.answered = null; go('practice'); } });
  [['all', 'Any difficulty'], ['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard']].forEach(function (d) {
    diffSel.appendChild(el('option', { value: d[0], text: d[1], selected: practiceState.diff === d[0] }));
  });
  bar.appendChild(diffSel);

  const poolSeg = el('div', { class: 'seg' });
  [['all', 'All'], ['unseen', 'Unseen'], ['wrong', 'Got wrong'], ['starred', 'Starred']].forEach(function (p) {
    poolSeg.appendChild(el('button', {
      type: 'button', text: p[1], 'aria-pressed': practiceState.pool === p[0] ? 'true' : 'false',
      onclick: function () { practiceState.pool = p[0]; practiceState.idx = 0; practiceState.answered = null; go('practice'); },
    }));
  });
  bar.appendChild(poolSeg);
  bar.appendChild(el('span', { class: 'grow' }));
  bar.appendChild(el('button', {
    class: 'btn btn-sm', text: 'Shuffle',
    onclick: function () { practiceState.list = shuffle(buildPool(), (Date.now() % 99991) + 7); practiceState.idx = 0; practiceState.answered = null; go('practice'); },
  }));
  wrap.appendChild(bar);

  const pool = buildPool();
  if (!practiceState.list.length || practiceState.list.some(function (q) { return pool.indexOf(q) === -1; }) || practiceState.list.length !== pool.length) {
    practiceState.list = pool;
  }
  const list = practiceState.list;

  if (!list.length) {
    const e = el('div', { class: 'empty' });
    e.appendChild(el('div', { text: 'No questions match that filter.' }));
    e.appendChild(el('button', { class: 'btn btn-sm', text: 'Reset filters', onclick: function () { practiceState.topic = 'all'; practiceState.diff = 'all'; practiceState.pool = 'all'; go('practice'); } }));
    wrap.appendChild(e);
    return wrap;
  }

  if (practiceState.idx >= list.length) practiceState.idx = 0;
  const q = list[practiceState.idx];
  wrap.appendChild(questionCard(q, {
    index: practiceState.idx, total: list.length,
    onNext: function () { practiceState.idx = (practiceState.idx + 1) % list.length; practiceState.answered = null; go('practice'); },
    onPrev: function () { practiceState.idx = (practiceState.idx - 1 + list.length) % list.length; practiceState.answered = null; go('practice'); },
  }));
  return wrap;
};

function questionCard(q, opts) {
  const card = el('div', { class: 'card card-pad q-card' });
  card.appendChild(el('i', { class: 'q-stripe', style: 'background:' + topicHue(q.topic) }));

  const meta = el('div', { class: 'q-meta' });
  meta.appendChild(el('span', { class: 'q-idx', text: (opts.index + 1) + ' / ' + opts.total }));
  meta.appendChild(el('span', { class: 'chip', html: '<i class="chip-dot" style="background:' + topicHue(q.topic) + '"></i>' + esc(topicLabel(q.topic)) }));
  meta.appendChild(el('span', { class: 'chip ' + q.difficulty, text: q.difficulty }));
  if (q.subtopic) meta.appendChild(el('span', { class: 'chip', text: q.subtopic }));
  meta.appendChild(el('span', { class: 'spacer' }));

  const rec = mcqRec(q.id);
  const star = el('button', { class: 'icon-btn ' + (rec.starred ? 'is-on' : ''), title: 'Star for later (S)', type: 'button' });
  star.appendChild(icon('flag'));
  star.addEventListener('click', function () {
    rec.starred = !rec.starred; saveState();
    star.classList.toggle('is-on', rec.starred);
    toast(rec.starred ? 'Starred' : 'Unstarred');
  });
  meta.appendChild(star);
  card.appendChild(meta);

  card.appendChild(mdBlock(q.question, 'q-stem'));

  const opts_ = el('div', { class: 'opts' });
  const buttons = [];
  const KEYS = ['A', 'B', 'C', 'D'];

  function reveal(pick) {
    buttons.forEach(function (b, i) {
      b.disabled = true;
      if (i === q.answerIndex) b.dataset.state = 'correct';
      else if (i === pick) b.dataset.state = 'wrong';
    });
    const right = pick === q.answerIndex;
    rec.seen = (rec.seen || 0) + 1;
    rec.lastPick = pick;
    if (right) rec.correct++; else rec.wrong++;
    saveState();

    const v = el('div', { class: 'verdict ' + (right ? 'right' : 'wrong') });
    const vh = el('div', { class: 'verdict-head' });
    vh.appendChild(icon(right ? 'check' : 'x'));
    vh.appendChild(el('span', { text: right ? 'Correct' : 'Not quite — the answer is ' + KEYS[q.answerIndex] }));
    v.appendChild(vh);

    const vb = el('div', { class: 'verdict-body' });
    vb.appendChild(mdBlock(q.explanation));

    if (q.whyOthersWrong && q.whyOthersWrong.length) {
      const sec = el('div');
      sec.appendChild(el('div', { class: 'section-label', style: 'margin-bottom:7px', text: 'Why the others are wrong' }));
      const wl = el('div', { class: 'why-list' });
      q.whyOthersWrong.forEach(function (w) {
        const item = el('div', { class: 'why-item' });
        item.appendChild(el('span', { class: 'k', text: KEYS[w.optionIndex] || '?' }));
        item.appendChild(el('span', { html: inlineMd(w.reason) }));
        wl.appendChild(item);
      });
      sec.appendChild(wl);
      vb.appendChild(sec);
    }

    if (q.takeaway) {
      const t = el('div', { class: 'takeaway' });
      t.appendChild(icon('bulb'));
      t.appendChild(el('span', { html: inlineMd(q.takeaway) }));
      vb.appendChild(t);
    }

    if (q.verified === 'unverified') {
      vb.appendChild(el('div', {
        class: 'chip', style: 'align-self:flex-start',
        text: 'Not double-checked by the review pass — sanity-check this one yourself',
      }));
    }

    v.appendChild(vb);
    card.appendChild(v);

    const nav = el('div', { style: 'display:flex;gap:9px;margin-top:16px;flex-wrap:wrap' });
    const next = el('button', { class: 'btn btn-primary', text: 'Next question  →', onclick: opts.onNext });
    nav.appendChild(next);
    nav.appendChild(el('button', { class: 'btn', text: '← Previous', onclick: opts.onPrev }));
    card.appendChild(nav);
    next.focus();
    practiceState.answered = pick;
  }

  q.options.forEach(function (o, i) {
    const b = el('button', { class: 'opt', type: 'button' });
    b.appendChild(el('span', { class: 'key', text: KEYS[i] }));
    b.appendChild(el('span', { class: 'txt', html: inlineMd(o) }));
    b.addEventListener('click', function () { reveal(i); });
    buttons.push(b);
    opts_.appendChild(b);
  });
  card.appendChild(opts_);

  card._pick = function (i) { if (!buttons[i].disabled) reveal(i); };
  card._star = function () { star.click(); };
  card._next = opts.onNext;
  return card;
}

    c.appendChild(mdBlock(p.edgeCases.map(function (x) { return '- ' + x; }).join('\n')));

  if (p.followUps && p.followUps.length) {

    c.appendChild(el('h3', { text: 'Follow-ups an interviewer would ask' }));
    c.appendChild(mdBlock(p.followUps.map(function (x) { return '- ' + x; }).join('\n')));

  if (p.patternTakeaway) {

  // Scratch notes

  notes.appendChild(el('h3', { text: 'Your notes' }));

  });
  ta.value = rec.notes || '';
  notes.appendChild(ta);
  box.appendChild(notes);

  return box;
}

/* ---- Timer -------------------------------------------------------------- */

let TIMER = null;
function stopTimer() { if (TIMER) { clearInterval(TIMER); TIMER = null; } }

function examBar(title, totalMs, onExpire, onQuit) {
  const bar = el('div', { class: 'exam-bar' });
  const t = el('div', { class: 'exam-title' });
  t.appendChild(icon('timer'));
  t.appendChild(el('span', { text: title }));
  bar.appendChild(t);
  bar.appendChild(el('span', { class: 'spacer' }));
  const clock = el('div', { class: 'exam-clock', text: fmtClock(totalMs) });
  bar.appendChild(clock);
  bar.appendChild(el('button', { class: 'btn btn-sm btn-ghost', text: 'Quit', onclick: onQuit }));

  const drain = el('div', { class: 'exam-drain' });
  const fill = el('i', { style: 'width:100%' });
  drain.appendChild(fill);

  const started = Date.now();
  stopTimer();
  TIMER = setInterval(function () {
    const left = totalMs - (Date.now() - started);
    clock.textContent = fmtClock(left);
    const pct = Math.max(0, left / totalMs * 100);
    fill.style.width = pct + '%';
    const cls = left <= 60000 ? 'danger' : left <= totalMs * 0.2 ? 'warn' : '';
    clock.className = 'exam-clock ' + cls;
    drain.className = 'exam-drain ' + cls;
    if (left <= 0) { stopTimer(); onExpire(); }
  }, 250);

  return { bar: bar, drain: drain, startedAt: started };
}

/* ---- Round 1 mock ------------------------------------------------------- */

const MOCK_N = 15;
const MOCK_MS = 15 * 60 * 1000;

let mock = null;

function newMockSet() {
  // One from each topic, then fill by weakest-accuracy first — mirrors a real
  // paper's spread instead of dumping 15 questions from one chapter.
  const byTopic = {};
  APP.mcq.forEach(function (q) { (byTopic[q.topic] = byTopic[q.topic] || []).push(q); });
  const seed = (Date.now() % 65521) + 3;
  const picked = [];
  const topics = Object.keys(byTopic);
  topics.forEach(function (t) {
    const pool = shuffle(byTopic[t], seed + t.length);
    if (pool.length) picked.push(pool[0]);
  });
  const rest = shuffle(APP.mcq.filter(function (q) { return picked.indexOf(q) === -1; }), seed);
  let i = 0;
  while (picked.length < MOCK_N && i < rest.length) picked.push(rest[i++]);
  return shuffle(picked, seed + 11).slice(0, MOCK_N);
}

ROUTES.mock = function (params) {
  const box = el('div');

  if (!mock || params.restart) {
    mock = { qs: newMockSet(), picks: {}, flags: {}, cur: 0, done: false, startedAt: Date.now() };
  }

  if (mock.done) { box.appendChild(mockReport()); return box; }

  function finish() {
    stopTimer();
    mock.done = true;
    mock.elapsed = Date.now() - mock.startedAt;
    let score = 0;
    mock.qs.forEach(function (q, i) {
      const p = mock.picks[i];
      const rec = mcqRec(q.id);
      rec.seen = (rec.seen || 0) + 1;
      if (p === q.answerIndex) { score++; rec.correct++; } else if (p !== undefined) { rec.wrong++; }
    });
    mock.score = score;
    STATE.mocks.push({ at: Date.now(), score: score, total: MOCK_N, elapsedMs: mock.elapsed });
    saveState();
    go('mock');
  }

  const timer = examBar('Round 1 mock · Section A', MOCK_MS, function () { toast('Time up — submitted'); finish(); },
    function () { if (confirm('Quit the mock? Your answers are discarded.')) { stopTimer(); mock = null; go('dashboard'); } });
  box.appendChild(timer.bar);
  box.appendChild(timer.drain);

  const view = el('div', { class: 'view narrow' });

  const pal = el('div', { class: 'card card-pad', style: 'margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap' });
  pal.appendChild(el('span', { class: 'section-label', text: 'Questions' }));
  const palRow = el('div', { class: 'palette' });
  function paintPalette() {
    clear(palRow);
    mock.qs.forEach(function (q, i) {
      const st = mock.flags[i] ? 'flagged' : (mock.picks[i] !== undefined ? 'answered' : '');
      palRow.appendChild(el('button', {
        class: 'pal-btn', 'data-s': st, text: String(i + 1),
        'aria-current': i === mock.cur ? 'true' : 'false',
        onclick: function () { mock.cur = i; paint(); },
      }));
    });
  }
  pal.appendChild(palRow);
  pal.appendChild(el('span', { style: 'flex:1' }));
  pal.appendChild(el('button', { class: 'btn btn-primary btn-sm', text: 'Submit now', onclick: function () { if (confirm('Submit? You cannot change answers after this.')) finish(); } }));
  view.appendChild(pal);

  const holder = el('div');
  view.appendChild(holder);
  box.appendChild(view);

  function paint() {
    paintPalette();
    clear(holder);
    const i = mock.cur;
    const q = mock.qs[i];
    const card = el('div', { class: 'card card-pad q-card' });
    card.appendChild(el('i', { class: 'q-stripe', style: 'background:' + topicHue(q.topic) }));

    const meta = el('div', { class: 'q-meta' });
    meta.appendChild(el('span', { class: 'q-idx', text: 'Q' + (i + 1) + ' of ' + MOCK_N }));
    meta.appendChild(el('span', { class: 'chip', html: '<i class="chip-dot" style="background:' + topicHue(q.topic) + '"></i>' + esc(topicLabel(q.topic)) }));
    meta.appendChild(el('span', { class: 'spacer' }));
    const fb = el('button', { class: 'icon-btn ' + (mock.flags[i] ? 'is-on' : ''), type: 'button', title: 'Flag for review (F)' });
    fb.appendChild(icon('flag'));
    fb.addEventListener('click', function () { mock.flags[i] = !mock.flags[i]; paint(); });
    meta.appendChild(fb);
    card.appendChild(meta);

    card.appendChild(mdBlock(q.question, 'q-stem'));

    const opts = el('div', { class: 'opts' });
    ['A', 'B', 'C', 'D'].forEach(function (K, oi) {
      const b = el('button', { class: 'opt', type: 'button', 'data-state': mock.picks[i] === oi ? 'picked' : '' });
      b.appendChild(el('span', { class: 'key', text: K }));
      b.appendChild(el('span', { class: 'txt', html: inlineMd(q.options[oi]) }));
      b.addEventListener('click', function () {
        mock.picks[i] = mock.picks[i] === oi ? undefined : oi;
        if (mock.picks[i] === undefined) delete mock.picks[i];
        paint();
      });
      opts.appendChild(b);
    });
    card.appendChild(opts);

    const nav = el('div', { style: 'display:flex;gap:9px;margin-top:18px;flex-wrap:wrap' });
    nav.appendChild(el('button', { class: 'btn', text: '← Previous', disabled: i === 0, onclick: function () { mock.cur--; paint(); } }));
    if (i < MOCK_N - 1) nav.appendChild(el('button', { class: 'btn btn-primary', text: 'Next →', onclick: function () { mock.cur++; paint(); } }));
    else nav.appendChild(el('button', { class: 'btn btn-primary', text: 'Submit', onclick: function () { if (confirm('Submit?')) finish(); } }));
    nav.appendChild(el('span', { style: 'flex:1' }));
    nav.appendChild(el('span', { class: 'chip', text: Object.keys(mock.picks).length + ' answered' }));
    card.appendChild(nav);

    holder.appendChild(card);
  }
  paint();
  return box;
};

function mockReport() {
  const view = el('div', { class: 'view narrow' });
  const pct = Math.round(mock.score / MOCK_N * 100);
  view.appendChild(pageHead('Round 1 mock', 'Your result',
    'Team score is the average of every member, so compare these across the team — the lowest one is the number that matters.'));

  const hero = el('div', { class: 'score-hero', style: 'margin-bottom:18px' });
  hero.appendChild(ring(pct, mock.score + '/' + MOCK_N, 'score'));
  const side = el('div', { style: 'flex:1;min-width:220px;display:flex;flex-direction:column;gap:12px' });
  const stats = el('div', { class: 'tiles' });
  stats.appendChild(tile('Accuracy', pct + '%', '', pct >= 70 ? 'var(--ok)' : pct >= 47 ? 'var(--warn)' : 'var(--bad)'));
  stats.appendChild(tile('Time used', fmtClock(mock.elapsed), 'of 15:00'));
  stats.appendChild(tile('Per question', fmtClock(Math.round(mock.elapsed / MOCK_N)), 'target 1:00'));
  side.appendChild(stats);
  const verdict = pct >= 73 ? 'Shortlist range. Hold this and spend your time on the coding half.'
    : pct >= 47 ? 'Borderline. The gap is usually one or two topics, not general weakness — see the breakdown.'
    : 'Below the line. Drill the red topics below before taking another mock.';
  side.appendChild(el('p', { class: 'lede', text: verdict }));
  hero.appendChild(side);
  view.appendChild(hero);

  // topic breakdown for this attempt
  const per = {};
  mock.qs.forEach(function (q, i) {
    if (!per[q.topic]) per[q.topic] = { n: 0, ok: 0 };
    per[q.topic].n++;
    if (mock.picks[i] === q.answerIndex) per[q.topic].ok++;
  });
  const bd = el('div', { class: 'card card-pad', style: 'margin-bottom:18px' });
  bd.appendChild(el('h2', { text: 'By topic, this attempt' }));
  const rows = el('div', { class: 'bar-rows', style: 'margin-top:12px' });
  Object.keys(per).sort(function (a, b) { return (per[a].ok / per[a].n) - (per[b].ok / per[b].n); }).forEach(function (t) {
    const p = per[t], q = Math.round(p.ok / p.n * 100);
    rows.appendChild(barRow(topicLabel(t), q, p.ok + '/' + p.n,
      q >= 70 ? 'var(--ok)' : q >= 40 ? 'var(--warn)' : 'var(--bad)'));
  });
  bd.appendChild(rows);
  view.appendChild(bd);

  const actions = el('div', { style: 'display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap' });
  actions.appendChild(el('button', { class: 'btn btn-primary', text: 'New mock', onclick: function () { go('mock', { restart: true }); } }));
  actions.appendChild(el('button', { class: 'btn', text: 'Back to dashboard', onclick: function () { mock = null; go('dashboard'); } }));
  view.appendChild(actions);

  view.appendChild(el('h2', { text: 'Full review', style: 'margin-bottom:12px' }));
  mock.qs.forEach(function (q, i) {
    const pick = mock.picks[i];
    const right = pick === q.answerIndex;
    const d = el('details', { class: 'card', style: 'margin-bottom:9px' });
    const sum = el('summary', { class: 'disclose-btn' });
    sum.appendChild(icon('chevron', 'caret'));
    sum.appendChild(el('span', { class: 'q-idx', text: 'Q' + (i + 1) }));
    sum.appendChild(el('span', { text: right ? 'Correct' : pick === undefined ? 'Skipped' : 'Wrong', style: 'color:' + (right ? 'var(--ok)' : pick === undefined ? 'var(--text-faint)' : 'var(--bad)') }));
    sum.appendChild(el('span', { class: 'chip', style: 'margin-left:auto', text: topicLabel(q.topic) }));
    d.appendChild(sum);
    const body = el('div', { style: 'padding:0 16px 16px' });
    body.appendChild(mdBlock(q.question, 'q-stem'));
    const ol = el('div', { class: 'opts' });
    q.options.forEach(function (o, oi) {
      const st = oi === q.answerIndex ? 'correct' : (oi === pick ? 'wrong' : '');
      const b = el('div', { class: 'opt', 'data-state': st });
      b.appendChild(el('span', { class: 'key', text: 'ABCD'[oi] }));
      b.appendChild(el('span', { class: 'txt', html: inlineMd(o) }));
      ol.appendChild(b);
    });
    body.appendChild(ol);
    const v = el('div', { class: 'verdict-body', style: 'padding-left:0;padding-right:0' });
    v.appendChild(mdBlock(q.explanation));
    if (q.takeaway) {
      const t = el('div', { class: 'takeaway' });
      t.appendChild(icon('bulb'));
      t.appendChild(el('span', { html: inlineMd(q.takeaway) }));
      v.appendChild(t);
    }
    body.appendChild(v);
    d.appendChild(body);
    view.appendChild(d);
  });

  return view;
}

/* ---- Flashcards --------------------------------------------------------- */

let flashDeck = null, flashIdx = 0, flashFlipped = false;

function buildDeck() {
  const cards = [];
  APP.mcq.forEach(function (q) {
    if (q.takeaway) cards.push({ key: 'm:' + q.id, front: q.subtopic || topicLabel(q.topic), back: q.takeaway, tag: topicLabel(q.topic) });
  });
  APP.coding.forEach(function (p) {
    if (p.patternTakeaway) cards.push({ key: 'c:' + p.id, front: p.title, back: p.patternTakeaway, tag: 'Coding pattern' });
  });
  (APP.theme || []).forEach(function (c) {
    (c.keyTerms || []).forEach(function (t, i) {
      cards.push({ key: 't:' + c.id + ':' + i, front: t.term, back: t.definition, tag: c.section });
    });
  });
  // Leitner: due boxes first, then unseen, then the rest.
  const now = Date.now();
  return cards.sort(function (a, b) {
    const ra = STATE.flash[a.key], rb = STATE.flash[b.key];
    const da = ra ? (ra.due <= now ? 0 : 2) : 1;
    const db = rb ? (rb.due <= now ? 0 : 2) : 1;
    return da - db;
  });
}

ROUTES.flash = function () {
  const wrap = el('div', { class: 'view narrow' });
  wrap.appendChild(pageHead('Rapid revision', 'Flashcards',
    'Every takeaway from the question bank, every coding pattern, every key term. Cards you get wrong come back sooner.'));

  if (!flashDeck) { flashDeck = buildDeck(); flashIdx = 0; }
  if (!flashDeck.length) { wrap.appendChild(el('div', { class: 'empty', text: 'No cards yet.' })); return wrap; }
  if (flashIdx >= flashDeck.length) flashIdx = 0;
  const card = flashDeck[flashIdx];

  const stage = el('div', { class: 'flash-stage' });
  const f = el('div', { class: 'flash', onclick: function () { flashFlipped = !flashFlipped; go('flash'); } });
  f.appendChild(el('div', { class: 'face-label', text: flashFlipped ? 'Answer' : 'Prompt · tap to flip' }));
  f.appendChild(el('div', { class: 'chip', style: 'position:absolute;top:11px;right:14px', text: card.tag }));
  if (!flashFlipped) {
    f.appendChild(el('div', { class: 'flash-q', html: inlineMd(card.front) }));
  } else {
    f.appendChild(el('div', { class: 'flash-q', html: inlineMd(card.front) }));
    f.appendChild(el('hr', { class: 'divider', style: 'margin:6px 0' }));
    f.appendChild(el('div', { class: 'flash-a', html: inlineMd(card.back) }));
  }
  stage.appendChild(f);
  wrap.appendChild(stage);

  function grade(box) {
    const days = [0, 1, 3, 7, 21][box] || 0;
    STATE.flash[card.key] = { box: box, due: Date.now() + days * 86400000 };
    saveState();
    flashFlipped = false;
    flashIdx++;
    if (flashIdx >= flashDeck.length) { flashDeck = buildDeck(); flashIdx = 0; toast('Deck reshuffled'); }
    go('flash');
  }

  const actions = el('div', { class: 'flash-actions' });
  if (flashFlipped) {
    actions.appendChild(el('button', { class: 'btn', style: 'border-color:var(--bad-line);color:var(--bad)', text: 'Missed it', onclick: function () { grade(1); } }));
    actions.appendChild(el('button', { class: 'btn', text: 'Shaky', onclick: function () { grade(2); } }));
    actions.appendChild(el('button', { class: 'btn', style: 'border-color:var(--ok-line);color:var(--ok)', text: 'Knew it', onclick: function () { grade(4); } }));
  } else {
    actions.appendChild(el('button', { class: 'btn btn-primary', text: 'Flip  (Space)', onclick: function () { flashFlipped = true; go('flash'); } }));
    actions.appendChild(el('button', { class: 'btn', text: 'Skip →', onclick: function () { flashIdx++; go('flash'); } }));
  }
  wrap.appendChild(actions);
  wrap.appendChild(el('p', { class: 'lede', style: 'text-align:center;margin-top:14px;font-size:.8rem', text: (flashIdx + 1) + ' of ' + flashDeck.length + ' in this pass' }));
  return wrap;
};

ROUTES.search = function (params) {
  const wrap = el('div', { class: 'view narrow' });
  wrap.appendChild(pageHead('Search', 'Find anything',
    'Searches every question, coding problem, case study and concept card.'));

  const input = el('input', { class: 'field', type: 'search', placeholder: 'e.g. topological sort, GEO, deadlock, share of voice', style: 'width:100%;padding:10px 13px;font-size:.95rem' });
  wrap.appendChild(input);
  const results = el('div', { style: 'margin-top:16px' });
  wrap.appendChild(results);

  function run() {
    const term = input.value.trim().toLowerCase();
    clear(results);
    if (term.length < 2) return;
    const hits = [];
    APP.mcq.forEach(function (q) {
      const hay = (q.question + ' ' + q.explanation + ' ' + q.takeaway + ' ' + (q.tags || []).join(' ')).toLowerCase();
      if (hay.indexOf(term) !== -1) hits.push({ kind: 'MCQ', title: q.subtopic || topicLabel(q.topic), sub: q.question.slice(0, 150).replace(/[#`]/g, ''), go: function () { practiceState.topic = 'all'; practiceState.pool = 'all'; practiceState.list = [q]; practiceState.idx = 0; go('practice'); } });
    });
    APP.coding.forEach(function (p) {
      const hay = (p.title + ' ' + p.statement + ' ' + (p.topics || []).join(' ') + ' ' + (p.patternTakeaway || '')).toLowerCase();
      if (hay.indexOf(term) !== -1) hits.push({ kind: 'Coding', title: p.title, sub: (p.topics || []).join(' · '), go: function () { go('coding', { id: p.id }); } });
    });
    (APP.theme || []).forEach(function (c) {
      const hay = (c.title + ' ' + c.body + ' ' + (c.keyTerms || []).map(function (t) { return t.term + ' ' + t.definition; }).join(' ')).toLowerCase();
      if (hay.indexOf(term) !== -1) hits.push({ kind: 'Concept', title: c.title, sub: c.section, go: function () { go('theme'); } });
    });
    APP.cases.forEach(function (c) {
      const hay = (c.title + ' ' + c.scenario + ' ' + (c.questions || []).map(function (q) { return q.q + ' ' + q.modelAnswer; }).join(' ')).toLowerCase();
      if (hay.indexOf(term) !== -1) hits.push({ kind: 'Case', title: c.title, sub: c.industry, go: function () { go('cases', { id: c.id }); } });
    });
    [].concat(APP.strategy || [], APP.dev || [], APP.caseMethod || []).forEach(function (s) {
      if ((s.title + ' ' + s.body).toLowerCase().indexOf(term) !== -1) {
        hits.push({ kind: 'Playbook', title: s.title, sub: '', go: function () { go(APP.dev.indexOf(s) !== -1 ? 'dev' : APP.strategy.indexOf(s) !== -1 ? 'strategy' : 'cases'); } });
      }
    });

    if (!hits.length) { results.appendChild(el('div', { class: 'empty', text: 'Nothing matched “' + term + '”.' })); return; }
    results.appendChild(el('p', { class: 'lede', style: 'margin-bottom:10px;font-size:.85rem', text: hits.length + ' matches' }));
    const list = el('div', { class: 'list' });
    hits.slice(0, 60).forEach(function (h) {
      const row = el('button', { class: 'list-row', type: 'button', onclick: h.go });
      row.appendChild(el('span', { class: 'chip', text: h.kind }));
      const main = el('div', { class: 'lr-main search-hit' });
      main.appendChild(el('span', { class: 'lr-title', text: h.title }));
      main.appendChild(el('span', { class: 'lr-sub', text: h.sub }));
      row.appendChild(main);
      list.appendChild(row);
    });
    results.appendChild(list);
  }
  input.addEventListener('input', run);
  setTimeout(function () { input.focus(); }, 30);
  if (params.q) { input.value = params.q; run(); }
  return wrap;
};


/* ==========================================================================
   Round 1 simulation — built to the OFFICIAL Unstop SmartHire guidelines for
   this assessment, not to the generic palette-style exam most people picture.

   The mechanics that actually matter, straight from the guidelines:
     - 17 questions, 1 hour, "Time per Question: 00:01:00", auto-advance.
     - "You won't be able to browse through the questions. If you either skip
       your question or submit your answer, it is marked and stored, and cannot
       be altered."
     - Marks are split between ACCURACY and SPEED, where speed marks scale with
       the percentage of the question's time still remaining.
     - Sections can be switched from a section tab; once a section's time is
       over you cannot answer any more of its questions.

   Overrides ROUTES.mock defined earlier — this file sorts last on purpose.
   ========================================================================== */

const EX_MCQ_COUNT = 15;
const EX_CODE_COUNT = 2;
const EX_MCQ_PER_Q_MS = 60 * 1000;          // "Time per Question: 00:01:00"
const EX_CODE_PER_Q_MS = 22 * 60 * 1000 + 30 * 1000;  // 45 min across 2 problems
const EX_MARKS_PER_Q = 4;                   // matches the worked example in the guidelines
const EX_VIOLATION_LIMIT = 3;

let EX = null;
let EX_TICK = null;

function exStop() { if (EX_TICK) { clearInterval(EX_TICK); EX_TICK = null; } }

/* In-app confirm. Native confirm()/alert() blur the window, which the proctor
   listener then reports as a violation — the dialog would flag you for using
   the dialog. This one never leaves the document. */
function exConfirm(message, onYes) {
  exSuppressProctor(1200);
  const back = el('div', { class: 'modal-back' });
  const close = function () { back.remove(); exSuppressProctor(600); };
  const m = el('div', { class: 'modal' });
  m.appendChild(el('h2', { text: 'Confirm' }));
  m.appendChild(el('p', { text: message }));
  const row = el('div', { style: 'display:flex;gap:9px;flex-wrap:wrap' });
  const yes = el('button', { class: 'btn btn-primary', text: 'Yes, continue', onclick: function () { close(); onYes(); } });
  row.appendChild(yes);
  row.appendChild(el('button', { class: 'btn', text: 'Cancel', onclick: close }));
  m.appendChild(row);
  back.appendChild(m);
  back.addEventListener('click', function (e) { if (e.target === back) close(); });
  document.body.appendChild(back);
  setTimeout(function () { yes.focus(); }, 20);
}

// Brief window in which focus changes are ours, not the candidate's.
function exSuppressProctor(ms) {
  if (EX) EX.suppressUntil = Date.now() + (ms || 800);
}

/* ---- Setup -------------------------------------------------------------- */

function exNew() {
  const byTopic = {};
  APP.mcq.forEach(function (q) { (byTopic[q.topic] = byTopic[q.topic] || []).push(q); });
  const seed = (Date.now() % 65521) + 3;

  const picked = [];
  Object.keys(byTopic).forEach(function (t) {
    const pool = shuffle(byTopic[t], seed + t.length);
    if (pool.length) picked.push(pool[0]);
  });
  const rest = shuffle(APP.mcq.filter(function (q) { return picked.indexOf(q) === -1; }), seed);
  let i = 0;
  while (picked.length < EX_MCQ_COUNT && i < rest.length) picked.push(rest[i++]);

  const rank = { easy: 0, medium: 1, hard: 2 };
  const codeQs = shuffle(APP.coding.slice(), seed + 41)
    .sort(function (a, b) { return (rank[a.difficulty] || 1) - (rank[b.difficulty] || 1); })
    .slice(0, EX_CODE_COUNT);

  return {
    phase: 'instructions',
    agreed: false,
    section: 'A',
    mcqQs: shuffle(picked, seed + 11).slice(0, EX_MCQ_COUNT),
    codeQs: codeQs,
    // per-question records: { answer, correct, msUsed, submitted, skipped }
    recA: {},
    recB: {},
    curA: 0,
    curB: 0,
    qStartedAt: 0,
    sectionAEndsAt: 0,
    sectionBEndsAt: 0,
    codeLang: 'python',
    violations: [],
    warnOpen: false,
    startedAt: 0,
  };
}

function exSectionDone(s) {
  if (s === 'A') return EX.curA >= EX_MCQ_COUNT;
  return EX.curB >= EX_CODE_COUNT;
}
function exAllDone() { return exSectionDone('A') && exSectionDone('B'); }

function exPerQMs() { return EX.section === 'A' ? EX_MCQ_PER_Q_MS : EX_CODE_PER_Q_MS; }
function exCur() { return EX.section === 'A' ? EX.curA : EX.curB; }
function exRec() { return EX.section === 'A' ? EX.recA : EX.recB; }

function exStart() {
  EX.phase = 'live';
  EX.startedAt = Date.now();
  EX.sectionAEndsAt = Date.now() + EX_MCQ_COUNT * EX_MCQ_PER_Q_MS;
  EX.sectionBEndsAt = Date.now() + EX_MCQ_COUNT * EX_MCQ_PER_Q_MS + EX_CODE_COUNT * EX_CODE_PER_Q_MS;
  EX.qStartedAt = Date.now();
  exRequestFullscreen();
  exAttachProctor();
  go('mock');
}

/* ---- Commit and advance ------------------------------------------------- */

// The single irreversible action. Once this runs for a question, that question
// is closed forever — exactly as the guidelines describe.
function exCommit(answer, skipped) {
  const idx = exCur();
  const rec = exRec();
  if (rec[idx] && rec[idx].submitted) return;

  const perQ = exPerQMs();
  const msUsed = Math.min(perQ, Date.now() - EX.qStartedAt);
  const remainingFrac = Math.max(0, (perQ - msUsed) / perQ);

  let correct = false;
  if (EX.section === 'A' && !skipped && answer !== undefined && answer !== null) {
    correct = answer === EX.mcqQs[idx].answerIndex;
  }

  // Accuracy is half the marks; speed is the other half, scaled by the time
  // left. Speed is only credited on a correct answer — the guidelines show the
  // worked example only for a correct answer, and any other reading would make
  // instant wrong guessing optimal, which no assessment would intend.
  const accuracyMarks = correct ? EX_MARKS_PER_Q / 2 : 0;
  const speedMarks = correct ? (EX_MARKS_PER_Q / 2) * remainingFrac : 0;

  rec[idx] = {
    answer: skipped ? null : answer,
    correct: correct,
    msUsed: msUsed,
    remainingFrac: remainingFrac,
    accuracyMarks: accuracyMarks,
    speedMarks: speedMarks,
    submitted: true,
    skipped: !!skipped,
  };

  if (EX.section === 'A') EX.curA++; else EX.curB++;
  EX.qStartedAt = Date.now();

  if (exAllDone()) { exFinish(); return; }
  if (exSectionDone(EX.section)) {
    EX.section = EX.section === 'A' ? 'B' : 'A';
    toast('Section complete — moving to Section ' + EX.section);
  }
  go('mock');
}

function exSwitchSection(to) {
  if (to === EX.section || exSectionDone(to)) return;
  // Switching mid-question forfeits the elapsed time on the current one, the
  // same way it would on the real platform. Warn, do not silently absorb it.
  exConfirm('Switch to Section ' + to + '? The time already spent on this question is not returned.', function () {
    EX.section = to;
    EX.qStartedAt = Date.now();
    go('mock');
  });
}

function exFinish() {
  exStop();
  exDetachProctor();
  exExitFullscreen();

  let acc = 0, spd = 0, right = 0;
  EX.mcqQs.forEach(function (q, i) {
    const r = EX.recA[i];
    const mrec = mcqRec(q.id);
    mrec.seen = (mrec.seen || 0) + 1;
    if (!r) return;
    acc += r.accuracyMarks; spd += r.speedMarks;
    if (r.correct) { right++; mrec.correct++; } else if (!r.skipped) { mrec.wrong++; }
  });
  EX.accuracyMarks = acc;
  EX.speedMarks = spd;
  EX.rightCount = right;
  EX.maxMarks = EX_MCQ_COUNT * EX_MARKS_PER_Q;

  STATE.mocks.push({
    at: Date.now(), score: right, total: EX_MCQ_COUNT,
    elapsedMs: Date.now() - EX.startedAt,
    marks: Math.round((acc + spd) * 10) / 10,
    violations: EX.violations.length,
  });
  saveState();
  EX.phase = 'done';
  go('mock');
}

/* ---- Proctoring --------------------------------------------------------- */

function exRequestFullscreen() {
  const root = document.documentElement;
  const fn = root.requestFullscreen || root.webkitRequestFullscreen || root.msRequestFullscreen;
  if (fn) { try { fn.call(root); } catch (e) { /* needs a user gesture */ } }
}
function exExitFullscreen() {
  if (document.fullscreenElement && document.exitFullscreen) {
    try { document.exitFullscreen(); } catch (e) { /* ignore */ }
  }
}

function exLogViolation(type) {
  if (!EX || EX.phase !== 'live') return;
  if (EX.suppressUntil && Date.now() < EX.suppressUntil) return;   // our own dialog
  const last = EX.violations[EX.violations.length - 1];
  if (last && Date.now() - last.at < 1500) return;   // one act, one event
  EX.violations.push({ at: Date.now(), type: type });
  const badge = $('#shProctor');
  if (badge) {
    badge.className = 'sh-proctor alert';
    clear(badge);
    badge.appendChild(el('i', { class: 'dot' }));
    badge.appendChild(el('span', { text: EX.violations.length + ' violation' + (EX.violations.length > 1 ? 's' : '') }));
  }
  exShowViolation(type);
}

function exShowViolation(type) {
  if (EX.warnOpen) return;
  EX.warnOpen = true;
  const n = EX.violations.length;
  const back = el('div', { class: 'modal-back sh-violation-modal' });
  const m = el('div', { class: 'modal' });
  m.appendChild(el('h2', { text: 'Proctoring violation' }));
  m.appendChild(el('p', {
    text: (type === 'tab' ? 'You switched away from the assessment.'
      : type === 'blur' ? 'The assessment window lost focus.'
      : 'You exited fullscreen.') + ' Violation ' + n + '.',
  }));
  m.appendChild(el('p', {
    class: 'lede', style: 'font-size:.86rem',
    text: n >= EX_VIOLATION_LIMIT
      ? 'The official guidelines state that exiting fullscreen, switching tabs or minimising "may lead to warnings and eventually termination of your assessment." At this point a real attempt could be terminated.'
      : 'Official wording: exiting fullscreen, switching tabs or minimising the window "may lead to warnings and eventually termination of your assessment."',
  }));
  m.appendChild(el('p', {
    class: 'lede', style: 'font-size:.86rem',
    text: 'The clock on your current question did not stop while this was open.',
  }));
  const btn = el('button', {
    class: 'btn btn-primary', text: 'Return to the assessment',
    onclick: function () { back.remove(); EX.warnOpen = false; if (EX.phase === 'live') exRequestFullscreen(); },
  });
  m.appendChild(btn);
  back.appendChild(m);
  document.body.appendChild(back);
  setTimeout(function () { btn.focus(); }, 20);
}

function exOnVisibility() { if (document.hidden) exLogViolation('tab'); }
function exOnFsChange() { if (!document.fullscreenElement) exLogViolation('fullscreen'); }

// Deliberately NOT listening to window blur. Blur fires for in-page dialogs,
// iframe focus changes and devtools, none of which are the candidate leaving
// the test — in an embedded viewer it produced constant false violations.
// visibilitychange is the reliable "you actually left" signal.
function exAttachProctor() {
  document.addEventListener('visibilitychange', exOnVisibility);
  document.addEventListener('fullscreenchange', exOnFsChange);
}
function exDetachProctor() {
  document.removeEventListener('visibilitychange', exOnVisibility);
  document.removeEventListener('fullscreenchange', exOnFsChange);
}

function exProgressStrip(total, cur, rec) {
  // Read-only. The guidelines forbid navigating between questions, so this
  // must not be clickable — showing a clickable palette would teach a habit
  // the real platform will not allow.

      title: 'Question ' + (i + 1) + (r ? ' — submitted, locked' : i === cur ? ' — current' : ' — not reached'),
    }));
  }
  return strip;
}

function exPaintMcq(main) {
  const i = EX.curA;

function exStartTick() {
  exStop();
  EX_TICK = setInterval(function () {
    if (!EX || EX.phase !== 'live') { exStop(); return; }
    const perQ = exPerQMs();
    const qLeft = perQ - (Date.now() - EX.qStartedAt);
    const secEnd = EX.section === 'A' ? EX.sectionAEndsAt : EX.sectionBEndsAt;
    const secLeft = secEnd - Date.now();

    const qc = $('#shQClock');
    if (qc) {
      qc.textContent = fmtClock(qLeft);
      qc.className = 'sh-clock ' + (qLeft <= 10000 ? 'danger' : qLeft <= 20000 ? 'warn' : '');
    }
    const sc = $('#shSectionClock');
    if (sc) sc.textContent = fmtClock(secLeft);

    const fill = $('#shDrainFill'), drain = $('#shDrain');
    if (fill) {
      const pct = Math.max(0, qLeft / perQ * 100);
      fill.style.width = pct + '%';
      drain.className = 'exam-drain ' + (qLeft <= 10000 ? 'danger' : qLeft <= 20000 ? 'warn' : '');
    }

    if (qLeft <= 0) {
      toast('Time up on that question — moved on');
      exCommit(EX.section === 'B' ? (EX._codeDraft || {})[exCur()] || '' : null, true);
    }
  }, 200);
}

/* ---- Report ------------------------------------------------------------- */

function exReport() {
  const wrap = el('div', { class: 'sh-report' });
  const total = EX.accuracyMarks + EX.speedMarks;
  const pctMarks = Math.round(total / EX.maxMarks * 100);

  wrap.appendChild(pageHead('Assessment complete', 'Your result',
    'Scored the way the official guidelines describe: half the marks for being right, half for how much of each question\'s minute you had left when you answered.'));

  const hero = el('div', { class: 'score-hero', style: 'margin-bottom:18px' });
  hero.appendChild(ring(pctMarks, total.toFixed(1), 'of ' + EX.maxMarks));
  const side = el('div', { style: 'flex:1;min-width:240px;display:flex;flex-direction:column;gap:12px' });
  const tiles = el('div', { class: 'tiles' });
  tiles.appendChild(tile('Correct', EX.rightCount + ' / ' + EX_MCQ_COUNT, 'accuracy marks ' + EX.accuracyMarks.toFixed(1)));
  tiles.appendChild(tile('Speed marks', EX.speedMarks.toFixed(1), 'of ' + (EX.maxMarks / 2) + ' possible',
    EX.speedMarks > EX.maxMarks / 4 ? 'var(--ok)' : 'var(--warn)'));
  const answered = Object.keys(EX.recA).filter(function (k) { return !EX.recA[k].skipped; }).length;
  const avgMs = answered ? Object.keys(EX.recA).reduce(function (s, k) { return s + EX.recA[k].msUsed; }, 0) / EX_MCQ_COUNT : 0;
  tiles.appendChild(tile('Avg time / MCQ', fmtClock(avgMs), 'of 1:00 allowed'));
  tiles.appendChild(tile('Violations', String(EX.violations.length), EX.violations.length ? 'would be flagged' : 'clean run',
    EX.violations.length ? 'var(--bad)' : 'var(--ok)'));
  side.appendChild(tiles);

  // The insight the speed rule makes possible
  const wasted = EX.mcqQs.reduce(function (s, q, i) {
    const r = EX.recA[i];
    return s + (r && r.correct ? (EX_MARKS_PER_Q / 2) * (1 - r.remainingFrac) : 0);
  }, 0);
  side.appendChild(el('p', {
    class: 'lede',
    text: 'You lost ' + wasted.toFixed(1) + ' marks to the clock on questions you got right. That is pure speed cost — the answers were correct, they just took time. Being 15 seconds quicker on each would have recovered about ' + (EX_MCQ_COUNT * (EX_MARKS_PER_Q / 2) * 0.25).toFixed(1) + ' marks.',
  }));
  hero.appendChild(side);
  wrap.appendChild(hero);

  // per-question table
  const tbl = el('div', { class: 'card card-pad', style: 'margin-bottom:18px' });
  tbl.appendChild(el('h2', { text: 'Question by question' }));
  const rows = EX.mcqQs.map(function (q, i) {
    const r = EX.recA[i];
    const verdict = !r ? 'not reached' : r.skipped ? 'skipped' : r.correct ? 'correct' : 'wrong';
    const marks = r ? (r.accuracyMarks + r.speedMarks).toFixed(1) : '0.0';
    return '| ' + (i + 1) + ' | ' + topicLabel(q.topic) + ' | ' + verdict + ' | ' + (r ? fmtClock(r.msUsed) : '—') + ' | ' + marks + ' |';
  });
  tbl.appendChild(mdBlock(['| # | Topic | Result | Time | Marks |', '|---|---|---|---|---|'].concat(rows).join('\n')));
  wrap.appendChild(tbl);

  if (EX.violations.length) {
    const v = el('div', { class: 'card card-pad', style: 'margin-bottom:18px' });
    v.appendChild(el('h2', { text: 'Proctoring log' }));
    v.appendChild(el('p', { class: 'lede', style: 'font-size:.85rem;margin:6px 0 12px', text: 'On the real assessment each of these is timestamped, and enough of them terminate the attempt.' }));
    v.appendChild(mdBlock(['| # | Time | Event |', '|---|---|---|'].concat(EX.violations.map(function (x, i) {
      return '| ' + (i + 1) + ' | ' + new Date(x.at).toLocaleTimeString() + ' | ' +
        (x.type === 'tab' ? 'Tab switch' : x.type === 'blur' ? 'Window lost focus' : 'Left fullscreen') + ' |';
    })).join('\n')));
    wrap.appendChild(v);
  }

  const actions = el('div', { style: 'display:flex;gap:9px;margin-bottom:22px;flex-wrap:wrap' });
  actions.appendChild(el('button', { class: 'btn btn-primary', text: 'New attempt', onclick: function () { EX = exNew(); go('mock'); } }));
  actions.appendChild(el('button', { class: 'btn', text: 'Back to dashboard', onclick: function () { EX = null; go('dashboard'); } }));
  wrap.appendChild(actions);

  wrap.appendChild(el('h2', { text: 'Section B — your code vs the model solution', style: 'margin-bottom:12px' }));
  EX.codeQs.forEach(function (p, i) {
    const src = (EX._codeDraft || {})[i] || '';
    const d = el('details', { class: 'card', style: 'margin-bottom:10px' });
    const sum = el('summary', { class: 'disclose-btn' });
    sum.appendChild(icon('chevron', 'caret'));
    sum.appendChild(el('strong', { text: 'Problem ' + (i + 1) + ' · ' + p.title }));
    sum.appendChild(el('span', { class: 'chip' + (src.trim() ? ' ok' : ''), style: 'margin-left:auto', text: src.trim() ? 'attempted' : 'blank' }));
    d.appendChild(sum);
    const body = el('div', { style: 'padding:0 16px 16px' });
    if (src.trim()) {
      body.appendChild(el('div', { class: 'section-label', style: 'margin-bottom:8px', text: 'What you wrote' }));
      body.appendChild(codeBlock(src, EX.codeLang));
    }
    body.appendChild(el('div', { class: 'section-label', style: 'margin:16px 0 8px', text: 'Model solution' }));
    body.appendChild(codeBlock(p.solutions[EX.codeLang] || p.solutions.python, EX.codeLang));
    body.appendChild(mdBlock('**Optimal:** ' + p.optimal.idea + '\n\nTime ' + p.optimal.time + ', space ' + p.optimal.space));
    if (p.practice && p.practice.links && p.practice.links.length) {
      body.appendChild(practiceBox(p.practice));
    }
    body.appendChild(el('button', {
      class: 'btn btn-sm', style: 'margin-top:12px', text: 'Open full problem with hints and dry run',
      onclick: function () { EX = null; go('coding', { id: p.id }); },
    }));
    d.appendChild(body);
    wrap.appendChild(d);
  });

  wrap.appendChild(el('h2', { text: 'Section A — full review', style: 'margin:22px 0 12px' }));
  EX.mcqQs.forEach(function (q, i) {
    const r = EX.recA[i];
    const pick = r && !r.skipped ? r.answer : undefined;
    const d = el('details', { class: 'card', style: 'margin-bottom:9px' });
    const sum = el('summary', { class: 'disclose-btn' });
    sum.appendChild(icon('chevron', 'caret'));
    sum.appendChild(el('span', { class: 'q-idx', text: 'Q' + (i + 1) }));
    sum.appendChild(el('span', {
      text: r && r.correct ? 'Correct' : pick === undefined ? 'Skipped' : 'Wrong',
      style: 'color:' + (r && r.correct ? 'var(--ok)' : pick === undefined ? 'var(--text-faint)' : 'var(--bad)'),
    }));
    if (r) sum.appendChild(el('span', { class: 'chip', text: fmtClock(r.msUsed) }));
    sum.appendChild(el('span', { class: 'chip', style: 'margin-left:auto', text: topicLabel(q.topic) }));
    d.appendChild(sum);
    const body = el('div', { style: 'padding:0 16px 16px' });
    body.appendChild(mdBlock(q.question, 'q-stem'));
    const ol = el('div', { class: 'opts' });
    q.options.forEach(function (o, oi) {
      const st = oi === q.answerIndex ? 'correct' : (oi === pick ? 'wrong' : '');
      const b = el('div', { class: 'opt', 'data-state': st });
      b.appendChild(el('span', { class: 'key', text: 'ABCD'[oi] }));
      b.appendChild(el('span', { class: 'txt', html: inlineMd(o) }));
      ol.appendChild(b);
    });
    body.appendChild(ol);
    body.appendChild(el('div', { style: 'margin-top:14px' }, mdBlock(q.explanation)));
    if (q.takeaway) {
      const t = el('div', { class: 'takeaway', style: 'margin-top:12px' });
      t.appendChild(icon('bulb'));
      t.appendChild(el('span', { html: inlineMd(q.takeaway) }));
      body.appendChild(t);
    }
    d.appendChild(body);
    wrap.appendChild(d);
  });

  return wrap;
}

/* ---- Route -------------------------------------------------------------- */

ROUTES.mock = function (params) {
  if (!EX || params.restart) { exStop(); EX = exNew(); }
  if (EX.phase === 'instructions') return exInstructions();
  if (EX.phase === 'live') return exLiveView();
  return exReport();
};


/* ==========================================================================
   Shell: rail navigation, theme, countdown ticker, keyboard shortcuts, boot.
   ========================================================================== */

const NAV = [
  { group: 'Round 1 — today' },
  { route: 'dashboard', label: 'Command centre', icon: 'gauge' },
  { route: 'mock', label: 'Round 1 mock', icon: 'timer' },
  { route: 'practice', label: 'MCQ practice', icon: 'list', count: function () { return APP.mcq.length; } },
  { route: 'coding', label: 'Coding lab', icon: 'code', count: function () { return APP.coding.length; } },
  { group: 'Round 2 — 16 Aug' },
  { route: 'cases', label: 'Case studio', icon: 'brief', count: function () { return APP.cases.length; } },
  { route: 'theme', label: 'Theme brief', icon: 'layers', count: function () { return APP.theme.length; } },
  { group: 'Prep' },
  { route: 'strategy', label: 'Exam strategy', icon: 'target' },
  { route: 'flash', label: 'Flashcards', icon: 'cards' },
  { route: 'dev', label: 'Round 3 build guide', icon: 'book' },
  { route: 'progress', label: 'Progress', icon: 'chart' },
  { route: 'search', label: 'Search', icon: 'search' },
];

function buildRail() {
  const rail = el('aside', { class: 'rail' });

  const head = el('div', { class: 'rail-head' });
  const mark = el('div', { class: 'rail-mark' });
  mark.appendChild(el('span', { class: 'glyph', text: 'A' }));
  mark.appendChild(el('span', { text: 'Hackathon Prep' }));
  head.appendChild(mark);
  head.appendChild(el('div', { class: 'rail-sub', text: 'Adobe UH 2026' }));
  rail.appendChild(head);

  const nav = el('nav', { class: 'rail-nav', 'aria-label': 'Sections' });
  NAV.forEach(function (item) {
    if (item.group) { nav.appendChild(el('div', { class: 'nav-group', text: item.group })); return; }
    const b = el('button', { class: 'nav-item', type: 'button', 'data-route': item.route, onclick: function () { go(item.route); } });
    b.appendChild(icon(item.icon));
    b.appendChild(el('span', { text: item.label }));
    if (item.count) b.appendChild(el('span', { class: 'count', text: String(item.count()) }));
    nav.appendChild(b);
  });
  rail.appendChild(nav);

  const foot = el('div', { class: 'rail-foot' });
  const cd = el('div', { class: 'countdown-mini', id: 'railCountdown' });
  cd.appendChild(el('div', { class: 'cd-label', id: 'cdLabel', text: 'Next round' }));
  cd.appendChild(el('div', { class: 'cd-value', id: 'cdValue', text: '—' }));
  foot.appendChild(cd);

  const tools = el('div', { class: 'rail-tools' });
  const themeBtn = el('button', { class: 'icon-btn', type: 'button', title: 'Toggle light / dark', onclick: toggleTheme, id: 'themeBtn' });
  themeBtn.appendChild(icon(isDark() ? 'sun' : 'moon'));
  tools.appendChild(themeBtn);
  const searchBtn = el('button', { class: 'icon-btn', type: 'button', title: 'Search (/)', onclick: function () { go('search'); } });
  searchBtn.appendChild(icon('search'));
  tools.appendChild(searchBtn);
  tools.appendChild(el('span', { style: 'flex:1' }));
  tools.appendChild(el('span', { class: 'rail-sub', style: 'padding:0;font-size:.63rem', text: 'v' + APP.meta.version }));
  foot.appendChild(tools);
  rail.appendChild(foot);
  return rail;
}

function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function toggleTheme() {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  STATE.theme = next; saveState();
  const btn = $('#themeBtn');
  if (btn) { clear(btn); btn.appendChild(icon(next === 'dark' ? 'sun' : 'moon')); }
}

function tickCountdown() {
  const r = nextRound();
  const st = roundState(r);
  const box = $('#railCountdown'), lab = $('#cdLabel'), val = $('#cdValue');
  if (!box) return;
  clear(lab);
  if (st.phase === 'live') {
    box.className = 'countdown-mini is-live';
    lab.appendChild(el('i', { class: 'pulse-dot' }));
    lab.appendChild(el('span', { text: 'R' + r.n + ' live · closes in' }));
  } else {
    const soon = st.ms < 6 * 3600 * 1000;
    box.className = 'countdown-mini' + (soon ? ' is-soon' : '');
    lab.appendChild(el('span', { text: 'Round ' + r.n + ' opens in' }));
  }
  val.textContent = fmtCountdown(st.ms);

  $$('[data-cd]').forEach(function (n) {
    const ms = Date.parse(n.getAttribute('data-cd')) - Date.now();
    n.textContent = ms > 0 ? 'in ' + fmtCountdown(ms) : 'now';
  });
}

function keyboard(e) {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

  if (e.key === '/') { e.preventDefault(); go('search'); return; }
  if (e.key === '?') { e.preventDefault(); showHelp(); return; }

  if (CURRENT === 'practice') {
    const card = $('.q-card');
    if (!card) return;
    const idx = ['1', '2', '3', '4'].indexOf(e.key);
    const alpha = ['a', 'b', 'c', 'd'].indexOf((e.key || '').toLowerCase());
    if (idx !== -1 && card._pick) { e.preventDefault(); card._pick(idx); }
    else if (alpha !== -1 && card._pick) { e.preventDefault(); card._pick(alpha); }
    else if (e.key === 's' && card._star) { e.preventDefault(); card._star(); }
    else if ((e.key === 'Enter' || e.key === 'n') && practiceState.answered !== null && card._next) { e.preventDefault(); card._next(); }
  }

  if (CURRENT === 'flash') {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flashFlipped = !flashFlipped; go('flash'); }
  }

  if (CURRENT === 'mock' && mock && !mock.done) {
    const idx = ['1', '2', '3', '4'].indexOf(e.key);
    if (idx !== -1) { e.preventDefault(); mock.picks[mock.cur] = idx; go('mock'); }
    if (e.key === 'ArrowRight' && mock.cur < MOCK_N - 1) { mock.cur++; go('mock'); }
    if (e.key === 'ArrowLeft' && mock.cur > 0) { mock.cur--; go('mock'); }
    if ((e.key || '').toLowerCase() === 'f') { mock.flags[mock.cur] = !mock.flags[mock.cur]; go('mock'); }
  }
}

function showHelp() {
  const back = el('div', { class: 'modal-back', onclick: function (e) { if (e.target === back) back.remove(); } });
  const m = el('div', { class: 'modal' });
  m.appendChild(el('h2', { text: 'Keyboard' }));
  m.appendChild(mdBlock([
    '| Key | Does |',
    '|---|---|',
    '| `1` `2` `3` `4` or `A`–`D` | Pick an option |',
    '| `Enter` / `N` | Next question (after answering) |',
    '| `S` | Star the current question |',
    '| `F` | Flag for review, during a mock |',
    '| `←` `→` | Move between mock questions |',
    '| `Space` | Flip a flashcard |',
    '| `/` | Search |',
    '| `?` | This panel |',
  ].join('\n')));
  m.appendChild(el('button', { class: 'btn btn-primary', text: 'Got it', onclick: function () { back.remove(); } }));
  back.appendChild(m);
  document.body.appendChild(back);
}

function boot() {
  loadState();
  if (STATE.theme) document.documentElement.setAttribute('data-theme', STATE.theme);

  const shell = el('div', { class: 'shell' });
  shell.appendChild(buildRail());

  const main = el('main', { class: 'main' });
  const top = el('div', { class: 'topbar' });
  top.appendChild(el('span', { class: 'crumb', id: 'crumb', text: 'Command centre' }));
  top.appendChild(el('span', { class: 'spacer' }));
  const mockBtn = el('button', { class: 'btn btn-sm btn-primary', onclick: function () { go('mock', { restart: true }); } });
  mockBtn.appendChild(icon('play'));
  mockBtn.appendChild(document.createTextNode('Start Round 1 mock'));
  top.appendChild(mockBtn);
  top.appendChild(el('button', { class: 'btn btn-sm btn-ghost', text: '?', title: 'Keyboard shortcuts', onclick: showHelp }));
  main.appendChild(top);
  main.appendChild(el('div', { id: 'viewport' }));
  shell.appendChild(main);

  document.body.appendChild(shell);

  go('dashboard');
  tickCountdown();
  setInterval(tickCountdown, 1000);
  document.addEventListener('keydown', keyboard);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
</body>
