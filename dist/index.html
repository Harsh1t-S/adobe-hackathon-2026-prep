 **IP address** is in the IP header and is necessarily plaintext, and the **hostname** leaks twice: in the DNS lookup that preceded the connection, and in the `server_name` (SNI) extension of the plaintext TLS ClientHello. An observer therefore learns *which site* you visited, plus timing and byte counts — but not which page or what data. (Encrypted Client Hello plus DNS-over-HTTPS close the hostname gap, but they are not yet universal.)\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"The path sits inside the encrypted HTTP request; only the endpoint sees it. Query strings are likewise encrypted (though they still land in server logs).\"},{\"optionIndex\":1,\"reason\":\"Headers and cookies are part of the encrypted request — that is why session cookies are safe from passive sniffing on HTTPS.\"},{\"optionIndex\":3,\"reason\":\"The response body is encrypted; an observer sees only its approximate size and timing.\"}],\"takeaway\":\"HTTPS hides the *content*, not the *destination*: IP and SNI/DNS hostname stay visible.\",\"tags\":[\"networks\",\"https\",\"tls\",\"security\",\"sni\"],\"verified\":\"ok\"},{\"id\":\"sys-24\",\"topic\":\"os-dbms-networks\",\"subtopic\":\"Latency vs bandwidth\",\"difficulty\":\"hard\",\"question\":\"A single-page app issues **40 sequential** API calls, each returning about **2 KB**, to a server **100 ms RTT** away. The office link is upgraded from 20 Mbps to 200 Mbps and page load time barely improves. Why?\",\"options\":[\"Load time is dominated by 40 × RTT ≈ 4 s of round-trip latency, which extra bandwidth does not reduce\",\"The extra bandwidth is consumed by TCP retransmissions on the faster link\",\"HTTP compresses the payloads, so bandwidth was never being used\",\"The server's CPU is the bottleneck, so the client's link speed is irrelevant\"],\"answerIndex\":0,\"explanation\":\"Separate the two components. **Transmission time** for the data is 40 × 2 KB = 80 KB ≈ 640 kbit, which even at 20 Mbps takes about 32 ms in total. **Latency** costs 40 × 100 ms = **4000 ms**, because each call must wait for the previous response before it is issued.\\n\\nBandwidth is how wide the pipe is; latency is how long the pipe is — and no amount of widening shortens it. The fix is architectural: parallelise the requests, batch them into one call, use HTTP/2 multiplexing, or move the data closer via a CDN or edge cache. This is the same reason \\\"my internet is 1 Gbps but the site feels slow\\\" is almost always an RTT or round-trip-count problem.\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"Higher link capacity does not cause retransmissions, and 80 KB of traffic would not congest either link.\"},{\"optionIndex\":2,\"reason\":\"Compression would shrink an already negligible 80 KB; it does not explain why the *upgrade* made no difference.\"},{\"optionIndex\":3,\"reason\":\"Nothing in the scenario points to server load, and the arithmetic already accounts for the whole delay through the 40 serial round trips.\"}],\"takeaway\":\"Bandwidth scales throughput for large payloads; only fewer round trips (or shorter distance) reduces latency-bound load time.\",\"tags\":[\"networks\",\"latency\",\"bandwidth\",\"rtt\",\"performance\"],\"verified\":\"ok\"},{\"id\":\"sys-25\",\"topic\":\"os-dbms-networks\",\"subtopic\":\"REST idempotency\",\"difficulty\":\"medium\",\"question\":\"A mobile client retries a request after a network timeout, unsure whether the original reached the server. Which of these is **idempotent** (N identical calls leave the same server state as one) yet **not safe** (it does change state)?\",\"options\":[\"`GET /users/42`\",\"`POST /orders` that creates a new order on each call\",\"`PATCH /counters/7` that increments a counter field\",\"`PUT /users/42` carrying the complete new representation\"],\"answerIndex\":3,\"explanation\":\"Two distinct properties:\\n\\n- **Safe** = does not modify server state (GET, HEAD, OPTIONS).\\n- **Idempotent** = repeating the request has the same effect as making it once (GET, HEAD, PUT, DELETE, OPTIONS).\\n\\n`PUT` replaces the resource with the exact representation supplied, so sending it five times leaves the same final state as sending it once — idempotent, but definitely not safe. That is precisely why a client can safely retry a timed-out `PUT` or `DELETE`, but must guard a retried `POST` with an idempotency key.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"GET is idempotent but it is also **safe** — it does not modify state, so it fails the second half of the question.\"},{\"optionIndex\":1,\"reason\":\"POST is neither safe nor idempotent here: each call creates another order, which is the classic duplicate-order bug on retry.\"},{\"optionIndex\":2,\"reason\":\"PATCH is not idempotent in general, and an increment is the textbook counter-example — three retries add three.\"}],\"takeaway\":\"Safe = read-only; idempotent = repeat-safe. PUT and DELETE are idempotent but not safe; POST and incrementing PATCH are neither.\",\"tags\":[\"networks\",\"rest\",\"http\",\"idempotency\",\"api-design\"],\"verified\":\"ok\"},{\"id\":\"apt-01\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Permutations with repetition\",\"difficulty\":\"easy\",\"question\":\"How many distinct arrangements can be made using all the letters of the word **LEVEL**?\",\"options\":[\"20\",\"30\",\"60\",\"120\"],\"answerIndex\":1,\"explanation\":\"LEVEL has 5 letters: L appears twice, E appears twice, V once.\\n\\nArrangements of `n` items where one letter repeats `p` times and another `q` times = `n! / (p! · q!)`.\\n\\nSo the count is `5! / (2! · 2!) = 120 / 4 = **30**`. The division by each factorial removes the identical orderings you would otherwise count twice for the two L's and twice for the two E's.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"20 = 5!/3!, which assumes some letter repeats three times — no letter in LEVEL appears more than twice.\"},{\"optionIndex\":2,\"reason\":\"60 = 5!/2! divides out only one repeated pair; both the L-pair and the E-pair must be divided out.\"},{\"optionIndex\":3,\"reason\":\"120 = 5! treats all five letters as distinct and ignores repetition entirely.\"}],\"takeaway\":\"Arrangements of a multiset = n! divided by the factorial of EVERY repeat count, not just the first one you notice.\",\"tags\":[\"permutations\",\"counting\",\"word-arrangement\"],\"verified\":\"ok\"},{\"id\":\"apt-02\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Probability without replacement\",\"difficulty\":\"medium\",\"question\":\"A bag contains 4 red and 5 blue balls. Two balls are drawn at random **without replacement**. What is the probability that both are of the same colour?\",\"options\":[\"4/9\",\"5/9\",\"41/81\",\"1/6\"],\"answerIndex\":0,\"explanation\":\"Total ways to pick 2 balls from 9 = `C(9,2) = 36`.\\n\\nFavourable: both red = `C(4,2) = 6`; both blue = `C(5,2) = 10`. Total favourable = 16.\\n\\nProbability = `16/36 = **4/9**`. Sanity check: P(different colours) = `4·5/36 = 20/36 = 5/9`, and 4/9 + 5/9 = 1.\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"5/9 is the probability of drawing two DIFFERENT colours (20/36) — the complement of what was asked.\"},{\"optionIndex\":2,\"reason\":\"41/81 = (4/9)² + (5/9)² is the answer WITH replacement; here the second draw sees only 8 balls.\"},{\"optionIndex\":3,\"reason\":\"1/6 = 6/36 counts only the both-red case and forgets the both-blue case.\"}],\"takeaway\":\"Without replacement, count with C(n,2); with replacement, multiply fractions with an unchanged denominator.\",\"tags\":[\"probability\",\"combinations\",\"without-replacement\"],\"verified\":\"ok\"},{\"id\":\"apt-03\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Expected value\",\"difficulty\":\"medium\",\"question\":\"A fair six-sided die is rolled once. You win rupees equal to the face value, **except** that on a face of 1 you instead pay ₹10. What is your expected gain per roll?\",\"options\":[\"₹3.50\",\"₹1.83\",\"₹1.67\",\"₹2.00\"],\"answerIndex\":2,\"explanation\":\"Each face has probability 1/6. The payoffs are: face 1 → −10; faces 2,3,4,5,6 → +2,+3,+4,+5,+6.\\n\\n`E = (−10 + 2 + 3 + 4 + 5 + 6)/6 = (−10 + 20)/6 = 10/6 ≈ **₹1.67**`.\\n\\nThe key is that the face-1 outcome *replaces* the ₹1 win — it does not add to it.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"₹3.50 is the plain expected face value (1+2+…+6)/6 and ignores the penalty completely.\"},{\"optionIndex\":1,\"reason\":\"₹1.83 = (21 − 10)/6 double-counts face 1: it adds the ₹1 win AND subtracts ₹10 for the same outcome.\"},{\"optionIndex\":3,\"reason\":\"₹2.00 = (20 − 10)/5 divides by 5 outcomes; there are still 6 equally likely outcomes.\"}],\"takeaway\":\"Expected value = Σ (probability × payoff) over MUTUALLY EXCLUSIVE outcomes — a replaced payoff must not also be counted normally.\",\"tags\":[\"expected-value\",\"probability\",\"dice\"],\"verified\":\"ok\"},{\"id\":\"apt-04\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Number systems — trailing zeros\",\"difficulty\":\"medium\",\"question\":\"How many trailing zeros does `100!` have?\",\"options\":[\"20\",\"21\",\"25\",\"24\"],\"answerIndex\":3,\"explanation\":\"A trailing zero comes from a factor of 10 = 2 × 5. Since 2's are far more plentiful than 5's in a factorial, the count of trailing zeros equals the exponent of 5.\\n\\nLegendre's formula: `⌊100/5⌋ + ⌊100/25⌋ + ⌊100/125⌋ = 20 + 4 + 0 = **24**`.\\n\\nThe extra 4 comes from 25, 50, 75, 100, each of which contributes a *second* factor of 5.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"20 counts only multiples of 5 and misses the second 5 hidden in 25, 50, 75 and 100.\"},{\"optionIndex\":1,\"reason\":\"21 adds just one extra 5 instead of the four contributed by 25, 50, 75 and 100.\"},{\"optionIndex\":2,\"reason\":\"25 over-counts — ⌊100/125⌋ = 0, so there is no fifth term to add.\"}],\"takeaway\":\"Trailing zeros of n! = ⌊n/5⌋ + ⌊n/25⌋ + ⌊n/125⌋ + … (keep going until the term is 0).\",\"tags\":[\"number-systems\",\"factorials\",\"legendre\"],\"verified\":\"ok\"},{\"id\":\"apt-05\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Cyclicity of unit digits\",\"difficulty\":\"easy\",\"question\":\"What is the unit (last) digit of `2^2026`?\",\"options\":[\"2\",\"4\",\"6\",\"8\"],\"answerIndex\":1,\"explanation\":\"Powers of 2 cycle their last digit with period 4: `2, 4, 8, 6, 2, 4, 8, 6, …`\\n\\nMap exponent `e` to position `e mod 4`, where remainder 1 → 2, 2 → 4, 3 → 8, 0 → 6.\\n\\n`2026 mod 4 = 2` (since 2024 is divisible by 4), so the last digit is the 2nd in the cycle = **4**.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"2 corresponds to remainder 1 (like 2^2025), not remainder 2.\"},{\"optionIndex\":2,\"reason\":\"6 corresponds to remainder 0, i.e. exponents divisible by 4 such as 2024 — 2026 is not.\"},{\"optionIndex\":3,\"reason\":\"8 corresponds to remainder 3 (like 2^2027); an off-by-one in the cycle position.\"}],\"takeaway\":\"Last digits of 2, 3, 7, 8 repeat with period 4 — reduce the exponent mod 4 and remember remainder 0 maps to the 4th term.\",\"tags\":[\"number-systems\",\"cyclicity\",\"unit-digit\"],\"verified\":\"ok\"},{\"id\":\"apt-06\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Modular arithmetic\",\"difficulty\":\"medium\",\"question\":\"What is the remainder when `2^100` is divided by 7?\",\"options\":[\"1\",\"4\",\"2\",\"6\"],\"answerIndex\":2,\"explanation\":\"Find the small cycle first: `2^1 ≡ 2`, `2^2 ≡ 4`, `2^3 = 8 ≡ 1 (mod 7)`. So powers of 2 repeat mod 7 with period 3.\\n\\nWrite `100 = 3·33 + 1`, hence `2^100 = (2^3)^33 · 2^1 ≡ 1^33 · 2 = **2 (mod 7)**`.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"1 would require the exponent to be a multiple of 3; 100 leaves remainder 1, not 0.\"},{\"optionIndex\":1,\"reason\":\"4 corresponds to exponent remainder 2 (e.g. 2^101); 100 mod 3 = 1, not 2.\"},{\"optionIndex\":3,\"reason\":\"6 never appears in the cycle {2, 4, 1} of powers of 2 modulo 7.\"}],\"takeaway\":\"For a^n mod m, hunt for the smallest k with a^k ≡ 1, then reduce n modulo k.\",\"tags\":[\"modular-arithmetic\",\"remainders\",\"exponents\"],\"verified\":\"ok\"},{\"id\":\"apt-07\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Work and time\",\"difficulty\":\"medium\",\"question\":\"A and B together finish a job in 12 days, B and C together in 15 days, and C and A together in 20 days. How long will all three working together take?\",\"options\":[\"10 days\",\"5 days\",\"12 days\",\"8 days\"],\"answerIndex\":0,\"explanation\":\"Work in rates (jobs per day). Adding the three pairwise rates counts every person exactly twice:\\n\\n`(A+B) + (B+C) + (C+A) = 2(A+B+C) = 1/12 + 1/15 + 1/20`.\\n\\nUsing LCM 60: `5/60 + 4/60 + 3/60 = 12/60 = 1/5`.\\n\\nSo `A+B+C = 1/10` job per day → all three together take **10 days**.\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"5 days comes from forgetting to halve: 1/5 is twice the combined rate, not the combined rate.\"},{\"optionIndex\":2,\"reason\":\"12 days just echoes the A+B figure; adding C must make the team strictly faster than any pair.\"},{\"optionIndex\":3,\"reason\":\"8 days is a plausible-looking guess but does not follow from 1/12 + 1/15 + 1/20 = 1/5.\"}],\"takeaway\":\"Sum of all pairwise rates = 2 × (combined rate of everyone) — always divide by 2 before inverting.\",\"tags\":[\"work-and-time\",\"rates\",\"lcm\"],\"verified\":\"ok\"},{\"id\":\"apt-08\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Ratios and mixtures\",\"difficulty\":\"easy\",\"question\":\"A 40-litre mixture contains milk and water in the ratio 3 : 1. How much water must be added so that the ratio becomes 3 : 2?\",\"options\":[\"5 L\",\"6 L\",\"20 L\",\"10 L\"],\"answerIndex\":3,\"explanation\":\"Initially milk = `(3/4) × 40 = 30 L` and water = `10 L`. Adding water leaves milk fixed at 30 L.\\n\\nWe need `30 / (10 + w) = 3/2`, so `3(10 + w) = 60` → `10 + w = 20` → `w = **10 L**`.\\n\\nQuick check: final mixture is 30 milk : 20 water = 3 : 2. ✔\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"5 L gives 30 : 15 = 2 : 1, not 3 : 2.\"},{\"optionIndex\":1,\"reason\":\"6 L comes from applying the new 2/5 water share to the ORIGINAL 40 L (16 L) instead of to the new total.\"},{\"optionIndex\":2,\"reason\":\"20 L gives 30 : 30 = 1 : 1 — that is far past the target ratio.\"}],\"takeaway\":\"In add-one-ingredient mixture problems, anchor on the quantity that does NOT change and solve for the new total.\",\"tags\":[\"ratios\",\"mixtures\",\"alligation\"],\"verified\":\"ok\"},{\"id\":\"apt-09\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Percentages — reverse change\",\"difficulty\":\"easy\",\"question\":\"An employee's salary is reduced by 20%. By what percentage must the reduced salary be increased to bring it back to the original amount?\",\"options\":[\"20%\",\"22%\",\"30%\",\"25%\"],\"answerIndex\":3,\"explanation\":\"Take the original salary as 100. After a 20% cut it becomes 80.\\n\\nTo restore, we must add 20 on a **base of 80**, not 100: `20/80 = 0.25 = **25%**`.\\n\\nGeneral rule: if a quantity falls by `x%`, the restoring rise is `100x/(100 − x)` percent.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"20% applies the increase to the reduced base of 80, giving 96 — still short of 100.\"},{\"optionIndex\":1,\"reason\":\"22% is an arbitrary split between 20 and 25 with no valid computation behind it.\"},{\"optionIndex\":2,\"reason\":\"30% overshoots: 80 × 1.30 = 104, more than the original salary.\"}],\"takeaway\":\"Percentage changes are base-dependent — a fall of x% needs a rise of 100x/(100−x)% to undo it.\",\"tags\":[\"percentages\",\"reverse-percentage\",\"base-change\"],\"verified\":\"ok\"},{\"id\":\"apt-10\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Trains — speed, time, distance\",\"difficulty\":\"medium\",\"question\":\"A 150 m long train passes a stationary pole in 15 seconds. How long will it take to completely cross a 350 m long platform?\",\"options\":[\"35 s\",\"50 s\",\"65 s\",\"40 s\"],\"answerIndex\":1,\"explanation\":\"Crossing a pole means covering only the train's own length: speed = `150 / 15 = 10 m/s`.\\n\\nCrossing a platform means covering train length + platform length: `150 + 350 = 500 m`.\\n\\nTime = `500 / 10 = **50 s**`.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"35 s uses only the 350 m platform length and ignores that the train's own 150 m must also clear it.\"},{\"optionIndex\":2,\"reason\":\"65 s adds the two times (15 + 50) instead of computing one journey of 500 m.\"},{\"optionIndex\":3,\"reason\":\"40 s would correspond to 400 m, an incorrect total distance.\"}],\"takeaway\":\"Pole → distance = train length; platform/bridge → distance = train length + platform length.\",\"tags\":[\"speed-time-distance\",\"trains\",\"relative-motion\"],\"verified\":\"ok\"},{\"id\":\"apt-11\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Boats and streams\",\"difficulty\":\"easy\",\"question\":\"A boat covers 20 km downstream in 2 hours and the same 20 km upstream in 4 hours. What is the speed of the stream?\",\"options\":[\"2.5 km/h\",\"5 km/h\",\"7.5 km/h\",\"3.75 km/h\"],\"answerIndex\":0,\"explanation\":\"Downstream speed = `20/2 = 10 km/h`; upstream speed = `20/4 = 5 km/h`.\\n\\nIf boat speed is `b` and stream speed is `s`, then `b + s = 10` and `b − s = 5`.\\n\\nSubtracting: `2s = 5` → `s = **2.5 km/h**` (and `b = 7.5 km/h`).\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"5 km/h is the upstream speed itself, not the stream's contribution.\"},{\"optionIndex\":2,\"reason\":\"7.5 km/h is the boat's speed in still water — the half-SUM, not the half-difference.\"},{\"optionIndex\":3,\"reason\":\"3.75 km/h comes from averaging 2.5 and 5 or similar mixing of the two formulas.\"}],\"takeaway\":\"Stream speed = (downstream − upstream)/2; boat speed in still water = (downstream + upstream)/2.\",\"tags\":[\"boats-and-streams\",\"speed\",\"linear-equations\"],\"verified\":\"ok\"},{\"id\":\"apt-12\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Series completion\",\"difficulty\":\"hard\",\"question\":\"Find the next term in the series:\\n\\n`3, 7, 16, 35, 74, ?`\",\"options\":[\"143\",\"148\",\"153\",\"160\"],\"answerIndex\":2,\"explanation\":\"Two consistent readings give the same answer.\\n\\n**Rule 1 (×2 + increasing constant):** 3×2+1 = 7, 7×2+2 = 16, 16×2+3 = 35, 35×2+4 = 74, so next = `74×2 + 5 = **153**`.\\n\\n**Rule 2 (differences):** 4, 9, 19, 39 — each difference is `2×previous + 1`, so next difference = `2×39 + 1 = 79` and `74 + 79 = 153`. ✔\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"143 uses a constant multiplier without the incrementing add-on (e.g. 74×2 − 5).\"},{\"optionIndex\":1,\"reason\":\"148 = 74×2 assumes pure doubling and drops the additive term entirely.\"},{\"optionIndex\":3,\"reason\":\"160 fits neither the ×2+n rule nor the doubling-differences rule.\"}],\"takeaway\":\"When a series roughly doubles, test 'a(n) = 2·a(n−1) + k' with k constant or k increasing by 1 — it covers most OA series.\",\"tags\":[\"series\",\"pattern-recognition\",\"sequences\"],\"verified\":\"ok\"},{\"id\":\"apt-13\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Syllogisms\",\"difficulty\":\"easy\",\"question\":\"**Statements:**\\n1. All pens are books.\\n2. Some books are red.\\n\\n**Conclusions:**\\nI. Some pens are red.\\nII. Some books are pens.\\n\\nWhich conclusion follows?\",\"options\":[\"Only I follows\",\"Only II follows\",\"Both I and II follow\",\"Neither follows\"],\"answerIndex\":1,\"explanation\":\"Draw the Venn diagram: the *pens* circle lies entirely inside *books*. A separate overlap exists between *books* and *red*.\\n\\nConclusion II is the valid **converse of a universal**: if all pens are books, the pen region is a non-empty part of books, so *some books are pens* is guaranteed.\\n\\nConclusion I is not guaranteed — the red part of *books* can lie completely outside the *pens* region, so it is only a possibility, never a certainty.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Only I is wrong: the 'some books are red' portion need not touch the pens sub-circle at all.\"},{\"optionIndex\":2,\"reason\":\"Both cannot follow because conclusion I fails in at least one valid diagram.\"},{\"optionIndex\":3,\"reason\":\"Neither is wrong because 'All A are B' always yields the valid conversion 'Some B are A'.\"}],\"takeaway\":\"'All A are B' validly converts to 'Some B are A'; chaining an 'All' with a 'Some' never yields a definite 'Some' conclusion.\",\"tags\":[\"syllogism\",\"logical-reasoning\",\"venn\"],\"verified\":\"ok\"},{\"id\":\"apt-14\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Blood relations\",\"difficulty\":\"medium\",\"question\":\"Pointing to a photograph, Rohit said: *\\\"I have no brother or sister, but that man's father is my father's son.\\\"* Whose photograph is Rohit looking at?\",\"options\":[\"His father\",\"His nephew\",\"Himself\",\"His son\"],\"answerIndex\":3,\"explanation\":\"Decode the innermost phrase first: **\\\"my father's son\\\"**. Since Rohit has no brothers, his father's only son is Rohit himself.\\n\\nSubstituting: *\\\"that man's father is Rohit.\\\"*\\n\\nIf Rohit is the man's father, the man in the photograph is **Rohit's son**.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"His father would require the sentence to read 'my father IS that man's son', reversing the relation.\"},{\"optionIndex\":1,\"reason\":\"A nephew is impossible — Rohit explicitly has no siblings, so no nephews exist through them.\"},{\"optionIndex\":2,\"reason\":\"Himself would mean Rohit is his own father; the phrase describes the man's father, not the man.\"}],\"takeaway\":\"Always resolve blood-relation riddles from the innermost possessive outward, and use 'no siblings' to collapse 'my father's son' to 'myself'.\",\"tags\":[\"blood-relations\",\"logical-reasoning\",\"deduction\"],\"verified\":\"ok\"},{\"id\":\"apt-15\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Seating arrangement (linear)\",\"difficulty\":\"medium\",\"question\":\"Five friends P, Q, R, S and T sit in a row of five seats numbered 1 to 5 from left to right (\\\"immediately to the left of\\\" means the next lower seat number).\\n\\n- P sits at the extreme left end.\\n- Q sits immediately to the left of R.\\n- S sits between T and Q (adjacent to both).\\n\\nWho occupies the middle seat?\",\"options\":[\"T\",\"S\",\"Q\",\"R\"],\"answerIndex\":1,\"explanation\":\"P is fixed at seat 1, leaving seats 2–5 for T, S, Q, R.\\n\\nQ immediately left of R makes the pair **Q R** consecutive. S must touch both T and Q, so the block reads **T S Q** — and it cannot be **Q S T**, because the seat right of Q is already taken by R.\\n\\nChaining gives T S Q R in seats 2–5: the row is `P T S Q R`. Seat 3 (the middle) is **S**.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"T is forced into seat 2 — S must sit between T and Q, so T cannot be central.\"},{\"optionIndex\":2,\"reason\":\"Q sits at seat 4; it would be the middle only if P were at the right end, which the clue forbids.\"},{\"optionIndex\":3,\"reason\":\"R sits at seat 5 because Q must be immediately to its left and the T-S-Q block precedes it.\"}],\"takeaway\":\"Lock the fixed-position clue first, then grow the largest adjacency block — contradictions kill the mirrored orderings.\",\"tags\":[\"seating-arrangement\",\"logical-reasoning\",\"constraints\"],\"verified\":\"ok\"},{\"id\":\"apt-16\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Data interpretation — growth rates\",\"difficulty\":\"medium\",\"question\":\"Quarterly unit sales of a product:\\n\\n| Quarter | Units |\\n|---|---|\\n| Q1 | 120 |\\n| Q2 | 150 |\\n| Q3 | 180 |\\n| Q4 | 210 |\\n\\nWhich quarter showed the **highest percentage growth** over the immediately preceding quarter?\",\"options\":[\"Q2\",\"Q3\",\"Q4\",\"All three are equal\"],\"answerIndex\":0,\"explanation\":\"The absolute increase is 30 units every quarter, but percentage growth divides by the *previous* value:\\n\\n- Q2: `30/120 = 25%`\\n- Q3: `30/150 = 20%`\\n- Q4: `30/180 ≈ 16.7%`\\n\\nThe base grows while the increment stays fixed, so the growth rate falls monotonically. **Q2** is highest.\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"Q3's 30-unit rise sits on a base of 150, giving only 20% — less than Q2's 25%.\"},{\"optionIndex\":2,\"reason\":\"Q4 has the largest ending value but the smallest growth rate (≈16.7%) because of its big base.\"},{\"optionIndex\":3,\"reason\":\"Equal ABSOLUTE growth is not equal PERCENTAGE growth when the base changes each period.\"}],\"takeaway\":\"Constant absolute increments on a rising base always produce falling percentage growth — spot it without computing every ratio.\",\"tags\":[\"data-interpretation\",\"percentages\",\"growth-rate\"],\"verified\":\"ok\"},{\"id\":\"apt-17\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Data interpretation — pie distribution\",\"difficulty\":\"easy\",\"question\":\"A company's annual expenditure of ₹80 lakh is split as: Salaries 40%, Marketing 25%, Rent 15%, Others 20%.\\n\\nBy how much does Marketing spending exceed Rent?\",\"options\":[\"₹6 lakh\",\"₹8 lakh\",\"₹10 lakh\",\"₹12 lakh\"],\"answerIndex\":1,\"explanation\":\"Work with the percentage gap directly instead of computing both amounts: `25% − 15% = 10%`.\\n\\n`10% of ₹80 lakh = **₹8 lakh**`.\\n\\nCross-check: Marketing = ₹20 lakh, Rent = ₹12 lakh, difference = ₹8 lakh. ✔\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"₹6 lakh would correspond to a 7.5% gap, not the 10 percentage-point gap given.\"},{\"optionIndex\":2,\"reason\":\"₹10 lakh confuses the 10 percentage-point gap with ₹10 lakh directly, skipping the multiplication by 80.\"},{\"optionIndex\":3,\"reason\":\"₹12 lakh is the Rent amount itself (15% of 80), not the difference.\"}],\"takeaway\":\"For 'how much more' on a single pie, subtract the percentages first and multiply the gap by the total once.\",\"tags\":[\"data-interpretation\",\"percentages\",\"pie-chart\"],\"verified\":\"ok\"},{\"id\":\"apt-18\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Bit manipulation\",\"difficulty\":\"medium\",\"question\":\"What is the value of `n & (n - 1)` when `n = 48`?\\n\\n```python\\nn = 48\\nprint(n & (n - 1))\\n```\",\"options\":[\"0\",\"16\",\"32\",\"47\"],\"answerIndex\":2,\"explanation\":\"`48 = 110000₂` and `47 = 101111₂`.\\n\\nSubtracting 1 flips the lowest set bit to 0 and turns every bit below it into 1. ANDing therefore **clears the lowest set bit** and leaves everything above it untouched.\\n\\n`110000 & 101111 = 100000₂ = **32**`.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"0 results only when n is a power of two (a single set bit); 48 = 32 + 16 has two set bits.\"},{\"optionIndex\":1,\"reason\":\"16 is the bit that got REMOVED, not the value that remains.\"},{\"optionIndex\":3,\"reason\":\"47 is simply n − 1; the AND with n still has to clear the lowest set bit.\"}],\"takeaway\":\"`n & (n-1)` clears the lowest set bit — repeat it to count set bits, and `n & (n-1) == 0` tests for a power of two.\",\"tags\":[\"bit-manipulation\",\"bitwise-and\",\"powers-of-two\"],\"verified\":\"ok\"},{\"id\":\"apt-19\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Bitwise identities\",\"difficulty\":\"hard\",\"question\":\"For any two non-negative integers `a` and `b`, the expression `(a & b) + (a | b)` is always equal to:\",\"options\":[\"`a + b`\",\"`a ^ b`\",\"`a * b`\",\"`2 * (a & b)`\"],\"answerIndex\":0,\"explanation\":\"Think bit by bit. At each position, `a` and `b` contribute 0, 1 or 2 ones. The OR keeps a 1 whenever at least one is set; the AND keeps a 1 only when both are set. Together they record exactly as many ones as `a` and `b` had — the AND supplies the carry that OR discarded.\\n\\nFormally `a | b = (a ^ b) + (a & b)` and `a + b = (a ^ b) + 2(a & b)`, so `(a & b) + (a | b) = (a ^ b) + 2(a & b) = **a + b**`.\\n\\nCheck with `a = 13 (1101₂)`, `b = 6 (0110₂)`: `a & b = 4`, `a | b = 15`, sum = 19 = 13 + 6. ✔\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"`a ^ b` is addition WITHOUT carries; it equals a + b only when a & b = 0 (no overlapping bits).\"},{\"optionIndex\":2,\"reason\":\"`a * b` fails immediately: for a = 13, b = 6 it gives 78, not 19.\"},{\"optionIndex\":3,\"reason\":\"`2*(a & b)` equals `a + b − (a ^ b)`, which is only the carry portion of the sum.\"}],\"takeaway\":\"Memorise a + b = (a ^ b) + 2(a & b), hence (a & b) + (a | b) = a + b — XOR is the sum, AND is the carry.\",\"tags\":[\"bit-manipulation\",\"identities\",\"xor\"],\"verified\":\"ok\"},{\"id\":\"apt-20\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Conditional probability\",\"difficulty\":\"hard\",\"question\":\"A family has exactly two children. Given that **at least one of them is a boy** (each child is independently a boy or girl with probability 1/2), what is the probability that both children are boys?\",\"options\":[\"1/2\",\"1/4\",\"2/3\",\"1/3\"],\"answerIndex\":3,\"explanation\":\"The equally likely ordered outcomes are BB, BG, GB, GG.\\n\\nThe condition *at least one boy* eliminates GG, leaving the three equally likely cases **BB, BG, GB**.\\n\\nExactly one of those three is BB, so the conditional probability is **1/3**. Formally `P(BB | ≥1 boy) = (1/4)/(3/4) = 1/3`.\\n\\nNote how different this is from *\\\"the elder child is a boy\\\"*, which leaves {BB, BG} and gives 1/2 — the information you receive changes the sample space.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"1/2 is the answer to the different question 'a SPECIFIC child is a boy — is the other a boy?', which leaves only two cases.\"},{\"optionIndex\":1,\"reason\":\"1/4 is the unconditional P(BB); it ignores the given information entirely.\"},{\"optionIndex\":2,\"reason\":\"2/3 is P(at least one girl | at least one boy) — the complement, not the both-boys case.\"}],\"takeaway\":\"Conditioning shrinks the sample space: 'at least one is a boy' keeps 3 ordered cases, while naming a specific child keeps only 2.\",\"tags\":[\"probability\",\"conditional-probability\",\"sample-space\"],\"verified\":\"ok\"},{\"id\":\"apt-21\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Combinations with a constraint\",\"difficulty\":\"medium\",\"question\":\"From 5 men and 4 women, a committee of 3 people is to be formed containing **at least one woman**. In how many ways can this be done?\",\"options\":[\"74\",\"40\",\"84\",\"112\"],\"answerIndex\":0,\"explanation\":\"Use complementary counting — far faster than summing cases.\\n\\nTotal committees = `C(9,3) = 84`. Committees with **no** woman (all men) = `C(5,3) = 10`.\\n\\nAnswer = `84 − 10 = **74**`.\\n\\nCase-by-case check: 1W = `C(4,1)C(5,2) = 40`, 2W = `C(4,2)C(5,1) = 30`, 3W = `C(4,3) = 4`; 40 + 30 + 4 = 74. ✔\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"40 counts only committees with EXACTLY one woman and drops the 2-woman and 3-woman cases.\"},{\"optionIndex\":2,\"reason\":\"84 = C(9,3) is the unrestricted total; the all-male committees must still be removed.\"},{\"optionIndex\":3,\"reason\":\"112 = 4 × C(8,2) picks a 'designated' woman then any two others, counting multi-woman committees several times.\"}],\"takeaway\":\"'At least one X' is almost always fastest as Total − (zero X); reserve-a-slot methods overcount.\",\"tags\":[\"combinations\",\"complementary-counting\",\"committees\"],\"verified\":\"ok\"},{\"id\":\"apt-22\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Lattice path counting\",\"difficulty\":\"medium\",\"question\":\"On a 3 × 3 grid of unit squares, how many shortest paths lead from the bottom-left corner to the top-right corner, moving only right or up along grid lines?\",\"options\":[\"6\",\"9\",\"36\",\"20\"],\"answerIndex\":3,\"explanation\":\"Any shortest path uses exactly 3 right-moves and 3 up-moves, in some order — a total of 6 moves.\\n\\nA path is fully determined by choosing which 3 of the 6 moves are 'right':\\n\\n`C(6,3) = 20`.\\n\\nSo there are **20** shortest paths.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"6 counts the number of moves, not the number of orderings of those moves.\"},{\"optionIndex\":1,\"reason\":\"9 = 3 × 3 multiplies the grid dimensions, which counts cells rather than paths.\"},{\"optionIndex\":2,\"reason\":\"36 = 6² treats the two move types as independently choosable 6 times, double-counting wildly.\"}],\"takeaway\":\"Shortest lattice paths across an m × n grid = C(m+n, m) — it is just arranging a string of R's and U's.\",\"tags\":[\"combinations\",\"lattice-paths\",\"counting\"],\"verified\":\"ok\"},{\"id\":\"apt-23\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Puzzle — tournament/racing logic\",\"difficulty\":\"hard\",\"question\":\"You have 25 horses and a track that races exactly 5 horses at a time. There is no stopwatch — a race only reveals the finishing order. What is the **minimum number of races** needed to identify the fastest 3 horses?\",\"options\":[\"6\",\"7\",\"8\",\"10\"],\"answerIndex\":1,\"explanation\":\"**Races 1–5:** split the 25 horses into 5 groups of 5 and race each group, giving every horse a within-group rank.\\n\\n**Race 6:** race the 5 group winners. Call the finishing order of their groups A, B, C, D, E. The winner of this race (A1) is the overall #1. Groups D and E are eliminated entirely — their best horse already has at least 3 faster horses ahead of it — as are all horses ranked 4th or 5th in any group, and C2/C3 and B3.\\n\\n**Race 7:** exactly 5 horses can still be in the top 3 — A2 and A3 (from the champion's group), B1 and B2 (from the runner-up's group), and C1 (winner of the third-placed group). Race those 5; the top two finishers are the overall #2 and #3.\\n\\nTotal = **7 races**.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"6 races cannot work: after the winners' race you still have 5 distinct live candidates for places 2 and 3 that have never met.\"},{\"optionIndex\":2,\"reason\":\"8 is achievable but not minimal — the elimination argument prunes the candidate set to exactly 5, so one final race suffices.\"},{\"optionIndex\":3,\"reason\":\"10 corresponds to a much lazier scheme and is far from the optimum.\"}],\"takeaway\":\"Group, race the winners, then prune by 'how many horses are provably ahead of you' — 25 horses, top 3 is always 7 races.\",\"tags\":[\"puzzle\",\"logical-reasoning\",\"tournament\"],\"verified\":\"corrected\"},{\"id\":\"apt-24\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Puzzle — measuring time\",\"difficulty\":\"hard\",\"question\":\"You have two ropes. Each burns completely in exactly 60 minutes, but burns **unevenly** (half a rope does not mean 30 minutes). You have a lighter. Which procedure measures exactly 45 minutes?\",\"options\":[\"Light rope 1 at both ends and rope 2 at one end simultaneously; when rope 1 finishes, light rope 2's other end; stop when rope 2 finishes.\",\"Light both ropes at both ends simultaneously; stop when the second rope finishes.\",\"Fold rope 2 in half and light it at the midpoint and one end; stop when it finishes.\",\"Light rope 1 at one end; when it finishes, light rope 2 at both ends; stop when rope 2 finishes.\"],\"answerIndex\":0,\"explanation\":\"A rope lit at **both ends** always finishes in half its total burn time, whatever the unevenness — the two flames jointly consume the whole rope at double rate.\\n\\nRope 1 lit at both ends burns out at **t = 30 min**. Rope 2, lit at one end at t = 0, has exactly 30 minutes of burn left at that moment. Lighting its second end then halves the remainder to **15 minutes**.\\n\\nTotal = 30 + 15 = **45 minutes**.\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"Both ropes lit at both ends both finish at 30 minutes — that measures 30, not 45.\"},{\"optionIndex\":2,\"reason\":\"Because the rope burns unevenly, the physical midpoint is not the 30-minute point, so this measures an unknown duration.\"},{\"optionIndex\":3,\"reason\":\"This measures 60 + 30 = 90 minutes.\"}],\"takeaway\":\"Lighting a rope at both ends halves its REMAINING burn time — chain that trick, never rely on physical length.\",\"tags\":[\"puzzle\",\"logical-reasoning\",\"measuring\"],\"verified\":\"ok\"},{\"id\":\"apt-25\",\"topic\":\"aptitude-logical\",\"subtopic\":\"Unit digit of factorial sums\",\"difficulty\":\"easy\",\"question\":\"What is the unit digit of `1! + 2! + 3! + … + 100!`?\",\"options\":[\"0\",\"1\",\"3\",\"5\"],\"answerIndex\":2,\"explanation\":\"From `5!` onwards every factorial contains the factors 2 and 5, so it is a multiple of 10 and ends in 0. Those terms contribute nothing to the unit digit.\\n\\nOnly the first four terms matter: `1 + 2 + 6 + 24 = 33`.\\n\\nThe unit digit is therefore **3**.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"0 would require the first four factorials to also end in 0, but 1! through 4! sum to 33.\"},{\"optionIndex\":1,\"reason\":\"1 comes from stopping at 1! or from mis-adding 1 + 2 + 6 + 24.\"},{\"optionIndex\":3,\"reason\":\"5 has no basis — no partial sum of the series ends in 5.\"}],\"takeaway\":\"For unit digits of factorial sums, only terms up to 4! matter — every factorial from 5! on ends in 0.\",\"tags\":[\"number-systems\",\"factorials\",\"unit-digit\"],\"verified\":\"ok\"},{\"id\":\"agt-01\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Tokens and tokenization\",\"difficulty\":\"easy\",\"question\":\"A product page contains about **1,200 words** of ordinary English prose. Using the standard rule of thumb for a modern byte-level BPE tokenizer, roughly how many **tokens** is that?\",\"options\":[\"~300 tokens\",\"~900 tokens\",\"~1,600 tokens\",\"~4,800 tokens\"],\"answerIndex\":2,\"explanation\":\"The usual rule of thumb is **~4 characters per token** for English. An average English word plus its space is ~5–6 characters, which works out to roughly **1.3 tokens per word**.\\n\\nSo `1,200 words × 1.3 ≈ 1,560 tokens`, i.e. about 1,600. Sub-word tokenizers split rare words, brand names, URLs and numbers into several pieces, so the token count is normally *higher* than the word count, never lower. Knowing this ratio matters because context windows, latency and cost are all billed in tokens, not words.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"This inverts the rule: it assumes ~4 *words* per token. The rule is ~4 *characters* per token.\"},{\"optionIndex\":1,\"reason\":\"Fewer tokens than words would require the tokenizer to merge whole words together; sub-word tokenization does the opposite on average.\"},{\"optionIndex\":3,\"reason\":\"That is character-scale (1,200 × ~4), not token-scale — it forgets to divide the characters by ~4.\"}],\"takeaway\":\"English ≈ 4 characters per token ≈ 1.3 tokens per word — always budget tokens above word count.\",\"tags\":[\"tokens\",\"tokenizer\",\"cost-estimation\",\"llm-fundamentals\"],\"verified\":\"unverified\"},{\"id\":\"agt-02\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Context window\",\"difficulty\":\"medium\",\"question\":\"A RAG service sends a system prompt + retrieved chunks + the user question to a model whose context window is **8,192 tokens**, and requests `max_tokens = 1000` for the answer. Which statement is correct?\",\"options\":[\"The context window limits only the input, so the prompt may use all 8,192 tokens and the 1,000 generated tokens are additional\",\"Prompt tokens and generated tokens share the same 8,192-token budget, so the prompt must fit in roughly 7,192 tokens\",\"If the prompt exceeds the window, the model silently summarises the oldest tokens and keeps going\",\"Raising `max_tokens` to 4,000 raises the effective context window to 12,192 tokens\"],\"answerIndex\":1,\"explanation\":\"The context window is the total number of tokens the model can attend over in one forward pass — **prompt plus completion**. Reserving 1,000 tokens for the answer leaves about `8192 − 1000 = 7192` tokens for system prompt, retrieved chunks and the question.\\n\\nThis is exactly why retrieval exists: you cannot stuff a whole catalogue in, so you select the top-k most relevant chunks. Overflow is not handled gracefully by the model itself — the API returns an error or truncates, depending on the provider; any sliding-window or summarisation behaviour is something *your* application must implement.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Completion tokens are drawn from the same window; they are not free extra capacity on top of it.\"},{\"optionIndex\":2,\"reason\":\"Models do not auto-summarise overflow. The request errors or is truncated unless your orchestration layer compacts the history.\"},{\"optionIndex\":3,\"reason\":\"`max_tokens` caps output length; it cannot enlarge the architectural context limit.\"}],\"takeaway\":\"Context window = prompt + completion; always reserve room for the answer before packing retrieved context.\",\"tags\":[\"context-window\",\"rag\",\"max-tokens\",\"prompt-budget\"],\"verified\":\"unverified\"},{\"id\":\"agt-03\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Decoding parameters (temperature / top-p)\",\"difficulty\":\"easy\",\"question\":\"A brand assistant must return **reproducible, compliance-checked product specifications** — the same question should yield the same wording. Which decoding setting best supports that?\",\"options\":[\"Set `temperature = 1.5` and `top_p = 1.0` so the model considers all the evidence\",\"Set `top_p = 1.0`, which restricts sampling to the single most likely token\",\"Set `presence_penalty = 2.0` so the model cannot invent new specifications\",\"Set `temperature ≈ 0`, so sampling collapses to the highest-probability token at each step\"],\"answerIndex\":3,\"explanation\":\"Temperature `T` rescales the logits before the softmax: `p_i ∝ exp(logit_i / T)`. As `T → 0` the distribution becomes a point mass on the arg-max token, i.e. greedy decoding — the same prompt yields the same output.\\n\\nHigher `T` flattens the distribution and increases variety (and drift). `top_p` (nucleus sampling) works differently: it keeps the smallest set of tokens whose cumulative probability reaches `p`, so `top_p = 1.0` keeps *everything* — the opposite of restrictive. Note that low temperature buys consistency, not truth: grounding is what buys truth.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"High temperature flattens the distribution and maximises variability — the opposite of reproducible output.\"},{\"optionIndex\":1,\"reason\":\"`top_p = 1.0` keeps the entire probability mass. Restriction comes from *small* top_p values such as 0.1.\"},{\"optionIndex\":2,\"reason\":\"Presence/frequency penalties discourage repeating tokens already used; they have nothing to do with factual invention.\"}],\"takeaway\":\"temperature→0 gives determinism; small top_p gives restriction; neither one gives correctness.\",\"tags\":[\"temperature\",\"top-p\",\"sampling\",\"determinism\"],\"verified\":\"unverified\"},{\"id\":\"agt-04\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Embeddings and semantic similarity\",\"difficulty\":\"medium\",\"question\":\"A shopper asks an AI assistant for a *\\\"cheap notebook for college\\\"*. Your retrieval layer surfaces the page *\\\"Affordable laptops for students\\\"* even though the two strings share **no words**. Which statement best explains this?\",\"options\":[\"BM25 keyword matching automatically expands synonyms using the site's XML sitemap\",\"The embedding model stores each document's words in a hash table, so the lookup was an exact match\",\"Both texts map to nearby points in a dense vector space because the embedding model encodes meaning, and similarity is measured by the angle between vectors rather than by shared tokens\",\"Embeddings are a reversible compression of text, so the retriever decoded the stored vector back into the query\"],\"answerIndex\":2,\"explanation\":\"An embedding model maps text to a fixed-length dense vector (e.g. 768 or 1536 dimensions) trained so that semantically related texts land close together. \\\"Cheap ≈ affordable\\\" and \\\"notebook ≈ laptop\\\" are captured in that geometry, so **cosine similarity is high despite zero lexical overlap**.\\n\\nThis is precisely the capability that lexical search lacks: BM25 scores exact term matches (with weighting), so it would miss this page entirely. In practice, hybrid retrieval — lexical + vector, then re-ranking — is used because lexical search is still better at exact SKUs, model numbers and rare brand tokens.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"BM25 is a lexical term-frequency scorer; it has no built-in synonym knowledge and sitemaps carry no semantics.\"},{\"optionIndex\":1,\"reason\":\"Embeddings are dense continuous vectors, not hash-table keys; nothing about this retrieval was an exact match.\"},{\"optionIndex\":3,\"reason\":\"Embeddings are lossy and not designed to be inverted — you cannot decode the original text back from the vector.\"}],\"takeaway\":\"Vector search matches meaning, not words — which is why AI answer surfaces can cite pages that never contain the user's phrasing.\",\"tags\":[\"embeddings\",\"cosine-similarity\",\"semantic-search\",\"hybrid-retrieval\"],\"verified\":\"unverified\"},{\"id\":\"agt-05\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Vector search geometry\",\"difficulty\":\"hard\",\"question\":\"Every vector in your index is **L2-normalised** (unit length). Ranking candidates by **descending cosine similarity** to the query is mathematically equivalent to ranking them by:\",\"options\":[\"ascending dot product with the query\",\"descending squared Euclidean distance to the query\",\"descending dot product with the query — equivalently, ascending Euclidean distance\",\"descending vector dimensionality\"],\"answerIndex\":2,\"explanation\":\"Cosine similarity is `cos(a,b) = (a·b) / (‖a‖‖b‖)`. When both vectors are unit length the denominator is 1, so **cosine similarity is exactly the dot product**.\\n\\nFor unit vectors the Euclidean distance also collapses: `‖a−b‖² = ‖a‖² + ‖b‖² − 2a·b = 2 − 2·cos(a,b)`. Distance is therefore a strictly decreasing function of cosine, so *highest cosine = highest dot product = smallest distance* — the three orderings are identical. This is why vector databases let you normalise once at ingest and then use the fastest inner-product kernel; it also explains why forgetting to normalise makes cosine and dot-product indexes disagree, with long documents scoring artificially high.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Ascending dot product reverses the ranking — it puts the *least* similar items first.\"},{\"optionIndex\":1,\"reason\":\"Distance moves opposite to similarity: `‖a−b‖² = 2 − 2cos`, so the best match has the *smallest* squared distance.\"},{\"optionIndex\":3,\"reason\":\"Dimensionality is a property of the index, identical for every vector in it, so it cannot order anything.\"}],\"takeaway\":\"For unit-norm vectors: max cosine = max dot product = min Euclidean distance — one ordering, three names.\",\"tags\":[\"vector-search\",\"cosine-similarity\",\"dot-product\",\"normalization\"],\"verified\":\"unverified\"},{\"id\":\"agt-06\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"RAG pipeline\",\"difficulty\":\"easy\",\"question\":\"Which sequence correctly describes a standard **retrieval-augmented generation** request at query time?\",\"options\":[\"Fine-tune the model on the user's query → generate → store the answer in the vector index\",\"Embed the user query → approximate-nearest-neighbour search over the chunk index → insert the top-k chunks into the prompt → generate a grounded answer\",\"Generate a draft answer → embed the draft → replace the answer with the nearest stored chunk\",\"Put every document in the prompt → embed the prompt → search the web → generate\"],\"answerIndex\":1,\"explanation\":\"RAG separates **indexing time** (chunk documents → embed chunks → store vectors + metadata) from **query time** (embed the query → retrieve top-k similar chunks → build a prompt containing those chunks → generate an answer that cites them).\\n\\nThe key property is that the model's knowledge is supplied *in context* rather than baked into the weights, so updating a price or a policy page updates the answer immediately, with no retraining. That is also why RAG is the natural mental model for brand visibility in answer engines: your content has to be crawlable, chunkable and retrievable before it can ever be cited.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Fine-tuning changes weights offline over a dataset; it is not something done per user query, and it is the alternative to RAG, not a step in it.\"},{\"optionIndex\":2,\"reason\":\"That describes generate-then-retrieve substitution, which discards the model's answer; it is not standard RAG (HyDE embeds a hypothetical answer to *improve retrieval*, then still generates).\"},{\"optionIndex\":3,\"reason\":\"Putting every document in the prompt is exactly the context-overflow problem retrieval exists to avoid.\"}],\"takeaway\":\"RAG = embed query → retrieve top-k chunks → ground the prompt → generate; the model's facts live in context, not in the weights.\",\"tags\":[\"rag\",\"retrieval\",\"pipeline\",\"grounding\"],\"verified\":\"unverified\"},{\"id\":\"agt-07\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Hallucination mitigation\",\"difficulty\":\"medium\",\"question\":\"A brand assistant confidently states a **warranty length that does not exist**. Which single change most directly reduces this class of error?\",\"options\":[\"Ground every answer in retrieved passages, require the model to cite the passage it used, and instruct it to reply \\\"not stated in the provided sources\\\" when no passage supports the claim\",\"Set `temperature = 0` so the output becomes deterministic\",\"Raise `max_tokens` so the model has room to explain itself fully\",\"Switch to a model with a much larger context window\"],\"answerIndex\":0,\"explanation\":\"Hallucination is the model completing a plausible pattern when it has no supporting evidence. The mitigation that attacks the cause is **grounding plus abstention**: supply the authoritative passage, require an inline citation to it, and give the model an explicit licence to say it does not know.\\n\\nCitation requirements are especially valuable because they make the failure *auditable* — an unsupported claim now has no passage to point at, so it can be caught by an automated check. The other options change style, length or capacity, none of which supply the missing fact.\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"Determinism removes variance, not falsehood — greedy decoding will reproduce the same confident fabrication every single time.\"},{\"optionIndex\":2,\"reason\":\"Length is not the constraint; longer ungrounded answers typically add *more* unsupported claims.\"},{\"optionIndex\":3,\"reason\":\"A larger window only helps if correct evidence is actually placed inside it; an empty bigger window changes nothing.\"}],\"takeaway\":\"Fix hallucination with evidence + citation + a permitted \\\"I don't know\\\", not with decoding knobs.\",\"tags\":[\"hallucination\",\"grounding\",\"citations\",\"abstention\"],\"verified\":\"unverified\"},{\"id\":\"agt-08\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Function / tool calling\",\"difficulty\":\"easy\",\"question\":\"An LLM \\\"calls a function\\\" such as `get_inventory(sku)`. What literally happens at runtime?\",\"options\":[\"The model opens the HTTP connection and executes the call itself inside the weights\",\"The model emits a structured request naming the tool plus a JSON arguments object; your application executes it and returns the result as a new message, after which the model continues\",\"The tool's source code is compiled into the model during fine-tuning, so no runtime call is required\",\"The function name is only a prompt hint — the model always invents the return value\"],\"answerIndex\":1,\"explanation\":\"Tool calling is a **structured-output contract**, not execution. You pass the model a JSON-Schema description of each tool; the model responds with a tool-use block containing the tool name and an arguments object; **your code** runs the real API call and appends the result back into the conversation as a tool-result message; the model then produces the final answer.\\n\\nThis is the security boundary that matters: the model chooses *what* to call, your runtime decides *whether* it is allowed to. Validate arguments against the schema, apply authorisation, and never let a model-chosen argument flow unchecked into a query or a shell.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"The model has no network stack or execution environment; it only produces tokens.\"},{\"optionIndex\":2,\"reason\":\"Tool definitions are passed in the request at runtime; that's why you can add or remove tools without touching the model.\"},{\"optionIndex\":3,\"reason\":\"With proper tool calling the return value comes from the real system; invented values are the failure mode you avoid by actually executing the tool.\"}],\"takeaway\":\"The model proposes the call; your application executes it and owns validation and authorisation.\",\"tags\":[\"tool-calling\",\"function-calling\",\"json-schema\",\"agent-runtime\"],\"verified\":\"unverified\"},{\"id\":\"agt-09\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"ReAct loop\",\"difficulty\":\"medium\",\"question\":\"In a **ReAct**-style agent loop, which sequence correctly describes one iteration?\",\"options\":[\"Thought (plan the next step) → Action (tool name + arguments) → Observation (the tool's real return value appended to the context) → next Thought\",\"Observation → Thought → Action, where the Observation is generated by the model itself\",\"Action → Thought → Observation, so the tool is chosen before any reasoning happens\",\"Thought → Observation → Action, where the Observation is the model's confidence score\"],\"answerIndex\":0,\"explanation\":\"ReAct interleaves **Reasoning and Acting**: the model writes a short Thought about what it still needs, emits an Action (a tool call with arguments), and the environment returns an Observation that is appended to the context. The loop repeats until the model emits a final answer.\\n\\nThe load-bearing detail is that the **Observation must come from the environment**, not from the model. If the model writes its own observations, the trace looks identical but is completely ungrounded — it is just hallucinating tool output. Production loops also need a step budget and a termination condition, since a model that keeps re-issuing the same failing search will otherwise spin until the context fills.\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"Self-generated observations break grounding entirely; the Observation is the environment's reply, and the loop begins with reasoning, not with an observation out of nowhere.\"},{\"optionIndex\":2,\"reason\":\"Acting before reasoning is exactly what ReAct was designed to avoid — the Thought is what selects and parameterises the Action.\"},{\"optionIndex\":3,\"reason\":\"An Observation is tool output, not a confidence score, and it necessarily follows the Action that produced it.\"}],\"takeaway\":\"Thought → Action → Observation, with the Observation coming from the real tool — plus a step limit so the loop can end.\",\"tags\":[\"react\",\"agent-loop\",\"observation\",\"tool-use\"],\"verified\":\"unverified\"},{\"id\":\"agt-10\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Model Context Protocol (MCP)\",\"difficulty\":\"medium\",\"question\":\"What problem does the **Model Context Protocol (MCP)** primarily solve?\",\"options\":[\"It is a transformer variant that extends the context window by compressing older tokens\",\"It is a file format for storing embeddings so vector databases can interoperate\",\"It is a ranking algorithm that decides which brand gets cited in a generated answer\",\"It is an open client–server protocol that lets any compatible host discover and invoke the tools, resources and prompts a server exposes, replacing bespoke per-application integrations\"],\"answerIndex\":3,\"explanation\":\"MCP standardises the wiring between AI applications (hosts/clients) and the systems that hold context and capabilities (servers). A server advertises **tools** (callable actions), **resources** (readable data) and **prompts** (reusable templates) over a defined JSON-RPC based interface; any MCP-capable client can then discover and use them.\\n\\nThe economic point is the **N×M problem**: without a standard, `N` AI apps each need custom connectors to `M` systems. With one protocol, each side implements it once. Note that MCP is a transport and capability-description standard — it does not by itself grant authorisation, so permissioning and validation remain your responsibility.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"MCP is a protocol layer around the model, not a change to model architecture or attention.\"},{\"optionIndex\":1,\"reason\":\"MCP does not define an embedding storage format; a server *may* expose vector search as a tool, but that is an application choice.\"},{\"optionIndex\":2,\"reason\":\"MCP has no ranking or visibility semantics whatsoever.\"}],\"takeaway\":\"MCP turns the N×M integration problem into N+M by standardising how tools and resources are exposed to any AI client.\",\"tags\":[\"mcp\",\"protocol\",\"tools\",\"integration\"],\"verified\":\"unverified\"},{\"id\":\"agt-11\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Multi-agent orchestration\",\"difficulty\":\"hard\",\"question\":\"A supervisor agent fans out to **four research sub-agents in parallel**. Each performs ~15 tool calls and returns a 2,000-token summary. Which statement is correct?\",\"options\":[\"The supervisor's context necessarily grows by the full traces of all four sub-agents, so parallelism cannot save context\",\"Only the four summaries (~8,000 tokens) enter the supervisor's context — context isolation is the main benefit, paid for with much higher total token spend plus the risk of duplicated or conflicting findings the supervisor must reconcile\",\"Sub-agents automatically share one context, so they can never duplicate each other's work\",\"Running agents in parallel reduces total token consumption versus one agent doing the same work sequentially\"],\"answerIndex\":1,\"explanation\":\"The orchestrator–worker pattern exists mainly for **context isolation**: each sub-agent burns its own window on noisy intermediate tool output, and only a compressed result crosses back to the supervisor. Four × 15 tool calls might be 60k+ tokens of raw traces, yet the supervisor only ingests ~8k.\\n\\nThe costs are real, though. Total tokens go *up*, not down (you pay for every sub-agent's full context on every one of its turns), and because the workers cannot see each other, they may overlap or contradict — so the supervisor needs an explicit merge/dedupe/conflict-resolution step, and task descriptions must be disjoint enough to be worth parallelising at all.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Returning a summary rather than the trace is the entire mechanism; the supervisor never has to see the intermediate steps.\"},{\"optionIndex\":2,\"reason\":\"Sub-agents run in separate contexts by design — that isolation is precisely why duplication is a known failure mode.\"},{\"optionIndex\":3,\"reason\":\"Parallelism buys wall-clock latency, not tokens; multi-agent systems typically consume several times the tokens of a single agent.\"}],\"takeaway\":\"Multi-agent fan-out trades tokens and coherence for context isolation and latency — merge logic is mandatory, not optional.\",\"tags\":[\"multi-agent\",\"orchestrator-worker\",\"context-isolation\",\"token-cost\"],\"verified\":\"unverified\"},{\"id\":\"agt-12\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Guardrails\",\"difficulty\":\"medium\",\"question\":\"Policy: a public brand agent must **never state a competitor's prices**. Which implementation is most robust?\",\"options\":[\"Put \\\"never mention competitor prices\\\" in the user message of every request\",\"Lower the temperature so the model is less creative\",\"Keep the policy in the system prompt **and** add a deterministic post-generation check — a classifier or pattern match over the draft answer — that blocks or rewrites violating responses before they reach the user\",\"Fine-tune on 50 examples of compliant answers and remove all runtime checks\"],\"answerIndex\":2,\"explanation\":\"Prompts are **probabilistic** instructions: they shift behaviour but can be overridden by clever user input, long conversations, or plain sampling luck. Guardrails that must hold need a **deterministic enforcement point outside the model** — typically an input filter and an output validator that inspect the actual text and can block, redact or regenerate.\\n\\nThe standard architecture is defence in depth: policy in the system prompt (cheap, handles the common case) + programmatic output checks (catches the tail) + logging of every block for evaluation. Note that the system prompt, not the user message, is the right place for policy, since user-supplied text is exactly the untrusted channel an attacker controls.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Policy placed in the user turn sits in the untrusted channel and is trivially contradicted by the rest of that same turn.\"},{\"optionIndex\":1,\"reason\":\"Temperature controls variability of wording, not compliance; a deterministic answer can be deterministically non-compliant.\"},{\"optionIndex\":3,\"reason\":\"Fine-tuning shifts the distribution but offers no hard guarantee, and removing runtime checks deletes the only enforceable layer.\"}],\"takeaway\":\"If a rule must never be broken, enforce it in code outside the model — prompts alone are guidance, not guarantees.\",\"tags\":[\"guardrails\",\"safety\",\"output-validation\",\"prompt-injection\"],\"verified\":\"unverified\"},{\"id\":\"agt-13\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Evals and LLM-as-judge\",\"difficulty\":\"hard\",\"question\":\"An LLM judge prefers response A over B **78%** of the time when A is shown first, but only **54%** of the time when A is shown second. What is happening, and what is the right fix?\",\"options\":[\"Position bias in the judge: evaluate every pair in both orders and average (or score a win only when the judge is consistent across both orders), and validate the judge against human labels before trusting it\",\"A genuine quality difference: the average is above 50%, so ship A\",\"The judge's temperature is too low; raising it will decorrelate the judgements\",\"The judge's context window is too small, and truncation caused the swing\"],\"answerIndex\":0,\"explanation\":\"A judge whose verdict flips with presentation order is exhibiting **position bias** — a well-documented artefact of pairwise LLM evaluation, alongside verbosity bias (longer answers look better) and self-preference (models favour their own outputs).\\n\\nThe standard remedy is order randomisation or full swapping: run each pair as (A,B) and (B,A), and count a win only when both orders agree, treating disagreements as ties. Before relying on any judge you should also measure **agreement with human labels** on a held-out set (e.g. Cohen's kappa) and pin the judge model and prompt, since a silent judge upgrade invalidates every historical comparison.\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"Averaging over a biased instrument does not remove the bias; the 24-point swing shows the measurement is dominated by ordering, not quality.\"},{\"optionIndex\":2,\"reason\":\"Raising temperature adds noise to an already unreliable judge — evaluation wants low-variance, reproducible scoring.\"},{\"optionIndex\":3,\"reason\":\"Truncation would degrade both orders roughly equally; it does not explain an order-dependent preference flip.\"}],\"takeaway\":\"Always swap the order in pairwise LLM-judge evals, and calibrate the judge against humans before trusting its numbers.\",\"tags\":[\"evals\",\"llm-as-judge\",\"position-bias\",\"measurement\"],\"verified\":\"unverified\"},{\"id\":\"agt-14\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"SEO vs GEO vs AEO\",\"difficulty\":\"easy\",\"question\":\"Which statement most accurately distinguishes classical **SEO** from **GEO** (Generative Engine Optimization) and **AEO** (Answer Engine Optimization)?\",\"options\":[\"They are rebrands of the same discipline; the optimisation target is identical in all three\",\"Classical SEO optimises for position in a ranked list of links a human clicks; AEO optimises to *be* the direct answer on answer surfaces; GEO optimises for being retrieved, quoted and cited inside a generated answer, where there may be no click at all\",\"GEO means buying placements inside LLM answers, while AEO means paying for featured snippets\",\"GEO removes crawlability requirements, because generative engines read your database directly\"],\"answerIndex\":1,\"explanation\":\"The three differ by **what winning looks like**. SEO wins a *rank*: a blue link the user clicks. AEO wins the *answer slot* — featured snippets, voice assistants, People-Also-Ask — where a single concise response is surfaced. GEO wins *inclusion and attribution inside synthesised text*: your passage is retrieved, paraphrased or quoted, and ideally cited.\\n\\nThe practical consequence is that GEO/AEO success may produce **zero clicks**, so measurement shifts from sessions and CTR to mention rate, citation rate and share of voice across sampled answers. The technical foundations still overlap heavily, though: crawlable HTML, clean structure, factual clarity and entity consistency serve all three.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"The surfaces and success metrics genuinely differ — a rank-1 link and a cited passage inside a synthesised answer are not the same outcome.\"},{\"optionIndex\":2,\"reason\":\"Both are organic-content disciplines; neither is defined as a paid-placement mechanism.\"},{\"optionIndex\":3,\"reason\":\"Generative engines still depend on crawled/retrieved public content; blocking crawlers removes you from citation, and no engine reads your private database.\"}],\"takeaway\":\"SEO wins a rank, AEO wins the answer slot, GEO wins the citation inside generated text — often with no click to measure.\",\"tags\":[\"geo\",\"aeo\",\"seo\",\"brand-visibility\"],\"verified\":\"unverified\"},{\"id\":\"agt-15\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Share of voice in LLM answers\",\"difficulty\":\"medium\",\"question\":\"Your team wants to measure **brand share of voice inside LLM answers**. Which methodology is sound?\",\"options\":[\"Ask one assistant once, \\\"what is the best CRM?\\\", and record whether the brand appears\",\"Count backlinks and domain authority, since those are the inputs generative engines use\",\"Run a fixed panel of representative prompts N times per model **and per model version**, then report the proportion of responses that mention or cite the brand, with a confidence interval — because generation is stochastic and shifts with model version, prompt phrasing and personalisation\",\"Track average Google ranking position, since AI answers mirror the top-10 organic results exactly\"],\"answerIndex\":2,\"explanation\":\"An LLM answer is a **sample from a distribution**, not a lookup. Two identical prompts can produce different brand mentions, and the distribution moves whenever the provider updates the model. So share of voice must be treated as a statistical estimate: a fixed prompt panel, repeated sampling, pinned model versions, and an interval around the proportion.\\n\\nGood practice also separates *mention rate* (brand named anywhere) from *citation rate* (your domain linked as a source) and records competitor rates on the same panel — share of voice is only meaningful relative to the competitive set. One-shot spot checks are anecdotes: with n=1 you cannot distinguish a 20% brand from an 80% one.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"A single sample has no statistical power and cannot separate a real change from ordinary generation variance.\"},{\"optionIndex\":1,\"reason\":\"Link metrics are proxies at best; they measure neither retrieval into an answer nor the attribution you actually want to count.\"},{\"optionIndex\":3,\"reason\":\"Generative answers draw on training data, tool-based retrieval and re-ranking; they do not reproduce the organic top 10.\"}],\"takeaway\":\"Share of voice in AI answers is a sampled proportion — fixed prompt panel, pinned model version, repeated runs, confidence intervals.\",\"tags\":[\"share-of-voice\",\"measurement\",\"brand-visibility\",\"sampling\"],\"verified\":\"unverified\"},{\"id\":\"agt-16\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Structured data / schema.org\",\"difficulty\":\"easy\",\"question\":\"A page includes this markup:\\n\\n```html\\n<script type=\\\"application/ld+json\\\">\\n{\\n  \\\"@context\\\": \\\"https://schema.org\\\",\\n  \\\"@type\\\": \\\"Product\\\",\\n  \\\"name\\\": \\\"Acme Aero 14\\\",\\n  \\\"brand\\\": { \\\"@type\\\": \\\"Brand\\\", \\\"name\\\": \\\"Acme\\\" },\\n  \\\"offers\\\": { \\\"@type\\\": \\\"Offer\\\", \\\"price\\\": \\\"899.00\\\", \\\"priceCurrency\\\": \\\"USD\\\" }\\n}\\n<\/script>\\n```\\n\\nWhat does this actually accomplish?\",\"options\":[\"It guarantees a higher ranking, because schema.org markup is a direct ranking factor\",\"It hides the price from human visitors while exposing it to crawlers, which is its intended use\",\"It removes the need for the page to be crawlable or for the price to appear in the visible content\",\"It publishes explicit machine-readable statements — a Product, with a Brand, carrying a priced Offer — that parsers can consume without inferring them from prose, improving rich-result eligibility and the reliability of entity and attribute extraction\"],\"answerIndex\":3,\"explanation\":\"JSON-LD in a `<script type=\\\"application/ld+json\\\">` block is the recommended way to attach structured data. It converts facts that a machine would otherwise have to infer from sentences (\\\"the Aero 14 starts at $899\\\") into unambiguous typed triples: entity type, brand relation, price, currency.\\n\\nThat matters for the agentic era because retrieval and knowledge-graph pipelines get exact attributes instead of guessing. But structured data is **descriptive, not magic**: it must match what users actually see on the page (marking up content that is hidden or absent is a policy violation), it does not replace crawlability, and it is not a guaranteed ranking boost — it affects eligibility and understanding.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Markup improves eligibility for rich results and machine understanding; search engines are explicit that it is not a guaranteed ranking boost.\"},{\"optionIndex\":1,\"reason\":\"Structured data must reflect visible page content — marking up information that users cannot see is a spam violation, not the intended use.\"},{\"optionIndex\":2,\"reason\":\"The JSON-LD lives inside the page, so the page must still be fetchable; markup is an addition to content, not a substitute for it.\"}],\"takeaway\":\"JSON-LD makes your facts machine-readable and must mirror visible content — it aids understanding and eligibility, not ranking by fiat.\",\"tags\":[\"schema-org\",\"json-ld\",\"structured-data\",\"rich-results\"],\"verified\":\"unverified\"},{\"id\":\"agt-17\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"llms.txt\",\"difficulty\":\"medium\",\"question\":\"Which statement about **`llms.txt`** is correct?\",\"options\":[\"It is a proposed, voluntary convention — a Markdown file at the site root offering LLM-facing consumers a curated, link-listed map of the site's most important content in clean form. No crawler is obliged to honour it, and it grants no access control.\",\"It is part of the Robots Exclusion Protocol and legally blocks AI crawlers that ignore `robots.txt`\",\"It is a binary index of your site's embeddings that answer engines download instead of crawling your pages\",\"It replaces the XML sitemap for search engines and is required by Google for indexing\"],\"answerIndex\":0,\"explanation\":\"`llms.txt` is a community proposal, not a ratified standard: a Markdown document at `/llms.txt` that lists a site's key pages with short descriptions so a model consuming the site does not have to parse navigation chrome, scripts and boilerplate out of full HTML. Some sites pair it with `.md` versions of key pages.\\n\\nTwo things follow. First, it is **opt-in on both sides** — publishing it does not oblige anyone to read it, and adoption by major providers is uneven. Second, it is a *discovery aid*, not a permission system: access control belongs in `robots.txt`, WAF rules or authentication. Treat it as low-cost hygiene, not as a visibility guarantee.\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"It is unrelated to the Robots Exclusion Protocol and confers no blocking power or legal force.\"},{\"optionIndex\":2,\"reason\":\"It is human-readable Markdown listing URLs, not a serialized embedding index.\"},{\"optionIndex\":3,\"reason\":\"XML sitemaps remain the sitemap mechanism, and no search engine requires `llms.txt` for indexing.\"}],\"takeaway\":\"llms.txt is a voluntary Markdown map for LLM consumers — a discovery convenience, never an access-control or ranking mechanism.\",\"tags\":[\"llms-txt\",\"geo\",\"crawlability\",\"standards\"],\"verified\":\"unverified\"},{\"id\":\"agt-18\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"robots.txt and AI crawlers\",\"difficulty\":\"medium\",\"question\":\"You add this to `robots.txt`:\\n\\n```\\nUser-agent: GPTBot\\nDisallow: /\\n```\\n\\nWhat is the accurate consequence?\",\"options\":[\"All AI systems are now legally prevented from using your content\",\"A crawler that honours robots.txt and identifies with that exact user-agent token stops fetching your pages — which also means that content can no longer be retrieved and cited in that system's answers. It does not remove content already collected, and non-compliant crawlers are unaffected.\",\"Your pages are deleted from that provider's model and disappear from answers already generated\",\"Other AI crawlers are blocked too, because `User-agent` rules cascade to similar bots\"],\"answerIndex\":1,\"explanation\":\"`robots.txt` is a **voluntary, per-user-agent crawl directive**. Rules match a specific product token, so blocking `GPTBot` says nothing about `ClaudeBot`, `PerplexityBot`, `CCBot` or anything else — each needs its own group (or a `User-agent: *` catch-all). Compliance is a convention that well-behaved crawlers follow; it is not enforcement.\\n\\nThe strategic point for brand visibility is the trade-off. Providers commonly separate *training* crawlers from *live retrieval* fetchers, so a blanket block can also cut you out of the retrieval path — no fetch means no passage, and no passage means no citation. It also has no retroactive effect on data already gathered. Decide per-agent, deliberately.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"robots.txt is a convention, not a legal instrument, and it binds only crawlers that choose to honour it.\"},{\"optionIndex\":2,\"reason\":\"Disallowing future crawls is not deletion — it neither removes previously collected data nor rewrites past outputs.\"},{\"optionIndex\":3,\"reason\":\"User-agent groups match specific tokens and never cascade; each crawler needs its own rule or a wildcard group.\"}],\"takeaway\":\"robots.txt blocks crawling per named user-agent only — and blocking retrieval crawlers also blocks your chance of being cited.\",\"tags\":[\"robots-txt\",\"ai-crawlers\",\"gptbot\",\"crawl-control\"],\"verified\":\"unverified\"},{\"id\":\"agt-19\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Citation and attribution\",\"difficulty\":\"medium\",\"question\":\"Two different pages state the same fact about a laptop's battery life. Which one is **more likely to be the passage an answer engine retrieves and cites**?\",\"options\":[\"The page that repeats the target keyword thirty times in the opening paragraph\",\"The longer page, because length signals depth\",\"The page behind a login, because gated content is treated as more authoritative\",\"The page whose paragraph is self-contained — it names the product explicitly, states the figure with its unit and test conditions, and sits under a descriptive heading — so the chunk still makes sense when retrieved in isolation\"],\"answerIndex\":3,\"explanation\":\"Retrieval operates on **chunks, not pages**. A chunk arrives at the model stripped of its surrounding narrative, so a passage full of \\\"it\\\", \\\"this model\\\" and \\\"as mentioned above\\\" becomes unusable once separated from its context, while a self-contained passage can be quoted and attributed directly.\\n\\nThat is why the practical GEO checklist is: explicit entity names instead of pronouns, one claim per paragraph, figures with units and conditions, descriptive headings that mirror real questions, and stable canonical URLs with visible publish/update dates. You are optimising for *extractability of a single passage*, not for keyword density across a document.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Keyword stuffing is a classic spam signal; embedding-based retrieval matches meaning, so repetition adds no semantic value.\"},{\"optionIndex\":1,\"reason\":\"Length alone is irrelevant — long pages often dilute the specific chunk that would have been retrieved.\"},{\"optionIndex\":2,\"reason\":\"Gated content usually cannot be crawled at all, which removes it from the retrieval corpus entirely.\"}],\"takeaway\":\"Write passages that survive being cut out of the page: name the entity, state the number with units, put it under a real question heading.\",\"tags\":[\"citation\",\"attribution\",\"content-structure\",\"geo\"],\"verified\":\"unverified\"},{\"id\":\"agt-20\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Chunking for retrieval\",\"difficulty\":\"hard\",\"question\":\"A 4,000-token document is split with a sliding window of **500 tokens per chunk and 100 tokens of overlap** between consecutive chunks. How many chunks are produced?\",\"options\":[\"8\",\"9\",\"10\",\"11\"],\"answerIndex\":2,\"explanation\":\"With overlap, each new chunk advances by the **stride**, not by the full chunk size:\\n\\n```\\nstride = chunk_size - overlap = 500 - 100 = 400\\n```\\n\\nThe first chunk covers tokens 0–500. The remaining 3,500 tokens are covered 400 at a time: `ceil(3500 / 400) = ceil(8.75) = 9` more chunks. Total = `1 + 9 = 10` (starts at offsets 0, 400, 800, …, 3600; the final chunk is short, covering 3600–4000).\\n\\nThe general formula is `1 + ceil((N − chunk) / stride)` for `N > chunk`. The practical lesson: overlap raises chunk count — and therefore index size, embedding cost and query latency — roughly by `chunk / stride`, here 1.25×. It buys protection against facts being sliced across a boundary, which is why structure-aware splitting (respecting headings, tables and list items) plus a small overlap beats naive fixed-size cutting.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"`4000 / 500 = 8` ignores the overlap entirely; with overlap each chunk only advances the window by 400 tokens.\"},{\"optionIndex\":1,\"reason\":\"This computes `ceil((4000 − 500)/400) = 9` but forgets to add the first chunk back in.\"},{\"optionIndex\":3,\"reason\":\"An extra chunk would start at offset 4000, past the end of the document — the chunk beginning at 3600 already covers the final token.\"}],\"takeaway\":\"Chunks = 1 + ceil((N − chunk_size) / (chunk_size − overlap)); overlap multiplies index size by chunk/stride.\",\"tags\":[\"chunking\",\"overlap\",\"retrieval\",\"indexing\"],\"verified\":\"unverified\"},{\"id\":\"agt-21\",\"topic\":\"ai-agents-brand\",\"subtopic\":\"Entities
