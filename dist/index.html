<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adobe University Hackathon 2026 — Prep Console</title>
</head>
<body>
<style>
/* ==========================================================================
   Adobe University Hackathon 2026 — Prep Console
   Design tokens. Palette is warm-neutral (red-biased) so the Adobe-derived
   accent sits on ground that looks chosen rather than inherited.
   Semantic colours (ok / warn / bad) are deliberately NOT the accent hue.
   ========================================================================== */

:root {
  color-scheme: light dark;

  /* Grounds — warm off-white, biased a few degrees toward the red accent */
  --ground:     #FBF7F4;
  --surface:    #FFFFFF;
  --surface-2:  #F4EDE8;
  --surface-3:  #EBE1DA;
  --line:       #E0D4CB;
  --line-soft:  #EFE6DF;

  /* Text */
  --text:       #1F1613;
  --text-dim:   #6B5A53;
  --text-faint: #98867D;

  /* Accent — Adobe red, desaturated just enough to live in a UI all day */
  --accent:      #D7261F;
  --accent-hot:  #B81C16;
  --accent-ink:  #FFFFFF;
  --accent-soft: #FBE7E4;
  --accent-line: #F2C4BF;

  /* Semantics */
  --ok:       #0E8C6A;
  --ok-soft:  #DFF3EC;
  --ok-line:  #A8DDCB;
  --warn:     #B26A00;
  --warn-soft:#FBEEDA;
  --warn-line:#EBD09B;
  --bad:      #C02626;
  --bad-soft: #FBE5E5;
  --bad-line: #EFC0C0;
  --info:     #5B4BC4;
  --info-soft:#EAE7FA;

  /* Topic ramp — 9 hues, held at similar chroma so no one topic shouts */
  --t1: #C1442E;  /* arrays & strings      */
  --t2: #B4761A;  /* sorting/search/hash   */
  --t3: #7C8A18;  /* trees & graphs        */
  --t4: #2E8B57;  /* dp / greedy           */
  --t5: #1C8797;  /* output prediction     */
  --t6: #3A6FC4;  /* oop & languages       */
  --t7: #6B54C6;  /* os / dbms / networks  */
  --t8: #A2439B;  /* aptitude & logic      */
  --t9: #B33A63;  /* ai agents & brand     */

  /* Form */
  --radius:    7px;
  --radius-sm: 4px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(43, 25, 18, .06), 0 1px 1px rgba(43, 25, 18, .04);
  --shadow:    0 2px 6px rgba(43, 25, 18, .07), 0 8px 24px -12px rgba(43, 25, 18, .18);
  --shadow-lg: 0 4px 12px rgba(43, 25, 18, .10), 0 24px 48px -20px rgba(43, 25, 18, .30);

  /* Type — system stacks only. The CSP blocks font CDNs, and a linked
     webfont that fails is worse than a system face that was chosen. */
  --font-ui: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system,
             "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui,
             -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
             Georgia, "Times New Roman", serif;
  --font-mono: "Cascadia Code", "Cascadia Mono", "JetBrains Mono", Consolas,
             "SF Mono", ui-monospace, "Liberation Mono", monospace;

  --rail-w: 244px;
  --bar-h: 52px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ground:     #17110F;
    --surface:    #1F1815;
    --surface-2:  #271F1B;
    --surface-3:  #332822;
    --line:       #3A2E28;
    --line-soft:  #2C231E;

    --text:       #F2E9E4;
    --text-dim:   #B09C93;
    --text-faint: #86736A;

    --accent:      #FF5347;
    --accent-hot:  #FF7A70;
    --accent-ink:  #24100D;
    --accent-soft: #38201C;
    --accent-line: #5A2C26;

    --ok:       #3DD9A4;
    --ok-soft:  #15302A;
    --ok-line:  #23554A;
    --warn:     #F0A93B;
    --warn-soft:#332512;
    --warn-line:#5C441C;
    --bad:      #FF6B6B;
    --bad-soft: #35191A;
    --bad-line: #5C2A2A;
    --info:     #A99BFF;
    --info-soft:#241F3D;

    --t1: #E8765C;
    --t2: #DEA245;
    --t3: #B4C247;
    --t4: #5FC98C;
    --t5: #4FBCCE;
    --t6: #7BA5EE;
    --t7: #A996F2;
    --t8: #D782CE;
    --t9: #E8789E;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .40);
    --shadow:    0 2px 8px rgba(0, 0, 0, .45), 0 12px 32px -16px rgba(0, 0, 0, .7);
    --shadow-lg: 0 6px 18px rgba(0, 0, 0, .5), 0 32px 64px -24px rgba(0, 0, 0, .8);
  }
}

/* The viewer's theme toggle stamps data-theme on :root and must win in
   BOTH directions, so each theme is restated at token level. */
:root[data-theme="dark"] {
  --ground: #17110F; --surface: #1F1815; --surface-2: #271F1B; --surface-3: #332822;
  --line: #3A2E28; --line-soft: #2C231E;
  --text: #F2E9E4; --text-dim: #B09C93; --text-faint: #86736A;
  --accent: #FF5347; --accent-hot: #FF7A70; --accent-ink: #24100D;
  --accent-soft: #38201C; --accent-line: #5A2C26;
  --ok: #3DD9A4; --ok-soft: #15302A; --ok-line: #23554A;
  --warn: #F0A93B; --warn-soft: #332512; --warn-line: #5C441C;
  --bad: #FF6B6B; --bad-soft: #35191A; --bad-line: #5C2A2A;
  --info: #A99BFF; --info-soft: #241F3D;
  --t1: #E8765C; --t2: #DEA245; --t3: #B4C247; --t4: #5FC98C; --t5: #4FBCCE;
  --t6: #7BA5EE; --t7: #A996F2; --t8: #D782CE; --t9: #E8789E;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.40);
  --shadow: 0 2px 8px rgba(0,0,0,.45), 0 12px 32px -16px rgba(0,0,0,.7);
  --shadow-lg: 0 6px 18px rgba(0,0,0,.5), 0 32px 64px -24px rgba(0,0,0,.8);
}

:root[data-theme="light"] {
  --ground: #FBF7F4; --surface: #FFFFFF; --surface-2: #F4EDE8; --surface-3: #EBE1DA;
  --line: #E0D4CB; --line-soft: #EFE6DF;
  --text: #1F1613; --text-dim: #6B5A53; --text-faint: #98867D;
  --accent: #D7261F; --accent-hot: #B81C16; --accent-ink: #FFFFFF;
  --accent-soft: #FBE7E4; --accent-line: #F2C4BF;
  --ok: #0E8C6A; --ok-soft: #DFF3EC; --ok-line: #A8DDCB;
  --warn: #B26A00; --warn-soft: #FBEEDA; --warn-line: #EBD09B;
  --bad: #C02626; --bad-soft: #FBE5E5; --bad-line: #EFC0C0;
  --info: #5B4BC4; --info-soft: #EAE7FA;
  --t1: #C1442E; --t2: #B4761A; --t3: #7C8A18; --t4: #2E8B57; --t5: #1C8797;
  --t6: #3A6FC4; --t7: #6B54C6; --t8: #A2439B; --t9: #B33A63;
  --shadow-sm: 0 1px 2px rgba(43,25,18,.06), 0 1px 1px rgba(43,25,18,.04);
  --shadow: 0 2px 6px rgba(43,25,18,.07), 0 8px 24px -12px rgba(43,25,18,.18);
  --shadow-lg: 0 4px 12px rgba(43,25,18,.10), 0 24px 48px -20px rgba(43,25,18,.30);
}

/* ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  text-wrap: balance;
  margin: 0;
  font-weight: 650;
  letter-spacing: -0.011em;
}
h1 { font-size: 1.75rem; line-height: 1.2; letter-spacing: -0.02em; }
h2 { font-size: 1.28rem; line-height: 1.25; }
h3 { font-size: 1.06rem; }
h4 { font-size: .95rem; }
p  { margin: 0; }

a { color: var(--accent); text-decoration-color: var(--accent-line); text-underline-offset: 2px; }
a:hover { color: var(--accent-hot); }

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

::selection { background: var(--accent-soft); color: var(--text); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

/* === Shell ================================================================ */

.shell { display: flex; min-height: 100vh; }

.rail {
  width: var(--rail-w);
  flex: 0 0 var(--rail-w);
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 40;
}

.rail-head {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--line-soft);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.rail-mark {
  display: flex; align-items: center; gap: 9px;
  font-family: var(--font-display);
  font-weight: 700; font-size: .98rem; letter-spacing: -0.015em;
}
.rail-mark .glyph {
  width: 24px; height: 24px; flex: none;
  border-radius: 5px;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid; place-items: center;
  font-weight: 800; font-size: .82rem;
  font-family: var(--font-display);
}
.rail-sub {
  font-size: .705rem;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--text-faint);
  font-weight: 600;
  padding-left: 33px;
}

.rail-nav { flex: 1; overflow-y: auto; padding: 10px 9px; display: flex; flex-direction: column; gap: 1px; }

.nav-group {
  font-size: .66rem; text-transform: uppercase; letter-spacing: .1em;
  color: var(--text-faint); font-weight: 700;
  padding: 14px 8px 5px;
}
.nav-group:first-child { padding-top: 4px; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 9px;
  border-radius: var(--radius-sm);
  background: none; border: 0; width: 100%;
  text-align: left; cursor: pointer;
  color: var(--text-dim);
  font-size: .875rem; font-weight: 500;
  transition: background .12s ease, color .12s ease;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item[aria-current="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 640;
}
.nav-item[aria-current="true"] .ico { opacity: 1; }
.nav-item .ico { width: 16px; height: 16px; flex: none; opacity: .72; }
.nav-item .count {
  margin-left: auto;
  font-size: .7rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-faint);
  background: var(--surface-2);
  padding: 1px 6px; border-radius: 20px;
  font-weight: 600;
}
.nav-item[aria-current="true"] .count { background: var(--surface); color: var(--accent); }

.rail-foot { border-top: 1px solid var(--line-soft); padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 9px; }

.countdown-mini { display: flex; flex-direction: column; gap: 2px; }
.countdown-mini .cd-label {
  font-size: .655rem; text-transform: uppercase; letter-spacing: .09em;
  color: var(--text-faint); font-weight: 700;
  display: flex; align-items: center; gap: 5px;
}
.countdown-mini .cd-value {
  font-family: var(--font-mono);
  font-size: 1.02rem; font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
  color: var(--text);
}
.countdown-mini.is-live .cd-value { color: var(--ok); }
.countdown-mini.is-soon .cd-value { color: var(--accent); }
.pulse-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

.rail-tools { display: flex; gap: 6px; align-items: center; }

/* === Main ================================================================= */

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  height: var(--bar-h);
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
}
.topbar .crumb {
  font-size: .74rem; text-transform: uppercase; letter-spacing: .085em;
  color: var(--text-faint); font-weight: 700;
}
.topbar .spacer { flex: 1; }

.view { padding: 26px 28px 80px; max-width: 1180px; width: 100%; }
.view.narrow { max-width: 860px; }

.page-head { display: flex; flex-direction: column; gap: 7px; margin-bottom: 22px; }
.page-head .eyebrow {
  font-size: .69rem; text-transform: uppercase; letter-spacing: .12em;
  font-weight: 700; color: var(--accent);
}
.page-head .lede { color: var(--text-dim); max-width: 68ch; font-size: .95rem; }

/* === Primitives =========================================================== */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.card-pad { padding: 18px 20px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-size: .855rem; font-weight: 600;
  cursor: pointer;
  transition: background .12s ease, border-color .12s ease, transform .06s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--text-faint); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
}
.btn-primary:hover { background: var(--accent-hot); border-color: var(--accent-hot); }
.btn-ghost { background: none; border-color: transparent; color: var(--text-dim); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { padding: 4px 9px; font-size: .78rem; }
.btn-lg { padding: 10px 20px; font-size: .93rem; }
.btn .ico { width: 15px; height: 15px; }

.icon-btn {
  width: 30px; height: 30px; display: grid; place-items: center;
  border-radius: var(--radius-sm); border: 1px solid transparent;
  background: none; cursor: pointer; color: var(--text-dim);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn .ico { width: 16px; height: 16px; }
.icon-btn.is-on { color: var(--warn); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: .715rem; font-weight: 650;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text-dim);
  white-space: nowrap;
}
.chip-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.easy   { color: var(--ok);   background: var(--ok-soft);   border-color: var(--ok-line); }
.chip.medium { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
.chip.hard   { color: var(--bad);  background: var(--bad-soft);  border-color: var(--bad-line); }
.chip.ok     { color: var(--ok);   background: var(--ok-soft);   border-color: var(--ok-line); }
.chip.accent { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }

.pill-row { display: flex; flex-wrap: wrap; gap: 6px; }

.seg {
  display: inline-flex; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 2px; gap: 2px;
}
.seg button {
  border: 0; background: none; cursor: pointer;
  padding: 4px 11px; border-radius: 3px;
  font-size: .8rem; font-weight: 600; color: var(--text-dim);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

select.field, input.field, textarea.field {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 6px 9px;
  font-size: .85rem;
  color: var(--text);
  min-width: 0;
}
textarea.field { line-height: 1.6; resize: vertical; }
input.field::placeholder, textarea.field::placeholder { color: var(--text-faint); }

.divider { height: 1px; background: var(--line); border: 0; margin: 22px 0; }

.empty {
  padding: 44px 20px; text-align: center; color: var(--text-dim);
  border: 1px dashed var(--line); border-radius: var(--radius);
  display: flex; flex-direction: column; gap: 10px; align-items: center;
}

/* === Stat tiles =========================================================== */

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 12px; }
.tile {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 13px 15px;
  display: flex; flex-direction: column; gap: 3px;
  position: relative; overflow: hidden;
}
.tile .t-label {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .09em;
  color: var(--text-faint); font-weight: 700;
}
.tile .t-value {
  font-family: var(--font-display);
  font-size: 1.72rem; font-weight: 680; line-height: 1.05;
  font-variant-numeric: tabular-nums; letter-spacing: -.025em;
}
.tile .t-note { font-size: .765rem; color: var(--text-dim); }
.tile .t-rail { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }

.meter { height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s ease; }
.meter.ok > i { background: var(--ok); }
.meter.warn > i { background: var(--warn); }

/* === Round timeline ======================================================= */

.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-row {
  display: grid; grid-template-columns: 58px 1fr; gap: 16px;
  padding: 15px 0;
  border-top: 1px solid var(--line-soft);
}
.tl-row:first-child { border-top: 0; }
.tl-when {
  font-family: var(--font-mono); font-size: .74rem; font-weight: 600;
  color: var(--text-faint); text-align: right; padding-top: 3px;
  font-variant-numeric: tabular-nums;
}
.tl-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tl-title { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.tl-title .num {
  width: 21px; height: 21px; border-radius: 5px; flex: none;
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: .7rem; font-weight: 700;
  background: var(--surface-3); color: var(--text-dim);
}
.tl-row.is-now .num { background: var(--accent); color: var(--accent-ink); }
.tl-row.is-done .num { background: var(--ok-soft); color: var(--ok); }
.tl-desc { color: var(--text-dim); font-size: .875rem; max-width: 74ch; }
.tl-quote {
  border-left: 2px solid var(--accent-line);
  padding: 2px 0 2px 11px;
  font-family: var(--font-serif);
  font-size: .9rem; line-height: 1.6;
  color: var(--text-dim);
}

/* === Question / practice ================================================== */

.q-wrap { display: grid; grid-template-columns: 1fr; gap: 14px; }

.q-card { position: relative; overflow: hidden; }
.q-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--t1); }

.q-meta {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding-bottom: 12px; margin-bottom: 14px;
  border-bottom: 1px solid var(--line-soft);
}
.q-meta .q-idx {
  font-family: var(--font-mono); font-size: .78rem; font-weight: 700;
  color: var(--text-faint); font-variant-numeric: tabular-nums;
}
.q-meta .spacer { flex: 1; }

.q-stem { font-size: 1.02rem; line-height: 1.62; }
.q-stem p + p { margin-top: .7em; }

.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.opt {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  text-align: left; width: 100%;
  transition: border-color .12s ease, background .12s ease;
  line-height: 1.5;
}
.opt:hover:not([disabled]) { border-color: var(--text-faint); background: var(--surface-2); }
.opt .key {
  flex: none; width: 21px; height: 21px; border-radius: var(--radius-sm);
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: .74rem; font-weight: 700;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text-dim);
  margin-top: 1px;
}
.opt .txt { flex: 1; min-width: 0; }
.opt[data-state="correct"] { border-color: var(--ok-line); background: var(--ok-soft); }
.opt[data-state="correct"] .key { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt[data-state="wrong"] { border-color: var(--bad-line); background: var(--bad-soft); }
.opt[data-state="wrong"] .key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt[data-state="picked"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[data-state="picked"] .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt[disabled] { cursor: default; }

.verdict {
  margin-top: 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  overflow: hidden;
}
.verdict-head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 13px;
  font-weight: 680; font-size: .885rem;
}
.verdict.right .verdict-head { background: var(--ok-soft); color: var(--ok); border-bottom: 1px solid var(--ok-line); }
.verdict.wrong .verdict-head { background: var(--bad-soft); color: var(--bad); border-bottom: 1px solid var(--bad-line); }
.verdict-body { padding: 13px; display: flex; flex-direction: column; gap: 13px; background: var(--surface); }

.why-list { display: flex; flex-direction: column; gap: 7px; }
.why-item { display: flex; gap: 9px; font-size: .855rem; color: var(--text-dim); line-height: 1.55; }
.why-item .k {
  flex: none; font-family: var(--font-mono); font-weight: 700; font-size: .74rem;
  color: var(--bad); background: var(--bad-soft); border-radius: 3px;
  padding: 0 5px; height: 18px; display: grid; place-items: center; margin-top: 2px;
}

.takeaway {
  display: flex; gap: 9px; align-items: flex-start;
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: .875rem;
  line-height: 1.55;
}
.takeaway .ico { width: 15px; height: 15px; flex: none; margin-top: 2px; color: var(--accent); }

.section-label {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .1em;
  font-weight: 700; color: var(--text-faint);
}

/* === Filter bar =========================================================== */

.filters {
  display: flex; flex-wrap: wrap; gap: 9px; align-items: center;
  padding: 11px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 16px;
}
.filters .grow { flex: 1; min-width: 120px; }

/* === Lists ================================================================ */

.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.list-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px;
  border-top: 1px solid var(--line-soft);
  cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0;
  text-align: left; width: 100%;
  transition: background .1s ease;
}
.list-row:first-child { border-top: 0; }
.list-row:hover { background: var(--surface-2); }
.list-row .lr-title { font-weight: 600; font-size: .9rem; }
.list-row .lr-sub { font-size: .765rem; color: var(--text-faint); }
.list-row .lr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.list-row .lr-num {
  font-family: var(--font-mono); font-size: .74rem; color: var(--text-faint);
  width: 26px; flex: none; font-variant-numeric: tabular-nums;
}
.list-row.is-done .lr-title { color: var(--text-dim); }
.solved-tick { color: var(--ok); width: 15px; height: 15px; flex: none; }

/* === Markdown surface ===================================================== */

.md { line-height: 1.65; }
.md > * + * { margin-top: .82em; }
.md h1, .md h2, .md h3, .md h4 { margin-top: 1.5em; }
.md h2 { font-size: 1.14rem; }
.md h3 { font-size: 1rem; }
.md h4 { font-size: .9rem; color: var(--text-dim); }
.md ul, .md ol { padding-left: 1.35em; margin-top: .55em; display: flex; flex-direction: column; gap: .3em; }
.md li::marker { color: var(--text-faint); }
.md blockquote {
  margin: 0; padding: 3px 0 3px 13px;
  border-left: 2px solid var(--accent-line);
  color: var(--text-dim); font-family: var(--font-serif); font-size: 1.02em;
}
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.4em 0; }
.md strong { font-weight: 680; color: var(--text); }
.md code {
  font-family: var(--font-mono); font-size: .855em;
  background: var(--surface-2); border: 1px solid var(--line-soft);
  padding: .08em .34em; border-radius: 3px;
  word-break: break-word;
}
.md table {
  border-collapse: collapse; width: 100%; font-size: .855rem;
  font-variant-numeric: tabular-nums;
}
.md thead th {
  text-align: left; font-weight: 700; font-size: .715rem;
  text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint);
  padding: 7px 11px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.md tbody td { padding: 7px 11px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.md tbody tr:last-child td { border-bottom: 0; }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }

/* Long-form reading surfaces get the serif */
.prose-serif { font-family: var(--font-serif); font-size: 1.03rem; line-height: 1.72; }
.prose-serif code { font-size: .8em; }

/* === Code blocks ========================================================== */

.code-wrap { position: relative; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-2); }
.code-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px 5px 11px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.code-bar .lang {
  font-family: var(--font-mono); font-size: .69rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint);
}
.code-bar .spacer { flex: 1; }
pre.code {
  margin: 0; padding: 12px 13px;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: .805rem;
  line-height: 1.62;
  tab-size: 2;
}
pre.code code { background: none; border: 0; padding: 0; font-size: inherit; }

.tk-kw  { color: var(--t7); font-weight: 600; }
.tk-typ { color: var(--t6); }
.tk-str { color: var(--t4); }
.tk-num { color: var(--t2); }
.tk-com { color: var(--text-faint); font-style: italic; }
.tk-fn  { color: var(--t9); }
.tk-op  { color: var(--text-dim); }

.lang-tabs { display: flex; gap: 2px; }
.lang-tabs button {
  border: 0; background: none; cursor: pointer;
  font-family: var(--font-mono); font-size: .72rem; font-weight: 700;
  padding: 3px 9px; border-radius: 3px; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: .05em;
}
.lang-tabs button[aria-pressed="true"] { background: var(--surface-2); color: var(--accent); }

/* === Disclosure =========================================================== */

.disclose { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); overflow: hidden; }
.disclose + .disclose { margin-top: 8px; }
.disclose-btn {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 10px 13px; background: none; border: 0; cursor: pointer;
  text-align: left; font-weight: 620; font-size: .875rem;
}
.disclose-btn:hover { background: var(--surface-2); }
.disclose-btn .caret { transition: transform .15s ease; width: 13px; height: 13px; color: var(--text-faint); }
.disclose[open] .disclose-btn .caret { transform: rotate(90deg); }
.disclose-body { padding: 0 13px 13px 35px; }
.disclose .hint-n {
  font-family: var(--font-mono); font-size: .7rem; font-weight: 700;
  background: var(--warn-soft); color: var(--warn); border-radius: 3px;
  padding: 1px 6px;
}

/* === Exam mode ============================================================ */

/* Exam lockdown: the rail AND the topbar go, so the app's own
   "Start Round 1 mock" button cannot sit above a running assessment. */
body.exam-mode .rail,
body.exam-mode .topbar { display: none; }

.exam-bar {
  position: sticky; top: 0; z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px;
  padding: 9px 18px;
}
.exam-bar .exam-title { font-weight: 700; font-size: .9rem; display: flex; align-items: center; gap: 9px; }
.exam-bar .spacer { flex: 1; }
.exam-clock {
  font-family: var(--font-mono); font-size: 1.28rem; font-weight: 700;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.exam-clock.warn { color: var(--warn); }
.exam-clock.danger { color: var(--bad); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .45; } }

.exam-drain { height: 3px; background: var(--surface-3); position: sticky; top: 51px; z-index: 49; }
.exam-drain > i { display: block; height: 100%; background: var(--accent); transition: width 1s linear; }
.exam-drain.warn > i { background: var(--warn); }
.exam-drain.danger > i { background: var(--bad); }

.palette { display: flex; flex-wrap: wrap; gap: 5px; }
.pal-btn {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--surface);
  font-family: var(--font-mono); font-size: .78rem; font-weight: 700;
  cursor: pointer; color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
.pal-btn[data-s="answered"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pal-btn[data-s="flagged"]  { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
.pal-btn[aria-current="true"] { outline: 2px solid var(--text); outline-offset: 1px; }

/* === Score report ========================================================= */

.score-hero {
  display: flex; align-items: center; gap: 26px; flex-wrap: wrap;
  padding: 24px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line);
}
.ring { position: relative; width: 128px; height: 128px; flex: none; }
.ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.ring .ring-bg { stroke: var(--surface-3); }
.ring .ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray .8s cubic-bezier(.2,.8,.2,1); }
.ring .ring-label {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
}
.ring .ring-num {
  font-family: var(--font-display); font-size: 2.05rem; font-weight: 700;
  font-variant-numeric: tabular-nums; letter-spacing: -.03em; line-height: 1;
}
.ring .ring-sub { font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); font-weight: 700; }

.bar-rows { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 175px 1fr 58px; gap: 11px; align-items: center; font-size: .82rem; }
.bar-row .bl { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .bv { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; font-family: var(--font-mono); font-size: .78rem; }
.bar-track { height: 7px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.bar-track > i { display: block; height: 100%; border-radius: 4px; transition: width .6s ease; }

/* === Flashcards =========================================================== */

.flash-stage { display: grid; place-items: center; min-height: 330px; }
.flash {
  width: min(620px, 100%); min-height: 240px;
  border: 1px solid var(--line); border-radius: var(--radius-lg);
  background: var(--surface); box-shadow: var(--shadow);
  padding: 30px; display: flex; flex-direction: column; justify-content: center; gap: 14px;
  cursor: pointer; position: relative;
}
.flash .face-label {
  position: absolute; top: 13px; left: 16px;
  font-size: .66rem; text-transform: uppercase; letter-spacing: .1em;
  color: var(--text-faint); font-weight: 700;
}
.flash .flash-q { font-size: 1.1rem; line-height: 1.55; font-weight: 600; }
.flash .flash-a { font-size: .96rem; line-height: 1.6; color: var(--text-dim); }
.flash-actions { display: flex; gap: 9px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }

/* === Case studio ========================================================== */

.case-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 18px; align-items: start; }
.answer-pad { position: sticky; top: 68px; display: flex; flex-direction: column; gap: 10px; }
.answer-pad textarea { min-height: 260px; font-family: var(--font-ui); font-size: .875rem; }
.word-count { font-size: .74rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }

.score-check { display: flex; flex-direction: column; gap: 7px; }
.score-check label {
  display: flex; gap: 9px; align-items: flex-start; font-size: .85rem;
  line-height: 1.5; cursor: pointer; color: var(--text-dim);
}
.score-check input { margin-top: 3px; accent-color: var(--accent); flex: none; }
.score-check label:has(input:checked) { color: var(--text); }

/* === Search =============================================================== */

.search-hit { display: flex; flex-direction: column; gap: 3px; padding: 11px 13px; }
.search-hit mark { background: var(--warn-soft); color: var(--text); padding: 0 2px; border-radius: 2px; }

/* === Toast ================================================================ */

.toast-stack { position: fixed; bottom: 18px; right: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--text); color: var(--ground);
  padding: 9px 15px; border-radius: var(--radius-sm);
  font-size: .855rem; font-weight: 600; box-shadow: var(--shadow-lg);
  animation: rise .25s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* === Modal ================================================================ */

.modal-back {
  position: fixed; inset: 0; background: rgba(20, 12, 9, .55);
  backdrop-filter: blur(3px); z-index: 150;
  display: grid; place-items: center; padding: 20px;
}
.modal {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  width: min(560px, 100%); max-height: 86vh; overflow-y: auto;
  padding: 22px;
  display: flex; flex-direction: column; gap: 14px;
}

/* === Responsive =========================================================== */

@media (max-width: 1080px) {
  .case-grid { grid-template-columns: 1fr; }
  .answer-pad { position: static; }
}

@media (max-width: 860px) {
  :root { --rail-w: 100%; }
  .shell { flex-direction: column; }
  .rail {
    position: static; height: auto; width: 100%; flex: none;
    border-right: 0; border-bottom: 1px solid var(--line);
  }
  .rail-nav { flex-direction: row; overflow-x: auto; padding: 8px; gap: 4px; }
  .nav-group { display: none; }
  .nav-item { width: auto; white-space: nowrap; }
  .nav-item .count { display: none; }
  .rail-foot { flex-direction: row; align-items: center; justify-content: space-between; }
  .view { padding: 18px 15px 60px; }
  .bar-row { grid-template-columns: 110px 1fr 48px; }
  .score-hero { gap: 18px; }
}

@media (max-width: 560px) {
  .tiles { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  h1 { font-size: 1.42rem; }
  .tl-row { grid-template-columns: 46px 1fr; gap: 11px; }
}

@media print {
  .rail, .topbar, .filters, .toast-stack { display: none; }
  .view { max-width: none; padding: 0; }
}


/* ==========================================================================
   SmartHire-style assessment shell.
   Deliberately plainer than the rest of the app: the real platform is a
   utilitarian exam window, and practising in a prettier one builds the
   wrong reflexes.
   ========================================================================== */

.sh-shell { min-height: 100vh; display: flex; flex-direction: column; background: var(--ground); }

.sh-top {
  display: flex; align-items: center; gap: 14px;
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 60;
}
.sh-brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: .9rem; }
.sh-brand .glyph {
  width: 24px; height: 24px; border-radius: 5px; background: var(--accent);
  color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-size: .8rem;
}
.sh-top .spacer { flex: 1; }

.sh-clock-box {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--surface-2);
}
.sh-clock-box .lbl {
  font-size: .64rem; text-transform: uppercase; letter-spacing: .09em;
  font-weight: 700; color: var(--text-faint);
}
.sh-clock {
  font-family: var(--font-mono); font-size: 1.15rem; font-weight: 700;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.sh-clock.warn { color: var(--warn); }
.sh-clock.danger { color: var(--bad); animation: blink 1s steps(2) infinite; }

.sh-sections {
  display: flex; gap: 2px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.sh-section-tab {
  padding: 8px 16px; border: 0; background: none; cursor: default;
  font-size: .83rem; font-weight: 650; color: var(--text-faint);
  border-bottom: 2px solid transparent;
}
.sh-section-tab[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.sh-section-tab[data-done="true"] { color: var(--ok); }

.sh-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 292px; gap: 0; align-items: start; }

.sh-main { padding: 20px 24px 120px; min-width: 0; }

.sh-qhead {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-bottom: 11px; margin-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.sh-qno { font-weight: 700; font-size: 1rem; }
.sh-marks {
  font-size: .74rem; color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

.sh-opts { display: flex; flex-direction: column; gap: 9px; margin-top: 18px; max-width: 780px; }
.sh-opt {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; text-align: left; width: 100%;
  line-height: 1.5;
}
.sh-opt:hover { background: var(--surface-2); }
.sh-opt .radio {
  width: 17px; height: 17px; border-radius: 50%; flex: none; margin-top: 2px;
  border: 2px solid var(--text-faint); display: grid; place-items: center;
}
.sh-opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.sh-opt[aria-checked="true"] .radio { border-color: var(--accent); }
.sh-opt[aria-checked="true"] .radio::after {
  content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
}

.sh-footer {
  position: fixed; bottom: 0; left: 0; right: 292px;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 11px 24px; display: flex; gap: 9px; align-items: center; flex-wrap: wrap;
  z-index: 55;
}
.sh-footer .spacer { flex: 1; }

/* ---- Palette ------------------------------------------------------------ */

.sh-side {
  position: sticky; top: 92px;
  border-left: 1px solid var(--line);
  background: var(--surface);
  padding: 16px 14px;
  height: calc(100vh - 92px);
  overflow-y: auto;
}
.sh-legend { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
.sh-legend-row { display: flex; align-items: center; gap: 9px; font-size: .745rem; color: var(--text-dim); }
.sh-swatch {
  width: 22px; height: 22px; flex: none; display: grid; place-items: center;
  font-size: .68rem; font-weight: 700; font-family: var(--font-mono);
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text-dim);
}
.sh-swatch.answered  { background: var(--ok); border-color: var(--ok); color: #fff; border-radius: 4px; }
.sh-swatch.notans    { background: var(--bad); border-color: var(--bad); color: #fff; border-radius: 4px; }
.sh-swatch.marked    { background: var(--info); border-color: var(--info); color: #fff; border-radius: 50%; }
.sh-swatch.ansmarked { background: var(--info); border-color: var(--info); color: #fff; border-radius: 50%; position: relative; }
.sh-swatch.ansmarked::after {
  content: ''; position: absolute; right: -2px; bottom: -2px;
  width: 9px; height: 9px; border-radius: 50%; background: var(--ok); border: 1.5px solid var(--surface);
}
.sh-swatch.notvisited { background: var(--surface-2); border-radius: 4px; }

.sh-pal-title {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .09em;
  font-weight: 700; color: var(--text-faint); margin-bottom: 9px;
}
.sh-pal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.sh-pal button {
  aspect-ratio: 1; border: 1px solid var(--line); background: var(--surface-2);
  font-family: var(--font-mono); font-size: .78rem; font-weight: 700;
  cursor: pointer; color: var(--text-dim); border-radius: 4px;
  font-variant-numeric: tabular-nums;
}
.sh-pal button[data-s="answered"]  { background: var(--ok); border-color: var(--ok); color: #fff; }
.sh-pal button[data-s="notans"]    { background: var(--bad); border-color: var(--bad); color: #fff; }
.sh-pal button[data-s="marked"]    { background: var(--info); border-color: var(--info); color: #fff; border-radius: 50%; }
.sh-pal button[data-s="ansmarked"] { background: var(--info); border-color: var(--info); color: #fff; border-radius: 50%; box-shadow: inset -6px -6px 0 -3px var(--ok); }
.sh-pal button[aria-current="true"] { outline: 2px solid var(--text); outline-offset: 2px; }

/* ---- Progress strip -----------------------------------------------------
   Read-only by design. The guidelines forbid navigating between questions, so
   this must never look clickable. */

.sh-strip { display: flex; gap: 4px; margin: 14px 0 4px; flex-wrap: wrap; }
.sh-strip-cell {
  width: 26px; height: 5px; border-radius: 3px;
  background: var(--surface-3);
}
.sh-strip-cell[data-s="locked"]  { background: var(--ok); }
.sh-strip-cell[data-s="skipped"] { background: var(--bad); }
.sh-strip-cell[data-s="current"] { background: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

/* ---- Instructions ------------------------------------------------------- */

.sh-instructions { max-width: 860px; margin: 0 auto; padding: 28px 24px 80px; }
.sh-inst-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
.sh-inst-card h1 { margin-bottom: 6px; }
.sh-agree {
  display: flex; gap: 11px; align-items: flex-start; margin-top: 20px;
  padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-2); cursor: pointer; font-size: .89rem; line-height: 1.5;
}
.sh-agree input { margin-top: 3px; accent-color: var(--accent); flex: none; width: 16px; height: 16px; }

/* ---- Proctoring --------------------------------------------------------- */

.sh-proctor {
  display: flex; align-items: center; gap: 7px;
  font-size: .72rem; font-weight: 650;
  padding: 3px 9px; border-radius: 20px;
  background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line);
}
.sh-proctor.alert { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-line); }
.sh-proctor .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.sh-violation-modal .modal { border-color: var(--bad-line); }
.sh-violation-modal h2 { color: var(--bad); }

.sh-viol-log { font-family: var(--font-mono); font-size: .76rem; }

/* ---- Coding section ----------------------------------------------------- */

.sh-code-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; min-height: 0; }
.sh-code-left { padding: 20px 22px 120px; border-right: 1px solid var(--line); overflow-y: auto; }
.sh-code-right { padding: 20px 22px 120px; display: flex; flex-direction: column; gap: 12px; }

.sh-editor-bar { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
.sh-editor {
  width: 100%; min-height: 340px; resize: vertical;
  font-family: var(--font-mono); font-size: .81rem; line-height: 1.6;
  tab-size: 4;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px; white-space: pre; overflow-wrap: normal; overflow-x: auto;
}
.sh-testcase {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-2); padding: 10px 12px;
  font-family: var(--font-mono); font-size: .78rem; line-height: 1.55;
}
.sh-testcase .tc-label {
  font-family: var(--font-ui); font-size: .66rem; text-transform: uppercase;
  letter-spacing: .09em; font-weight: 700; color: var(--text-faint); margin-bottom: 4px;
}
.sh-note {
  font-size: .78rem; color: var(--text-dim); line-height: 1.5;
  border-left: 2px solid var(--warn); padding-left: 10px;
}

/* ---- Report ------------------------------------------------------------- */

.sh-report { max-width: 940px; margin: 0 auto; padding: 26px 24px 80px; }

@media (max-width: 1000px) {
  .sh-body { grid-template-columns: 1fr; }
  .sh-side {
    position: static; height: auto; border-left: 0; border-top: 1px solid var(--line);
  }
  .sh-footer { right: 0; }
  .sh-code-grid { grid-template-columns: 1fr; }
  .sh-code-left { border-right: 0; border-bottom: 1px solid var(--line); }
}

 along with detailed instructions, will be shared with the shortlisted teams before the round begins.\"},{\"n\":4,\"title\":\"Prototype Showcase\",\"shortDate\":\"21 Sep\",\"window\":\"21 Sep 26, 04:00 PM IST → 27 Sep 26, 11:59 PM IST · team leader submits\",\"startISO\":\"2026-09-21T16:00:00+05:30\",\"endISO\":\"2026-09-27T23:59:00+05:30\",\"quote\":\"In this round, shortlisted teams will build a working prototype of their solution idea. Building on the previous round, teams must create an interface that allows users to explore, interact with, and gain meaningful insights from their solution. The prototype should highlight core user experience elements such as ease of navigation, smooth interactions, and the overall value it delivers to the user.\"},{\"n\":5,\"title\":\"Grand Finale — Adobe HQ, Noida\",\"shortDate\":\"TBA\",\"window\":\"Date to be announced · travel and accommodation covered by Adobe\",\"startISO\":\"2026-10-15T10:00:00+05:30\",\"endISO\":\"2026-10-15T18:00:00+05:30\",\"quote\":\"The top-qualifying teams will get the exclusive opportunity to present their solutions to Adobe's leadership at the company's headquarters in Noida. Adobe will take care of all travel and accommodation arrangements for the finalists.\"}],\"rulesBrief\":\"**Read the official Assessment Guidelines before anything else — Round 1 is not a normal exam.** Three rules decide your score:\\n\\n**1. You cannot go back.** *\\\"You won't be able to browse through the questions. If you either skip your question or submit your answer, it is marked and stored, and cannot be altered.\\\"* There is no palette, no review, no changing your mind.\\n\\n**2. You must submit every answer individually.** *\\\"Otherwise your response will NOT be recorded.\\\"* Selecting an option is not submitting it.\\n\\n**3. Speed is marked separately from accuracy.** The official worked example: a 4-mark question with a 120-second timer, answered correctly in 30 seconds, scores **2 for accuracy and 1.5 for speed = 3.5**, because 75% of the time remained. Every second you sit on a question you have already solved costs marks.\\n\\n**The numbers.** 17 questions, 01:00:00 total, **00:01:00 per question**, auto-advance when a question's time runs out. Window is 09 Aug 02:00 PM → 10 Aug 02:00 PM IST, but you must **start by 10 Aug 02:00 PM** to get the full hour. Once started, the timer does not stop.\\n\\n**Sections.** Switchable from a section tab above the questions. Once a section's time is over you cannot answer any more of its questions.\\n\\n**Your team score is the average of every member's score**, so the weakest member is where the cheapest marks are.\\n\\n**Proctoring is strict.** SmartHire app only, desktop or laptop only, fullscreen mandatory, webcam and mic required with constant audio monitoring, no external displays, no screen sharing, and no WhatsApp / Discord / Chrome / ChatGPT open — that causes an automatic exit. Do not rest your hand on your face; it can trigger a \\\"mobile phone detected\\\" violation.\\n\\n> Quotes and timings are taken from the official Unstop listing and its Assessment Guidelines, read on 09 Aug 2026. Re-check on the day — organisers do change them.\"},\"mcq\":[{\"id\":\"arr-01\",\"topic\":\"arrays-strings\",\"subtopic\":\"Nested loop counting\",\"difficulty\":\"easy\",\"question\":\"How many times does the innermost statement execute?\\n\\n```c\\nfor (int i = 0; i < n; i++)\\n    for (int j = i; j < n; j++)\\n        sum += a[i] * a[j];\\n```\",\"options\":[\"n(n-1)/2\",\"n(n+1)/2\",\"n²\",\"n·log n\"],\"answerIndex\":1,\"explanation\":\"For a fixed `i`, `j` runs over `i, i+1, ..., n-1`, which is `n - i` values.\\n\\nTotal = `Σ(i=0..n-1) (n - i) = n + (n-1) + ... + 1 = n(n+1)/2`.\\n\\nThe key detail is that `j` **starts at `i`, not at `i+1`**, so the diagonal pair `(i, i)` is included. That single inclusion is exactly the difference between `n(n-1)/2` and `n(n+1)/2`. Asymptotically it is Θ(n²), but the exact count is asked here.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"n(n-1)/2 is the count when the inner loop starts at `j = i + 1` (strictly upper triangle, diagonal excluded). Here `j = i` is included.\"},{\"optionIndex\":2,\"reason\":\"n² would require the inner loop to run from 0 to n-1 for every `i`. It only runs over the tail of the array, so roughly half of n².\"},{\"optionIndex\":3,\"reason\":\"n·log n arises when a loop variable multiplies/divides by a constant. Both loops here step by +1, so no logarithm appears.\"}],\"takeaway\":\"Triangular nested loops run n(n+1)/2 times when the inner index starts at i, and n(n-1)/2 when it starts at i+1 — both Θ(n²).\",\"tags\":[\"loops\",\"counting\",\"big-o\",\"triangular-sum\"],\"verified\":\"ok\"},{\"id\":\"arr-02\",\"topic\":\"arrays-strings\",\"subtopic\":\"String slicing and indexing\",\"difficulty\":\"easy\",\"question\":\"What does this Python snippet print?\\n\\n```python\\ns = \\\"hackathon\\\"\\nprint(s[::-1][:4])\\n```\",\"options\":[\"noht\",\"hack\",\"htno\",\"nohta\"],\"answerIndex\":0,\"explanation\":\"Evaluate left to right.\\n\\n1. `s[::-1]` reverses the string: `\\\"hackathon\\\"` → `\\\"nohtakcah\\\"`.\\n2. `[:4]` takes the first 4 characters of that reversed string: `\\\"noht\\\"`.\\n\\nA slice `[start:stop:step]` with a negative step walks backwards; `[:4]` is `[0:4]`, i.e. indices 0,1,2,3 — the stop index is exclusive. Note both operations build new strings, so this is O(n) time and O(n) extra space.\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"`\\\"hack\\\"` is `s[:4]` — the first four characters of the original string. It ignores the reversal step entirely.\"},{\"optionIndex\":2,\"reason\":\"`\\\"htno\\\"` is a scrambled guess; reversing preserves adjacency, and the last four letters `h,t,o,n` reversed are `n,o,h,t` in that order.\"},{\"optionIndex\":3,\"reason\":\"`\\\"nohta\\\"` has 5 characters. `[:4]` stops before index 4, yielding exactly 4.\"}],\"takeaway\":\"`s[::-1]` reverses; `[:k]` keeps indices 0..k-1 (stop is exclusive) — and both create copies, so O(n) space.\",\"tags\":[\"strings\",\"slicing\",\"python\"],\"verified\":\"ok\"},{\"id\":\"arr-03\",\"topic\":\"arrays-strings\",\"subtopic\":\"Two pointers on a sorted array\",\"difficulty\":\"medium\",\"question\":\"The classic two-pointer pair-sum search runs on the sorted array `[1, 3, 4, 6, 8, 10]` with `target = 12`:\\n\\n```python\\nl, r = 0, len(a) - 1\\nwhile l < r:\\n    s = a[l] + a[r]\\n    if s == target: return (a[l], a[r])\\n    elif s < target: l += 1\\n    else: r -= 1\\n```\\n\\nHow many times does the loop body execute (counting the iteration in which it returns)?\",\"options\":[\"3\",\"4\",\"5\",\"6\"],\"answerIndex\":1,\"explanation\":\"Trace the pointers:\\n\\n| iter | l → a[l] | r → a[r] | sum | action |\\n|---|---|---|---|---|\\n| 1 | 0 → 1 | 5 → 10 | 11 | 11 < 12 → `l++` |\\n| 2 | 1 → 3 | 5 → 10 | 13 | 13 > 12 → `r--` |\\n| 3 | 1 → 3 | 4 → 8 | 11 | 11 < 12 → `l++` |\\n| 4 | 2 → 4 | 4 → 8 | 12 | match → return |\\n\\nSo 4 iterations. Each iteration moves exactly one pointer by one step, so the loop can never exceed n-1 iterations — that is why the whole scan is O(n) rather than the O(n²) of a double loop.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"3 counts only the iterations that moved a pointer and forgets the final iteration where the pair (4, 8) is found and returned.\"},{\"optionIndex\":2,\"reason\":\"5 would require an extra pointer move; after `l` reaches index 2 the sum is exactly 12 and the loop exits immediately.\"},{\"optionIndex\":3,\"reason\":\"6 (= n) assumes the loop always scans the whole array. The pointers converge and stop as soon as a match is found.\"}],\"takeaway\":\"Each two-pointer iteration moves one pointer one step toward the other, so the total iteration count is bounded by n — an O(n) scan.\",\"tags\":[\"two-pointers\",\"sorted-array\",\"tracing\"],\"verified\":\"ok\"},{\"id\":\"arr-04\",\"topic\":\"arrays-strings\",\"subtopic\":\"String immutability and complexity\",\"difficulty\":\"easy\",\"question\":\"In Java, what is the time complexity of building a result this way, where `src` has length n?\\n\\n```java\\nString out = \\\"\\\";\\nfor (int i = 0; i < n; i++) {\\n    out += src.charAt(i);   // note: += on String\\n}\\n```\",\"options\":[\"Θ(n)\",\"Θ(n log n)\",\"Θ(n²)\",\"Θ(2ⁿ)\"],\"answerIndex\":2,\"explanation\":\"Java `String` is **immutable**. Each `out += c` allocates a brand-new string and copies every character already in `out`.\\n\\nAt step i, `out` has length i, so that step costs Θ(i). Total cost:\\n\\n`Σ(i=0..n-1) i = n(n-1)/2 = Θ(n²)`\\n\\nThe fix is a mutable buffer — `StringBuilder` in Java, `''.join(list)` in Python, `strings.Builder` in Go — which amortises each append to Θ(1) and makes the loop Θ(n). This is one of the most common hidden-quadratic bugs in interview code.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Θ(n) is what you get with `StringBuilder.append`, which mutates one buffer. With immutable `String` every `+=` re-copies the accumulated prefix.\"},{\"optionIndex\":1,\"reason\":\"Θ(n log n) would need a halving/doubling structure. Nothing here divides the work; the copy cost grows linearly each step.\"},{\"optionIndex\":3,\"reason\":\"Θ(2ⁿ) is exponential — it needs branching recursion. A single linear loop can never be exponential.\"}],\"takeaway\":\"Repeated concatenation onto an immutable string in a loop is Θ(n²); use a StringBuilder / list-and-join to get Θ(n).\",\"tags\":[\"strings\",\"immutability\",\"big-o\",\"java\"],\"verified\":\"ok\"},{\"id\":\"arr-05\",\"topic\":\"arrays-strings\",\"subtopic\":\"Sliding window (longest substring without repeats)\",\"difficulty\":\"hard\",\"question\":\"This is the standard \\\"longest substring without repeating characters\\\" sliding window, with one line altered:\\n\\n```java\\nMap<Character,Integer> last = new HashMap<>();\\nint left = 0, best = 0;\\nfor (int right = 0; right < s.length(); right++) {\\n    char c = s.charAt(right);\\n    if (last.containsKey(c)) left = last.get(c) + 1;   // <-- altered line\\n    last.put(c, right);\\n    best = Math.max(best, right - left + 1);\\n}\\nreturn best;\\n```\\n\\nWhat happens on the input `\\\"abba\\\"`?\",\"options\":[\"It returns 3, but the correct answer is 2 — `left` can jump *backwards*, so the line must be `left = Math.max(left, last.get(c) + 1);`\",\"It returns 2, which is correct\",\"It returns 4, because the map never removes stale entries so the window is never shrunk at all\",\"It returns 1, because every repeated character resets the window down to a single character\"],\"answerIndex\":0,\"explanation\":\"Trace `\\\"abba\\\"`:\\n\\n- `right=0` (`a`): `left=0`, `best=1`, map `{a:0}`\\n- `right=1` (`b`): `best=2`, map `{a:0, b:1}`\\n- `right=2` (`b`): `b` seen at 1 → `left = 2`; `best` stays 2; map `{a:0, b:2}`\\n- `right=3` (`a`): `a` is *still* in the map from index 0 → `left = 0 + 1 = 1`. **`left` moved backwards from 2 to 1.** Window is now `\\\"bba\\\"`, length 3 → `best = 3`.\\n\\nThe stale map entry for `a` refers to a position already outside the window. Guarding with `left = Math.max(left, last.get(c) + 1)` keeps the left edge monotonically non-decreasing, giving the correct answer 2 (`\\\"ab\\\"` or `\\\"ba\\\"`).\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"2 is the correct answer for `\\\"abba\\\"`, but this buggy code does not produce it — the stale index for `a` drags `left` back to 1 and reports 3.\"},{\"optionIndex\":2,\"reason\":\"The window *is* shrunk (at `right=2`, `left` jumps to 2). The bug is that it is later wrongly *expanded*, not that it never shrinks. 4 is never reported.\"},{\"optionIndex\":3,\"reason\":\"`left` is set to `lastIndex + 1`, not to `right`, so the window is not reset to a single character; `best` also never decreases once set.\"}],\"takeaway\":\"In a jump-style sliding window, the left pointer must be monotone: always use `left = max(left, lastSeen[c] + 1)`.\",\"tags\":[\"sliding-window\",\"hashmap\",\"strings\",\"off-by-one\"],\"verified\":\"ok\"},{\"id\":\"arr-06\",\"topic\":\"arrays-strings\",\"subtopic\":\"Prefix sums\",\"difficulty\":\"easy\",\"question\":\"You are given a **static** integer array of size n and must answer Q queries of the form \\\"sum of `a[l..r]`\\\". What does the prefix-sum technique give you?\",\"options\":[\"Θ(nQ) total time and Θ(1) extra space\",\"Θ(n log n) preprocessing and Θ(log n) per query\",\"Θ(1) preprocessing and Θ(n) per query\",\"Θ(n) preprocessing and Θ(1) per query, so Θ(n + Q) overall\"],\"answerIndex\":3,\"explanation\":\"Build `P[0] = 0` and `P[i+1] = P[i] + a[i]` in a single pass: Θ(n) time, Θ(n) extra space.\\n\\nThen any range sum is one subtraction:\\n\\n`sum(l..r) = P[r+1] - P[l]`  → Θ(1) per query.\\n\\nTotal Θ(n + Q), versus Θ(nQ) for the naive re-scan. This is the standard trade: a linear precomputation buys constant-time queries. (If the array were *mutable*, you would need a Fenwick/segment tree instead — that is the Θ(log n)-per-query world.)\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Θ(nQ) is the naive approach — re-summing the range for every query. Prefix sums exist precisely to eliminate that factor.\"},{\"optionIndex\":1,\"reason\":\"Θ(log n) per query describes a Fenwick tree or segment tree, which you need only when the array supports updates. A static array does better.\"},{\"optionIndex\":2,\"reason\":\"This is the no-preprocessing baseline. Prefix sums deliberately spend Θ(n) up front to make queries constant.\"}],\"takeaway\":\"Prefix sums: Θ(n) build, Θ(1) range-sum query — the right tool whenever the array is static.\",\"tags\":[\"prefix-sums\",\"range-query\",\"big-o\"],\"verified\":\"ok\"},{\"id\":\"arr-07\",\"topic\":\"arrays-strings\",\"subtopic\":\"Amortised analysis of dynamic arrays\",\"difficulty\":\"medium\",\"question\":\"A dynamic array starts with capacity 1 and **doubles** its capacity whenever it becomes full (copying all existing elements to the new buffer). Starting from empty, you perform n = 2ᵏ `push_back` operations. How many element **copies** occur in total across all resizes?\",\"options\":[\"about n/2\",\"about n·log n\",\"n − 1\",\"about n²/2\"],\"answerIndex\":2,\"explanation\":\"Resizes happen when the size hits 1, 2, 4, 8, …, n/2, and each resize copies exactly that many elements.\\n\\nTotal copies = `1 + 2 + 4 + ... + n/2 = n − 1` (geometric series: the sum of all powers of two below n is n − 1).\\n\\nSo n insertions cost fewer than n copies in total — under one copy per insertion on average. That is the amortised Θ(1) `push_back`: individual operations can cost Θ(n), but the expensive ones are rare enough (geometrically spaced) that the *average* over any sequence is constant.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"n/2 is only the cost of the single *last* resize. All the earlier resizes together add another n/2 − 1 copies.\"},{\"optionIndex\":1,\"reason\":\"n·log n counts log n resizes but wrongly assigns cost n to each. Early resizes copy tiny buffers; the sizes form a geometric series, not a flat one.\"},{\"optionIndex\":3,\"reason\":\"n²/2 is the cost of growing by a *fixed* increment (copy on every insert or every constant number of inserts). Doubling avoids exactly this.\"}],\"takeaway\":\"Doubling makes total copy work 1+2+…+n/2 = n−1, i.e. Θ(n) for n appends — amortised Θ(1) per append.\",\"tags\":[\"amortised-analysis\",\"dynamic-array\",\"geometric-series\"],\"verified\":\"ok\"},{\"id\":\"arr-08\",\"topic\":\"arrays-strings\",\"subtopic\":\"Amortised analysis — growth factor\",\"difficulty\":\"hard\",\"question\":\"Suppose a dynamic array is changed so that it grows by a **fixed 100 extra slots** each time it fills, instead of doubling. What are the total cost of n appends and the amortised cost per append?\",\"options\":[\"Θ(n) total, Θ(1) amortised — the constant 100 does not change the asymptotics\",\"Θ(n log n) total, Θ(log n) amortised\",\"Θ(n²) total, but each append is still Θ(1) amortised because resizes are rare\",\"Θ(n²) total, Θ(n) amortised\"],\"answerIndex\":3,\"explanation\":\"With a fixed increment c = 100, resizes occur at sizes 100, 200, 300, …, n, and each copies the current contents:\\n\\n`100 + 200 + ... + n ≈ (n/100)·(n/2) = n²/200 = Θ(n²)`\\n\\nThat is an **arithmetic** series, not a geometric one — it does not collapse to Θ(n). Dividing by n appends gives Θ(n) amortised per append.\\n\\nThe lesson: amortised Θ(1) append depends on *multiplicative* growth (capacity × k for some k > 1), which spaces resizes geometrically. Any additive growth rule, no matter how large the constant, degrades to quadratic total work.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"The constant does change the asymptotics because it changes the *series type*: 100+200+…+n is arithmetic (Θ(n²)), while 1+2+4+…+n is geometric (Θ(n)).\"},{\"optionIndex\":1,\"reason\":\"Θ(n log n) has no source here. There are n/100 = Θ(n) resizes, not Θ(log n) of them, and no halving structure anywhere.\"},{\"optionIndex\":2,\"reason\":\"Self-contradictory: amortised cost is by definition total cost divided by the number of operations, so Θ(n²)/n = Θ(n), not Θ(1). Resizes are also not rare — there are Θ(n) of them.\"}],\"takeaway\":\"Amortised O(1) append requires geometric (multiplicative) growth; growing by a fixed constant makes n appends Θ(n²).\",\"tags\":[\"amortised-analysis\",\"dynamic-array\",\"growth-factor\",\"big-o\"],\"verified\":\"ok\"},{\"id\":\"arr-09\",\"topic\":\"arrays-strings\",\"subtopic\":\"Master theorem\",\"difficulty\":\"hard\",\"question\":\"Solve the recurrence `T(n) = 2T(n/2) + n log n` (with T(1) = Θ(1)).\",\"options\":[\"Θ(n log n)\",\"Θ(n²)\",\"Θ(n log² n)\",\"Θ(n² log n)\"],\"answerIndex\":2,\"explanation\":\"Here a = 2, b = 2, so the watershed is `n^(log_b a) = n^(log₂2) = n`.\\n\\nThe driving function is `f(n) = n log n = n^1 · log^1 n` — the *same* polynomial degree as the watershed, times one extra log factor. This is the extended Case 2 of the Master theorem: if `f(n) = Θ(n^(log_b a) · log^k n)` with k ≥ 0, then `T(n) = Θ(n^(log_b a) · log^(k+1) n)`.\\n\\nWith k = 1: `T(n) = Θ(n · log² n)`.\\n\\nRecursion-tree check: there are log n levels, and each level does Θ(n log n) work at the top, decaying only by the log — summing gives n·log²n.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Θ(n log n) is the answer for `T(n) = 2T(n/2) + n` (merge sort). The extra log factor in f(n) pushes the result up by one more log.\"},{\"optionIndex\":1,\"reason\":\"Θ(n²) would require Case 3 with a polynomially larger f(n), e.g. f(n) = n². A log factor is not a polynomial gap.\"},{\"optionIndex\":3,\"reason\":\"Θ(n² log n) overshoots badly — the recursion never produces an n² term since a = b = 2 keeps the leaf work at Θ(n).\"}],\"takeaway\":\"For a = b^d, each extra log^k n in f(n) becomes log^(k+1) n in the answer: 2T(n/2)+n log n = Θ(n log² n).\",\"tags\":[\"master-theorem\",\"recurrence\",\"divide-and-conquer\",\"big-o\"],\"verified\":\"ok\"},{\"id\":\"arr-10\",\"topic\":\"arrays-strings\",\"subtopic\":\"Master theorem\",\"difficulty\":\"medium\",\"question\":\"Solve the recurrence `T(n) = 4T(n/2) + n`.\",\"options\":[\"Θ(n²)\",\"Θ(n log n)\",\"Θ(n² log n)\",\"Θ(n³)\"],\"answerIndex\":0,\"explanation\":\"a = 4, b = 2 → watershed `n^(log₂4) = n²`.\\n\\nCompare `f(n) = n` with n²: f is polynomially **smaller** (n = O(n^(2-ε)) for ε = 1). That is Master theorem **Case 1**, where the leaves dominate:\\n\\n`T(n) = Θ(n^(log_b a)) = Θ(n²)`\\n\\nIntuition: the recursion tree has 4^(log₂n) = n² leaves, and the leaf level alone already costs Θ(n²) — the Θ(n) merge work at the root is negligible in comparison.\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"Θ(n log n) is the merge-sort answer for a = 2, b = 2. With a = 4 the branching factor doubles the leaf count relative to the problem size, so the leaves dominate.\"},{\"optionIndex\":2,\"reason\":\"Θ(n² log n) is Case 2, which needs f(n) = Θ(n²). Here f(n) = n is far smaller, so no extra log factor appears.\"},{\"optionIndex\":3,\"reason\":\"Θ(n³) would need a = 8 with b = 2 (log₂8 = 3). Four subproblems of half size give n², not n³.\"}],\"takeaway\":\"Compare f(n) with n^(log_b a): if f is polynomially smaller, the leaves win and T(n) = Θ(n^(log_b a)).\",\"tags\":[\"master-theorem\",\"recurrence\",\"big-o\"],\"verified\":\"ok\"},{\"id\":\"arr-11\",\"topic\":\"arrays-strings\",\"subtopic\":\"Recurrences — binary search\",\"difficulty\":\"easy\",\"question\":\"Binary search on a sorted array satisfies `T(n) = T(n/2) + Θ(1)`. What is T(n)?\",\"options\":[\"Θ(1)\",\"Θ(n)\",\"Θ(n log n)\",\"Θ(log n)\"],\"answerIndex\":3,\"explanation\":\"By the Master theorem: a = 1, b = 2, so `n^(log₂1) = n⁰ = 1`, and `f(n) = Θ(1) = Θ(n⁰ log⁰ n)`. That is Case 2 with k = 0, giving `T(n) = Θ(log n)`.\\n\\nUnrolling gives the same picture directly: the array size goes n → n/2 → n/4 → … → 1, which takes log₂n halvings, and each level does constant work. So the total is Θ(log n).\\n\\nNote binary search uses Θ(1) *extra space* iteratively (Θ(log n) if written recursively, due to the call stack).\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Θ(1) ignores that the recursion has log₂n levels; constant work *per level* still sums to log n.\"},{\"optionIndex\":1,\"reason\":\"Θ(n) is linear search. Binary search discards half the remaining candidates each step rather than testing them.\"},{\"optionIndex\":2,\"reason\":\"Θ(n log n) is the cost of *sorting* the array first — not of a single search on an already-sorted array.\"}],\"takeaway\":\"Halving the input with O(1) work per step gives Θ(log n): T(n) = T(n/2) + Θ(1).\",\"tags\":[\"binary-search\",\"recurrence\",\"big-o\"],\"verified\":\"ok\"},{\"id\":\"arr-12\",\"topic\":\"arrays-strings\",\"subtopic\":\"Kadane's algorithm\",\"difficulty\":\"medium\",\"question\":\"Using Kadane's algorithm, what is the maximum sum of a **non-empty contiguous subarray** of\\n\\n`[3, -4, 5, -1, 2, -4, 6, -1]` ?\",\"options\":[\"6\",\"7\",\"8\",\"16\"],\"answerIndex\":2,\"explanation\":\"Kadane keeps `cur = max(a[i], cur + a[i])` (extend or restart) and tracks the running best:\\n\\n| a[i] | 3 | -4 | 5 | -1 | 2 | -4 | 6 | -1 |\\n|---|---|---|---|---|---|---|---|---|\\n| cur | 3 | -1 | **5** | 4 | 6 | 2 | **8** | 7 |\\n| best | 3 | 3 | 5 | 5 | 6 | 6 | **8** | 8 |\\n\\nAnswer: **8**, achieved by `[5, -1, 2, -4, 6]`.\\n\\nThe decision at each element is exactly \\\"is the prefix I am carrying helping me?\\\" — if `cur` ever goes below 0 it is discarded, because dragging a negative prefix forward can never improve a later subarray. One pass, Θ(n) time, Θ(1) space.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"6 is the sum of the *entire* array, and also the best found through index 5. Continuing to the 6 at index 6 raises it to 8.\"},{\"optionIndex\":1,\"reason\":\"7 is the final value of `cur` after processing the trailing -1. `best` must be tracked separately and never decreases.\"},{\"optionIndex\":3,\"reason\":\"16 is the sum of all positive elements (3+5+2+6). Subarrays must be contiguous, so the intervening negatives cannot be skipped.\"}],\"takeaway\":\"Kadane: cur = max(a[i], cur + a[i]), best = max(best, cur) — drop any prefix whose running sum turns negative.\",\"tags\":[\"kadane\",\"dynamic-programming\",\"subarray\",\"tracing\"],\"verified\":\"ok\"},{\"id\":\"arr-13\",\"topic\":\"arrays-strings\",\"subtopic\":\"In-place rotation by reversal\",\"difficulty\":\"medium\",\"question\":\"Let `rev(l, r)` reverse the inclusive subarray `a[l..r]`. Which sequence rotates an array of length n **right** by k in place (e.g. `[1,2,3,4,5,6,7]`, k = 3 → `[5,6,7,1,2,3,4]`)?\",\"options\":[\"`rev(0, k-1); rev(k, n-1); rev(0, n-1)`\",\"`rev(0, n-1); rev(0, k-1); rev(k, n-1)`\",\"`rev(0, n-1); rev(0, n-k-1); rev(n-k, n-1)`\",\"`rev(0, k-1); rev(k, n-1)`\"],\"answerIndex\":1,\"explanation\":\"Trace option B on `[1,2,3,4,5,6,7]`, k = 3:\\n\\n1. `rev(0,6)` → `[7,6,5,4,3,2,1]`\\n2. `rev(0,2)` → `[5,6,7,4,3,2,1]`\\n3. `rev(3,6)` → `[5,6,7,1,2,3,4]` ✅\\n\\nThe idea: reversing the whole array brings the last k elements to the front (but backwards), then reversing each of the two blocks restores their internal order. Θ(n) time, Θ(1) extra space, and no `gcd`/cycle bookkeeping needed.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Reversing the blocks *first* and the whole array last yields `[4,5,6,7,1,2,3]` — a right rotation by n-k, i.e. a **left** rotation by k. Order of the three reversals matters.\"},{\"optionIndex\":2,\"reason\":\"Splitting the reversed array at n-k instead of k gives `[4,5,6,7,1,2,3]` — again a right rotation by n-k = 4, not 3.\"},{\"optionIndex\":3,\"reason\":\"Two reversals without the full reversal give `[3,2,1,7,6,5,4]`; both blocks end up backwards. Exactly three reversals are required.\"}],\"takeaway\":\"Right-rotate by k in O(1) space: reverse the whole array, then reverse a[0..k-1] and a[k..n-1].\",\"tags\":[\"rotation\",\"in-place\",\"reversal\",\"two-pointers\"],\"verified\":\"ok\"},{\"id\":\"arr-14\",\"topic\":\"arrays-strings\",\"subtopic\":\"Anagram check — time/space trade-off\",\"difficulty\":\"easy\",\"question\":\"Two strings of length n contain only lowercase English letters. What is the **best** time and auxiliary-space complexity for deciding whether they are anagrams?\",\"options\":[\"Θ(n) time, Θ(1) auxiliary space\",\"Θ(n log n) time, Θ(1) auxiliary space\",\"Θ(n²) time, Θ(1) auxiliary space\",\"Θ(n) time, but Θ(n) auxiliary space is unavoidable\"],\"answerIndex\":0,\"explanation\":\"Use a fixed frequency table of 26 counters: increment for every character of the first string, decrement for every character of the second, then check all 26 counters are zero.\\n\\n- Time: one pass over each string → Θ(n).\\n- Auxiliary space: the table is **26 ints regardless of n**, so it is Θ(1) — constant, not proportional to input size.\\n\\n(If the alphabet were arbitrary Unicode you would use a hash map, giving Θ(min(n, σ)) space; for a *fixed* alphabet σ = 26, that is Θ(1).)\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"Θ(n log n) is the sort-both-strings approach. It works and uses O(1) extra space if sorted in place, but counting beats it — the question asks for the best.\"},{\"optionIndex\":2,\"reason\":\"Θ(n²) is the naive \\\"for each character, scan the other string and cross it off\\\" method. Counting removes the inner scan entirely.\"},{\"optionIndex\":3,\"reason\":\"Θ(n) space is not required: the counter array's size depends on the alphabet (26), not on n, so it is constant auxiliary space.\"}],\"takeaway\":\"A fixed-alphabet frequency array is O(1) space by definition — 26 counters do not grow with n.\",\"tags\":[\"strings\",\"hashing\",\"counting\",\"space-complexity\"],\"verified\":\"ok\"},{\"id\":\"arr-15\",\"topic\":\"arrays-strings\",\"subtopic\":\"In-place duplicate removal (slow/fast pointers)\",\"difficulty\":\"medium\",\"question\":\"What does this return for the sorted array `a = [0,0,1,1,1,2,2,3,3,4]` (n = 10)?\\n\\n```java\\nint k = 0;\\nfor (int i = 0; i < n; i++)\\n    if (i == 0 || a[i] != a[i-1])\\n        a[k++] = a[i];\\nreturn k;\\n```\",\"options\":[\"4\",\"6\",\"10\",\"5\"],\"answerIndex\":3,\"explanation\":\"The write pointer `k` advances only when `a[i]` differs from its predecessor — i.e. once per **distinct** value. The distinct values are 0, 1, 2, 3, 4 → five of them, so `k = 5` and the array's first 5 slots become `[0,1,2,3,4]` (positions 5..9 hold leftover garbage, which the contract says to ignore).\\n\\nBecause the input is sorted, all copies of a value are adjacent, so comparing against only the previous element is enough. Θ(n) time, Θ(1) extra space, and `k ≤ i` always holds — the write pointer never overtakes the read pointer, which is why writing in place is safe.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"4 counts the *transitions* between distinct blocks (0→1, 1→2, 2→3, 3→4) and forgets the first element, which is always written via the `i == 0` guard.\"},{\"optionIndex\":1,\"reason\":\"6 is not the count of distinct values; there are exactly five: 0, 1, 2, 3, 4.\"},{\"optionIndex\":2,\"reason\":\"10 is the original length. The whole point is that `k` counts only unique elements, and `k < n` whenever duplicates exist.\"}],\"takeaway\":\"Slow/fast pointers compact a sorted array in place in O(n) time and O(1) space; the returned k is the count of distinct values.\",\"tags\":[\"two-pointers\",\"in-place\",\"sorted-array\",\"tracing\"],\"verified\":\"ok\"},{\"id\":\"arr-16\",\"topic\":\"arrays-strings\",\"subtopic\":\"Amortised analysis of a sliding window\",\"difficulty\":\"hard\",\"question\":\"Consider the \\\"minimum length subarray with sum ≥ target\\\" solution:\\n\\n```java\\nint left = 0, sum = 0, best = INF;\\nfor (int right = 0; right < n; right++) {\\n    sum += a[right];\\n    while (sum >= target) {          // nested loop!\\n        best = Math.min(best, right - left + 1);\\n        sum -= a[left++];\\n    }\\n}\\n```\\n\\nWhat is its time complexity, and why?\",\"options\":[\"Θ(n²), because a `while` nested inside a `for` always multiplies the two bounds\",\"Θ(n), because `left` only ever increases: each element is added once and removed at most once, so the inner `while` executes at most n times **in total**\",\"Θ(n log n), because the window boundaries are effectively binary-searched\",\"Θ(n), because the inner `while` runs O(1) times on every outer iteration\"],\"answerIndex\":1,\"explanation\":\"You cannot bound nested loops by multiplying here — you must **amortise**.\\n\\n`left` is never decremented and never exceeds n, so across the entire run the `while` body executes at most n times total. The outer `for` contributes n iterations. Total work ≤ 2n = Θ(n).\\n\\nThe accounting argument: give each element one token when it enters the window (`sum += a[right]`) and spend it when it leaves (`sum -= a[left++]`). Each element can only be spent once, so total inner iterations ≤ n.\\n\\nThis is the same reasoning that makes two-pointer, monotonic-stack, and dynamic-array-doubling algorithms linear.\",\"whyOthersWrong\":[{\"optionIndex\":0,\"reason\":\"Multiplying loop bounds is only valid when the inner loop's count is independent of the outer state. Here the inner loop's total work is capped by a monotone pointer, so the bounds are additive, not multiplicative.\"},{\"optionIndex\":2,\"reason\":\"No binary search or halving occurs; both pointers move by ±1. A log factor has no source in this code.\"},{\"optionIndex\":3,\"reason\":\"Right conclusion, wrong reason: a single outer iteration can trigger up to Θ(n) inner iterations (e.g. one huge element collapsing the whole window). Only the *total*, not the per-iteration cost, is bounded.\"}],\"takeaway\":\"When an inner pointer only moves forward, bound its work over the whole run (amortised), not per outer iteration — the result is O(n), not O(n²).\",\"tags\":[\"sliding-window\",\"amortised-analysis\",\"big-o\",\"two-pointers\"],\"verified\":\"ok\"},{\"id\":\"arr-17\",\"topic\":\"arrays-strings\",\"subtopic\":\"Nested loop counting with geometric growth\",\"difficulty\":\"hard\",\"question\":\"What is the asymptotic value of `count` after this runs (assume n is a power of 2)?\\n\\n```c\\nint count = 0;\\nfor (int i = 1; i <= n; i *= 2)\\n    for (int j = 0; j < i; j++)\\n        count++;\\n```\",\"options\":[\"Θ(n)\",\"Θ(n log n)\",\"Θ(log n)\",\"Θ(n²)\"],\"answerIndex\":0,\"explanation\":\"The outer loop takes values i = 1, 2, 4, 8, …, n, and the inner loop runs exactly `i` times for each. So:\\n\\n`count = 1 + 2 + 4 + ... + n = 2n − 1 = Θ(n)`\\n\\nThe trap is seeing \\\"log n outer iterations × up to n inner iterations\\\" and concluding Θ(n log n). That over-counts badly, because only the **final** outer iteration does n units of work — all previous iterations combined do less than n more. Whenever the inner bound grows geometrically, the last term dominates and the sum is Θ(last term).\\n\\nContrast: `for (i=1; i<=n; i++) for (j=1; j<=n; j*=2)` really is Θ(n log n), because there the inner cost is log n *every* time.\",\"whyOthersWrong\":[{\"optionIndex\":1,\"reason\":\"Θ(n log n) comes from multiplying log n outer iterations by a worst-case inner cost of n. But the inner cost is `i`, which is tiny for most iterations — the sum is geometric, not flat.\"},{\"optionIndex\":2,\"reason\":\"Θ(log n) counts only the number of outer iterations and ignores the inner loop's work entirely.\"},{\"optionIndex\":3,\"reason\":\"Θ(n²) would need the outer loop to run n times. It runs only log₂n + 1 times because `i` doubles.\"}],\"takeaway\":\"When the inner loop bound doubles each round, the total is a geometric series ≈ 2n = Θ(n), not Θ(n log n).\",\"tags\":[\"loops\",\"counting\",\"geometric-series\",\"big-o\"],\"verified\":\"ok\"},{\"id\":\"arr-18\",\"topic\":\"arrays-strings\",\"subtopic\":\"Two-pointer palindrome with filtering\",\"difficulty\":\"easy\",\"question\":\"What does `ok(\\\"0P\\\")` return?\\n\\n```python\\ndef ok(s):\\n    i, j = 0, len(s) - 1\\n    while i < j:\\n        if not s[i].isalnum():   i += 1\\n        elif not s[j].isalnum(): j -= 1\\n        elif s[i].lower() != s[j].lower(): return False\\n        else: i += 1; j -= 1\\n    return True\\n```\",\"options\":[\"`True`, because `isalnum()` is False for digits so `'0'` is skipped\",\"`True`, because `.lower()` maps `'0'` and `'P'` to the same value\",\"`False`, because both characters are alphanumeric and `'0' != 'p'`\",\"`TypeError`, because `.lower()` cannot be called on a digit character\"],\"answerIndex\":2,\"explanation\":\"With i = 0 and j = 1:\\n\\n- `'0'.isalnum()` → **True** (alphanumeric = letters *and* digits), so no skip.\\n- `'P'.isalnum()` → True, so no skip.\\n- Compare `'0'.lower()` = `'0'` with `'P'.lower()` = `'p'` → different → return `False`.\\n\\n`\\\"0P\\\"` is the canonical test case that c
