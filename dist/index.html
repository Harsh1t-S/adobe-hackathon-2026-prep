 // Step 3: share descending, then name ascending.\\n        // Compare doubles with an epsilon, never with ==.\\n        ranked.sort((a, b) -> {\\n            double sa = (Double) a[1], sb = (Double) b[1];\\n            if (Math.abs(sa - sb) > 1e-9) return Double.compare(sb, sa);\\n            return ((String) a[0]).compareTo((String) b[0]);\\n        });\\n\\n        return ranked;\\n    }\\n}\",\"cpp\":\"#include <string>\\n#include <vector>\\n#include <unordered_map>\\n#include <algorithm>\\n#include <sstream>\\n#include <cmath>\\n\\nclass Solution {\\npublic:\\n    std::vector<std::pair<std::string, double>> shareOfVoice(const std::vector<std::string>& answers) {\\n        std::unordered_map<std::string, double> scores;\\n        double total = 0.0;\\n\\n        // Step 1: parse and accumulate in a single pass\\n        for (const auto& answer : answers) {\\n            std::istringstream stream(answer);\\n            std::string token;\\n            while (stream >> token) {\\n                size_t colon = token.rfind(':');\\n                if (colon == std::string::npos) continue;\\n                std::string brand = token.substr(0, colon);\\n                int position = std::stoi(token.substr(colon + 1));\\n                double points = 1.0 / position;   // first citation is worth the most\\n                scores[brand] += points;\\n                total += points;\\n            }\\n        }\\n\\n        std::vector<std::pair<std::string, double>> ranked;\\n        if (total == 0.0) return ranked;\\n\\n        // Step 2: convert to shares, rounded to 4 decimal places\\n        for (const auto& kv : scores) {\\n            double share = std::round(kv.second / total * 10000.0) / 10000.0;\\n            ranked.push_back({kv.first, share});\\n        }\\n\\n        // Step 3: share descending, then name ascending.\\n        // Compare doubles with an epsilon, never with ==.\\n        std::sort(ranked.begin(), ranked.end(),\\n                  [](const std::pair<std::string, double>& a,\\n                     const std::pair<std::string, double>& b) {\\n                      if (std::fabs(a.second - b.second) > 1e-9) return a.second > b.second;\\n                      return a.first < b.first;\\n                  });\\n\\n        return ranked;\\n    }\\n};\"},\"edgeCases\":[\"A single brand in a single answer → share 1.0\",\"Exact ties requiring the alphabetical tie-break — comparing doubles with == breaks here\",\"The same brand mentioned twice in one answer at different positions — both mentions count\",\"Brand names containing no colon, or an empty token from a double space\",\"Rounding per-mention instead of once at the end, which accumulates error and can flip a tie\"],\"followUps\":[\"Weight each answer by how often that prompt is actually asked, so share of voice reflects real traffic.\",\"Report the change in share versus a previous run and flag statistically significant moves.\",\"Positions can now be tied (two brands cited jointly first) — how does the scoring change?\"],\"patternTakeaway\":\"Parse, aggregate, then rank — as three separate passes; and never break a tie on floating-point equality, always use an epsilon or a scaled integer.\",\"practice\":{\"note\":\"Closest judge equivalent — same count, rank and tie-break shape. Ours adds the 1/position weighting, which no LeetCode problem covers.\",\"links\":[{\"name\":\"LeetCode 692 · Top K Frequent Words\",\"url\":\"https://leetcode.com/problems/top-k-frequent-words/\"}]}}],\"cases\":[{\"id\":\"cs-01\",\"title\":\"The skincare brand that stopped being recommended\",\"industry\":\"D2C consumer · India\",\"difficulty\":\"easy\",\"timeAllocation\":\"45 minutes. Read everything for 5, then roughly 9 minutes per question, leaving 4 to sweep back and add numbers and metrics.\",\"scenario\":\"**Lumea** is a four-year-old direct-to-consumer skincare brand based in Bengaluru, selling through its own site and two marketplaces. Its strongest product is a lightweight gel moisturiser aimed at oily and combination skin in humid climates — a genuinely well-reviewed product with a 4.4 average rating across 11,000 marketplace reviews.\\n\\nFor three years Lumea grew almost entirely on organic search and influencer seeding. It ranks in the top three for \\\"gel moisturiser for oily skin India\\\" and owns a content library of roughly 200 blog posts, mostly long-form articles in the 1,800–2,500 word range covering ingredients, routines and skin science.\\n\\nOver the last nine months something changed. Organic sessions are down sharply, but marketplace sales have held roughly flat and the category itself is growing. The performance-marketing team wants to move the entire content budget into paid social. The founder is not convinced and has asked you to work out what is actually happening before anyone reallocates anything.\\n\\nOne more data point the team gathered informally: a junior analyst asked four different AI assistants the question *\\\"what moisturiser should I buy for oily skin in humid weather in India\\\"* twenty times each. Lumea was named in 9% of the answers. Two competitors — one much smaller than Lumea by revenue — were named in over half.\",\"data\":\"**Organic and revenue trend (indexed, month 1 = 100)**\\n\\n| Month | Organic sessions | Organic revenue | Category search demand | Marketplace revenue |\\n|---|---|---|---|---|\\n| 1 | 100 | 100 | 100 | 100 |\\n| 4 | 92 | 96 | 106 | 101 |\\n| 7 | 74 | 85 | 112 | 99 |\\n| 9 | 61 | 79 | 118 | 102 |\\n\\n**AI assistant prompt sample — 4 engines × 20 runs, one high-intent prompt**\\n\\n| Brand | Times named | Avg. citation position | Typical cited source |\\n|---|---|---|---|\\n| Competitor A | 58% | 1.4 | Category roundup blog, review aggregator |\\n| Competitor B | 51% | 1.9 | Review aggregator, Reddit thread |\\n| Lumea | 9% | 3.1 | Lumea's own blog |\\n| Competitor C | 34% | 2.6 | Marketplace listing, roundup blog |\\n\\n**Content structure audit, 200 blog posts**\\n\\n| Attribute | Lumea | Competitor A |\\n|---|---|---|\\n| Avg. word count | 2,100 | 1,150 |\\n| Avg. H2 headings per post | 3 | 11 |\\n| Posts with a direct-answer summary in the first 100 words | 8% | 74% |\\n| Posts with FAQPage schema | 0% | 68% |\\n| Comparison / \\\"vs\\\" posts | 2 | 31 |\",\"questions\":[{\"q\":\"What is actually happening to Lumea's organic traffic? Diagnose the problem using the data provided.\",\"whatTheyAreTesting\":\"Whether you can separate market contraction from share loss, and whether you read the table rather than the narrative.\",\"suggestedMinutes\":9,\"modelAnswer\":\"**Verdict: this is share loss inside a growing category, driven by a content-format mismatch — not a demand problem and not a product problem.**\\n\\n**Why:**\\n\\n- Category search demand is **up 18%** over nine months while Lumea's organic sessions are **down 39%**. Those move in opposite directions, which rules out market contraction as the cause.\\n- Marketplace revenue is **flat (100 → 102)** and the product holds a 4.4 rating over 11,000 reviews. So demand and product quality are both intact — the loss is specifically in the *discovery* channel Lumea depends on.\\n- Organic revenue fell less than organic sessions (−21% vs −39%). The remaining traffic converts better, which is consistent with losing top-of-funnel informational visits while retaining high-intent ones — the classic zero-click signature.\\n- The prompt sample locates the failure precisely. Lumea is named in **9%** of answers versus 58% and 51% for two competitors, one of them smaller by revenue. So this is not about brand size or budget.\\n- The content audit gives the mechanism. Lumea averages **3 H2 headings across 2,100 words**; Competitor A averages **11 across 1,150**. Only **8%** of Lumea's posts open with a direct answer, against 74%. Lumea has **2** comparison posts; Competitor A has **31**.\\n\\n**The mechanism:** generative answer engines retrieve *passages*, not documents. A 2,100-word essay with three headings chunks into long, unfocused blocks that answer no single question cleanly. Competitor A's short, heavily-subheaded, direct-answer posts chunk into self-contained passages that match a rewritten query almost exactly.\\n\\n**What this rules out:** it is not a ranking collapse — Lumea still ranks top-three for its head keyword. It is not a penalty, or marketplace revenue would move too. Traffic is being intercepted *above* the ranked list, inside AI answers and answer-style results.\",\"scoringPoints\":[\"Explicitly compares the −39% sessions against +18% category demand to rule out market contraction\",\"Uses flat marketplace revenue to rule out a product or demand problem\",\"Notes organic revenue fell less than sessions, and reads it as top-of-funnel loss\",\"Cites the 9% vs 58% prompt-sample gap as the location of the failure\",\"Identifies the structural content mismatch (headings, direct answers, comparison posts) as the mechanism\",\"Rules out at least one alternative explanation explicitly\"]},{\"q\":\"Quantify the commercial impact of this decline, stating your assumptions.\",\"whatTheyAreTesting\":\"Whether you will estimate under uncertainty and state assumptions out loud, rather than refusing or inventing precision.\",\"suggestedMinutes\":8,\"modelAnswer\":\"**Verdict: the visible loss is roughly a fifth of organic revenue, but the counterfactual loss — what Lumea should have earned in a growing category — is closer to double that.**\\n\\nI do not have absolute revenue, so I will work in index points and state every assumption.\\n\\n**Realised loss.** Organic revenue fell from 100 to 79, so **21 index points of organic revenue have gone**. If organic was, say, 40% of total revenue at month 1, that is roughly **8.4 points of total company revenue**.\\n\\n**Counterfactual loss.** Category demand grew 18%. Had Lumea merely held share, organic revenue would sit near **118**. Actual is 79. The true gap is therefore about **39 index points**, nearly twice the visible decline. This is the number the founder should be told, because the reported figure understates the damage.\\n\\n**Sizing the recoverable portion.** Lumea is named in 9% of sampled answers; the leader is at 58%. Assume:\\n\\n- Structural fixes can realistically move Lumea to **30%** presence within two quarters — below the leader, since some of their advantage is third-party sources Lumea does not control.\\n- An AI answer citation converts at roughly **one-third** the rate of an organic click, because there is no landing page visit in most cases.\\n\\nThat implies recovering perhaps **a third to a half** of the counterfactual gap — call it **13–20 index points of organic revenue**.\\n\\n**The assumption my conclusion depends on** is that AI-mediated discovery is a meaningful share of the lost sessions rather than a coincidental correlate. If a server-log check showed AI referrers were negligible and the decline were purely a classic ranking loss, I would reverse this recommendation and treat it as an SEO problem. That check is a one-day task and should be the first thing done.\",\"scoringPoints\":[\"Computes the realised loss (21 index points) from the table\",\"Computes the counterfactual against +18% category growth, arriving at ~39 points\",\"Explicitly flags that the counterfactual is the more honest number\",\"States conversion and presence assumptions numerically before using them\",\"Names the single assumption the conclusion is load-bearing on, and how to test it cheaply\"]},{\"q\":\"What would you do about it? Give a prioritised plan.\",\"whatTheyAreTesting\":\"Prioritisation with stated reasoning, and specificity — recommendations someone could start on Monday.\",\"suggestedMinutes\":10,\"modelAnswer\":\"**Verdict: do not move the content budget to paid social. Restructure the content Lumea already owns — the asset is fine, the format is wrong.**\\n\\nPrioritised by impact over effort:\\n\\n**1. Baseline first — week 1, 2 days, data owner.** Formalise the junior analyst's experiment into a standing panel: 150 prompts across discovery, comparison and transactional intent, 4 engines, 5 runs each, weekly. Nothing else is attributable without this, and it already exists in rough form.\\n\\n**2. Restructure the top 25 commercial posts — weeks 1–3, content + 1 engineer.** For each: a 40–60 word direct answer in the first 100 words, H2 every 200–300 words phrased as the question a user actually asks, and FAQPage schema. This is reformatting existing work, not new writing, so it is fast. Expected effect: these are the pages already ranking, so they are already retrievable — the fix is making them *selectable* as passages.\\n\\n**3. Ship comparison content — weeks 2–5, content.** Lumea has 2 comparison posts; the leader has 31. Comparison prompts are where competitors are being cited from roundups and aggregators. Start with the 10 highest-volume \\\"X vs Y\\\" and \\\"best X for Y\\\" prompts from the panel.\\n\\n**4. Earn third-party presence — weeks 3–8, PR + partnerships.** Competitors are cited from review aggregators and roundups, not their own sites. Lumea's only cited source is its own blog, which is the weakest position — assistants prefer sources that look independent for recommendation questions. Target the specific aggregators and roundups already appearing in the panel data.\\n\\n**5. Structured data across the catalogue — week 2, 2 engineering days.** `Product` and `Review` schema sitewide. Cheap, durable, and a precondition for shopping-agent surfaces later.\\n\\n**Sequencing logic:** measurement first because nothing is provable without it; then the cheapest changes to assets already owned; then new content; then the slowest lever, third-party presence, which compounds but takes months.\\n\\n**Trade-off I am accepting:** paid social would show a faster number. I am choosing a slower, compounding, owned asset over rented reach, and I would tell the founder to expect little movement before week 6.\",\"scoringPoints\":[\"Directly rejects the proposed budget shift and gives a reason\",\"Recommendations are ordered with the reason for the order stated\",\"Each item has an owner and a timeframe\",\"Identifies that Lumea's only cited source is its own site, and treats third-party presence as a distinct lever\",\"Names a trade-off and the expected time-to-effect\",\"Puts measurement first\"]},{\"q\":\"How would you measure whether your plan worked, and what would make you conclude it had not?\",\"whatTheyAreTesting\":\"Measurement design, and whether you set a falsification condition rather than only success criteria.\",\"suggestedMinutes\":9,\"modelAnswer\":\"**Verdict: primary metric is position-weighted citation share on a fixed prompt panel; the honest read requires error bars and a falsification threshold set in advance.**\\n\\n**Primary metric.** Share of citations across the 150-prompt panel, weighted by position (1/position). Baseline is 9% unweighted, and Lumea's average position of 3.1 is poor, so the weighted figure is worse still — which is the point of weighting. **Target: 22–30% presence within 12 weeks**, with average position under 2.5.\\n\\n**Supporting metrics**\\n\\n- Passage-level retrieval: are the restructured pages appearing as cited URLs at all? This isolates whether step 2 worked independently of everything else.\\n- Branded search volume and direct traffic — the durable downstream signal that AI exposure converts to intent.\\n- Assisted conversions with an AI referrer anywhere in the path.\\n\\n**Guardrail metrics that must not degrade:** classic organic rankings for the head terms, and conversion rate on the restructured pages. Shortening and restructuring content for machines can hurt human conversion, and I would rather know early.\\n\\n**Statistical honesty.** With 5 runs per prompt per engine, week-to-week noise on a presence percentage will plausibly be ±5 points. So a 3-point rise is not evidence of anything. I would report a 4-week rolling average with a confidence interval, and only call a change real when it exceeds the interval.\\n\\n**Falsification — decided now, not later.** If, after **10 weeks**, presence on the restructured pages' prompts has not moved beyond the noise band *and* the pages are confirmed to be indexed and retrievable, then the structural hypothesis is wrong. In that case the constraint is authority and third-party presence rather than format, and the budget should move to lever 4 and to PR — not to paid social, which addresses neither.\\n\\n**Read-out cadence:** weekly internal, monthly to the founder, with the counterfactual-versus-category chart alongside the absolute numbers so a growing category never flatters a flat result.\",\"scoringPoints\":[\"Names a primary metric with baseline, target and timeframe\",\"Position-weights the metric rather than counting mentions\",\"Includes guardrail metrics that must not get worse\",\"Quantifies expected noise and refuses to read changes inside it\",\"States a falsification condition in advance, with what it would trigger\",\"Separates leading indicators from downstream revenue signals\"]}],\"commonMistakes\":[\"Treating the traffic decline as an SEO ranking problem when the case says rankings are intact\",\"Never referencing the content-structure table, which contains the actual mechanism\",\"Recommending 'create more content' when the problem is the format of existing content\",\"Agreeing with the paid-social reallocation because it is the fastest-sounding answer\",\"Giving no numbers at all, or inventing precise numbers with no stated assumption\",\"Forgetting that Lumea's only cited source is its own blog — the weakest possible position for a recommendation prompt\"]},{\"id\":\"cs-02\",\"title\":\"The enterprise tool that never makes the shortlist\",\"industry\":\"B2B SaaS · project management\",\"difficulty\":\"medium\",\"timeAllocation\":\"45 minutes. 5 to read, ~9 per question, 4 to sweep back for quantification and metrics.\",\"scenario\":\"**Trellix Work** (no relation to the security firm — a naming problem in its own right) sells project management software to mid-market and enterprise engineering organisations. ARR is ₹180 crore, growing 22% year on year. The product is well regarded by its users: 4.5 on the major review platforms, and best-in-category scores for its dependency-mapping feature, which genuinely has no equivalent among competitors.\\n\\nThe head of demand generation has noticed something uncomfortable. When buyers ask an AI assistant to *\\\"compare the best project management tools for a 200-person engineering org\\\"*, Trellix Work is essentially absent. Three competitors appear consistently. One of them is a smaller company with a weaker product and a much larger content and review footprint.\\n\\nInbound demo requests are down 15% year on year despite marketing spend being up 30%. Sales report that deals which do arrive are increasingly \\\"late-stage\\\" — buyers arrive with a shortlist already formed, and Trellix Work is often being added as a courtesy third option rather than a genuine contender.\\n\\nThe CMO's proposed response is to double the content team's output. You have been asked to review that plan before it is funded.\",\"data\":\"**Prompt panel — 60 comparison-intent prompts, 3 engines, 10 runs each**\\n\\n| Brand | Named in | Avg. position | Most common cited source |\\n|---|---|---|---|\\n| Competitor A | 87% | 1.2 | G2, category roundups, own comparison pages |\\n| Competitor B | 79% | 1.8 | G2, Capterra, Reddit |\\n| Competitor C (smaller) | 64% | 2.4 | 14 third-party roundups, own \\\"vs\\\" pages |\\n| **Trellix Work** | **11%** | **3.6** | Own homepage |\\n\\n**Where each brand's citations come from**\\n\\n| Source type | Competitor A | Competitor C | Trellix Work |\\n|---|---|---|---|\\n| Review aggregators (G2, Capterra) | 41% | 38% | 6% |\\n| Third-party roundups / listicles | 33% | 44% | 4% |\\n| Own comparison pages | 19% | 15% | 0% |\\n| Own marketing site | 7% | 3% | 90% |\\n\\n**Content and footprint audit**\\n\\n| Attribute | Trellix Work | Competitor C |\\n|---|---|---|\\n| Review count on major platforms | 340 | 2,900 |\\n| \\\"X vs Y\\\" pages published | 0 | 22 |\\n| Pages segmented by company size | 0 | 9 |\\n| Docs publicly indexable | No — behind login | Yes |\\n| Mentions of \\\"dependency mapping\\\" on third-party sites | 12 | n/a |\\n\\n**Funnel**\\n\\n| Metric | Last year | This year |\\n|---|---|---|\\n| Marketing spend | 100 | 130 |\\n| Inbound demo requests | 100 | 85 |\\n| Win rate when shortlisted | 34% | 36% |\",\"questions\":[{\"q\":\"Why is Trellix Work absent from AI-generated comparisons? Be specific about the mechanism.\",\"whatTheyAreTesting\":\"Whether you can identify the stage of failure rather than describing the symptom, and whether you notice the source-mix table.\",\"suggestedMinutes\":9,\"modelAnswer\":\"**Verdict: Trellix Work fails at the retrieval-and-selection stage for comparison prompts, because 90% of its citable footprint is its own marketing site — the source type assistants trust least for a recommendation question.**\\n\\n**The mechanism, stage by stage:**\\n\\n- **Indexed?** Partly. The marketing site is indexable, but the **documentation is behind a login**. Docs are disproportionately valuable for technical comparison prompts because they contain the specific, structured capability detail a buyer question actually needs. Trellix Work has removed its most differentiating content from the index entirely.\\n- **Retrieved?** Poorly for comparison intent. A prompt like \\\"compare the best tools for a 200-person engineering org\\\" fans out into queries about company-size fit and head-to-head comparisons. Trellix Work has **0 \\\"vs\\\" pages and 0 size-segmented pages**. There is nothing matching the rewritten query.\\n- **Selected?** Rarely, and this is the crux. **90% of Trellix Work's citations come from its own marketing site**, versus 7% for Competitor A. For a *recommendation* question, an answer engine weights ostensibly independent sources — aggregators, roundups, community threads — far above a vendor's own claims about itself. Trellix Work is only citable from the one source type that carries least weight for this intent.\\n- **Characterised?** Barely present enough to matter. Average position 3.6 on the 11% of occasions it appears.\\n\\n**The decisive comparison** is Competitor C: a *smaller company with a weaker product* at 64% presence. Their advantage is not quality and not spend — it is **2,900 reviews versus 340**, **22 \\\"vs\\\" pages versus 0**, and **44% of citations from third-party roundups versus 4%**. This proves the constraint is footprint and source diversity, not product merit or budget.\\n\\n**What this rules out:** it is not a product problem — the win rate when shortlisted actually rose from 34% to 36%. It is not an awareness-spend problem — spend rose 30% while demo requests fell 15%. The failure is upstream of both, at the point where the shortlist is assembled.\",\"scoringPoints\":[\"Names the specific failing stage rather than describing the symptom\",\"Uses the 90%-own-site source-mix figure as the central evidence\",\"Identifies gated documentation as a self-inflicted indexing loss\",\"Notes zero comparison and size-segmented pages against a comparison-intent prompt set\",\"Uses Competitor C (smaller, weaker, more visible) to rule out product quality and budget\",\"Uses the rising shortlisted win rate to rule out a product problem\"]},{\"q\":\"The CMO wants to double content output. Do you agree? Make the case.\",\"whatTheyAreTesting\":\"Whether you will disagree with the stated plan when the data supports disagreeing, and whether you offer a better-targeted alternative.\",\"suggestedMinutes\":9,\"modelAnswer\":\"**Verdict: no. Doubling output repeats the mistake at twice the cost. The problem is not content volume — it is content *type* and *where the citations come from*.**\\n\\n**Why more of the same fails:**\\n\\n- Trellix Work already has a marketing site producing 90% of its citations, and that source type is weighted lowest for recommendation prompts. Doubling it doubles the least useful asset.\\n- Spend already rose **30%** while demo requests fell **15%**. That is direct evidence the current channel mix has stopped converting spend into pipeline. Scaling an unproductive input is the wrong response to that signal.\\n- The gap versus Competitor C is measured in **reviews (340 vs 2,900)** and **third-party presence (4% vs 44%)** — neither of which is produced by the content team writing more blog posts.\\n\\n**What I would fund instead, in order:**\\n\\n1. **Unlock the documentation — 1 week, engineering.** Make docs publicly indexable. This is close to free, immediately increases citable surface, and the docs contain the dependency-mapping detail that is Trellix Work's actual differentiator. Highest impact-to-effort item available.\\n2. **A review-generation programme — ongoing, customer success.** In-product prompts at moments of success, a lifecycle email sequence, incentives within platform rules. Going from 340 toward ~1,500 reviews is a 2–3 quarter programme and it directly attacks the largest measured gap.\\n3. **Twelve comparison pages — 6 weeks, existing content team, no headcount added.** \\\"Trellix Work vs A\\\", \\\"vs B\\\", \\\"vs C\\\", plus size-segmented pages for 200-person orgs. This is a *reallocation* of the existing team, which is why no doubling is needed.\\n4. **Third-party roundup placement — ongoing, PR.** Target the specific 14 roundups already citing Competitor C. They are named in the data; the target list is not a mystery.\\n5. **Fix the name collision.** \\\"Trellix\\\" is an established security brand. Entity resolution will be genuinely degraded by this, and it deserves at minimum a Wikidata and knowledge-panel cleanup, with a naming review escalated as a separate strategic question.\\n\\n**Trade-off:** items 2 and 4 are slow — two to three quarters before they compound. I would set that expectation explicitly rather than promise a quarterly turnaround, and use item 1 to show movement early.\",\"scoringPoints\":[\"Clearly disagrees and gives evidence-based reasons\",\"Uses spend +30% against demo requests −15% to show the current mix is failing\",\"Proposes reallocation rather than expansion of the content team\",\"Identifies gating docs as the highest impact-to-effort fix\",\"Targets the specific roundups already visible in the data\",\"Spots the brand-name collision as an entity-resolution problem\",\"Sets honest expectations on time-to-effect\"]},{\"q\":\"Trellix Work's dependency-mapping feature is genuinely unique. How do you make an AI assistant aware of that, and is 'unique' even useful here?\",\"whatTheyAreTesting\":\"Whether you understand that assistants answer the question asked, and whether you can reason about category framing rather than feature marketing.\",\"suggestedMinutes\":9,\"modelAnswer\":\"**Verdict: a differentiator is only useful if buyers ask a question it answers. Right now nobody asks for dependency mapping, so the work is in two parts — become citable *for* it, and create demand for the question itself.**\\n\\n**The framing problem first.** The panel is built on prompts like \\\"best project management tool for a 200-person engineering org\\\". An assistant answering that retrieves general category content and returns generalist leaders. A unique feature is invisible to a prompt that does not mention it. With only **12 third-party mentions of \\\"dependency mapping\\\"**, there is almost no evidence in the index that the capability or the category even exists.\\n\\n**Part 1 — become the definitive source for the capability.**\\n\\n- Publish the dependency-mapping documentation publicly, with worked examples. This is the highest-value single page Trellix Work could expose.\\n- Create the category page: what dependency mapping is, when a team needs it, what breaks without it. Structured as self-contained Q&A blocks under question-shaped H2s so it chunks cleanly for retrieval.\\n- Seed the term into third-party surfaces — analyst notes, engineering-leadership publications, conference talks, and the review platforms where customers describe *why* they chose the product.\\n\\n**Part 2 — expand the prompt panel to intent you can win.** The current panel is 60 comparison prompts Trellix Work loses. Add problem-shaped prompts it can win: *\\\"how do I manage cross-team dependencies in a 200-person engineering org\\\"*, *\\\"project tool that shows blocking dependencies across teams\\\"*. Track presence on those separately. Winning 60% of a narrow, high-intent prompt set is worth more pipeline than 15% of a broad one — and it is achievable this year, which the broad set is not.\\n\\n**The honest caveat.** This only works if the underlying pain is real and buyers experience it. If they do not, this is category creation — expensive, slow, and often a way of avoiding the harder truth that you are losing a generalist race. I would validate first by checking whether the pain appears unprompted in sales-call transcripts and in reviews. If it does not, deprioritise this and put the resource behind the review and roundup programme instead.\",\"scoringPoints\":[\"Recognises that a differentiator is irrelevant to prompts that do not mention it\",\"Uses the 12-mentions figure as evidence the category has no index presence\",\"Recommends segmenting the prompt panel by winnable intent, not just tracking losses\",\"Argues that narrow high-intent presence can beat broad low presence, with reasoning\",\"States the category-creation risk and proposes a cheap validation before committing\"]},{\"q\":\"You are given one quarter and no additional budget. What do you do, and what do you deliberately not do?\",\"whatTheyAreTesting\":\"Prioritisation under a hard constraint, and willingness to state explicit non-goals.\",\"suggestedMinutes\":9,\"modelAnswer\":\"**Verdict: one quarter with no new budget buys the cheap structural fixes and the start of the slow compounding ones. It does not buy a change in market position, and I would say so up front.**\\n\\n**Weeks 1–2 — make it measurable and unblock the free wins**\\n\\n- Formalise the prompt panel: 60 comparison prompts plus 40 problem-intent prompts, 3 engines, weekly, with variance recorded. Baseline locked at 11%.\\n- Publish the documentation. One week of engineering time, no budget, largest single increase in citable surface available.\\n- `Product`, `FAQPage` and `Organization` schema across the marketing site.\\n\\n**Weeks 3–8 — reallocate the existing team**\\n\\n- 12 comparison and size-segmented pages, written by the current content team instead of the blog calendar. No new headcount, which is what makes this fit the constraint.\\n- Launch review generation through customer success — in-product prompts and a lifecycle email. Costs process change, not money.\\n- PR outreach to the 14 roundups already citing Competitor C.\\n\\n**Weeks 9–12 — read the results and hand over**\\n\\n- Measure presence on both panels separately. Expect movement on the problem-intent panel first, because it is less contested.\\n- Write the case for next quarter's budget using measured deltas rather than argument.\\n\\n**What I am explicitly not doing, and why:**\\n\\n- **Not doubling content output.** It scales the least effective asset.\\n- **Not chasing Competitor A's 87% presence.** Their footprint is years of accumulated reviews and roundups; a quarter cannot close that and pretending otherwise sets up a failure.\\n- **Not rebranding**, despite the name collision being real. Too expensive and too slow for the constraint — I flag it as a separate strategic decision with its own business case.\\n- **Not building tooling.** Off-the-shelf sampling plus a spreadsheet is sufficient at this scale, and building tooling would consume the quarter.\\n\\n**What I would tell the CMO on day one:** in one quarter with no new budget, the honest deliverable is a measurement baseline, the structural fixes that were free, and the first compounding investments started. Presence moving from 11% to somewhere near 20% on the problem-intent panel is a realistic target. Beating Competitor A is not, and any plan that promises it is not credible.\",\"scoringPoints\":[\"Sequences within the constraint, with weeks and owners\",\"Explicitly reallocates rather than requesting budget\",\"States non-goals with reasons for each\",\"Sets a realistic, quantified target and refuses an unrealistic one\",\"Separates the panel by winnable versus contested intent\",\"Manages expectations with the CMO in advance rather than at the end\"]}],\"commonMistakes\":[\"Answering 'build more content' — the exact plan the case invites you to challenge\",\"Missing the source-mix table, which contains the whole diagnosis\",\"Not noticing that documentation is gated, which is the cheapest available fix\",\"Failing to use Competitor C to rule out product quality and budget as causes\",\"Ignoring the brand-name collision entirely\",\"Promising to overtake the market leader within a quarter\"]},{\"id\":\"cs-03\",\"title\":\"When the shopper is a piece of software\",\"industry\":\"Quick commerce · groceries\",\"difficulty\":\"hard\",\"timeAllocation\":\"45 minutes. This one is conceptually harder — spend 6 minutes reading, then ~9 per question.\",\"scenario\":\"**DashKart** is a quick-commerce grocery app operating in seven Indian cities, with a catalogue of about 18,000 SKUs and 20-minute delivery. Revenue is strong and the app has good retention among weekly shoppers.\\n\\nA new behaviour has begun to appear. Users are instructing general-purpose AI assistants to handle recurring shopping: *\\\"reorder my usual weekly groceries, keep it under ₹2,000, substitute anything out of stock with the closest equivalent.\\\"* Today the volume is small — DashKart's data team estimates under 2% of orders originate from an agent-mediated path — but it has tripled in six months.\\n\\nWhen the team tested this, the results were uncomfortable. Given the same instruction, assistants completed the basket on a competitor's platform far more often. Post-mortem showed the competitor exposes a structured public product feed and a partner API; DashKart's catalogue is rendered client-side by a JavaScript app, its prices are only visible after location selection, and its stock status is not exposed anywhere machine-readable.\\n\\nThe CEO's view is that this is a rounding error and the team should focus on delivery-time improvements. The head of product disagrees strongly. You have been asked to settle it with an analysis rather than an opinion.\",\"data\":\"**Agent-mediated order share, DashKart**\\n\\n| Quarter | Share of orders | QoQ growth |\\n|---|---|---|\\n| Q1 | 0.6% | — |\\n| Q2 | 1.0% | +67% |\\n| Q3 | 1.4% | +40% |\\n| Q4 | 1.9% | +36% |\\n\\n**Agent basket-completion test — 200 identical instructions, 3 assistants**\\n\\n| Platform | Basket completed | Avg. items matched | Failure reason (most common) |\\n|---|---|---|---|\\n| Competitor X | 71% | 18.2 / 20 | Item genuinely unavailable |\\n| Competitor Y | 44% | 14.1 / 20 | Price not parseable |\\n| **DashKart** | **9%** | **4.6 / 20** | **Catalogue not machine-readable** |\\n\\n**Machine-readability audit**\\n\\n| Attribute | DashKart | Competitor X |\\n|---|---|---|\\n| Public product feed | No | Yes, refreshed hourly |\\n| Partner / commerce API | No | Yes, documented |\\n| Structured data on product pages | None | Product + Offer + AggregateRating |\\n| Price visible without location selection | No | Yes, with a city parameter |\\n| Real-time stock exposed | No | Yes, per dark store |\\n| Server-side rendered catalogue | No | Yes |\\n\\n**Economics**\\n\\n| Metric | Value |\\n|---|---|\\n| Avg. order value | ₹1,180 |\\n| Contribution margin per order | 11% |\\n| Weekly orders (all cities) | 940,000 |\\n| Est. engineering cost, feed + API | ₹65 lakh, 3 months, 4 engineers |\",\"questions\":[{\"q\":\"Is the CEO right that this is a rounding error? Quantify the argument on both sides.\",\"whatTheyAreTesting\":\"Whether you can reason about a growth rate rather than a level, and whether you take the counter-position seriously instead of dismissing it.\",\"suggestedMinutes\":10,\"modelAnswer\":\"**Verdict: the CEO is right about today's level and wrong about the trajectory. At 36–40% quarterly growth, a rounding error becomes a material channel inside two years — and the build takes three months, so the decision must be made now, not when the number is large.**\\n\\n**The case that it is a rounding error.** Agent-mediated orders are **1.9%** of volume. At 940,000 weekly orders and ₹1,180 AOV, that is roughly **₹21 crore of weekly GMV**, and at 11% contribution margin about **₹2.3 crore of weekly contribution**. Losing most of it hurts but does not threaten the business. Delivery time affects 100% of orders; this affects 2%. On today's numbers, the CEO's prioritisation is defensible and should be acknowledged as such.\\n\\n**The case that it is not.** Compounding at ~36% per quarter:\\n\\n| Horizon | Share of orders |\\n|---|---|\\n| Today | 1.9% |\\n| +4 quarters | ~6.4% |\\n| +8 quarters | ~21% |\\n\\nAssumptions: growth decays gradually rather than holding at 36%, and no step-change from a major assistant shipping native commerce — which would accelerate it sharply.\\n\\n**The part that makes it urgent.** DashKart completes **9%** of agent baskets against Competitor X's **71%**. So within the agent channel, DashKart is not losing marginally — it is losing roughly **8 out of every 9** contests it enters. Applying that to a 6.4% channel a year out, the annual contribution at risk is on the order of **₹100+ crore**, against a build cost of **₹65 lakh**. That is a return of well over 100×, and it does not require the optimistic growth case to justify itself.\\n\\n**The decisive argument is lead time.** The fix takes 3 months to build and longer to be discovered and trusted by agents. Starting when the channel is 6% means arriving at 9% having already lost two years of habit formation. In recurring grocery, first-mover advantage is unusually durable because \\\"my usual order\\\" is stored state on someone else's platform.\\n\\n**What would change my mind:** if the 2% were concentrated in a low-margin, low-retention cohort, or if growth were decelerating rather than compounding. The data shows growth decaying only slowly — 67%, 40%, 36% — which is a maturing channel, not a fad burning out.\",\"scoringPoints\":[\"Computes today's absolute exposure from AOV, order volume and margin\",\"Projects the growth rate forward and states the decay assumption\",\"Uses the 9% vs 71% completion gap to show loss within the channel, not just channel size\",\"Compares the value at risk against the stated ₹65 lakh build cost\",\"Makes the lead-time argument for deciding now\",\"Acknowledges the CEO's position as reasonable on current numbers\",\"States what evidence would reverse the conclusion\"]},{\"q\":\"Why does DashKart complete only 9% of agent baskets? Walk through the mechanism.\",\"whatTheyAreTesting\":\"Technical understanding of what an agent actually needs, rather than marketing-level reasoning.\",\"suggestedMinutes\":8,\"modelAnswer\":\"**Verdict: DashKart is not losing an agent's preference — it is failing to be a candidate at all. Every input the agent needs to satisfy the instruction is either absent or unreachable.**\\n\\nTake the instruction apart: *reorder my usual groceries, under ₹2,000, substitute anything out of stock*. To execute it an agent must resolve four things — identity of each item, current price, stock status, and a substitution graph. DashKart exposes none of them.\\n\\n**Stage by stage:**\\n\\n1. **Discover the catalogue.** No public feed, no API, and the catalogue is **client-side rendered**. A fetcher retrieving the page gets an application shell, not products. The agent cannot enumerate what exists.\\n2. **Resolve prices.** Price requires location selection — an interactive step behind a UI state the agent cannot reach. Even a rendering agent must guess a city, and any budget constraint becomes unsatisfiable without a reliable price.\\n3. **Check stock.** Not exposed anywhere machine-readable, so the substitution half of the instruction is impossible to execute correctly. The agent cannot know what to substitute *for*.\\n4. **Match items.** No structured data means no stable identifiers, no canonical names, no pack sizes. The audit shows only **4.6 of 20 items matched** — the agent is guessing from rendered text, and mostly failing.\\n\\nCompetitor X's failure reason is instructive: *\\\"item genuinely unavailable\\\"*. That is a **real-world** constraint — they have already won the machine-readability contest, and their remaining losses are inventory, not integration. DashKart's failure reason is *\\\"catalogue not machine-readable\\\"*, which is a **self-inflicted** constraint.\\n\\n**The strategic reframing.** The agent is not choosing between DashKart and Competitor X on merit — brand, delivery speed and price never enter the decision, because DashKart never reaches the comparison. Twenty-minute delivery is a genuine advantage that is completely invisible in this channel, since it is not expressed anywhere a machine can read. **The shelf is now a data structure, and DashKart is not on it.**\",\"scoringPoints\":[\"Decomposes the instruction into the four data requirements\",\"Identifies client-side rendering as the first hard blocker\",\"Explains why the price-behind-location gate breaks the budget constraint\",\"Explains why missing stock data makes the substitution instruction unexecutable\",\"Contrasts Competitor X's real-world failure reason with DashKart's self-inflicted one\",\"Notes that DashKart's real advantages are invisible in this channel\"]},{\"q\":\"Design DashKart's response. What do you build, in what order, and what do you refuse to build?\",\"whatTheyAreTesting\":\"Technical product judgement, sequencing by dependency, and discipline about scope.\",\"suggestedMinutes\":10,\"modelAnswer\":\"**Verdict: build the data layer before the relationship layer. Machine-readability is a prerequisite for everything else, and it is also the cheapest part.**\\n\\n**Phase 1 — become parseable at all (weeks 1–6, 2 engineers)**\\n\\n1. **Server-render the catalogue**, or ship a static pre-rendered mirror of product pages. Without this nothing else is reachable.\\n2. **Structured data**: `Product`, `Offer` with price and currency, `AggregateRating`, on every SKU page.\\n3. **Price without an interactive gate** — accept a city parameter in the URL so price resolves on first fetch.\\n\\nThis phase alone should move basket completion substantially, because it converts DashKart from invisible to merely imperfect. It is also the phase with no partner negotiation and no external dependency, which is why it goes first.\\n\\n**Phase 2 — the feed (weeks 4–10, 2 engineers, overlapping)**\\n\\n4. **Public product feed**, refreshed at least hourly: stable SKU IDs, canonical names, pack size, price, per-city availability, category taxonomy.\\n5. **Substitution graph** — for each SKU, ranked equivalents. This directly serves the substitution clause in the instruction and is a genuine differentiator, because most competitors leave substitution to the agent's guesswork. DashKart has the purchase data to do it better than an outside model can.\\n\\n**Phase 3 — transact (weeks 8–14)**\\n\\n6. **Commerce API**: basket construction, availability check, order placement, with authentication and clear rate limits.\\n7. **MCP server** exposing the catalogue and basket as callable tools, so assistants supporting the protocol can use DashKart directly rather than scraping it.\\n\\n**What I refuse to build:**\\n\\n- **A DashKart chatbot.** The user is already in an assistant they chose. Building a competing conversational surface solves a problem nobody has and consumes the quarter.\\n- **A bespoke integration per assistant.** Standards first. Bespoke deals do not generalise and they age badly.\\n- **Dynamic agent-specific pricing.** Tempting and a regulatory and trust minefield. Not in phase 1, and probably not ever.\\n- **Anything that degrades the human app.** Server rendering must not slow the consumer experience that produces 98% of revenue today.\\n\\n**Sequencing logic:** phases are ordered by dependency, not by ambition. The feed is useless if pages are unparseable; the API is useless if the feed is wrong. Each phase ships value independently, so the programme survives being cut short — which matters when the CEO is sceptical and the budget is annual.\",\"scoringPoints\":[\"Orders the work by technical dependency and says so\",\"Puts server-side rendering first as the hard prerequisite\",\"Includes a substitution graph and explains why it is a differentiator DashKart is uniquely placed to build\",\"Names specific schema types rather than saying 'add structured data'\",\"States explicit non-goals with reasons\",\"Protects the existing human experience\",\"Ensures each phase delivers value standalone in case funding is cut\"]},{\"q\":\"If agents become the dominant way people shop groceries, what happens to DashKart's brand — and what, if anything, is still worth investing in?\",\"whatTheyAreTesting\":\"Strategic reasoning about where brand equity survives when the buyer is software. The hardest question in the set.\",\"suggestedMinutes\":9,\"modelAnswer\":\"**Verdict: most conventional brand investment loses its power, but not all of it. Brand stops winning the purchase and starts doing two narrower jobs — getting named in the prompt, and being the trusted default the agent is told to use.**\\n\\n**What stops working.** Packaging design, app UI polish, emotional advertising and merchandising all target a human visual and emotional system the agent does not have. If the agent is filtering on \\\"under ₹2,000, in stock, delivers today\\\", a competitor 3% cheaper on a matched specification wins that basket regardless of how the brand feels. Advantages become **specification-shaped**: price, availability, delivery window, substitution accuracy, return policy.\\n\\n**What still works, and is worth investing in:**\\n\\n1. **Being the specified brand.** \\\"Reorder my usual groceries **from DashKart**\\\" bypasses selection entirely. This is the single most valuable position available and it is won by the human experience — the part where a person decides which platform is theirs. Ironically, agentic commerce raises the value of the human app rather than lowering it.\\n2. **Being the stored default.** Whoever holds the user's \\\"usual list\\\" holds enormous inertia. Investment in making that list rich, portable and accurate is investment in switching cost.\\n3. **Reliability as a measurable attribute.** If agents learn — through their own retries and through structured signals — that DashKart substitutes accurately and delivers when it says it will, that becomes a machine-legible reputation. Delivery reliability stops being a marketing claim and becomes a data point, which is arguably a *better* deal for a brand that genuinely performs.\\n4. **Category and question presence.** When a user asks an open question rather than issuing a reorder — \\\"where should I buy groceries in Pune\\\" — the visibility mechanics from ordinary generative search apply in full.\\n\\n**The genuine tension worth stating.** DashKart's 20-minute delivery is a real, expensive advantage that agents currently cannot see. The strategic imperative is not to abandon it but to **make it machine-legible** — expose delivery windows in the feed so the agent can weigh them. An advantage that cannot be expressed as data is, in this channel, an advantage that does not exist.\\n\\n**What I would tell the CEO.** Keep investing in the human app, because it is what makes you the *named* brand. Stop investing in brand work that only a human can perceive at the point of purchase, because increasingly there is no human there. And expose the operational excellence you already have as structured data, because that is the only form in which the new buyer can read it.\",\"scoringPoints\":[\"Distinguishes brand's role in selection from brand's role in being specified\",\"Argues that agentic commerce increases rather than decreases the value of the human app, with reasoning\",\"Identifies the stored 'usual list' as a switching-cost asset\",\"Reframes reliability as machine-legible reputation\",\"Names the tension that an advantage which cannot be expressed as data does not exist in this channel\",\"Gives a clear, decision-shaped recommendation rather than an essay\"]}],\"commonMistakes\":[\"Dismissing the CEO without engaging the 2% argument honestly\",\"Arguing from the current level rather than the growth rate and the build lead time\",\"Treating this as a marketing problem when the mechanism is entirely technical\",\"Proposing a DashKart chatbot — the most common wrong answer to any agent question\",\"Never computing the value at risk against the stated ₹65 lakh build cost\",\"Missing that the competitor's failure reason is real-world while DashKart's is self-inflicted\"]}],\"caseMethod\":[{\"id\":\"cm-clock\",\"title\":\"The 45-minute clock\",\"body\":\"You get 45 minutes, one sitting, one attempt, and you cannot pause. Assume 4–6 questions on a scenario of roughly 300–500 words plus a data table.\\n\\n| Minutes | What you are doing | Why |\\n|---|---|---|\\n| 0–5 | Read **everything** — scenario, data, and all questions — before writing a word. Underline the numbers. | Question 5 usually reveals what question 1 was really asking. |\\n| 5–7 | Write a one-line plan per question in your answer boxes. Skeleton only. | If you run out of time, a skeleton still scores. A blank box scores zero. |\\n| 7–38 | Answer in order, holding a hard per-question budget. With 5 questions that is roughly 6 minutes each. | The single biggest cause of a bad score is question 5 being blank. |\\n| 38–43 | Sweep back. Add a number where you have none, add a metric where you recommended something, add a risk line. | These three additions are where the marginal marks are. |\\n| 43–45 | Final read for anything unfinished. Submit with time to spare. | Never trust the last 60 seconds of a browser timer. |\\n\\n**If you are running out of time**, switch to bullet points immediately. Four sharp bullets score far better than two polished paragraphs and an empty box. Announce it if you like — *\\\"In brief, given time:\\\"* — and then land the points.\\n\\n**Never** spend 15 minutes on question 1 because you happen to know a lot about it. The marks are distributed across questions, not across your enthusiasm.\",\"checklist\":[\"Read all questions before answering any\",\"Write the minute budget down before you start typing\",\"Skeleton every answer box early\",\"Reserve the last 5 minutes for the numbers-and-metrics sweep\"]},{\"id\":\"cm-skeleton\",\"title\":\"The answer skeleton — memorise this\",\"body\":\"The evaluator is reading fast and looking for evidence of structured thinking. Give them a shape they can scan. Use this skeleton for almost any question:\\n\\n> **1. Verdict.** One sentence that directly answers the question asked.\\n>\\n> **2. Diagnosis.** Two or three bullets on *why* it is happening, each anchored to a number from the case.\\n>\\n> **3. Recommendation.** Two or three concrete actions, ordered by impact-over-effort, each specific enough that someone could start it on Monday.\\n>\\n> **4. Measurement.** The one or two metrics that would tell you within a defined window whether it worked.\\n>\\n> **5. Risk.** The main thing that could go wrong, and the trade-off you are knowingly accepting.\\n\\n### Fill-in template\\n\\n```text\\nVerdict: The core problem is [X], driven primarily by [Y].\\n\\nWhy:\\n- [Metric] fell from [A] to [B], which points to [mechanism].\\n- [Second evidence], suggesting [inference].\\n- The thing that is NOT the problem: [rule something out].\\n\\nWhat I would do:\\n1. [Action] - because [reason]. Effort: [low/med/high]. Expected effect: [direction, rough size].\\n2. [Action] - ...\\n3. [Action] - ...\\n\\nHow I would know it worked:\\n- Primary: [metric], measured [how], target [value] within [timeframe].\\n- Guardrail: [metric that must NOT get worse].\\n\\nRisk: [main risk]. I am accepting [trade-off] because [reason].\\n```\\n\\nRuling something *out* — \\\"this is not a pricing problem, because X\\\" — is one of the cheapest ways to signal analytical thinking. Most candidates only argue for; arguing against shows you considered alternatives.\",\"checklist\":[\"Every answer opens with a direct one-line verdict\",\"Every claim is anchored to a number from the case\",\"Every recommendation has a metric attached\",\"At least one alternative explicitly ruled out\"]},{\"id\":\"cm-frameworks\",\"title\":\"Frameworks that earn marks — and how not to look naive\",\"body\":\"Reciting a framework scores nothing. *Applying* one, and naming it in passing, scores well. Learn these four; use at most one per answer.\\n\\n### 1. The agentic visibility funnel\\n\\nThe classic marketing funnel does not describe what happens when an AI assistant is the interface. Use this instead:\\n\\n**Prompt → Retrieval → Citation → Consideration → Action**\\n\\n- **Prompt** — is your brand even in the space of questions users ask? (Category framing.)\\n- **Retrieval** — when the assistant searches, does your content come back? (Crawlability, structure, freshness.)\\n- **Citation** — of what was retrieved, does the assistant actually cite you, and in what position?\\n- **Consideration** — does the way you are described make a user want you? (Sentiment, accuracy, comparison framing.)\\n- **Action** — can the user, or their agent, actually transact? (Feeds, APIs, structured availability.)\\n\\nThis is the single most useful diagnostic tool for this theme, because it turns \\\"we are less visible\\\" into \\\"we are failing at stage 3 specifically\\\". *When it makes you look naive:* if you walk all five stages when the case clearly only concerns one.\\n\\n### 2. Root-cause laddering (five whys, done properly)\\n\\nTraffic is down → because citations are down → because our pages are not being retrieved → because our content is structured as long unsegmented prose → because we optimised for dwell time in 2019. Each rung must be supported by evidence in the case, or you are just guessing in a formal shape.\\n\\n### 3. ICE / RICE for prioritising\\n\\nWhen asked \\\"what would you do first\\\", score your options rather than listing them: **Reach × Impact × Confidence ÷ Effort**. You do not need real numbers — relative high/medium/low with one line of justification is enough and reads as disciplined. *When it makes you look naive:* inventing precise-looking scores like 7.4 with no basis.\\n\\n### 4. Effort-versus-impact 2×2\\n\\nFast to write, easy to scan, and it forces you to commit. Put your recommendations in the quadrants and say which quadrant you are starting in and why. Works especially well when the question asks for a phased plan.\\n\\n### What to avoid\\n\\nSWOT, Porter's Five Forces and the 4 Ps will read as padding here. They were not built for this problem and the evaluator will notice you reaching.\",\"checklist\":[\"Can you recite the five stages of the agentic visibility funnel from memory?\",\"One framework per answer, maximum\",\"Every framework application cites evidence from the case\",\"No SWOT\"]},{\"id\":\"cm-quant\",\"title\":\"How to quantify anything in 90 seconds\",\"body\":\"An answer with numbers beats an answer without, even when the numbers are estimates — **provided you state the assumption**. Evaluators reward visible reasoning, not precision.\\n\\n### The sentence patterns that earn the mark\\n\\n> \\\"Assuming X, that implies Y.\\\"\\n> \\\"Taking the midpoint of the range given, roughly Z.\\\"\\n> \\\"Order of magnitude: this is a lakhs problem, not a crores problem.\\\"\\n> \\\"I do not have data on X; if it is roughly Y, the conclusion holds — if it is 10× that, I would reverse this recommendation.\\\"\\n\\nThat last one is the strongest sentence in case interviewing. It shows you know which assumption your answer is load-bearing on.\\n\\n### Funnel maths\\n\\nIf 100,000 people ask a category question monthly, the assistant cites 3 brands per answer, and you appear in 12% of answers, you are visible in 12,000 answer-impressions. If those convert at a third the rate of a direct search click, and your direct-click conversion is 2%, then 12,000 × 0.67% ≈ 80 conversions. Every step there is an assumption, and every assumption is stated. That is a full-marks quantification.\\n\\n### Converting a share-of-voice delta to money\\n\\n```text\\nrevenue impact = category prompt volume\\n               x delta in share of AI answers\\n               x click-or-action rate from an AI citation\\n               x conversion rate\\n               x average order value\\n```\\n\\nYou will not have all five numbers. Take what the case gives you, assume the rest out loud, and show the multiplication.\\n\\n### Sanity checks that catch embarrassing errors\\n\\n- Does the total add to 100% where it should?\\n- Is the answer within an order of magnitude of the company's stated revenue?\\n- Would this recommendation cost more than the value it creates?\\n- Did you compare a monthly number with an annual one?\\n\\n### Reading the data table\\n\\nThe table is not decoration. It usually contains one deliberate anomaly — a metric moving against the others. Find it, name it, and build your diagnosis around it. Candidates who never reference the table lose marks even when their prose is good.\",\"checklist\":[\"At least one quantified estimate per case\",\"Every assumption stated out loud\",\"The data table is explicitly referenced\",\"One sanity check performed before committing to a number\"]},{\"id\":\"cm-writing\",\"title\":\"Writing for the evaluator\",\"body\":\"The official criteria are *analytical thinking, strategic approach, and the ability to derive actionable insights*. That is the rubric. Here is what each one actually looks like on the page.\\n\\n| Criterion | What scores | What does not |\\n|---|---|---|\\n| **Analytical thinking** | Reasoning from the data given, ruling alternatives out, spotting the anomaly in the table, stating assumptions | Restating the scenario back; asserting causes with no evidence |\\n| **Strategic approach** | Prioritised recommendations with a stated reason for the order; acknowledging trade-offs; a phased plan | An undifferentiated list of every idea you had |\\n| **Actionable insight** | Recommendations specific enough to start on Monday, with an owner, a metric and a timeframe | \\\"Improve content quality\\\", \\\"leverage AI\\\", \\\"increase engagement\\\" |\\n\\n### Phrases that signal each criterion\\n\\n- Analytical: *\\\"The anomaly here is…\\\"*, *\\\"This rules out…\\\"*, *\\\"Two readings fit this data; the one I favour is…\\\"*\\n- Strategic: *\\\"I would sequence this as…\\\"*, *\\\"The trade-off I am accepting is…\\\"*, *\\\"First, because it is reversible and cheap…\\\"*\\n- Actionable: *\\\"Within two weeks, ship…\\\"*, *\\\"Measured by… against a baseline of…\\\"*, *\\\"Owned by the content team, not engineering.\\\"*\\n\\n### Phrases that lose marks\\n\\n\\\"Leverage synergies.\\\" \\\"Robust omnichannel strategy.\\\" \\\"Best-in-class.\\\" \\\"AI-powered solution\\\" with no mechanism. \\\"Do a deep dive\\\" with no statement of what you would find. If a sentence would survive find-and-replacing the company name with any other company, delete it.\\n\\n### Formatting\\n\\nShort paragraphs. Bold the verdict line. Numbered lists for recommendations, bullets for evidence. White space is not wasted space — it is what makes a skimming evaluator find your structure.\",\"checklist\":[\"Verdict line bolded or first\",\"No sentence that would survive a company-name find-and-replace\",\"Recommendations numbered, evidence bulleted\",\"Read once for jargon and delete it\"]},{\"id\":\"cm-insight\",\"title\":\"Observation versus actionable insight\",\"body\":\"This is the difference between an average answer and a strong one. An observation describes; an insight tells someone what to do differently and how you would know it worked.\\n\\n| Weak — observation | Strong — actionable insight |\\n|---|---|\\n| \\\"Our organic traffic is declining.\\\" | \\\"Organic sessions fell 34% while category demand grew 8%, so this is share loss, not market contraction — the fix belongs to content structure, not to budget.\\\" |\\n| \\\"We should improve our SEO.\\\" | \\\"Restructure the top 20 commercial pages into question-and-answer blocks under H2 headings, because retrieval systems chunk on headings; measure by citation rate on our 50 tracked prompts within 30 days.\\\" |\\n| \\\"AI is changing search.\\\" | \\\"62% of our category prompts now return an answer with zero clicks, so we should stop optimising for click-through and start optimising for being the cited source inside the answer.\\\" |\\n| \\\"We need better content.\\\" | \\\"Our pages answer 'what is X' but users ask 'X vs Y for a 200-person team' — we have no comparison content, which is why competitors get cited on comparison prompts and we do not.\\\" |\\n| \\\"Track brand mentions.\\\" | \\\"Sample 100 fixed prompts weekly across three assistants, log which brands are cited and in what position, and alert when our share of voice moves more than 5 points week over week.\\\" |\\n| \\\"Engage with the community.\\\" | \\\"Get listed and reviewed on the three sources our competitors are cited from — G2, the two category roundups — because assistants cite aggregators more than vendor sites for comparison prompts.\\\" |\\n| \\\"Use structured data.\\\" | \\\"Add Product and FAQPage schema to the 40 SKU pages missing it; this is a two-day engineering task and it is a precondition for shopping agents parsing our catalogue at all.\\\" |\\n| \\\"Monitor sentiment.\\\" | \\\"Two of five assistants describe our onboarding as 'slow', traceable to a 2023 review; publish an updated onboarding benchmark page and re-test those prompts in 30 days.\\\" |\\n| \\\"Invest in AI.\\\" | \\\"Do not build a model. Build the measurement harness first — you cannot improve visibility you cannot see, and the harness is a two-week build.\\\" |\\n| \\\"Improve the customer journey.\\\" | \\\"The journey now starts inside an assistant, so the first controllable touchpoint is our product feed, not our homepage — audit feed completeness before touching the site.\\\" |\\n\\nRead the left column again before your round. Under time pressure, everyone drifts left. The discipline is to write the observation, then ask *\\\"so what would I do about it, and how would I know?\\\"* — and only the answer to that question goes in the box.\",\"checklist\":[\"Every observation followed by a 'so what'\",\"Every recommendation has a timeframe\",\"Every recommendation has a named metric\",\"Nothing in the left column of that table appears in your answer\"]},{\"id\":\"cm-curveballs\",\"title\":\"Curveball bank\",\"body\":\"Fifteen questions an evaluator can slip in to see whether you actually understand the problem. Three or four sentences each is the right length.\\n\\n**1. Is optimising for AI answers just gaming the system?**\\nThere is a real line. Making your content accurate, well-structured and machine-readable helps the user get a correct answer — that is legitimate. Fabricating reviews, spinning doorway pages, or stuffing prompts is manipulation and carries both platform and reputational risk. The test I would apply: would I be comfortable if the user saw exactly what I did to become visible?\\n\\n**2. What if the assistant describes your product incorrectly?**\\nFirst find the source — assistants ground answers in retrievable content, so an error usually traces to a stale page, an old review, or a competitor's comparison article. Fix the source, then re-test the prompt over the following weeks. Most platforms also have a feedback path, but content correction is the durable fix.\\n\\n**3. Your AI visibility work cannibalises your own SEO traffic. Continue?**\\nYes, if the category is moving. Defending a declining channel is more expensive than establishing a position in a growing one. But I would run them in parallel rather than switching, because organic search still carries most of the volume today and the transition timeline is uncertain.\\n\\n**4. There is no rank tracker for AI answers. How do you measure anything?**\\nBuild a prompt panel: a fixed set of representative prompts, sampled on a schedule across multiple assistants, logging which brands appear and where. It is sampling, not census, so treat it statistically — track the trend and the confidence interval, not a single week's number.\\n\\n**5. Answers are non-deterministic. Isn't your measurement noise?**\\nPartly, which is why you sample the same prompt multiple times per period and report a rate rather than a binary. Non-determinism inflates variance; it does not remove signal. Increase sample size until the week-over-week noise is smaller than the effect you care about.\\n\\n**6. Should we block AI crawlers?**\\nOnly if you are a content business whose product *is* the content and you have a licensing route. For most brands, blocking removes you from the answers your customers are reading — it protects the page view and loses the customer.\\n\\n**7. Budget is being cut by 40%. What survives?**\\nMeasurement and structured data. Measurement, because everything else is unmanageable without it. Structured data, because it is a one-time engineering cost with a durable effect. Campaign-style content production is the first thing I would cut.\\n\\n**8. Your competitor is cited more. Is that necessarily bad?**\\nNot on its own. It depends on *what* they are cited for and whether the citation is favourable. Being cited as the budget option on a premium prompt is worse than not being cited. Segment share of voice by prompt intent before treating it as a scoreboard.\\n\\n**9. How is this different from SEO?**\\nSEO optimises for a ranked list a human scans; you win a position. Generative engines synthesise an answer from several retrieved sources; you win a citation and a characterisation. The units change from keywords and rankings to prompts, citations and how you are described.\\n\\n**10. What would you do in your first 30 days?**\\nWeek 1: build the prompt panel and take a baseline. Week 2: audit structured data and crawler access. Weeks 3–4: fix the top 20 commercial pages for retrievability and ship one comparison page for the highest-volume comparison prompt. Nothing before the baseline, because otherwise nothing is attributable.\\n\\n**11. Prove the ROI.**\\nHonestly: attribution here is weak, and I would not pretend otherwise. I would use a holdout — improve one product category and not another — and compare assisted conversions and branded search volume between them. Imperfect, but far better than claiming a causal chain that the data cannot support.\\n\\n**12. Your recommendation takes six months. The CEO wants results this quarter.**\\nSplit it. Structured data and feed fixes are days, not months, and they move retrievability. Content restructuring is the slow part. I would ship the fast half this quarter with the baseline in place, and be explicit that the compounding effect is next quarter.\\n\\n**13. What if the platforms change their algorithm next month?**\\nThat is why the durable investments are the ones that are good regardless: accurate, well-structured, freshly-maintained content and clean machine-readable data. I would avoid tactics that depend on a specific retrieval quirk, because those are the ones that get patched.\\n\\n**14. Where does this sit organisationally?**\\nIt cannot sit only in SEO, because half the fixes are engineering (feeds, schema, crawler policy) and half are content. I would put the measurement harness with a data owner and give a single accountable person the share-of-voice number, with a working group across content, engineering and PR.\\n\\n**15. If you could only track one metric, which?**\\nShare of citations on a fixed panel of high-intent category prompts, weighted by citation position. It is the closest single number to \\\"when a buyer asks an assistant about this category, do we show up first\\\" — and it moves before revenue does.\",\"checklist\":[\"Can you answer curveballs 1, 4, 9 and 11 from memory?\",\"Practise saying 'I don't have that data, here is what I'd assume'\",\"Have a 30-day plan ready to deploy on any case\"]},{\"id\":\"cm-rubric\",\"title\":\"Score your own practice answer\",\"body\":\"Grade yourself honestly out of 20 after each practice case. Under 12 means rewrite it rather than moving on.\\n\\n| # | Criterion | 0 | 1 | 2 |\\n|---|---|---|---|---|\\n| 1 | Answers the question actually asked | Drifted onto another topic | Partially | Directly, in the first line |\\n| 2 | Uses the data given | Never referenced it | Quoted a number | Interpreted the anomaly |\\n| 3 | Quantification | None | One vague number | Estimate with stated assumptions |\\n| 4 | Causal reasoning | Asserted | One 'because' | Chain of reasoning, alternative ruled out |\\n| 5 | Prioritisation | Flat list | Ordered | Ordered *with the reason for the order* |\\n| 6 | Specificity | Generic advice | Somewhat specific | Startable Monday, with an owner |\\n| 7 | Measurement | Absent | Named a metric | Metric, baseline, target, timeframe |\\n| 8 | Risk / trade-off | Absent | Mentioned | Named and consciously accepted |\\n| 9 | Domain credibility | Generic marketing | Some correct terms | Mechanism-level understanding |\\n| 10 | Structure and scannability | Wall of text | Some structure | Verdict, bullets, clean skeleton |\\n\\n**16–20** — shortlist-grade. **12–15** — solid, usually losing marks on quantification and measurement. **Below 12** — the content is probably fine and the structure is failing you; rewrite using the skeleton before writing anything new.\",\"checklist\":[\"Score every practice answer before reading the model answer\",\"Score it again after, and note which two criteria you lost most on\",\"Those two criteria are your prep focus\"]}],\"theme\":[{\"id\":\"th-llm-basics\",\"section\":\"Agents & LLM fundamentals\",\"title\":\"Tokens, context windows and why they constrain everything\",\"body\":\"A language model does not read characters or words. It reads **tokens** — subword fragments produced by a tokeniser. In English, roughly 1 token ≈ 4 characters ≈ 0.75 words, so a 1,000-word page is about 1,300 tokens. Rare words, code and non-Latin scripts tokenise less efficiently.\\n\\nThe **context window** is the total number of tokens the model can attend to in one request: the system prompt, the conversation so far, any retrieved documents, and the response it is generating. Everything competes for the same budget.\\n\\nThis single constraint explains most of the architecture in agentic systems:\\n\\n- You cannot paste your whole knowledge base into the prompt, so you **retrieve** the relevant slice — that is what RAG exists for.\\n- Long conversations must be summarised or truncated, which is why agents need **memory** strategies rather than just longer transcripts.\\n- Cost and latency both scale with tokens processed, so trimming context is a direct performance optimisation, not just housekeeping.\\n\\nFor brand visibility the implication is sharp: when a user asks an assistant a question, only a handful of sources make it into the context window. Being retrievable is not enough — you have to be selected into that small set, and then survive the model's decision about what to cite.\",\"keyTerms\":[{\"term\":\"Token\",\"definition\":\"The subword unit a model actually processes; ~4 characters of English on average.\"},{\"term\":\"Context window\",\"definition\":\"Maximum tokens a model can consider in one request, shared across prompt, retrieved documents and output.\"},{\"term\":\"Truncation\",\"definition\":\"Dropping tokens that no longer fit, usually the oldest — a silent cause of an agent 'forgetting'.\"}],\"whyItMatters\":\"Every retrieval, chunking and memory decision in an agent exists because the context window is finite.\",\"examTie\":\"MCQ: estimating token counts, or which component is dropped first when context overflows. Case study: arguing why only a few sources get cited per answer.\"},{\"id\":\"th-embeddings\",\"section\":\"Agents & LLM fundamentals\",\"title\":\"Embeddings and vector search\",\"body\":\"An **embedding** maps a piece of text to a fixed-length vector of floats such that semantically similar texts land close together. \\\"How do I cancel my plan\\\" and \\\"steps to end my subscription\\\" share almost no keywords but sit near each other in embedding space.\\n\\nA **vector database** stores these vectors and answers nearest-neighbour queries. Similarity is normally **cosine similarity** — the angle between vectors, which ignores magnitude and so is robust to document length. Exact nearest-neighbour search is O(n) per query, so production systems use **ANN** (approximate nearest neighbour) indexes such as HNSW or IVF, trading a small recall loss for large speed gains.\\n\\nCritical practical points:\\n\\n- **Query and documents must use the same embedding model.** Mixing models produces vectors in incompatible spaces and the results are quietly meaningless rather than obviously broken.\\n- Embeddings capture semantic similarity, not truth or recency. A confidently wrong 2019 page embeds just as well as a correct 2026 one.\\n- **Hybrid search** — combining vector similarity with classic keyword search (BM25) — usually beats either alone, because exact terms like product names and error codes matter and embeddings blur them.\",\"keyTerms\":[{\"term\":\"Embedding\",\"definition\":\"A dense vector representation of text where distance encodes semantic similarity.\"},{\"term\":\"Cosine similarity\",\"definition\":\"Similarity measured as the cosine of the angle between two vectors; length-invariant.\"},{\"term\":\"ANN index\",\"definition\":\"Approximate nearest-neighbour structure (HNSW, IVF) that trades exact recall for sub-linear query time.\"},{\"term\":\"Hybrid search\",\"definition\":\"Blending dense vector retrieval with sparse keyword retrieval such as BM25.\"}],\"whyItMatters\":\"Retrieval quality caps answer quality — a perfect model cannot cite a document your retriever never returned.\",\"examTie\":\"MCQ: cosine vs Euclidean, why ANN is used, what breaks when embedding models are mixed.\"},{\"id\":\"th-rag\",\"section\":\"Agents & LLM fundamentals\",\"title\":\"RAG, end to end\",\"body\":\"**Retrieval-Augmented Generation** grounds a model's answer in documents fetched at query time rather than relying on what it memorised during training.\\n\\nThe pipeline, in order:\\n\\n1. **Ingest** — collect source documents.\\n2. **Chunk** — split them into retrievable pieces.\\n3. **Embed** — vectorise each chunk and store it with metadata.\\n4. **Retrieve** — embed the user's query, fetch the top-k nearest chunks.\\n5. **Rerank** *(optional but high value)* — a cross-encoder rescores the top-k with the query and chunk seen together, which is far more accurate than the initial bi-encoder similarity.\\n6. **Assemble** — build a prompt containing the query plus the surviving chunks.\\n7. **Generate** — the model answers, ideally citing which chunk supported which claim.\\n\\nRAG fixes three problems at once: knowledge cutoffs, hallucination on facts the model never learned, and the impossibility of fine-tuning on constantly changing data. What it does *not* fix is reasoning quality — bad retrieval yields a fluent answer built on the wrong documents, which is more dangerous than an obvious failure.\\n\\nThe usual failure modes: chunks too large so the signal is diluted; chunks too small so context is lost; retrieving k documents that are all near-duplicates; and no reranking, so a marginally-relevant chunk crowds out the right one.\",\"keyTerms\":[{\"term\":\"RAG\",\"definition\":\"Retrieval-Augmented Generation — grounding answers in documents retrieved at query time.\"},{\"term\":\"Top-k\",\"definition\":\"The number of chunks pulled into the prompt; the main precision/recall dial.\"},{\"term\":\"Reranker\",\"definition\":\"A cross-encoder that rescores retrieved candidates by reading query and chunk together.\"},{\"term\":\"Grounding\",\"definition\":\"Tying generated claims to specific retrieved source text.\"}],\"whyItMatters\":\"AI answer engines are RAG systems. Understanding the pipeline tells you exactly which stage your brand is failing at.\",\"examTie\":\"Case study gold: 'we are retrieved but not cited' is a rerank/selection problem, not a crawling problem — naming the right stage scores heavily.\"},{\"id\":\"th-chunking\",\"section\":\"Agents & LLM fundamentals\",\"title\":\"Chunking strategy — the most underrated lever\",\"body\":\"Chunking decides what a retriever can possibly return. Get it wrong and no amount of model quality recovers.\\n\\n**Fixed-size chunking** splits every N tokens with an overlap of perhaps 10–20%. Simple, predictable, and it cheerfully cuts sentences and tables in half.\\n\\n**Semantic or structural chunking** splits on document structure — headings, sections, paragraphs — so each chunk is a self-contained idea. For web content this is decisively better, and it is why heading hierarchy has become a retrieval concern rather than a styling one.\\n\\n**Overlap** exists so a fact spanning a boundary appears whole in at least one chunk. It costs storage and can cause duplicate retrievals.\\n\\nThe practical rules:\\n\\n- A chunk should answer a question **on its own**. If it needs the previous chunk to make sense, it is mis-split.\\n- Keep tables and code blocks intact; splitting them destroys their meaning entirely.\\n- Attach metadata — source URL, title, section heading, publish date — to every chunk. Retrieval filters and citations both depend on it.\\n- Prepend the document title and section heading to each chunk's text. It is a small change that measurably improves retrieval, because the chunk now carries its own context.\\n\\nThis is the direct mechanism linking *page structure* to *AI visibility*: content written as one long undifferentiated essay chunks badly, retrieves badly and gets cited less.\",\"keyTerms\":[{\"term\":\"Fixed-size chunking\",\"definition\":\"Splitting every N tokens regardless of meaning, usually with overlap.\"},{\"term\":\"Structural chunking\",\"definition\":\"Splitting on headings and sections so each chunk is self-contained.\"},{\"term\":\"Overlap\",\"definition\":\"Shared text between adjacent chunks so boundary-spanning facts survive.\"}],\"whyItMatters\":\"'Restructure the page into self-contained Q&A blocks under clear headings' is an actionable recommendation with a real mechanism behind it.\",\"examTie\":\"The single most useful concrete recommendation you can make in a brand-visibility case study.\"},{\"id\":\"th-tools\",\"section\":\"Agents & LLM fundamentals\",\"title\":\"Tool calling and the ReAct loop\",\"body\":\"A model alone can only emit text. **Tool calling** (function calling) is what turns it into an agent: you describe a set of functions with typed JSON schemas, and the model responds with a structured request to call one, which your code executes and feeds back.\\n\\nThe **ReAct** pattern — Reason + Act — is the loop this runs in:\\n\\n```text\\nThought  -> what do I need to f
