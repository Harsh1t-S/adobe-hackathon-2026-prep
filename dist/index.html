ind out?\\nAction   -> call tool(args)\\nObservation -> the tool's result\\nThought  -> ...repeat until the task is done\\nFinal answer\\n```\\n\\nThe model never runs anything itself. Your runtime validates arguments, executes, handles errors and decides whether to continue. That separation is where all the safety lives: the schema is a contract, and anything the model returns must be validated against it before it touches a real system.\\n\\nDesign rules that matter in practice:\\n\\n- **Tool descriptions are prompt engineering.** A vague description produces a model that picks the wrong tool.\\n- **Keep the tool set small.** Accuracy of selection degrades as the menu grows; group related actions rather than exposing dozens of near-identical functions.\\n- **Return errors as observations**, not exceptions. An agent that sees `\\\"error: no results for that date range\\\"` can recover; one that crashes cannot.\\n- **Cap the loop.** Always bound iterations, or a confused agent will spin until it exhausts your budget.\",\"keyTerms\":[{\"term\":\"Tool / function calling\",\"definition\":\"The model emitting a structured, schema-validated request for your code to execute.\"},{\"term\":\"ReAct\",\"definition\":\"Interleaving reasoning steps with tool actions and observations until the task completes.\"},{\"term\":\"Observation\",\"definition\":\"The tool result fed back into the model's context for the next reasoning step.\"}],\"whyItMatters\":\"This is the mechanism behind every 'agent' in the theme — including the shopping agent that will or will not pick your product.\",\"examTie\":\"MCQ: who actually executes a tool call (your runtime, not the model). Round 3: this is the core loop you will build.\"},{\"id\":\"th-mcp\",\"section\":\"Agents & LLM fundamentals\",\"title\":\"MCP — Model Context Protocol\",\"body\":\"**MCP** is an open protocol, introduced by Anthropic in late 2024 and since adopted broadly across the industry, that standardises how AI applications connect to external tools and data.\\n\\nBefore it, every assistant and every data source needed a bespoke integration — an N×M problem. MCP turns that into N+M: a data source implements one MCP **server**, and any MCP-capable **client** can use it.\\n\\nAn MCP server exposes three kinds of capability:\\n\\n- **Tools** — functions the model can invoke (side effects allowed).\\n- **Resources** — data the client can read into context (files, records, documents).\\n- **Prompts** — reusable templates the user can invoke deliberately.\\n\\nTransport is JSON-RPC over stdio for local servers or HTTP/SSE for remote ones.\\n\\nWhy this belongs in a brand-visibility discussion: MCP is one of the routes by which a brand becomes *directly* available to agents rather than only through crawled web pages. Shipping an MCP server that exposes your catalogue, availability or documentation makes your brand a first-class tool an assistant can call, rather than a page it might retrieve. That is a genuinely forward-looking recommendation in a case study, and it is concrete rather than hand-waving.\",\"keyTerms\":[{\"term\":\"MCP\",\"definition\":\"Model Context Protocol — an open standard for connecting AI applications to tools and data sources.\"},{\"term\":\"MCP server\",\"definition\":\"A process exposing tools, resources and prompts over the protocol.\"},{\"term\":\"N+M integration\",\"definition\":\"The reduction in integration effort from bespoke pairwise connectors to one standard interface per side.\"}],\"whyItMatters\":\"The clearest existing answer to 'how does a brand make itself directly usable by an agent, not just findable by a crawler'.\",\"examTie\":\"A high-credibility recommendation in the Round 2 case, and a plausible Round 3 build component.\"},{\"id\":\"th-hallucination\",\"section\":\"Agents & LLM fundamentals\",\"title\":\"Hallucination, grounding and evaluation\",\"body\":\"A **hallucination** is fluent output unsupported by any source — the model producing what is statistically plausible rather than what is true. It is not a bug to be patched out; it is a consequence of next-token prediction, and it is managed rather than eliminated.\\n\\nThe mitigations that actually work:\\n\\n- **Grounding** — supply the facts in context via retrieval instead of relying on parametric memory.\\n- **Citation requirements** — instruct the model to attribute each claim to a retrieved chunk, then verify the citations resolve.\\n- **Abstention** — explicitly permit \\\"I don't know\\\". Models over-answer when the prompt implies an answer must exist.\\n- **Constrained output** — schemas and enums remove whole classes of invention.\\n\\n**Evaluation** is the discipline that tells you whether any of this worked. Build a fixed eval set of representative inputs with known-good outputs, then score automatically. **LLM-as-judge** — a second model scoring outputs against a rubric — scales well but has known biases: it favours longer answers, prefers its own style, and is sensitive to option order. Mitigate by randomising positions, using a concrete rubric rather than \\\"rate 1–10\\\", and spot-checking against human labels.\\n\\nFor brand visibility this doubles as the measurement method: your eval set is a panel of prompts, and what you are scoring is whether you appear, where, and how you are described.\",\"keyTerms\":[{\"term\":\"Hallucination\",\"definition\":\"Confident output not supported by any source.\"},{\"term\":\"Grounding\",\"definition\":\"Constraining generation to supplied, retrieved evidence.\"},{\"term\":\"LLM-as-judge\",\"definition\":\"Using a model to score outputs against a rubric; scalable but biased toward length and its own style.\"},{\"term\":\"Abstention\",\"definition\":\"Explicitly allowing the model to decline rather than guess.\"}],\"whyItMatters\":\"If an assistant states something wrong about your brand, the fix is almost always the retrievable source, not the model.\",\"examTie\":\"Curveball favourite: 'what if the AI describes your product incorrectly?'\"},{\"id\":\"th-multiagent\",\"section\":\"Agents & LLM fundamentals\",\"title\":\"Planning, memory and multi-agent orchestration\",\"body\":\"**Planning** separates deciding from doing. A planner decomposes a goal into steps before execution, which beats greedy step-by-step reasoning on long tasks — and lets you show the user a plan before anything irreversible happens.\\n\\n**Memory** comes in layers, and conflating them is a common design error:\\n\\n- *Working memory* — the current context window.\\n- *Short-term* — a running summary of the session, compacted as it grows.\\n- *Long-term* — durable facts in a store, retrieved when relevant.\\n\\n**Multi-agent orchestration** splits work across specialised agents. The usual shapes:\\n\\n- **Supervisor / worker** — one orchestrator decomposes and delegates, workers report back. Predictable and easy to debug.\\n- **Pipeline** — fixed stages, each agent's output feeding the next.\\n- **Debate / critic** — one agent produces, another attacks, improving reliability on judgement-heavy tasks.\\n\\nMulti-agent is not automatically better. It multiplies token cost, adds coordination failure modes, and errors compound across handoffs. Use it when subtasks are genuinely independent (parallel speedup) or when an adversarial second opinion measurably improves quality — not because it sounds sophisticated. Saying that out loud in a case study or a Round 3 pitch reads as judgement rather than buzzword fluency.\",\"keyTerms\":[{\"term\":\"Supervisor pattern\",\"definition\":\"A single orchestrating agent that decomposes a goal and delegates to workers.\"},{\"term\":\"Context compaction\",\"definition\":\"Summarising older conversation to free context while retaining the thread.\"},{\"term\":\"Critic agent\",\"definition\":\"A second agent that reviews or attacks the first's output to catch errors.\"}],\"whyItMatters\":\"Knowing when NOT to use multiple agents is the part that distinguishes an engineer from someone repeating a trend.\",\"examTie\":\"Round 3 architecture defence: judges ask why you chose the design you did.\"},{\"id\":\"th-geo\",\"section\":\"Brand visibility in the agentic era\",\"title\":\"GEO and AEO — and how they differ from SEO\",\"body\":\"**SEO** optimises for position in a ranked list of links that a human then scans and clicks. The unit of success is a *ranking*, and the payoff is a *click*.\\n\\n**AEO (Answer Engine Optimization)** targets being the source used to construct a direct answer — featured snippets, voice assistants, AI overviews. The unit of success is *being the answer*.\\n\\n**GEO (Generative Engine Optimization)** targets being retrieved, selected and cited inside a synthesised generative answer, and being *characterised favourably* within it. The unit of success is a *citation plus a description*.\\n\\nWhat actually changes:\\n\\n| | SEO | GEO |\\n|---|---|---|\\n| Target | Rank in a list | Citation inside an answer |\\n| Unit of demand | Keyword | Prompt, often long and conversational |\\n| Competitive set | Ten blue links | Three to five cited sources |\\n| Payoff | Click | Mention, citation, recommendation |\\n| Measurement | Rank tracking, deterministic | Prompt sampling, probabilistic |\\n\\nWhat carries over: technical crawlability, genuine authority, freshness, and content that answers a real question. What is new: writing in self-contained retrievable blocks, being consistent across the web so entity resolution works, earning presence on the third-party sources assistants trust for comparisons, and accepting that measurement is sampled rather than exact.\\n\\nThe honest framing for a case study: GEO is not a replacement discipline with a separate budget. It is largely SEO's technical foundation plus a different content shape and a different measurement model.\",\"keyTerms\":[{\"term\":\"GEO\",\"definition\":\"Generative Engine Optimization — optimising to be retrieved and cited inside AI-generated answers.\"},{\"term\":\"AEO\",\"definition\":\"Answer Engine Optimization — optimising to be the direct answer to a question.\"},{\"term\":\"Prompt\",\"definition\":\"The unit of demand in generative search, replacing the keyword.\"}],\"whyItMatters\":\"The vocabulary the case study will be written in. Using it precisely signals you understand the mechanism, not just the acronym.\",\"examTie\":\"Near-certain to appear. Be able to state the SEO/GEO difference in two sentences without waffle.\"},{\"id\":\"th-citation\",\"section\":\"Brand visibility in the agentic era\",\"title\":\"How answer engines select and cite sources\",\"body\":\"Broadly, a generative answer engine runs a RAG pipeline against a live index:\\n\\n1. **Query fan-out** — your one prompt is rewritten into several search queries. A question like \\\"best project tool for a 200-person engineering org\\\" may become separate searches for team-size guidance, category comparisons, and pricing.\\n2. **Retrieval** — each query hits a search index; candidate pages come back.\\n3. **Selection and reranking** — a small number of passages survive into the context window.\\n4. **Synthesis** — the model composes an answer from the surviving passages.\\n5. **Attribution** — citations are attached to the claims they support.\\n\\nEvery stage is a place to lose:\\n\\n- **Not indexed** — crawler blocked, JavaScript-only rendering, no sitemap. You never enter the funnel.\\n- **Not retrieved** — your page does not match the *rewritten* queries, which are often more specific than the head term you optimised for.\\n- **Retrieved but not selected** — the passage is not self-contained, so a competitor's tighter section wins the slot.\\n- **Selected but not cited** — your fact was used but attributed elsewhere, often because an aggregator stated it more quotably.\\n- **Cited but poorly characterised** — you appear as the expensive option or the one with slow onboarding.\\n\\nDiagnosing *which* stage you are failing at is the single most valuable analytical move available in the Round 2 case, because each stage has a completely different fix.\",\"keyTerms\":[{\"term\":\"Query fan-out\",\"definition\":\"Expansion of one user prompt into several underlying search queries.\"},{\"term\":\"Passage selection\",\"definition\":\"Choosing which retrieved chunks make it into the generation context.\"},{\"term\":\"Attribution\",\"definition\":\"Linking a generated claim back to the source that supported it.\"}],\"whyItMatters\":\"Turns 'we are invisible' into a specific, fixable stage failure.\",\"examTie\":\"Use this ladder to structure your diagnosis answer. It reads as mechanism-level understanding.\"},{\"id\":\"th-sov\",\"section\":\"Brand visibility in the agentic era\",\"title\":\"Share of voice and measurement without a rank tracker\",\"body\":\"There is no rank tracker for generative answers, because there is no stable ranked list — answers are non-deterministic, personalised and change between runs. Measurement therefore becomes **sampling**, and you must design it deliberately.\\n\\nA workable measurement system:\\n\\n1. **Define a prompt panel** — 100–300 prompts representing real category demand, segmented by intent: discovery (\\\"what is X\\\"), comparison (\\\"X vs Y\\\"), and transactional (\\\"best X for Z, under ₹N\\\").\\n2. **Sample on a schedule** — run every prompt across each assistant you care about, several times per period, from a consistent locale and a clean session so personalisation does not contaminate the baseline.\\n3. **Extract** — for each answer, log which brands are mentioned, in what order, which URLs are cited, and the sentiment of the description.\\n4. **Score** — share of voice = your weighted mentions ÷ all brand mentions. Weight by citation position; being named first is worth far more than being fourth.\\n5. **Track the trend, with error bars.** A single week's number is noise. Report a rolling average and be explicit about variance.\\n\\nThe statistical discipline matters. If your sample gives ±6 points of week-to-week noise and you announce a 4-point improvement, you have announced nothing. Increase samples per prompt until the noise floor is below the effect you care about — and say so in the case study, because almost nobody does, and it is exactly the analytical rigour the rubric rewards.\",\"keyTerms\":[{\"term\":\"Prompt panel\",\"definition\":\"A fixed, representative set of prompts sampled repeatedly to measure visibility over time.\"},{\"term\":\"Share of voice\",\"definition\":\"Your share of total brand mentions or citations across sampled answers, ideally position-weighted.\"},{\"term\":\"Non-determinism\",\"definition\":\"The same prompt yielding different answers across runs, forcing statistical rather than exact measurement.\"}],\"whyItMatters\":\"'You cannot improve what you cannot measure, and measurement here is sampling' is the strongest opening move in most of these cases.\",\"examTie\":\"A question asking you to design the measurement system is highly likely. This card is the answer.\"},{\"id\":\"th-structured\",\"section\":\"Brand visibility in the agentic era\",\"title\":\"Structured data, entities and product feeds\",\"body\":\"**Schema.org markup** (usually JSON-LD in the page head) states explicitly what a page is about: `Product` with price and availability, `FAQPage` with question–answer pairs, `Organization`, `Review`, `HowTo`. It removes the need for a machine to infer structure from prose, and it is a precondition for anything transactional.\\n\\n**Entity consistency** is the less obvious half. Search and answer systems resolve your brand to an entity in a knowledge graph. If your name, category, founding details, executives and descriptions differ across your site, Wikipedia/Wikidata, LinkedIn, review platforms and directories, resolution gets noisy and you show up less confidently — or get conflated with a similarly named company. Auditing and aligning that footprint is unglamorous and genuinely effective.\\n\\n**Product feeds** matter enormously for agentic commerce. An agent asked to \\\"reorder my usual groceries under ₹2,000\\\" needs machine-readable price, availability, size, substitutions and delivery windows. If your catalogue exists only as rendered HTML behind a JavaScript app, you are not a candidate — not because you lost a ranking, but because you were never parseable in the first place.\\n\\nThis is why \\\"audit feed completeness before touching the website\\\" is a genuinely strong recommendation: it is cheap, fast, engineering-owned, and it gates everything downstream.\",\"keyTerms\":[{\"term\":\"JSON-LD\",\"definition\":\"The recommended format for embedding schema.org structured data in a page.\"},{\"term\":\"Entity resolution\",\"definition\":\"A system mapping mentions of a brand to a single knowledge-graph entity.\"},{\"term\":\"Product feed\",\"definition\":\"A machine-readable catalogue of items with price, availability and attributes.\"}],\"whyItMatters\":\"The cheapest, fastest, most defensible recommendation in almost any brand-visibility case.\",\"examTie\":\"Name the specific schema types. 'Add Product and FAQPage schema to the 40 SKU pages missing it' beats 'use structured data'.\"},{\"id\":\"th-crawlers\",\"section\":\"Brand visibility in the agentic era\",\"title\":\"AI crawlers, robots.txt and llms.txt\",\"body\":\"AI systems reach your content through named crawlers, and they split into two purposes that you can control separately:\\n\\n- **Training crawlers** collect data to train future models.\\n- **Retrieval / user-triggered fetchers** fetch pages live to answer a specific question right now.\\n\\n`robots.txt` lets you allow or disallow specific user-agents. The strategic point: blocking a *training* crawler protects your content from being absorbed into model weights, while blocking a *retrieval* fetcher removes you from live answers your customers are reading today. Those are very different trades, and conflating them is the most common mistake in this debate.\\n\\n**`llms.txt`** is a proposed convention — a markdown file at your domain root offering a curated, LLM-friendly map of your most important content. Adoption is not universal and it is not a standard in the way `robots.txt` is; treat it as cheap, low-risk, and not a substitute for structured content.\\n\\nThe publisher's dilemma sits here: block and lose visibility, allow and be summarised without traffic, or license and get paid. Several large publishers have taken the licensing route. For most non-publisher brands the calculus is simpler — your content is marketing for a product you sell, so being read is the point, and blocking retrieval fetchers is self-harm.\",\"keyTerms\":[{\"term\":\"robots.txt\",\"definition\":\"Per-user-agent crawl directives at your domain root.\"},{\"term\":\"llms.txt\",\"definition\":\"A proposed markdown index of a site's key content aimed at LLM consumption; a convention, not a standard.\"},{\"term\":\"Training vs retrieval crawler\",\"definition\":\"Bots that gather data for model training versus those fetching pages live to answer a query.\"}],\"whyItMatters\":\"The distinction between training and retrieval crawlers is the crux of the 'should we block AI' question.\",\"examTie\":\"Expect a curveball on blocking. Make the training/retrieval distinction and you have separated yourself from most answers.\"},{\"id\":\"th-zeroclick\",\"section\":\"Brand visibility in the agentic era\",\"title\":\"Zero-click, and what replaces the click\",\"body\":\"When an assistant answers directly, the user's need is met without visiting a source. Traffic falls even when brand presence holds — sometimes *especially* when it holds, because a complete answer removes the reason to click.\\n\\nThis breaks the entire measurement stack that marketing teams grew up on. Sessions, bounce rate and click-through were proxies for attention; they no longer capture attention that happens inside someone else's interface.\\n\\nWhat replaces them:\\n\\n- **Citation share** — how often you are the cited source on your panel of prompts.\\n- **Answer presence and position** — are you mentioned, and how early.\\n- **Sentiment and framing** — being cited as \\\"the enterprise-grade option\\\" versus \\\"a cheaper alternative\\\" are very different outcomes from the same citation count.\\n- **Branded search and direct volume** — the durable downstream signal that AI exposure is working, because people who heard about you inside an answer later look you up by name.\\n- **Assisted conversions** — conversions where an AI referral appears anywhere in the path.\\n\\nThe strategic reframing to state plainly in a case study: **stop optimising for the click, start optimising for the mention** — while being honest that attribution is now weaker and holdout tests, not last-click models, are how you will prove impact.\",\"keyTerms\":[{\"term\":\"Zero-click\",\"definition\":\"The user's need satisfied within the answer surface, with no visit to the source.\"},{\"term\":\"Citation share\",\"definition\":\"Proportion of sampled answers in which your domain is a cited source.\"},{\"term\":\"Holdout test\",\"definition\":\"Improving one segment and not another to infer causal impact where attribution is unreliable.\"}],\"whyItMatters\":\"Explains why traffic can fall while the brand is doing fine — and why traffic alone is now the wrong KPI.\",\"examTie\":\"Nearly every case will hand you a declining-traffic chart. This is how you interpret it without panicking.\"},{\"id\":\"th-agentic-commerce\",\"section\":\"Brand visibility in the agentic era\",\"title\":\"Agentic commerce — when the buyer is software\",\"body\":\"The theme's sharpest edge: an agent that does not just recommend but **transacts**. \\\"Reorder my usual groceries, keep it under ₹2,000, swap anything out of stock.\\\"\\n\\nWhen software is the buyer, the levers change:\\n\\n- **Persuasion stops working.** Photography, copy and emotional positioning are aimed at a human visual system the agent does not have. What survives is structured fact: price, availability, specification, delivery window, return policy, rating.\\n- **Machine-readability becomes the shelf.** If your catalogue is not parseable, you are not on the shelf at all.\\n- **Constraint satisfaction decides the winner.** The agent is solving \\\"under ₹2,000, in stock, delivers tomorrow\\\". Being 3% cheaper on a matched specification can beat twenty years of brand equity for that transaction.\\n- **The brand's job shifts upstream** — to being the *specified* brand, the one the user names in the prompt, because that is the only part the agent will not optimise away.\\n\\nThat last point is the genuinely interesting strategic tension, and a strong case-study answer names it: in an agentic funnel, brand equity's role moves from winning the purchase decision to surviving the constraint filter and being named in the prompt.\",\"keyTerms\":[{\"term\":\"Agentic commerce\",\"definition\":\"Purchases researched, decided or executed by an autonomous agent on a user's behalf.\"},{\"term\":\"Constraint satisfaction\",\"definition\":\"The agent matching hard requirements — price, availability, delivery — before any preference applies.\"},{\"term\":\"Specified brand\",\"definition\":\"A brand named directly in the user's prompt, bypassing the agent's selection entirely.\"}],\"whyItMatters\":\"The most forward-looking framing available for this theme, and it produces genuinely non-obvious recommendations.\",\"examTie\":\"If a case involves retail, groceries or e-commerce, this is your differentiating angle.\"},{\"id\":\"th-sentiment\",\"section\":\"Brand visibility in the agentic era\",\"title\":\"How you are described, not just whether you appear\",\"body\":\"Citation count is a vanity metric on its own. Being mentioned as \\\"powerful but with a steep learning curve and slow support\\\" in every comparison is worse than three neutral mentions.\\\\n\\\\nWhere an assistant's characterisation of you comes from:\\\\n\\\\n- **Review platforms and aggregators** — heavily weighted for comparison prompts, because they are structured, comparative and perceived as independent.\\\\n- **Third-party roundups and 'best X' listicles** — the exact format that answers comparison questions, which is why competitors who invest in being listed get cited more.\\\\n- **Your own documentation** — surprisingly influential, and the part you fully control.\\\\n- **Old content that never died.** A 2023 review describing a since-fixed problem stays retrievable forever and keeps shaping how you are described.\\\\n\\\\nThe actionable move is a **sentiment audit**: run your prompt panel, extract the adjectives and caveats attached to your brand, trace each recurring one back to its likely source, then fix the source. If three assistants call your onboarding slow, there is a retrievable document saying so — find it and publish something newer, better structured and more quotable.\\\\n\\\\nThis is also the honest answer to \\\"the AI is wrong about us\\\": you almost never fix the model. You fix what the model retrieves.\",\"keyTerms\":[{\"term\":\"Sentiment audit\",\"definition\":\"Extracting and classifying how a brand is described across sampled AI answers.\"},{\"term\":\"Source tracing\",\"definition\":\"Mapping a recurring characterisation back to the retrievable document causing it.\"}],\"whyItMatters\":\"Separates candidates who count mentions from those who understand that framing is the actual outcome.\",\"examTie\":\"Strong material for the 'what would you measure' and 'the AI describes us wrongly' questions.\"},{\"id\":\"th-adobe-dx\",\"section\":\"Adobe context\",\"title\":\"Adobe Experience Cloud — what the products actually do\",\"body\":\"Round 3 is judged partly on whether your solution feels relevant to Adobe's business. Knowing roughly what these products do, and saying it accurately, is worth real credibility.\\n\\n- **Adobe Experience Platform (AEP)** — the underlying customer-data platform. Ingests behavioural and profile data from many sources and unifies it into real-time customer profiles on a common schema (XDM).\\n- **Real-Time CDP** — built on AEP; assembles unified profiles and activates audience segments to downstream channels.\\n- **Adobe Analytics** — analytics and reporting across digital touchpoints.\\n- **Adobe Journey Optimizer (AJO)** — designs and executes personalised, triggered customer journeys across channels.\\n- **Adobe Experience Manager (AEM)** — content management and digital asset management; where the actual web content and assets live.\\n- **Firefly** — Adobe's generative AI family for image, video and design, built with commercial safety in mind.\\n- **AEP Agent Orchestrator** — Adobe's framework for building and coordinating AI agents across Experience Platform data and applications.\\n\\nThe commercial logic connecting these to this year's theme: Adobe sells the stack brands use to be visible and to convert. If discovery migrates from search results into AI assistants, Adobe's customers need to measure and influence visibility on those surfaces — which is precisely why the hackathon theme is what it is. Adobe also announced its intent to acquire Semrush in November 2025, which points squarely at owning brand-visibility measurement.\",\"keyTerms\":[{\"term\":\"AEP\",\"definition\":\"Adobe Experience Platform — the customer data foundation underpinning Adobe's DX applications.\"},{\"term\":\"XDM\",\"definition\":\"Experience Data Model — the standard schema AEP uses to unify data across sources.\"},{\"term\":\"Agent Orchestrator\",\"definition\":\"Adobe's framework for building and coordinating AI agents over Experience Platform data.\"}],\"whyItMatters\":\"Grounding a recommendation in the customer's actual product line is a cheap, high-return credibility move.\",\"examTie\":\"Reference one product accurately rather than listing all of them. A wrong claim is worse than no claim.\"},{\"id\":\"th-adobe-why\",\"section\":\"Adobe context\",\"title\":\"Why Adobe set this theme\",\"body\":\"Reason backwards from the business and the whole hackathon makes sense.\\n\\nAdobe's Digital Experience division sells brands the tooling to attract, understand, convert and retain customers on digital surfaces. That business assumes there *is* a surface the brand controls or can influence — a website, a campaign, a search result, an app.\\n\\nAgentic AI puts an intermediary between the brand and the customer. If a user asks an assistant rather than browsing, then:\\n\\n- The brand's website may never be visited, so on-site optimisation loses reach.\\n- The brand's message is *paraphrased by a third party* rather than delivered as written — a genuine loss of control over positioning.\\n- Attribution weakens, so proving marketing's value gets harder exactly when budgets are scrutinised.\\n\\nEvery Adobe customer will face this, few know how to measure it, and almost nobody has tooling. That is a product gap — which is why \\\"Speak to Agents: The New Language of Brand Visibility\\\" is the theme, and why the announced intent to acquire Semrush in November 2025 reads as a move to own that measurement layer.\\n\\n**What this implies for your Round 3 build:** solutions that *measure and improve brand visibility inside AI answers* sit directly on Adobe's commercial roadmap. A generic chatbot does not. If you can articulate, in one sentence, which Adobe customer problem your project solves and what it would replace, you are ahead of most teams before you have written a line of code.\",\"keyTerms\":[{\"term\":\"Digital Experience (DX)\",\"definition\":\"Adobe's enterprise division selling marketing, analytics and content tooling to brands.\"},{\"term\":\"Intermediation\",\"definition\":\"An agent standing between brand and customer, paraphrasing the brand's message.\"}],\"whyItMatters\":\"Judges reward solutions that understand the business problem, not just the technology.\",\"examTie\":\"Frame your Round 3 pitch as 'this is the tool an Adobe customer needs and cannot currently buy'.\"}],\"strategy\":[{\"id\":\"speed-marking\",\"title\":\"Speed is half the marks — read this first\",\"body\":\"This is the rule that makes Round 1 unlike any exam you have sat, and most candidates will not have read it.\\n\\n> **Official wording:** *\\\"You'll get separate marks for accuracy (correct answer) and speed (time taken to answer). Example: A question of 4 marks has a timer of 120 seconds with the correct answer as Unstop. You answered Unstop in 30 seconds. Then you get 2 for accuracy and 1.5 for speed, so a total of 3.5 marks. Marks for speed are calculated based on the percentage of time remaining.\\\"*\\n\\n### The maths\\n\\nHalf the marks are accuracy, half are speed, and speed scales linearly with the fraction of the question's time still on the clock:\\n\\n```text\\nmarks = (M / 2)                     if correct, else 0\\n      + (M / 2) x (time_remaining / time_allowed)   for speed\\n```\\n\\nWith a 60-second question worth 4 marks:\\n\\n| Answered at | Time remaining | Accuracy | Speed | Total |\\n|---|---|---|---|---|\\n| 10 s | 83% | 2.0 | 1.67 | **3.67** |\\n| 20 s | 67% | 2.0 | 1.33 | **3.33** |\\n| 30 s | 50% | 2.0 | 1.00 | **3.00** |\\n| 45 s | 25% | 2.0 | 0.50 | **2.50** |\\n| 58 s | 3% | 2.0 | 0.07 | **2.07** |\\n\\n**Answering a question you know in 10 seconds instead of 45 is worth more than a whole extra correct answer's accuracy marks.** Across 15 questions, habitually answering at 20 s rather than 45 s is worth roughly **12 marks** — the difference between shortlisted and not.\\n\\n### What this changes about how you sit the paper\\n\\n- **The moment you know it, submit it.** Do not re-read. Do not double-check a question you were confident about. Confirmation costs more than it protects.\\n- **Never run the clock down.** There is no benefit to using your full minute — you cannot go back, so time not spent answering is simply thrown away.\\n- **Decide fast on the ones you do not know.** If you are 15 seconds in with no route to the answer, eliminate and commit. Sitting there earns nothing even if you eventually get it right, because speed marks are already gone.\\n\\n### The one caveat, stated honestly\\n\\nThe guidelines do not explicitly say whether speed marks are awarded on a *wrong* answer. The worked example only covers a correct one. **Assume speed marks require a correct answer** — if it were otherwise, slamming a random option in one second on every question would be optimal, which no assessment is designed to reward. So: fast **and** right. Do not turn this into a reason to guess instantly.\",\"checklist\":[\"Submit the instant you are confident — no re-reading\",\"Never let a question's clock run out on a question you can answer\",\"15-second rule on questions you cannot see a route into\",\"Practise on the mock until fast submission feels normal\"]},{\"id\":\"no-going-back\",\"title\":\"You cannot go back — and what that removes from your toolkit\",\"body\":\"> **Official wording:** *\\\"You won't be able to browse through the questions. If you either skip your question or submit your answer, it is marked and stored, and cannot be altered.\\\"* And: *\\\"You have to submit answers/code/solutions to all the questions individually. Otherwise your response will NOT be recorded.\\\"*\\n\\n**Every exam habit you have built is now wrong.** There is no question palette, no Mark for Review, no two-pass strategy, no coming back at the end. Each question appears once, you answer or skip, and it closes.\\n\\n### What this deletes\\n\\n- **The two-pass strategy.** Flagging hard questions to return to later does not exist here. You cannot return.\\n- **Guessing now and refining later.** Your first submission is your only submission.\\n- **Banking time for the end.** Time saved on question 3 does not help question 12 — each question has its own minute, and unused time is lost, not pooled.\\n\\n### What it adds\\n\\n- **Every question is independent.** A disaster on question 4 cannot bleed into question 5 unless you let it. There is no cumulative time deficit to panic about.\\n- **The decision is always the same:** answer now, or skip now. That is the entire decision tree. It is simpler than a normal paper, and much less forgiving.\\n\\n### The forced-commitment routine\\n\\n1. **Read the last line first** — what is actually being asked.\\n2. **0–10 s:** do you recognise the pattern? If yes, answer and submit.\\n3. **10–25 s:** work it, or eliminate options. Commit to whichever gives the best expected value.\\n4. **25 s:** commit regardless. Pick the best surviving option and submit. Never let the clock expire — an expiry gives you zero speed marks *and* zero chance of the accuracy marks you might have got from an educated guess.\\n\\n**Never deliberately skip.** Skipping and answering wrongly score the same — zero — but a guess has a real chance of being right. Since there is no negative marking mentioned anywhere in the guidelines, **there is never a reason to leave a question unanswered.** Confirm the negative-marking rule on the instruction screen on the day, but the default assumption is: always answer.\",\"checklist\":[\"Unlearn the two-pass habit before the exam, not during it\",\"Commit by 25 seconds on every MCQ\",\"Never let a question auto-expire\",\"Never skip — a guess strictly dominates a blank\"]},{\"id\":\"clock-a\",\"title\":\"Section A: 15 MCQs, one minute each\",\"body\":\"Fifteen questions, sixty seconds each, auto-advance when the minute is up. Sixty seconds is not enough to *derive* an answer. It is enough to *recognise* one.\\n\\n### The 60-second budget\\n\\n| Seconds | What should be happening |\\n|---|---|\\n| 0–5 | Read the last line of the stem. Identify what is being asked. |\\n| 5–15 | Recognise the pattern. If you know it, answer and submit — you are done at 15 s with 75% of the speed marks. |\\n| 15–25 | Not recognised: eliminate options. Kill impossible complexity classes, impossible types, impossible magnitudes. |\\n| 25–40 | Work the survivors. If two remain and you cannot separate them, pick and go. |\\n| 40 | Hard stop. Submit whatever you have. |\\n\\nNothing after 40 seconds is worth much — the speed marks are nearly gone by then and you still risk the auto-advance taking the decision out of your hands.\\n\\n### Fast elimination heuristics\\n\\n| Question shape | Fast route |\\n|---|---|\\n| Count the loop iterations | Look at where the inner index *starts*. `j = i` → n(n+1)/2. `j = i+1` → n(n-1)/2. `j = 0` → n². |\\n| \\\"What is the complexity\\\" | Find the loop that multiplies or divides a variable — that is your log. Additive loops do not nest. |\\n| Predict the output | Look for the trap first: mutation, aliasing, integer division, pre/post increment, short-circuit evaluation. |\\n| Which data structure | Match the operation set, then the complexity guarantee. \\\"Ordered\\\" rules out hash tables. |\\n| Which algorithm applies | Look for the disqualifying constraint: negative edges kill Dijkstra, cycles kill topological sort. |\\n| Normal forms / ACID / isolation | Pure recall. You know it in 10 seconds or you eliminate and move. |\\n| Probability | Look for the complement — `1 − P(none)` is almost always less arithmetic. |\\n\\n**Eliminate by dimension.** If the options are `O(n)`, `O(n log n)`, `O(n²)`, `O(2ⁿ)`, a single non-recursive loop can never be exponential, and if nothing halves anything then `O(n log n)` usually dies too. Two eliminations turn a 25% guess into a 50% one, in about four seconds.\\n\\n**The distractors are built from your mistakes.** In a well-built paper the wrong options are the answers you get by making the specific common error. If your answer appears instantly and exactly as an option, spend three seconds checking you did not fall into the obvious trap — but only three.\",\"checklist\":[\"Hard stop and submit at 40 seconds, every question\",\"Practise recognising the seven question shapes above\",\"Eliminate by dimension before working anything\",\"Read the last line of the stem first\"]},{\"id\":\"clock-b\",\"title\":\"Section B: 2 coding problems in 45 minutes\",\"body\":\"The stage description gives Section B 45 minutes for 2 coding challenges — roughly **22 minutes each**, including reading, writing and debugging.\\n\\n**An ambiguity to resolve on the day.** The guidelines state a blanket *\\\"Time per Question: 00:01:00\\\"* while the stage description gives the coding section 45 minutes. One minute per coding problem would be impossible, so the per-question figure is almost certainly the MCQ section's setting. **Check the actual per-question timer on the first coding screen before you start typing.** If it really shows one minute, your only rational play is to write the most correct skeleton you can in that minute — so know that possibility exists rather than freezing when you see it.\\n\\n### The 22-minute procedure\\n\\n| Minutes | What |\\n|---|---|\\n| 0–2 | Read fully. Restate the input/output contract in one line. |\\n| 2–4 | Name the pattern. Two pointers, sliding window, hash counting, sort-then-scan, binary search on the answer, BFS/DFS, topological sort, 1D DP, 2D DP, greedy, monotonic stack, heap. If you cannot name it in two minutes, write the brute force — it often reveals the pattern. |\\n| 4–6 | Write the signature, the return, and the degenerate cases first. `if not arr: return 0` costs nothing and saves whole test cases. |\\n| 6–16 | Write the solution. |\\n| 16–19 | Dry-run sample 1 by hand, tracing the state. This is the highest-value three minutes in the section. |\\n| 19–22 | Fix, submit. |\\n\\n**Submitting is final here too.** You cannot come back and improve it, so the calculus changes: **a working brute force submitted beats an elegant solution you are still debugging.** If you have something correct at minute 15 and an optimisation in mind, weigh whether you can finish and verify the optimisation before the clock — if it is close, submit the version that works.\\n\\n### The bugs that actually cost marks\\n\\n- **Off-by-one** in loop bounds — `<` vs `<=`, `n-1` vs `n`.\\n- **Integer overflow in Java and C++.** `int` dies past 2,147,483,647. Constraints allowing values to 10⁹ summed over n elements need `long` / `long long`. Python is immune.\\n- **Printing instead of returning**, or the reverse. Check what the harness wants.\\n- **Unhandled empty input.** The suite always includes it.\\n- **Mutating the input** when the contract forbids it.\\n- **Reading input wrong** — a parsing bug looks exactly like an algorithm bug and wastes your whole budget.\\n\\n### Language\\n\\nWrite in whichever you type fastest without lookups. **Python** for fewest keystrokes, no overflow, and `Counter` / `defaultdict` / `deque` / `heapq` / `bisect` / `lru_cache` doing the work. **Java** if you are more fluent there — watch `int` overflow and never `String +=` in a loop. **C++** only if you already compete in it. Decide before the exam, not during.\",\"checklist\":[\"Check the real per-question timer on the first coding screen\",\"Restate the contract in one line before coding\",\"Degenerate cases in the first two lines of the function\",\"Dry-run sample 1 by hand before submitting\",\"Submit a working brute force rather than an unfinished optimum\"]},{\"id\":\"proctoring\",\"title\":\"Proctoring: set your room up before you start\",\"body\":\"This assessment runs under active surveillance and the guidelines are explicit that violations can terminate your attempt. Most of these are fixed in five minutes *before* you start and are unfixable once the clock is running.\\n\\n### Hard requirements\\n\\n- **Unstop SmartHire app.** The assessment runs only there. Install and open it well before the window — not at 1:55 PM.\\n- **Desktop or laptop only.** Phones and tablets are unsupported and you will be forced to switch devices mid-attempt.\\n- **Working webcam and microphone.** Both are required. Test them in the app first.\\n- **Fullscreen throughout.** Exiting, switching tabs or minimising \\\"may lead to warnings and eventually termination of your assessment.\\\"\\n- **No external displays.** Physically unplug the second monitor. A connected display can terminate the attempt.\\n\\n### Things that flag you without you realising\\n\\n- **Resting your hand on your face.** The guidelines call this out specifically — it can trigger a *\\\"mobile phone detected\\\"* violation. Keep your hands on the keyboard or the desk.\\n- **Background noise.** Audio is monitored constantly. Other voices, a television, a conversation in the next room, or someone walking in all register as violations. Lock the door and tell your household.\\n- **Clothing with images or logos.** Explicitly discouraged. Wear something plain.\\n- **Any of WhatsApp, Discord, Chrome, ChatGPT or similar left open.** Not minimised — **closed**. The guidelines say this causes an *automatic exit* and is flagged. Quit them properly, including anything auto-starting in the background.\\n- **Screen sharing.** Any detection restricts you from continuing. Close Zoom, Meet, Teams, AnyDesk, OBS.\\n\\n### The five-minute pre-flight\\n\\n1. Unplug external monitors. Single screen only.\\n2. Quit every application except SmartHire. Check the system tray — Discord and Steam hide there.\\n3. Test webcam and microphone inside the app.\\n4. Quiet room, door shut, phone in another room, household told.\\n5. Plain clothing, good lighting on your face, hands off your face.\\n6. Laptop on mains power, battery saver off, wired internet if you have it, hotspot charged as backup.\\n\\n**Start early in the window.** It opens 09 Aug 02:00 PM IST and closes 10 Aug 02:00 PM IST, but you must **start by 10 Aug 02:00 PM to get the full hour**. Starting at the last moment leaves no room for a device problem, a webcam failure, or support being slow. Aim to start with many hours of window remaining.\",\"checklist\":[\"SmartHire app installed and tested well in advance\",\"External displays physically disconnected\",\"WhatsApp, Discord, Chrome, ChatGPT fully quit, tray included\",\"Webcam and mic tested inside the app\",\"Quiet room secured, phone elsewhere, household warned\",\"Plain clothing, hands off face\",\"Started with hours of the window still left\"]},{\"id\":\"coding-procedure\",\"title\":\"A repeatable procedure for coding under a timer\",\"body\":\"Under stress you do not rise to the occasion; you fall to your procedure. Do these six things in this order, every time.\\n\\n**1. Restate the contract.** One line: *input is an array of n ints, output is a single int, n can be 0.* Half of all wrong submissions are correct answers to a slightly different question.\\n\\n**2. Name the pattern.** Say which one it is out loud. If you cannot name it in 90 seconds, write the brute force — the brute force usually reveals the pattern.\\n\\n**3. Write the signature and the return first.** Then fill the middle. This stops you writing a function that returns nothing on some path.\\n\\n**4. Handle degenerate cases at the top.** Empty, single element, all identical. Two lines that cost nothing.\\n\\n**5. Dry-run on the sample before submitting.** Actually trace it — take sample 1 and walk the state through. Not \\\"it looks right\\\".\\n\\n**6. Only then submit.** And remember submission is final.\\n\\n### Patterns worth being able to name instantly\\n\\nTwo pointers · sliding window · prefix sums · hash-map counting · sort-then-scan · binary search on the answer · BFS/DFS on grids and graphs · topological sort · union-find · monotonic stack · heap / top-K · 1D DP · 2D DP · greedy with an exchange argument · bit manipulation.\\n\\nIf you can look at a statement and produce the right name from that list in under two minutes, you will finish both problems. If you cannot, that recognition speed is the single highest-leverage thing to drill in the coding lab.\",\"checklist\":[\"Contract restated in one line\",\"Pattern named before coding\",\"Degenerate cases first\",\"Sample dry-run by hand before submit\"]},{\"id\":\"average\",\"title\":\"Because the team score is the average\",\"body\":\"The official brief: *\\\"The team's final score will be calculated based on the average score of all its members.\\\"* Every member also takes the assessment **individually** — *\\\"All team members will be able to take the assessments individually.\\\"*\\n\\n**The arithmetic.** In a 3-person team, moving your strongest member from 12/15 to 14/15 lifts the team average by 0.67. Moving your weakest from 6/15 to 10/15 lifts it by 1.33 — **double the return, and far easier**. Marks at the bottom are cheap; marks at the top are expensive.\\n\\n**With speed marking, this gets sharper.** A member who knows the material but works slowly is losing up to half the available marks on questions they answer *correctly*. That is the cheapest fix in the entire team: it needs no new knowledge, only the habit of submitting the moment they are confident. Drilling submission speed is worth more per hour than drilling any topic.\\n\\n### The 6-hour crash plan\\n\\n| Time | What |\\n|---|---|\\n| 0:00–0:30 | One full mock, cold. Diagnosis, not comfort. |\\n| 0:30–0:50 | Read the speed-marking and no-going-back sections here. Most of the gap is procedural, not knowledge. |\\n| 0:50–2:30 | Drill the two weakest topics, Easy and Medium only, **watching the clock on every question**. |\\n| 2:30–3:30 | Output prediction and complexity questions. Highest-density, most learnable marks in the paper. |\\n| 3:30–5:00 | Three coding problems: one easy, two medium. Type the solutions yourself, do not read them. |\\n| 5:00–5:30 | Flashcards, full pass. |\\n| 5:30–6:00 | Second mock. Compare marks *and* average time per question. |\\n\\n### The 90-minute panic plan\\n\\n| Time | What |\\n|---|---|\\n| 0:00–0:15 | One mock. Diagnosis only. |\\n| 0:15–0:30 | Read speed marking and no-going-back. This alone is worth marks. |\\n| 0:30–1:00 | Flashcards, full pass — pure recall moves fastest. |\\n| 1:00–1:20 | Weakest topic, Easy and Medium only. |\\n| 1:20–1:30 | Proctoring pre-flight. Set the room up. |\\n\\n**Team move:** everyone exports their progress from the Progress page and shares the file. Compare topic bars *and* average answer times side by side. The lowest bar in the team is where the group's next hour goes.\",\"checklist\":[\"Identify the team's weakest member honestly, today\",\"Everyone runs one mock and exports progress\",\"Compare average answer time, not just accuracy\",\"Slow-but-correct members drill submission speed specifically\"]},{\"id\":\"r2-setup\",\"title\":\"Round 2: the 45-minute case study\",\"body\":\"Round 2 is **16 Aug, 12:00 PM – 04:00 PM IST**, individual, 45 minutes in one sitting, one attempt. It is typed prose marked on *analytical thinking, strategic approach, and the ability to derive actionable insights* — that phrasing is from the official brief and it is effectively the rubric.\\n\\nA completely different skill from Round 1, and the failure modes are logistical as much as intellectual.\\n\\n**Spend the first 5 minutes not writing.** Read the whole case, all questions, and the data table. Question 4 usually reveals what question 1 was really asking.\\n\\n**Then allocate by question, not by interest.** Five questions and 40 minutes left is 8 minutes each. Write the split down before you start typing. Running out with the last question blank costs more than any amount of polish on the first.\\n\\n**Structure every answer identically.** Evaluators skim. One-line verdict, then bullets of evidence, then recommendation, then measurement, then risk. A wall of prose reads as unstructured thinking even when the thinking is good.\\n\\n**Draft in the answer box, not in another app.** Every extra step is a chance to lose work or run out of time pasting — and tab-switching may well be monitored here too.\\n\\n**Type speed matters.** At 40 wpm, 8 minutes is 320 words, enough for a strong structured answer. At 20 wpm it is 160 and will read as thin. If you type slowly, use shorter sentences and lean harder on bullets.\\n\\n**The failure modes that lose the round outright:** not answering the last question; writing everything you know instead of answering what was asked; recommending things with no way to measure them; no numbers anywhere; and generic advice that would survive find-and-replacing the company name.\\n\\nThe full method — the answer skeleton, the frameworks, the quantification patterns and the curveball bank — is in the **Case studio**.\",\"checklist\":[\"Read all questions before answering any\",\"Write the per-question minute budget down first\",\"Every answer: verdict, evidence, recommendation, metric, risk\",\"Every recommendation carries a metric and a timeframe\",\"Last question answered even if short\"]}],\"dev\":[{\"id\":\"dv-predict\",\"title\":\"What Adobe will probably ask for\",\"body\":\"The statement drops when Round 3 opens on **27 Aug 2026, 04:00 PM IST**, and you have until **13 Sep 2026, 11:59 PM IST**. That is 17 days. Teams that start thinking on day one lose to teams that started building infrastructure in August.\\n\\nThe theme is fixed — *Speak to Agents: The New Language of Brand Visibility* — and Adobe sells measurement and activation tooling to marketers. So the problem will almost certainly sit in the intersection of **agents**, **brand discovery**, and **something a marketer can act on**.\\n\\nEight candidate statements, with what a winning solution to each looks like:\\n\\n1. **\\\"Build a tool that measures a brand's visibility across AI assistants.\\\"** Winner: a real prompt-sampling harness with statistical honesty about variance, not a dashboard of invented numbers.\\n2. **\\\"Help a brand understand *why* it is not being cited.\\\"** Winner: stage-level diagnosis — indexed / retrieved / selected / cited / characterised — with a specific fix per stage.\\n3. **\\\"Build an agent that optimises content for generative retrieval.\\\"** Winner: takes a real URL, analyses chunkability and structure, and outputs a rewritten version with a before/after retrieval score.\\n4. **\\\"Design the interface between a brand and a shopping agent.\\\"** Winner: a working product feed plus an MCP server or API an agent can actually query, demoed with a real agent completing a constrained purchase.\\n5. **\\\"Detect and correct misinformation about a brand in AI answers.\\\"** Winner: sentiment extraction, source tracing back to the offending document, and a suggested correction.\\n6. **\\\"Simulate how an agent chooses between competing brands.\\\"** Winner: a transparent scoring model that shows *why* one product won under a given constraint set.\\n7. **\\\"Make an existing website agent-ready.\\\"** Winner: an automated audit — schema coverage, crawler access, heading structure, feed completeness — that emits a prioritised fix list.\\n8. **\\\"Give marketers a conversational analytics agent.\\\"** Winner: natural-language questions over real visibility data, with the caveat that this is the most crowded idea and the hardest to differentiate.\\n\\n**The through-line:** every winning version measures something real and produces an action. Build the measurement layer now — whatever the statement turns out to be, you will need it.\",\"checklist\":[\"Team agrees on which 2 predictions to pre-build toward\",\"Measurement harness started before 27 Aug\",\"Everyone has read the theme brief section of this app\"]},{\"id\":\"dv-arch\",\"title\":\"A reference architecture you can pre-build\",\"body\":\"This architecture serves most of the predicted statements. Build the spine now; swap the head later.\\n\\n```text\\n                 +------------------+\\n   prompt panel  |  Prompt Sampler  |  scheduled, multi-engine, N runs per prompt\\n   (JSON/DB) --> |  (worker/cron)   |\\n                 +--------+---------+\\n                          | raw answers + citations\\n                          v\\n                 +------------------+\\n                 |    Extractor     |  brand mentions, positions, cited URLs,\\n                 |  (LLM + regex)   |  sentiment, claim spans\\n                 +--------+---------+\\n                          | structured rows\\n                          v\\n                 +------------------+       +------------------+\\n                 |    Data store    |<----->|  Scoring engine  |  share of voice,\\n                 | (Postgres + pg   |       |                  |  position weight,\\n                 |  vector for RAG) |       +--------+---------+  trend, variance\\n                 +--------+---------+                |\\n                          |                          v\\n                          |                 +------------------+\\n                          |                 | Recommender agent|  reads a losing prompt,\\n                          |                 |  (ReAct + tools) |  fetches the page, proposes\\n                          |                 +--------+---------+  a concrete fix\\n                          v                          |\\n                 +---------------------------------------------+\\n                 |               Dashboard (web)               |\\n                 |  trend, prompt drill-down, competitor set,  |\\n                 |  fix queue with owner + expected impact     |\\n                 +---------------------------------------------+\\n```\\n\\n**Component notes**\\n\\n- **Prompt Sampler** — the hard part is honesty. Same locale, clean session, N ≥ 5 runs per prompt per period, and store every raw answer so results are auditable. Judges notice when a demo cannot show its raw data.\\n- **Extractor** — a hybrid. Regex and string matching for known brand and domain lists (fast, deterministic); an LLM with a strict JSON schema for position, sentiment and claim extraction. Never let the LLM do what a string match can do reliably.\\n- **Scoring** — position-weighted share of voice (1/position works well), plus a confidence interval. Showing error bars is a differentiator on its own.\\n- **Recommender agent** — ReAct loop with three tools: `fetch_page`, `analyse_structure`, `propose_rewrite`. This is where you demonstrate agentic engineering rather than a single prompt call.\\n- **Dashboard** — the fix queue is what makes it a product rather than a report. Every insight must terminate in an action with an owner.\",\"checklist\":[\"Sampler stores raw answers, not just parsed scores\",\"Extractor uses deterministic matching where possible\",\"Scores carry a confidence interval\",\"Every insight ends in an actionable item\"]},{\"id\":\"dv-stack\",\"title\":\"Stack — decide this before the statement drops\",\"body\":\"Optimise for *shipping in 17 days with 3 people*, not for what would scale to a million users.\\n\\n| Layer | Pick | Why | Cheaper fallback |\\n|---|---|---|---|\\n| Frontend | Next.js + TypeScript + Tailwind | One framework for UI and API routes; deploys to Vercel with zero config | Vite + React, static host |\\n| Charts | Recharts | Sane defaults, small API surface, quick to style | Hand-rolled SVG |\\n| Backend | Next.js API routes; Python FastAPI only if you need the data ecosystem | Fewer moving parts beats architectural purity at this timescale | Serverless functions only |\\n| Database | Postgres via Supabase or Neon | Free tier, real SQL, `pgvector` if you need embeddings | SQLite committed to the repo for a demo-only build |\\n| Vector store | `pgvector` in the same Postgres | One database is one less thing to break on demo day | In-memory index |\\n| Scheduling | Vercel Cron or GitHub Actions on a schedule | No infrastructure to run | A script the demo runs manually |\\n| LLM | One primary provider, one fallback, behind a single interface | Provider outage on demo day is a real risk | Cached fixture responses |\\n| Auth | Skip it, or Clerk/Supabase Auth if genuinely needed | Auth is a time sink that wins no marks unless multi-tenancy is the point | Hardcoded demo user |\\n| Hosting | Vercel | Push-to-deploy, free, judges can open a live URL | Netlify |\\n\\n**Rules that save the project**\\n\\n- **Every external call goes behind an interface with a cached fixture mode.** `USE_FIXTURES=true` must produce a full working demo with no network. This is the single highest-value engineering decision you will make, and it is what saves you when an API is rate-limited ten minutes before you present.\\n- **Never commit keys.** Use `.env.local`, commit `.env.example`. A leaked key in a public repo is a real risk and reads as carelessness.\\n- **Pick the stack the team already knows.** Learning a framework during a hackathon costs more than the framework saves.\\n- Where it is genuinely relevant, referencing Adobe's ecosystem — Experience Platform data, an Agent Orchestrator-style pattern — earns credibility. Do not bolt it on artificially; judges can tell.\",\"checklist\":[\"Stack agreed and scaffolded before 27 Aug\",\"Fixture mode works with the network disabled\",\".env.example committed, real keys never\",\"Live URL deploys from main on every push\"]},{\"id\":\"dv-repo\",\"title\":\"Repository standards that actually score\",\"body\":\"The submission is a GitHub link. A judge spends perhaps ninety seconds on the repo before forming an opinion. Optimise the first screen.\\n\\n```text\\n.\\n├── README.md              <- the whole pitch, above the fold\\n├── ARCHITECTURE.md        <- diagram + decisions + trade-offs\\n├── DEMO.md                <- how to run it in under 5 minutes\\n├── .env.example\\n├── .gitignore\\n├── LICENSE                <- MIT unless told otherwise\\n├── package.json\\n├── docs/\\n│   ├── problem-statement.md\\n│   ├── methodology.md      <- how the metric is computed, and its limits\\n│   └── screenshots/\\n├── src/\\n│   ├── app/                <- routes and UI\\n│   ├── lib/                <- sampler, extractor, scoring, agent tools\\n│   └── types/\\n├── tests/\\n└── scripts/\\n    └── seed.ts             <- populates a demo dataset in one command\\n```\\n\\n### README template\\n\\n```markdown\\n# <Project name>\\n\\n> One sentence: what it does and who it is for.\\n\\n**Live demo:** <url>  ·  **Video:** <2-3 min link>  ·  **Team:** names, college\\n\\n![screenshot](docs/screenshots/hero.png)\\n\\n## The problem\\nTwo or three sentences. Name the user and what they cannot do today.\\n\\n## What we built\\nThree to five bullets, each a capability, not a technology.\\n\\n## How it works\\nOne diagram plus one paragraph. Link to ARCHITECTURE.md for depth.\\n\\n## Run it locally\\n```bash\\ngit clone <repo> && cd <repo>\\nnpm install\\ncp .env.example .env.local   # fixture mode needs no keys\\nnpm run dev\\n```\\n\\n## What is real and what is mocked\\nBe explicit. Judges trust honesty far more than they punish scope.\\n\\n## What we would build next\\nThree bullets. Shows you know the difference between a demo and a product.\\n```\\n\\n**Commit hygiene:** small, present-tense, meaningful messages. `main` always deploys. Feature branches merged by PR even in a team of three — the history is itself evidence of engineering discipline, and judges do look.\\n\\n**The section that wins trust:** *\\\"What is real and what is mocked.\\\"* Almost nobody writes it. It converts a possible accusation into a demonstration of judgement.\",\"checklist\":[\"README readable in 60 seconds, screenshot above the fold\",\"Live demo URL in the first three lines\",\"One-command local run that works from a clean clone\",\"'What is real and what is mocked' section present\",\"No secrets in git history\"]},{\"id\":\"dv-demo\",\"title\":\"The demo\",\"body\":\"Assume the judge watches three minutes and never installs anything.\\n\\n**Structure — 3 minutes**\\n\\n| Time | Beat |\\n|---|---|\\n| 0:00–0:20 | The problem, in one concrete sentence with a real example. \\\"Ask any assistant which project tool suits a 200-person team. This brand is never mentioned. They cannot see that, and they cannot see why.\\\" |\\n| 0:20–0:40 | What you built, one sentence, then straight into the product. |\\n| 0:40–2:20 | Live walkthrough of the *single* most impressive path. One path, done fully. Not a tour. |\\n| 2:20–2:45 | The insight that only your tool produces. This is the moment that gets remembered. |\\n| 2:45–3:00 | What is next, and the ask. |\\n\\n**Record it.** A recorded demo with a live URL underneath beats a live demo that fails. Record in fixture mode so it is deterministic, and say on screen that you did.\\n\\n**Risk control**\\n\\n- Fixture mode tested with wifi off, the day before.\\n- Demo data seeded by one command, so a broken database is a 30-second recovery.\\n- Browser tabs pre-opened, notifications off, screen at a readable resolution.\\n- No live coding. Ever.\\n\\n**The most common demo failure** is spending ninety seconds on login, navigation and settings before showing anything interesting. Start the recording on the screen that shows the value. Everything before that is throat-clearing.\",\"checklist\":[\"3-minute recording exists a week before the deadline\",\"Fixture mode verified with the network off\",\"One command seeds demo data\",\"Value visible within the first 30 seconds\"]},{\"id\":\"dv-docs\",\"title\":\"Supporting documents\",\"body\":\"The brief says *\\\"the GitHub repository link and any supporting documents\\\"*. Prepare these; they cost little and differentiate a lot.\\n\\n**1. Solution document (4–6 pages)**\\n- Problem and who has it\\n- Your approach, and the alternatives you rejected with reasons\\n- Architecture diagram\\n- What you built versus what you designed\\n- Results or validation, however small\\n- Limitations, stated plainly\\n- Roadmap\\n\\n**2. Methodology note (1–2 pages)** — if your project computes any metric, document exactly how. Sample size, weighting, what is excluded, known biases, confidence. This is the document that separates a serious team from a demo, and almost nobody submits one.\\n\\n**3. Architecture document** — the diagram plus the three or four decisions that actually mattered, each with the trade-off you accepted. \\\"We chose Postgres with pgvector over a dedicated vector database because one datastore is one less failure mode in a 17-day build; we accept worse recall at scale.\\\"\\n\\n**4. Demo video** — 2–3 minutes, hosted somewhere that will not expire.\\n\\n**5. Team document** — who did what. Judges ask, and a clear split reads as a functioning team.\\n\\n**Writing rules:** no marketing language, no invented statistics, no claim you cannot demonstrate. If something is a prototype, call it a prototype. Overclaiming is the fastest way to lose a technically strong submission, because the moment a judge catches one inflated claim they discount everything else.\",\"checklist\":[\"Methodology note written for any metric you compute\",\"Every rejected alternative has a stated reason\",\"Limitations section is honest and specific\",\"No claim in the docs that the demo cannot show\"]},{\"id\":\"dv-plan\",\"title\":\"Seventeen-day execution plan\",\"body\":\"Round 3 runs 27 Aug – 13 Sep 2026. Three people. Roles are ownership, not silos.\\n\\n**Before 27 Aug — the free head start**\\n- Scaffold the repo, deploy a hello-world to Vercel, wire CI.\\n- Build the prompt sampler and the data model. These are statement-independent.\\n- Agree the stack, the branch strategy, and who owns what.\\n\\n**Days 1–3 (27–29 Aug) — lock scope**\\n- Read the statement together. Write your own one-paragraph restatement and agree on it before touching code.\\n- Decide the single demo path you will show at the end. Everything is judged against whether it serves that path.\\n- Cut ruthlessly on day 3. Scope grows; it never shrinks on its own.\\n\\n**Days 4–9 — build the spine**\\n- *Engineer A*: data pipeline — sampler, extractor, storage, scoring.\\n- *Engineer B*: interface — the dashboard and the one path that matters.\\n- *Engineer C*: the agent layer plus fixture mode and seed scripts.\\n- **End of day 9: end-to-end works, ugly.** If it does not, cut scope, do not add hours.\\n\\n**Days 10–13 — make it good**\\n- Polish the demo path only. Everything off that path stays ugly and that is correct.\\n- Write the README and the methodology note now, not on day 17.\\n- First demo recording. It will be bad, which is why you do it now.\\n\\n**Days 14–16 — harden**\\n- Fixture mode verified offline. Seed script verified from a clean clone.\\n- Final recording. Documents finished. Screenshots taken.\\n- Submit on day 16, not day 17.\\n\\n**Day 17 — buffer.** Something will go wrong. This day is why it will not matter.\\n\\n**Scope-cut list, in the order you drop things:** auth → multi-user → settings → mobile layout → historical trends → extra AI engines → export → anything with the word *also* in front of it.\",\"checklist\":[\"Repo scaffolded and deployed before 27 Aug\",\"One-paragraph restatement agreed by all three before coding\",\"Single demo path chosen and written down\",\"End-to-end working by day 9\",\"Submitted by day 16\"]},{\"id\":\"dv-rubric\",\"title\":\"How you will be judged, and the artefact that proves each\",\"body\":\"Hackathon rubrics vary, but they converge on five things. For each, there is one artefact that proves it — build the artefact, not the impression.\\n\\n| Criterion | What it really means | The artefact that proves it |\\n|---|---|---|\\n| **Innovation** | Not \\\"did you use AI\\\" but \\\"did you see something others did not\\\" | One insight your tool surfaces that a spreadsheet could not. Show it in the demo. |\\n| **Technical depth** | Real engineering, not a wrapper around one API call | The agent loop, the scoring method with its confidence interval, the fixture architecture. ARCHITECTURE.md carries this. |\\n| **User experience** | Can the intended user get value without you explaining it | The 3-minute recording with no narration crutches; a stranger should follow it. |\\n| **Impact / relevance** | Does an Adobe customer actually need this | One sentence in the README naming the customer and what it replaces. |\\n| **Presentation** | Can you explain it under pressure | Rehearsed 3-minute demo, plus a one-page answer to \\\"why this approach and not X\\\". |\\n\\n**What separates the top ten from the top fifty**, consistently:\\n\\n1. **The project measures something real.** Invented dashboard numbers are visible from a mile away and judges ask about the data source within the first two questions.\\n2. **Honesty about limits.** \\\"This samples 120 prompts weekly across two engines; below a 5-point move we cannot distinguish signal from noise\\\" is a stronger statement than any confident claim.\\n3. **It ends in an action.** Insight without a recommended fix is a report, not a product.\\n4. **The repo is legible.** A judge who can understand the project from the README alone is a judge who trusts everything else.\\n5. **One thing done completely** beats five things done partly. Every time.\",\"checklist\":[\"Can you name the one insight only your tool produces?\",\"Can you state your method's limits in one sentence?\",\"Does every insight in the UI have an action attached?\",\"Would a stranger understand the project from the README alone?\"]}]}");</script>

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k === 'text') node.textContent = v;
      else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    }
  }
  if (children) {
    (Array.isArray(children) ? children : [children]).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
  }
  return node;
}
const $ = function (sel, root) { return (root || document).querySelector(sel); };
const $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }

function icon(name, cls) {
